apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: eks-cluster-template
  title: Setup EKS Environment
  description: |
    Creates a new Amazon EKS AutoMode cluster using Kro and ACK controllers.
    
    This template uses:
    - **Kro (Kubernetes Resource Orchestrator)**: Declarative resource graph for cluster creation
    - **ACK (AWS Controllers for Kubernetes)**: Manages AWS resources (VPC, EKS, IAM) from Kubernetes
    - **GitOps**: Automatically registers the new cluster with ArgoCD hub for continuous deployment
    
    The cluster will be fully configured with networking, IAM roles, and ready for workload deployment.

    **Cross-account prerequisite**: If deploying to a different AWS account, run `scripts/create-cross-account-roles.sh` first:
    1. From the **target account** (first time only): `./scripts/create-cross-account-roles.sh --target-only` to create IAM roles
    2. From the **hub account**: `./scripts/create-cross-account-roles.sh` to configure hub capability roles

    ```
    export TARGET_ACCOUNT_ID=<target-account-id>
    export RESOURCE_PREFIX=peeks
    export HUB_CLUSTER_NAME=peeks-hub
    ```
spec:
  owner: user:guest
  type: service
  parameters:
    - title: EKS Cluster Information
      required:
        - clusterName
        - environment
        - region
        - k8sVersion
        - tenant
      properties:
        clusterName:
          title: EKS Cluster Name
          type: string
          description: Name of the EKS cluster
          ui:autofocus: true
          default: "peeks-spoke-staging"
        environment:
          title: Environment
          type: string
          description: Environment (e.g., dev, test, prod)
          default: "dev"
        region:
          title: AWS Region
          type: string
          description: AWS Region for the EKS cluster
          default: "us-west-2"
        k8sVersion:
          title: Kubernetes Version
          type: string
          description: Kubernetes version for the EKS cluster
          default: "1.35"
        accountId:
          title: Account ID
          type: string
          description: AWS Account ID (optional - defaults to system default)
          ui:help: "Enter your AWS Account ID (12 digits) or leave empty for default"
        managementAccountId:
          title: Management Account ID
          type: string
          description: AWS Management Account ID
          ui:help: "Enter your AWS Management Account ID (12 digits)"
        tenant:
          title: Tenant Name
          type: string
          description: Name of the tenant
          default: "control-plane"
        resourcePrefix:
          title: Resource Prefix
          type: string
          description: Prefix for AWS resources
          default: "peeks"
        repoHostUrl:
          type: string
          ui:widget: hidden
        repoUsername:
          type: string
          ui:widget: hidden
        repoName:
          type: string
          default: fleet-config
          ui:widget: hidden

    - title: Git Repository URLs
      properties:
        addonsRepoUrl:
          title: Addons Repository URL
          type: string
          description: Git repository URL for addons
          ui:help: "Leave empty to use default system repository"
        fleetRepoUrl:
          title: Fleet Repository URL
          type: string
          description: Git repository URL for fleet
          ui:help: "Leave empty to use default system repository"
        platformRepoUrl:
          title: Platform Repository URL
          type: string
          description: Git repository URL for platform
          ui:help: "Leave empty to use default system repository"
        workloadRepoUrl:
          title: Workload Repository URL
          type: string
          description: Git repository URL for workload
          ui:help: "Will be auto-populated from system configuration"
    - title: Cluster Addons Configuration
      properties:
        enableIngressClassAlb:
          title: Enable Ingress Class ALB
          type: boolean
          description: Enable Ingress Class ALB addon
          default: false
        enableArgoRollouts:
          title: Enable Argo Rollouts
          type: boolean
          description: Enable Argo Rollouts addon
          default: true
        enableMetricsServer:
          title: Enable Metrics Server
          type: boolean
          description: Enable Metrics Server addon
          default: true
        enableExternalSecrets:
          title: Enable External Secrets
          type: boolean
          description: Enable External Secrets addon
          default: true
        enableKyverno:
          title: Enable Kyverno
          type: boolean
          description: Enable Kyverno addon
          default: true
        enableKyvernoPolicies:
          title: Enable Kyverno Policies
          type: boolean
          description: Enable Kyverno Policies addon
          default: false
        enableKyvernoPolicyReporter:
          title: Enable Kyverno Policy Reporter
          type: boolean
          description: Enable Kyverno Policy Reporter addon
          default: false
        enableCrossplane:
          title: Enable Crossplane
          type: boolean
          description: Enable Crossplane addon
          default: true
        enableCrossplaneAws:
          title: Enable Crossplane AWS
          type: boolean
          description: Enable Crossplane AWS addon
          default: true
        enableFlux:
          title: Enable Flux
          type: boolean
          description: Enable Flux addon
          default: true
        enableIngressNginx:
          title: Enable Ingress Nginx
          type: boolean
          description: Enable Ingress Nginx addon
          default: true
        enablePlatformManifests:
          title: Enable Platform Manifests
          type: boolean
          description: Enable Platform Manifests addon
          default: true
        enableKubevela:
          title: Enable KubeVela
          type: boolean
          description: Enable KubeVela addon
          default: true
        enableCertManager:
          title: Enable Cert Manager
          type: boolean
          description: Enable Cert Manager addon
          default: true
        enableAwsEfsCsiDriver:
          title: Enable AWS EFS CSI Driver
          type: boolean
          description: Enable AWS EFS CSI Driver addon
          default: false
  steps:
    - id: fetchSystem
      name: Fetch System
      action: catalog:fetch
      input:
        entityRef: system:default/system-info
    - id: checkout
      name: Checkout repository
      action: fetch:plain
      input:
        url: https://${{ steps['fetchSystem'].output.entity.spec.gitlab_hostname }}/${{ steps['fetchSystem'].output.entity.spec.gituser }}/${{ parameters.repoName }}
        targetPath: ./repo
    - id: addCluster
      name: Add new Clusters
      # if: ${{ (parameters.accountId or steps['fetchSystem'].output.entity.spec.aws_account_id) !== (parameters.managementAccountId or steps['fetchSystem'].output.entity.spec.aws_account_id) }}
      action: roadiehq:utils:fs:append
      input:
        path: ./repo/configs/multi-acct/values.yaml
        content: "\n  ${{ parameters.clusterName }}: \"${{ parameters.accountId or steps['fetchSystem'].output.entity.spec.aws_account_id }}\""
    - id: addKroClusterConfig
      name: Update kro Clusters Configuration
      # Use roadiehq:utils:merge (not fs:append): merge creates the file (and parent
      # dirs) if missing and deep-merges into an existing one, so this works for any
      # tenant whether or not tenants/<tenant>/kro-clusters/values.yaml already exists.
      # fs:append required the file to pre-exist and raised ENOENT for tenants that
      # were never seeded with a kro-clusters/values.yaml (e.g. control-plane).
      action: roadiehq:utils:merge
      input:
        path: ./repo/gitops/fleet/spoke-values/tenants/${{ parameters.tenant }}/kro-clusters/values.yaml
        content:
          clusters:
            ${{ parameters.clusterName }}:
              managementAccountId: "${{ parameters.managementAccountId or steps['fetchSystem'].output.entity.spec.aws_account_id }}"
              accountId: "${{ parameters.accountId or steps['fetchSystem'].output.entity.spec.aws_account_id }}"
              tenant: "${{ parameters.tenant }}"
              environment: "${{ parameters.environment }}"
              region: "${{ parameters.region }}"
              k8sVersion: "${{ parameters.k8sVersion }}"
              resourcePrefix: "${{ parameters.resourcePrefix }}"
              adminRoleName: "${{ steps['fetchSystem'].output.entity.spec.admin_role_name }}"
              domainName: "${{ steps['fetchSystem'].output.entity.spec.ingress_hostname }}"
              gitops:
                addonsRepoUrl: "${{ parameters.addonsRepoUrl or 'https://' + steps['fetchSystem'].output.entity.spec.gitlab_hostname + '/' + steps['fetchSystem'].output.entity.spec.gituser + '/platform-on-eks-workshop.git' }}"
                fleetRepoUrl: "${{ parameters.fleetRepoUrl or 'https://' + steps['fetchSystem'].output.entity.spec.gitlab_hostname + '/' + steps['fetchSystem'].output.entity.spec.gituser + '/platform-on-eks-workshop.git' }}"
                platformRepoUrl: "${{ parameters.platformRepoUrl or 'https://' + steps['fetchSystem'].output.entity.spec.gitlab_hostname + '/' + steps['fetchSystem'].output.entity.spec.gituser + '/platform-on-eks-workshop.git' }}"
                workloadRepoUrl: "${{ parameters.workloadRepoUrl or 'https://' + steps['fetchSystem'].output.entity.spec.gitlab_hostname + '/' + steps['fetchSystem'].output.entity.spec.gituser + '/platform-on-eks-workshop.git' }}"
              addons:
                enable_argo_rollouts: "true"
                enable_cert_manager: "true"
                enable_cni_metrics_helper: "true"
                enable_crossplane: "true"
                enable_crossplane_aws: "true"
                enable_external_secrets: "true"
                enable_flux: "true"
                enable_ingress_nginx: "true"
                enable_kube_state_metrics: "true"
                enable_kubevela: "true"
                enable_metrics_server: "true"
                enable_platform_manifests: "true"
                enable_prometheus_node_exporter: "true"
                enable_aws_for_fluentbit: "true"
                enable_kro_manifests: "true"
                enable_platform_manifests_bootstrap: "true"
                enable_ingress_class_alb: "${{ parameters.enableIngressClassAlb }}"
                enable_kyverno: "${{ parameters.enableKyverno }}"
                enable_kyverno_policies: "${{ parameters.enableKyvernoPolicies }}"
                enable_kyverno_policy_reporter: "${{ parameters.enableKyvernoPolicyReporter }}"
                enable_aws_efs_csi_driver: "${{ parameters.enableAwsEfsCsiDriver }}"
    - id: addKroClusterJson
      name: Register kro cluster for the ApplicationSet git generator
      action: roadiehq:utils:fs:write
      input:
        path: ./repo/gitops/fleet/spoke-values/tenants/${{ parameters.tenant }}/kro-clusters/clusters/${{ parameters.clusterName }}.json
        content: '{"clusterName": "${{ parameters.clusterName }}"}'
    - id: addComponent
      name: Add new component for Cluster
      action: roadiehq:utils:fs:write
      input:
        path: ./repo/platform/backstage/components/${{ parameters.clusterName }}.yaml
        content: |
          apiVersion: backstage.io/v1alpha1
          kind: Component
          metadata:
            name: ${{ parameters.clusterName }}
            description: EKS Cluster deployed by kro
            links:
              - url: https://${{ steps['fetchSystem'].output.entity.spec.argocd_hostname }}/applications/argocd/clusters
                title: ArgoCD App URL
                icon: externalLink
              - url: https://${{ steps['fetchSystem'].output.entity.spec.gitlab_hostname }}/${{ steps['fetchSystem'].output.entity.spec.gituser }}/${{ parameters.repoName }}/-/blob/main/gitops/fleet/spoke-values/tenants/${{ parameters.tenant }}/kro-clusters/values.yaml
                title: Git Repo URL
                icon: github
          spec:
            owner: user:guest
            lifecycle: experimental
            type: service
    - id: createGitlabMergeRequest
      name: Create a Merge Request
      action: publish:gitlab:merge-request
      input:
        repoUrl: ${{ steps['fetchSystem'].output.entity.spec.gitlab_hostname }}?repo=${{ parameters.repoName }}&owner=${{ steps['fetchSystem'].output.entity.spec.gituser }}
        title: Add new EKS cluster ${{ parameters.clusterName }}
        description: |
          Add new EKS cluster ${{ parameters.clusterName }} to the platform
          
          Changes:
          - Added cluster configuration to multi-acct values
          - Added kro cluster configuration  
          - Added Backstage component definition
        sourcePath: ./repo
        targetPath: .
        branchName: cluster-${{ parameters.clusterName }}
        removeSourceBranch: true
        commitAction: auto
    - id: register
      name: Register
      action: catalog:register
      input:
        catalogInfoUrl: https://${{ steps['fetchSystem'].output.entity.spec.gitlab_hostname }}/${{ steps['fetchSystem'].output.entity.spec.gituser }}/${{ parameters.repoName }}/-/blob/main/platform/backstage/components/${{ parameters.clusterName }}.yaml
        optional: true
  output:
    links:
      - title: Gitlab MergeRequest URL
        url: ${{ steps.createGitlabMergeRequest.output.mergeRequestUrl }}
