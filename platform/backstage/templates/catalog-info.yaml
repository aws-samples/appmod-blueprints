apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: app-mod-backstage-templates
  description: App Mod Backstage Templates
spec:
  targets:
    - ./eks-cluster-template/template.yaml
    - ./rds-cluster/template.yaml
    - ./s3-bucket-ack-kubevela/template.yaml
    - ./s3-bucket-ack-kro/template.yaml
    - ./app-deploy/template.yaml
    - ./app-deploy-without-repo/template.yaml
    - ./spark-job/template-spark-job.yaml
    - ./ray-serve-cpu/template.yaml
    - ./ray-serve-gpu/template.yaml
    - ./ray-serve-trainium/template.yaml
    - ./create-dev-and-prod-env/template-create-dev-and-prod-env.yaml
    - ./cicd-pipeline/template-cicd-pipeline.yaml
    - ./platform-entities.yaml
    # Uncomment the line below to register the custom DynamoDB template (Module 1 - GenAI section)
    # - ../customtemplates/ddb-table/template.yaml
# The `system-info` System is NOT declared here. It is provided only by the
# backstage-dynamic-catalog ConfigMap (gitops/addons/charts/backstage/templates/install.yaml),
# which carries the real values. A second declaration here would register the same
# entity ref with unrendered placeholders.
