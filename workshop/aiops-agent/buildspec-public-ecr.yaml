# CodeBuild buildspec — build + push the PEEKS agent images to the PUBLIC ECR registry
# public.ecr.aws/seb-demo (the same workshop-generic registry that hosts backstage:cnoe).
#
# Unlike buildspec.yaml (private per-env ECR), this publishes WORKSHOP-GENERIC images once
# per release so any deployment pulls them anonymously — participants never build their own.
#
#   Images published (each at its OWN pinned tag below — MUST match chart/values.yaml
#   images.*.tag so the pinned set is reproducible; never overwrite a mutable tag in place):
#   chat-ui, eks-mcp, gitlab-mcp, incident-bridge, skills-mcp (PEEKS .kiro/skills baked in),
#   strands-agent
#
# Run in the demo3 account (382076407153, owner of the seb-demo public ECR alias), us-east-1
# region for the ecr-public control plane. Requires privilegedMode (Docker) + a service role
# with ecr-public:* and sts:GetServiceBearerToken.
#
# Env vars (CodeBuild project or override):
#   <COMPONENT>_TAG (CHAT_UI_TAG, EKS_MCP_TAG, GITLAB_MCP_TAG, INCIDENT_BRIDGE_TAG,
#                SKILLS_MCP_TAG, STRANDS_TAG) — per-component pinned tags; defaults below
#                MUST match chart/values.yaml images.*.tag. Override just one to bump it.
#   APPMOD_REF   (default integration/peeks-e2e-unified)  — appmod-blueprints branch/tag (aws-samples)
#   OAP_REF      (default fix/configurable-max-tokens) — OAP branch/tag with the configurable
#                max_tokens env fix. NOTE: this fix is NOT yet on awslabs/open-agentic-platform
#                main (main hardcodes max_tokens=1000), so OAP_REPO still points at the fork
#                until the fix is upstreamed to awslabs. Repoint OAP_REPO once merged upstream.
version: 0.2
env:
  variables:
    PUBLIC_REGISTRY: "public.ecr.aws/seb-demo"
    # TODO(pre-publish): review/bump these pins AND PUBLIC_REGISTRY before cutting a release —
    # grep 'TODO(pre-publish)' across the repo to find every pin/ref that must be revisited.
    # Per-component PINNED tags — MUST stay in sync with chart/values.yaml images.*.tag so this
    # buildspec can actually reproduce the pinned set. (Previously a single IMAGE_TAG pushed all
    # six at one tag, which never matched the chart's five distinct pins.)
    CHAT_UI_TAG: "v1.4"
    EKS_MCP_TAG: "v1"
    GITLAB_MCP_TAG: "v2"
    INCIDENT_BRIDGE_TAG: "v1.4"
    SKILLS_MCP_TAG: "v4"
    STRANDS_TAG: "v1.12"
    # TODO(pre-publish): APPMOD_REF/OAP_REF are MOVING integration/fork refs. Repoint OAP_REPO to
    # awslabs/open-agentic-platform and pin APPMOD_REF/OAP_REF to a tag/SHA once the max_tokens fix
    # (OAP PR #35) is upstream. Tracked in the B2/B4 build-pin issue.
    APPMOD_REPO: "https://github.com/aws-samples/appmod-blueprints.git"
    APPMOD_REF: "integration/peeks-e2e-unified"
    OAP_REPO: "https://github.com/allamand/open-agentic-platform.git"
    OAP_REF: "fix/configurable-max-tokens"
phases:
  pre_build:
    commands:
      - aws --version && docker --version
      - git clone --depth 1 -b "$APPMOD_REF" "$APPMOD_REPO" /src
      - git clone --depth 1 -b "$OAP_REF" "$OAP_REPO" /oap
      # public ECR login (control plane is always us-east-1); also raises anonymous pull limits
      - aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws
      - REG="$PUBLIC_REGISTRY"; SRC=/src/workshop/aiops-agent/src
      - echo "Publishing PEEKS agent images to $REG (chat-ui:$CHAT_UI_TAG eks-mcp:$EKS_MCP_TAG gitlab-mcp:$GITLAB_MCP_TAG incident-bridge:$INCIDENT_BRIDGE_TAG skills-mcp:$SKILLS_MCP_TAG strands-agent:$STRANDS_TAG)"
  build:
    commands:
      # 1) generic services, built from in-repo sources
      - docker build -t "$REG/chat-ui:$CHAT_UI_TAG"            "$SRC/a2a-chat-ui"
      - docker build -t "$REG/eks-mcp:$EKS_MCP_TAG"            "$SRC/eks-mcp"
      - docker build -t "$REG/gitlab-mcp:$GITLAB_MCP_TAG"      "$SRC/gitlab-mcp"
      - docker build -t "$REG/incident-bridge:$INCIDENT_BRIDGE_TAG" "$SRC/incident-bridge"
      # 2) skills-mcp: base + PEEKS overlay (context = appmod repo ROOT for .kiro/skills)
      - docker build -t "skills-mcp-base:$SKILLS_MCP_TAG" "$SRC/skills-mcp"
      - docker build -f /src/workshop/aiops-agent/skills-overlay/Dockerfile
          --build-arg SKILLS_MCP_IMAGE="skills-mcp-base:$SKILLS_MCP_TAG"
          -t "$REG/skills-mcp:$SKILLS_MCP_TAG" /src
      # 3) agent runtime from the OAP fork (configurable max_tokens — issue #34 / PR #35)
      - docker build -t "$REG/strands-agent:$STRANDS_TAG" /oap/applications/strands-agent-base
  post_build:
    commands:
      - docker push "$REG/chat-ui:$CHAT_UI_TAG"
      - docker push "$REG/eks-mcp:$EKS_MCP_TAG"
      - docker push "$REG/gitlab-mcp:$GITLAB_MCP_TAG"
      - docker push "$REG/incident-bridge:$INCIDENT_BRIDGE_TAG"
      - docker push "$REG/skills-mcp:$SKILLS_MCP_TAG"
      - docker push "$REG/strands-agent:$STRANDS_TAG"
      - echo "Published chat-ui:$CHAT_UI_TAG eks-mcp:$EKS_MCP_TAG gitlab-mcp:$GITLAB_MCP_TAG incident-bridge:$INCIDENT_BRIDGE_TAG skills-mcp:$SKILLS_MCP_TAG strands-agent:$STRANDS_TAG to $REG"
