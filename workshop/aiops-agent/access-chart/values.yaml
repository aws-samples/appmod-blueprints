# Not a user-facing chart: all values are filled per spoke by the aiops-agent chart's
# spoke-access ApplicationSet (templates/spoke-access.yaml). clusterName comes from the
# spoke's ArgoCD cluster secret (aws_cluster_name); accountId from the hub's aws_account_id;
# roleName is eks-read-mcp's Pod Identity role as the platform names it (chart _helpers.tpl);
# region is the spoke's aws_region (the hub's region when the secret has none).
clusterName: ""
accountId: ""
roleName: ""
region: ""
# Image of the PreSync selector-wait Job (templates/selector-wait-hook.yaml). Same value name
# and default as the ack-pod-identity crd-wait hook (crdWait.image); override it for a hub
# that cannot pull from Docker Hub. The aiops-agent chart passes it through when set.
crdWait:
  image: bitnami/kubectl:latest
