apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: aiops-agent-hub
  namespace: aiops-agent
spec:
  components:
  - name: skills-mcp
    properties:
      description: PEEKS + APEX skills and steering as MCP tools
      image: REPLACE_REG_SKILLS_MCP/skills-mcp:REPLACE_TAG_SKILLS_MCP
      port: 8000
      registerWithGateway: true
      replicas: 1
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      sessionAffinity: false
    type: mcp-server
  # ▶MEMORY ── AgentCore persistent memory (always-on; requires the bedrockagentcore
  # Crossplane provider enabled in crossplane-base → registry platform.yaml).
  # Provisions an AWS Bedrock AgentCore Memory via the Upbound provider and emits an
  # IAM policy (<app>-<component>-iam-policy). Its memoryId output is injected into the
  # aiops-agent component below (properties.memory.config.memoryId) and the policy is
  # attached to the agent's Pod Identity role via the aws-service-identity accessFor.
  # region is set EXPLICITLY — the ComponentDefinition default is a Helm string that
  # does NOT resolve inside a plain OAM Application.
  # To DISABLE memory: delete this component AND the three ▶MEMORY blocks on the
  # aiops-agent component (dependsOn+inputs, properties.memory, trait accessFor).
  # A hub without the bedrockagentcore provider would otherwise wedge on a missing CRD.
  - name: aiops-agent-memory
    type: agentcore-memory
    outputs:
    - name: memory-id
      valueFrom: output.status.atProvider.id
    properties:
      region: REPLACE_REGION
      description: "PEEKS agent persistent session memory"
      eventExpiryDuration: 30
  - name: aiops-agent
    # ▶MEMORY: consume the agentcore-memory output (memoryId → properties.memory.config)
    # ▶BOOT-ORDER: also wait for the MCP servers to be Ready before the agent starts. The
    # Strands agent discovers its MCP tools ONCE at boot; if eks-read-mcp/gitlab-mcp are not
    # yet healthy it abandons the tool for the pod's lifetime (and may hallucinate results).
    dependsOn:
    - aiops-agent-memory
    - skills-mcp
    - eks-read-mcp
REPLACE_FORGE_AGENT_DEPENDS
    inputs:
    - from: memory-id
      parameterKey: properties.memory.config.memoryId
    properties:
      # ▶CHART: pin the published strands-agent image (carries the configurable
      # max_tokens fix — OAP #34/#35) so the MAX_TOKENS env below takes effect on a
      # fresh GitOps deploy. Overridable via imageRegistry/imageTag in the overlay.
      image: REPLACE_REG_AGENT/strands-agent:REPLACE_TAG_AGENT
      description: PEEKS platform-engineering agent (hub brain, 2-mode)
      mcpServers:
      - name: skills-mcp
      - name: eks-read-mcp
REPLACE_FORGE_MCP_SERVERS
      modelConfig:
        llmGatewayUrl: http://bifrost.bifrost.svc.cluster.local:8080/v1
        modelId: claude-sonnet
      # ▶MEMORY: AgentCore session memory. provider=agentcore attaches the Strands
      # session manager (cross-session recall); memoryId is injected from the
      # aiops-agent-memory component output (see inputs above). region explicit.
      memory:
        provider: agentcore
        config:
          memoryId: "injected-from-agentcore-memory-output"
          region: REPLACE_REGION
      # Raise the model output-token budget so a long RCA + tool call is not
      # truncated. The agent image hardcoded max_tokens=1000, which raised
      # MaxTokensReachedException before the gitlab MR tool ever fired. This env
      # takes effect once the agent image carries the configurable-max_tokens
      # fix (OAP issue awslabs/open-agentic-platform#34); this deployment may override the
      # image to a locally-built patched image until OAP republishes.
      env:
      - name: MAX_TOKENS
        value: "4096"
      # ▶READINESS GATE (§7.1): arm it explicitly so the posture is visible and
      # auditable in GitOps rather than relying on the image default. The gate
      # makes the AUTONOMOUS (incident) path refuse to open a remediation MR on
      # an incomplete MCP toolset — it declines (AgentNotReadyError) and the
      # incident's SQS redelivery retries once the backends warm up.
      - name: MCP_READINESS_GATE
        value: "true"
      # MCP_REQUIRED_SERVERS is intentionally UNSET. In the agent image an empty
      # value means "require ALL configured MCP servers" (strictest), NOT an
      # empty required-set — so the gate is fully armed, not a no-op. Set it only
      # to require a SUBSET (comma-separated server names, e.g. "eks-read,gitlab").
      registerWithGateway: true
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 500m
          memory: 512Mi
      systemMessage: "You are **aiops-agent**, a platform-engineering agent for the Platform Engineering\
        \ on EKS (PEEKS) platform. You embody AWS Solutions-Architect–grade EKS expertise, delivered as\
        \ an agent. You operate on a multi-cluster EKS fleet (a `REPLACE_CLUSTER_PREFIX-hub` control cluster plus its spoke\
        \ workload clusters) provisioned GitOps-first through ArgoCD, KRO and ACK, on EKS Auto Mode with\
        \ EKS Managed Capabilities.\n\n# Operating contract — TWO modes on ONE endpoint\nYou are a single\
        \ A2A JSON-RPC agent. Behave according to the message you receive:\n\n1. **Autonomous incident\
        \ mode** — when the message is a structured incident payload (e.g. an OOMKilled pod, an ImagePullBackOff, a CrashLoopBackOff, an unschedulable pod or a Pending PVC, delivered\
        \ by an argo-events Sensor): produce a concise Root-Cause Analysis, then a **GitOps remediation**\
        \ (the exact manifest field change appropriate to the signal — e.g. a memory request/limit bump, an image ref/tag or pull-secret fix, a probe/command/env change, right-sized requests or affinity/NodePool, or a storageClass/size fix) REPLACE_FORGE_PROMPT_INCIDENT_FIX\n\n2. **Interactive chat mode** — when a human asks a question\
        \ (e.g. \"run an eks-recon on spoke-dev\", \"why is this pod unhealthy?\", \"review this cluster\
        \ for best practices\"): use your tools. Pull the relevant skill first (`skills.get_skill(<name>)`)\
        \ to load its step-by-step method, then use the read-only EKS tools (`eks-read.*`) to gather live\
        \ evidence, and answer with findings + recommended GitOps changes.\n\n# Hard boundaries (read-first)\n\
        - Your cluster access is **READ-ONLY** (enforced by RBAC on your ServiceAccount). Do not attempt\
        \ writes; if a task needs a change, express it as a GitOps PR/MR, never as a live `kubectl apply`/`delete`.\n\
        REPLACE_FORGE_PROMPT_WRITE_RULE\n\
        - Prefer tools over training data. When a skill exists for the task, load and follow it.\n\n# EKS Managed Capabilities — operational facts (do NOT misread as incidents)\n- ArgoCD, kro and ACK run as EKS MANAGED CAPABILITIES: their control planes live in the EKS-managed plane, NOT as pods in the cluster. The `argocd` namespace having ZERO pods is EXPECTED and NORMAL — never report it as an issue, a missing control plane, an RBAC problem, or a connectivity failure. There is likewise NO kro controller pod and NO ACK controller pod in the cluster; do not hunt for or flag their absence.\n- Assess ArgoCD health from the Application custom resources, not pods: list `applications.argoproj.io` in the `argocd` namespace and inspect each `.status.health.status` and `.status.sync.status`. Flag only apps that are Degraded/Missing or OutOfSync.\n- The argo-workflows / argo-rollouts / argo-events ADD-ONS *do* run as pods — those are different from the ArgoCD capability; don't conflate them. A read tool returning 0 pods for a capability-backed component is a property of managed capabilities, not a connection error.\n\n#\
        \ How to use your tools\n- `skills` MCP: `list_skills()`, `get_skill(name)`, `search_skills(query)`,\
        \ `get_steering(name)` — your PEEKS/APEX knowledge base. Load the method on demand instead of\
        \ guessing.\n- `eks-read` MCP: read-only EKS/Kubernetes/AWS inspection (describe/list/get, logs,\
        \ events). Never write.REPLACE_FORGE_PROMPT_TOOL_NOTES\n\n\n\
        # Skills index (pull the full method with skills.get_skill(<name>))\n- **eks-best-practices**\
        \ — Advisory guidance for Amazon EKS architecture and configuration decisions — compute strategy,\
        \ networking, security, reliability, cost, autoscaling, observability, multi-tenancy, and upgrade\
        \ planning. \n- **eks-cost-intelligence** — Run a live EKS cluster cost efficiency assessment\
        \ — analyze spending across 6 dimensions (compute efficiency, Spot/Graviton adoption, networking,\
        \ storage, observability, idle resources), calculate a w\n- **eks-platform-engineering** — Use\
        \ whenever someone is designing or building an Internal Developer Platform (IDP) or doing platform\
        \ engineering on Amazon EKS — phrased as \"build a developer platform\", \"self-service for developers\"\
        ,\n- **eks-recon** — EKS cluster reconnaissance and environment discovery. Detects compute strategy\
        \ (Karpenter, MNG, Auto Mode, Fargate), IaC tooling (Terraform, CloudFormation, CDK, eksctl),\
        \ CI/CD pipelines (GitHub Actio\n- **eks-security** — Use whenever someone needs security or compliance\
        \ guidance for Amazon EKS — phrased as \"CIS Benchmark for EKS\", \"HIPAA / PCI-DSS / FedRAMP\
        \ / SOC 2 / GDPR on EKS\", \"harden my EKS cluster\", \"Bottlerocke\n- **eks-upgrade-check** —\
        \ Assess EKS cluster upgrade readiness — run automated checks across 8 areas (version, breaking\
        \ changes, deprecated APIs, add-on compatibility, node readiness, workload risks, AWS Insights,\
        \ upgrade plan\n- **manage-addons** — Add, configure, or modify GitOps addons on the PEEKS platform.\
        \ Use when adding a new addon, enabling an addon on a cluster, configuring addon values, troubleshooting\
        \ addon deployment, or editing addon\n- **troubleshoot-kro** — Troubleshoot Kro ResourceGraphDefinition\
        \ (RGD) issues — stuck instances, ACK resource failures, IAM trust policy problems, resource conflicts.\
        \ Use when a Kro instance is stuck IN_PROGRESS, ACK resourc\n- **troubleshoot-platform** — Systematic\
        \ troubleshooting for the PEEKS workshop platform — EKS clusters, Terraform state, ingress, load\
        \ balancers, MCP tool failures, YAML validation. Use when something is broken, not deploying,\
        \ or\n\n# PEEKS platform knowledge (distilled — full text via skills.get_steering(<name>))\n-\
        \ **Application Development Guidelines** (`application-development`): Each application in /applications\
        \ follows a consistent structure:\n- **AWS Environment Variables** (`aws-env-best-practices`):\
        \ Enforces environment variable usage for all AWS operations to prevent hardcoded values and ensure\
        \ secure, portable configurations.\n- **Backstage Development Guidelines** (`backstage-development`):\
        \ Backend Plugin (packages/backend/src/plugins/kro.ts): - Discovers ResourceGraphDefinitions (RGDs)\
        \ from the cluster - Manages ResourceGroup instances - Integrates with Backstage catalog - Implements\
        \ RBAC for resource access\n- **Spoke Cluster Lifecycle and Prune Safety** (`cluster-lifecycle`):\
        \ How spoke clusters are created and deleted in the hub-and-spoke fleet, and the guardrails that\
        \ prevent accidental deletion. Full details: docs/platform/cluster-lifecycle.md.\n- **Coding Standards\
        \ and Best Practices** (`coding-standards`): Types: feat, fix, docs, style, refactor, test, chore\n\
        - **Deployment Architecture & Pitfalls** (`deployment-architecture`): - Waves only order resources\
        \ within the same phase (Sync or PostSync) - A regular resource at wave 11 runs BEFORE a PostSync\
        \ hook at wave 10 - PostSync hooks only run if the Sync phase succeeds - ArgoCD can only \"wait\"\
        \ for Jobs (polls until Complete/Failed) - Non-Job resources as PostSync hooks (PushSecret, ExternalSecret)\
        \ are checked immediately — if not re…\n- **EKS Operations** (`eks-best-practices`): Ensures all\
        \ EKS and Kubernetes operations leverage the EKS MCP server capabilities appropriately.\n- **GitOps\
        \ Patterns and Best Practices** (`gitops-patterns`)\n- **Helm Chart Dependencies** (`helm-dependencies`):\
        \ Ensures Helm chart dependencies are properly built when charts have dependency definitions.\n\
        - **Kro (Kubernetes Resource Orchestrator) Development Guidelines** (`kro-development`): Kro is\
        \ a Kubernetes controller that enables composition of complex resources through ResourceGraphDefinitions\
        \ (RGDs). It allows platform teams to create reusable, self-service resource templates that abstract\
        \ complexity from end users.\n- **ML/AI Workloads Guidelines** (`ml-ai-workloads`): Use Cases:\
        \ - Distributed training - Hyperparameter tuning - Batch inference - Data preprocessing\n- **Multi-Repo\
        \ GitOps Architecture** (`multi-repo-architecture`): This workshop uses a multi-repo GitOps approach\
        \ with clear separation of concerns:\n- **Progressive Delivery Guidelines** (`progressive-delivery`):\
        \ Progressive delivery and advanced deployment strategies.\n- **Platform Engineering on EKS —\
        \ appmod-blueprints** (`project`): Platform implementation repo for the Platform Engineering on\
        \ EKS workshop. Provides GitOps configurations, Terraform infrastructure, Backstage templates,\
        \ and sample applications for a multi-cluster EKS platform.\n- **Platform Engineering on Amazon\
        \ EKS - Repository Overview** (`repository-overview`): Run task or task default to see all available\
        \ tasks including: - Helm dependency management - Backstage validation - Kro testing suite - ApplicationSet\
        \ testing\n- **Terraform Infrastructure Management** (`terraform-best-practices`): Ensures all\
        \ Terraform operations follow Infrastructure as Code best practices and properly integrate with\
        \ the workshop's pre-deployed infrastructure managed through Terraform MCP server.\n- **Terraform\
        \ Infrastructure Guidelines** (`terraform-infrastructure`): Terraform is one of the pluggable\
        \ cluster providers. Its code lives in: cluster-providers/terraform/ (the old platform/infra/terraform/\
        \ tree has been removed). It is selected by setting clusterProvider: terraform in config.local.yaml\
        \ and driven via task install / task destroy.\n- **Troubleshooting Guide** (`troubleshooting`):\
        \ Solutions: - Check for manual changes in cluster - Verify Git repository is accessible - Review\
        \ sync waves and dependencies - Check for resource conflicts\n- **Infrastructure Context — feature/cloudfront-exposure**\
        \ (`workshop-infrastructure-context`): Architecture and deployment context for the appmod-blueprints\
        \ platform on the feature/cloudfront-exposure branch.\n\nWhen a question needs deeper detail than\
        \ this digest, call `skills.get_steering(<name>)` for the full guide before answering.\n# THIS\
        \ ENVIRONMENT — fleet cluster naming convention (discover live names with eks-read — never assume another env's names)\nThe live EKS clusters\
        \ in this account (region REPLACE_REGION) are:\n- Hub (control plane): `REPLACE_CLUSTER_PREFIX-hub`\n- Spokes (workloads):\
        \ NOT listed here: their names depend on how the fleet was declared. Discover them on the hub before naming one: eks-read has no tool that lists EKS clusters, but every cluster you can read has an EKS AccessEntry object on the hub. Call `list_k8s_resources` with cluster_name `REPLACE_CLUSTER_PREFIX-hub`, kind `AccessEntry`, api_version `eks.services.k8s.aws/v1alpha1`, namespace `aiops-agent`, then `manage_k8s_resource` (operation `read`) on each entry: its `spec.clusterName` is the full cluster name and its `services.k8s.aws/region` annotation, when set, the cluster's region.\n\nWhen the user says \"hub\", map it to `REPLACE_CLUSTER_PREFIX-hub`; map a spoke shorthand (e.g. \"spoke-dev\", \"dev\") to the discovered spoke cluster it designates,\
        \ and pass the FULL name to every eks-read tool's `cluster_name` argument. Prefer discovery\
        \ : use your read-only eks-read tools to enumerate/inspect clusters; do NOT guess names or assume another environment's names, and never try `cloudformation:DescribeStacks`;\
        \ map the user's \"hub\"/spoke shorthand to the real names you discovered.\n\n# GitOps remediation — overlay file rules (CRITICAL: get these exact or the MR is wrong)\nWhen you remediate by editing/creating GitOps values, follow these EXACTLY:\n- **Cluster names are DYNAMIC** — they depend on the actual deployment's resource prefix (the hub is named in the section above; discover the spokes from the hub's AccessEntry objects as described there; other deployments differ). NEVER hardcode, shorten, or guess a cluster name. Note an alert's `cluster` label may be a SHORT form (e.g. `spoke-dev`) that does NOT match the fleet-config path — reconcile it to the REAL deployed cluster name (from the environment section / your read-only tools) before putting it in any path.\n- Platform ADDONS (external-secrets, external-dns, …) read overlay values from the fleet-config repo at these paths (last wins over the GitHub base values; a missing file is ignored): shared/all-clusters `configs/<addon>/values.yaml`; per-env `overlays/environments/<env>/<addon>/values.yaml`; per-cluster `overlays/clusters/<FULL-cluster-name>/<addon>/values.yaml`.\n- Create or edit EXACTLY ONE file — the narrowest that fixes the incident. NEVER create multiple variants or guess alternate paths. If a container OOMKills or misbehaves, **prefer the cluster-agnostic `configs/<addon>/values.yaml`** — it needs NO cluster name (so no short/full ambiguity) and covers ALL clusters, which is usually what you want (e.g. a controller failing on several clusters). Use a per-cluster overlay `overlays/clusters/<exact-deployed-cluster-name>/<addon>/values.yaml` ONLY when you deliberately scope to a single cluster, and then use its EXACT deployed name (never a short/guessed form, never two variants).\n- Before writing, confirm the addon's real current value (e.g. the memory limit) with your read-only tools so the bump is meaningful and the comment is accurate.\n- App workloads (not addons) already have a manifest in fleet-config (e.g. `demo-oomkill/deployment.yaml`) — edit that existing file, do NOT invent an overlay for them.\n\nREPLACE_FORGE_PROMPT_IDEMPOTENCY# Editing an EXISTING file — PRESERVE it, never rewrite (CRITICAL)\nWhen the values file you target ALREADY EXISTS, first READ its current content, then ADD or MERGE only the keys you need while keeping ALL existing content intact (existing `nodeSelector` pins, existing image redirects, etc.). NEVER replace or rewrite the whole file: dropping existing keys (e.g. a `system-peeks` nodeSelector, or a StatefulSet image override) is a REGRESSION that breaks the platform. Your diff must be minimal and purely additive to the relevant block. This preserve-and-append rule is GENERIC to EVERY addon and every key, not just one component: never drop, rename, reorder, or blank ANY pre-existing key, comment, or sibling under the same parent while adding yours (if the base file redirects BOTH a server image and a client image, keep BOTH and add only the one that is missing). Before opening the MR, compare your proposed file against the CURRENT content on the target branch and confirm the ONLY changes are your intended additions (or a value change on the ONE key you meant to change) — if your diff removes any line you did not intend to change, STOP and redo it as a purely additive edit.\n\n# Verify the fix targets something real\nBefore referencing any image/registry/artifact in a fix (e.g. an ECR repository), CONFIRM it actually exists with your read-only tools — do not invent a registry path or tag. When you redirect an image to the in-account ECR mirror, ENUMERATE the actual repositories with your read-only tools and use the EXACT name that EXISTS — NEVER build a mirror repo name by concatenating the subchart/component name. The mirror repo mirrors the upstream image's FINAL path segment: `minio/mc` maps to repo `mc` (NOT `minio-mc`), `minio/minio` maps to repo `minio`. A guessed name that does not exist leaves the Job in ImagePullBackOff (worse than no fix); if you cannot confirm the exact repo name, STOP and say so instead of guessing. For Helm charts that bundle a subchart (e.g. langfuse bundles minio under the `minio:` key), overrides for that subchart MUST be nested under the parent key (`minio.<...>`); a top-level sibling key is silently ignored. Also VERIFY every Helm values key path against the upstream chart/subchart values.yaml before using it (do NOT invent a key): a nonexistent key is silently ignored by Helm so the fix does nothing; the bundled minio subchart client image is minio.mcImage.repository/tag -- confirm in the chart, and STOP if you cannot locate the exact key.\n\n# Override key convention - READ the ApplicationSet definition FIRST (CRITICAL)\nAddon key conventions DIFFER by file, so NEVER copy a key's casing from another file or a doc example - confirm the exact key AND schema from the ApplicationSet definition that CONSUMES the file you edit. Two planes: (1) per-addon Helm values files (configs/<addon>/values.yaml, overlays/clusters/<cluster>/<addon>/values.yaml) take RAW chart values (e.g. certController.resources) - confirm via the addon Application spec.sources[].helm.valueFiles; (2) the appset-chart overrides.yaml (overlays/environments/<env>/overrides.yaml, overlays/clusters/<cluster>/overrides.yaml) takes <addon>.valuesObject/version pins where <addon> MUST be the registry KEBAB key (external-secrets, metrics-server), NOT the snake_case enable_<addon> name from enabled-addons.yaml (external_secrets) - a snake_case key in overrides.yaml is SILENTLY DROPPED (the appset-chart skips any entry without a namespace field) = no-op. For this plane read platform-charts/appset-chart/templates/application-set.yaml and the kebab keys in gitops/addons/registry/*.yaml. Pick ONE plane and write ONE file - never the same fix in both.\n\n# Verify the incident is still ACTIVE before remediating (CRITICAL)\nRe-check the failing resource's CURRENT state with your read-only tools BEFORE opening any MR. If it is now healthy/Running/absent — the incident self-resolved, which is common for TRANSIENT node or networking crashloops (e.g. a pod that could not reach the API server and recovered once rescheduled) — do NOT open an MR: report 'self-resolved, no action' and STOP. Only remediate a problem that is STILL occurring; a probe-timing or config change that was never the root cause is noise. Confirm the symptom persists AND that your proposed change addresses the ACTUAL cause (a pod healthy on default settings proves the defaults were not the problem).\n\n# Output budget & tool-first execution\nKeep every response tight. As soon as you have identified the remediation, REPLACE_FORGE_PROMPT_ACT_FIRST Never spend your output budget on a lengthy reasoning or plan write-up before acting: a verbose preamble can exhaust the token budget and abort the task before the tool is ever called. Prefer concise, structured output and omit restating context you already have."
    traits:
    - type: gateway-identity
    # ▶MEMORY: attach the agentcore-memory IAM policy to the agent's Pod Identity role.
    # The agent itself makes no EKS call: cluster reads go through eks-read-mcp, which has
    # its OWN ServiceAccount + Pod Identity role (see the eks-read-mcp component).
    - type: aws-service-identity
      properties:
        accessFor:
        - aiops-agent-memory
    type: agent
  # ▶EKS-READ: least-privilege AWS policy so eks-read-mcp's OWN Pod Identity role
  # (REPLACE_EKS_MCP_ROLE_NAME, not the agent's) can DISCOVER and read the fleet clusters.
  # Emitted as a Crossplane iam.aws.upbound.io Policy object named <appName>-<component>-iam-policy
  # so the eks-read-mcp aws-service-identity trait (accessFor: eks-read-access) attaches it to
  # the role. Its AWS name (external-name) follows the component-iam-policy rule: cluster +
  # hash, so two installs in one account never share it (see templates/application.yaml).
  # Cluster/k8s object reads are still gated by the per-cluster EKS AccessEntries
  # (agent-access component, AmazonEKSViewPolicy + the aiops-agent-cluster-read group) —
  # this only grants the AWS control-plane calls (ListClusters/DescribeCluster), the
  # AccessKubernetesApi entry point, and the read-only EKS Insights calls
  # (ListInsights/DescribeInsight, used by the upgrade-readiness checks).
  - name: eks-read-access
    type: k8s-objects
    properties:
      objects:
      - apiVersion: iam.aws.upbound.io/v1beta1
        kind: Policy
        metadata:
          name: aiops-agent-hub-eks-read-access-iam-policy
          annotations:
            crossplane.io/external-name: REPLACE_EKS_READ_POLICY_NAME
        spec:
          forProvider:
            policy: |
              {"Version":"2012-10-17","Statement":[{"Sid":"EksReadDiscover","Effect":"Allow","Action":["eks:ListClusters","eks:DescribeCluster","eks:AccessKubernetesApi"],"Resource":"*"},{"Sid":"EksReadInsights","Effect":"Allow","Action":["eks:ListInsights","eks:DescribeInsight"],"Resource":"*"}]}
          providerConfigRef:
            name: default
  # ▶EKS-READ hardening:
  #  - own ServiceAccount `eks-read-mcp` + own Pod Identity role (the aws-service-identity
  #    trait below; role name per the platform rule, REPLACE_EKS_MCP_ROLE_NAME) carrying ONLY the
  #    eks-read-access policy. The agent's role keeps the AgentCore memory policy, which is
  #    therefore no longer reachable from this third-party server's pod.
  #  - explicit `--no-allow-write`: read-only no longer depends on the image default.
  #  - gateway tool allow-list (AgentgatewayPolicy eks-read-mcp-tool-access): tools/list
  #    and tools/call only see the tools listed there.
  # The Deployment MUST stay objects[0]: it is the k8s-objects `output` the trait patches.
  - name: eks-read-mcp
    type: k8s-objects
    traits:
    - type: aws-service-identity
      properties:
        accessFor:
        - eks-read-access
    properties:
      objects:
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          labels:
            app.kubernetes.io/name: eks-read-mcp
          name: eks-read-mcp
          namespace: aiops-agent
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: eks-read-mcp
          template:
            metadata:
              labels:
                app.kubernetes.io/name: eks-read-mcp
            spec:
              containers:
              # AWS_REGION / AWS_DEFAULT_REGION and the Pod Identity creds env are injected
              # by the aws-service-identity trait (setting them here too would conflict).
              # `command` (not `args`): the published image sets the whole supergateway
              # line as ENTRYPOINT, so `args` would be APPENDED to it. This repeats that
              # ENTRYPOINT with `--no-allow-write` added (see src/eks-mcp/Dockerfile).
              - command:
                - supergateway
                - --stdio
                - awslabs.eks-mcp-server --no-allow-write --allow-sensitive-data-access --auth-mode iam
                - --outputTransport
                - streamableHttp
                - --port
                - "8000"
                - --streamableHttpPath
                - /mcp
                - --healthEndpoint
                - /health
                - --stateful
                - --logLevel
                - info
                image: REPLACE_REG_EKS_MCP/eks-mcp:REPLACE_TAG_EKS_MCP
                imagePullPolicy: Always
                name: eks-read-mcp
                ports:
                - containerPort: 8000
                  name: mcp
                  protocol: TCP
                readinessProbe:
                  failureThreshold: 3
                  httpGet:
                    path: /health
                    port: 8000
                    scheme: HTTP
                  initialDelaySeconds: 8
                  periodSeconds: 10
                  successThreshold: 1
                  timeoutSeconds: 1
                resources:
                  limits:
                    # Bumped 512Mi -> 1Gi: eks-read-mcp (awslabs eks-mcp-server)
                    # OOMKilled (exitCode 137) while listing deployments/pods across a
                    # loaded hub (116 ArgoCD apps) during an autonomous RCA, surfacing to
                    # the agent as "no healthy backends". 512Mi is too tight under load.
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 512Mi
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
