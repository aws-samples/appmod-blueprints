{{- /*
Render the PEEKS agent OAM Application from the canonical manifest in files/.
We use .Files.Get so Helm does NOT evaluate the embedded Go/AlertManager templates
(e.g. {{ "{{" }} .CommonLabels.alertname {{ "}}" }} in the AlertManager receiver) —
the file content is a plain string, and only the REPLACE_ tokens are substituted.

Image tokens are per-component: REPLACE_REG_<C>/REPLACE_TAG_<C>. Each resolves to the
per-component override in .Values.images.<c> when set, else falls back to the global
.Values.imageRegistry / .Values.imageTag. This lets a single component be pinned to a
different registry/tag (e.g. incidentBridge.tag) without moving the other images.
*/ -}}
{{- $reg := .Values.imageRegistry -}}
{{- $tag := .Values.imageTag | toString -}}
{{- $im  := .Values.images | default dict -}}
{{- $skills := (index $im "skillsMcp")      | default dict -}}
{{- $agent  := (index $im "agent")          | default dict -}}
{{- $eks    := (index $im "eksMcp")         | default dict -}}
{{- $gitlab := (index $im "gitlabMcp")      | default dict -}}
{{- $chat   := (index $im "chatUi")         | default dict -}}
{{- $ib     := (index $im "incidentBridge") | default dict -}}
{{- /*
AWS names that follow the platform's per-cluster naming (aws-service-identity and
component-iam-policy traits, platform/oam/definitions/traits/): the agent runs on the
hub, <clusterPrefix>-hub, in namespace aiops-agent. Same rule as the traits:
  role:   <first 50 of "<cluster>-<sa>">-<sha256("<region>/<cluster>/<ns>/<sa>")[:8]>-role
  policy: <first 100 of "<cluster>-<app>-<component>">-<sha256("<region>/<cluster>/<ns>/<app>/<component>")[:8]>-iam-policy
*/ -}}
{{- $hub := printf "%s-hub" .Values.clusterPrefix -}}
{{- $agentRole := include "aiops-agent.podIdentityRoleName" (dict "root" $ "sa" "aiops-agent") -}}
{{- /* eks-read-mcp has its own SA (and so its own trait-named role): it is the principal of the EKS AccessEntries (hub here, spokes in templates/spoke-access.yaml). */ -}}
{{- $eksMcpRole := include "aiops-agent.podIdentityRoleName" (dict "root" $ "sa" "eks-read-mcp") -}}
{{- $polKey := printf "%s/%s/aiops-agent/aiops-agent-hub/eks-read-access" .Values.region $hub -}}
{{- $eksReadPolicy := printf "%s-%s-iam-policy" (printf "%s-aiops-agent-hub-eks-read-access" $hub | trunc 100) (sha256sum $polKey | trunc 8) -}}
{{- /*
MR project (path) the agent and the incident-bridge dup-check target = the fleet repo,
DERIVED from .Values.fleetRepoUrl (scheme+host and .git stripped). "" when there is no
fleet repo (dup-check disabled, fail-open). .Values.gitlabMrProject, when set, still wins
(deprecated explicit override kept for one release).
*/ -}}
{{- $mrProject := .Values.gitlabMrProject | default (trimSuffix ".git" (regexReplaceAll "^https?://[^/]+/" (.Values.fleetRepoUrl | default "") "")) -}}
{{- /*
Forge variant (templates/_helpers.tpl "aiops-agent.forge", derived, no parameter):
files/aiops-agent-app.yaml is the forge-neutral core; each REPLACE_FORGE_<SLOT> token in it
is filled from files/forge/<forge>/<slot>.txt.
  gitlab  the original GitLab text, byte for byte (workshop render unchanged).
  none    no gitlab-mcp, no token ExternalSecret; the agent's mcpServers are skills-mcp +
          eks-read-mcp only (OAP /ready requires every listed server), and its prompt says
          it is read-only and gives fixes as text. The incident path (IAMRoleSelectors,
          ACK IAM/SNS/SQS, AmpIncident, incident-bridge) is in the core, so it is rendered
          in BOTH variants: it does not need GitLab (the bridge's open-MR dup-check is
          fail-open and is the only forge-specific part, slot BRIDGE_ENV), and keeping it
          means a GitLab -> none switch deletes no ACK CR (deleting them in the same GC
          pass as their IAMRoleSelectors left them stuck in deletion with the AWS
          resources still there).
Line slots stand alone on their own line: the token AND its newline are replaced, so an
empty fragment leaves no blank line. Prompt slots sit inside the systemMessage scalar.
Slots are filled BEFORE the REPLACE_* tokens below, which the fragments also use.
*/ -}}
{{- $forge := include "aiops-agent.forge" . -}}
{{- $doc := .Files.Get "files/aiops-agent-app.yaml" -}}
{{- range $slot := list "AGENT_DEPENDS" "MCP_SERVERS" "WRITE_COMPONENT" "BRIDGE_ENV" -}}
{{- $doc = replace (printf "REPLACE_FORGE_%s\n" $slot) ($.Files.Get (printf "files/forge/%s/%s.txt" $forge ($slot | lower | replace "_" "-"))) $doc -}}
{{- end -}}
{{- range $slot := list "PROMPT_INCIDENT_FIX" "PROMPT_WRITE_RULE" "PROMPT_TOOL_NOTES" "PROMPT_IDEMPOTENCY" "PROMPT_ACT_FIRST" -}}
{{- $doc = replace (printf "REPLACE_FORGE_%s" $slot) ($.Files.Get (printf "files/forge/%s/%s.txt" $forge ($slot | lower | replace "_" "-"))) $doc -}}
{{- end -}}
{{- if contains "REPLACE_FORGE_" $doc -}}
{{- fail (printf "aiops-agent: unfilled REPLACE_FORGE_ slot for forge %q" $forge) -}}
{{- end -}}
{{- $doc
      | replace "REPLACE_REG_SKILLS_MCP"      (default $reg (index $skills "registry"))
      | replace "REPLACE_TAG_SKILLS_MCP"      (default $tag (index $skills "tag" | toString))
      | replace "REPLACE_REG_AGENT"           (default $reg (index $agent  "registry"))
      | replace "REPLACE_TAG_AGENT"           (default $tag (index $agent  "tag" | toString))
      | replace "REPLACE_REG_EKS_MCP"         (default $reg (index $eks    "registry"))
      | replace "REPLACE_TAG_EKS_MCP"         (default $tag (index $eks    "tag" | toString))
      | replace "REPLACE_REG_GITLAB_MCP"      (default $reg (index $gitlab "registry"))
      | replace "REPLACE_TAG_GITLAB_MCP"      (default $tag (index $gitlab "tag" | toString))
      | replace "REPLACE_REG_CHAT_UI"         (default $reg (index $chat   "registry"))
      | replace "REPLACE_TAG_CHAT_UI"         (default $tag (index $chat   "tag" | toString))
      | replace "REPLACE_REG_INCIDENT_BRIDGE" (default $reg (index $ib     "registry"))
      | replace "REPLACE_TAG_INCIDENT_BRIDGE" (default $tag (index $ib     "tag" | toString))
      | replace "REPLACE_AGENT_ROLE_NAME"     $agentRole
      | replace "REPLACE_EKS_MCP_ROLE_NAME"   $eksMcpRole
      | replace "REPLACE_EKS_READ_POLICY_NAME" $eksReadPolicy
      | replace "REPLACE_ACCOUNT_ID"     (.Values.accountId     | toString)
      | replace "REPLACE_CLUSTER_PREFIX" .Values.clusterPrefix
      | replace "REPLACE_REGION"         .Values.region
      | replace "REPLACE_CLOUDFRONT_DOMAIN" .Values.cloudfrontDomain
      | replace "REPLACE_GITLAB_DOMAIN"  .Values.gitlabDomain
      | replace "REPLACE_GITLAB_MR_PROJECT" $mrProject }}
