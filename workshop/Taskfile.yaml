version: "3"
set: [errexit, nounset, pipefail]
silent: true

# Workshop-specific Taskfile for Platform Engineering on EKS (PEEKS).
# Covers workshop pre-requisites and post-install steps that are NOT
# part of the generic appmod-blueprints platform installation.
#
# Included by the root Taskfile under the 'workshop:' namespace.

vars:
  # The workshop lives in <repo>/workshop and is run standalone (cd workshop && task ...).
  # REPO is the platform repo root (this repo's top level) = parent of the workshop dir.
  # All platform paths (config.local.yaml, private/, platform/, .platform clone) hang off REPO.
  REPO:
    sh: cd {{.ROOT_DIR}}/.. && pwd
  CONFIG_FILE: "{{.REPO}}/config.local.yaml"
  AWS_REGION:
    sh: yq '.aws.region' {{.CONFIG_FILE}}
  AWS_ACCOUNT_ID:
    sh: yq '.aws.accountId' {{.CONFIG_FILE}}
  HUB_CLUSTER_NAME:
    sh: yq '.hub.clusterName' {{.CONFIG_FILE}}
  K8S_VERSION:
    sh: yq '.hub.kubernetesVersion // "1.35"' {{.CONFIG_FILE}}
  DOMAIN:
    sh: yq '.domain // ""' {{.CONFIG_FILE}}
  # Platform consumption (OAP-style). If platform.ref is unset, the platform IS
  # this repo (workshop/ is a subfolder) — used in place, no clone. If set, the
  # platform is cloned at that ref into .platform/ and used as a pinned artifact.
  PLATFORM_REF:
    sh: yq '.platform.ref // ""' {{.CONFIG_FILE}}
  PLATFORM_REPO:
    sh: yq '.platform.repo // "https://github.com/aws-samples/appmod-blueprints.git"' {{.CONFIG_FILE}}
  PLATFORM_DIR:
    sh: |
      if [ -z "$(yq '.platform.ref // ""' {{.REPO}}/config.local.yaml)" ]; then
        echo "{{.REPO}}"
      else
        echo "{{.REPO}}/.platform"
      fi
  RESOURCE_PREFIX:
    sh: yq '.resourcePrefix // "peeks"' {{.CONFIG_FILE}}
  IDC_INSTANCE_ARN:
    sh: yq '.identityCenter.instanceArn' {{.CONFIG_FILE}}
  IDC_REGION:
    sh: yq '.identityCenter.region' {{.CONFIG_FILE}}
  IDC_ADMIN_GROUP_ID:
    sh: yq '.identityCenter.adminGroupId' {{.CONFIG_FILE}}
  GIT_USERNAME:
    sh: yq '.gitUsername // "user1"' {{.CONFIG_FILE}}
  EXPOSURE_MODE:
    sh: 'if [ -z "$(yq ''.domain // ""'' {{.CONFIG_FILE}})" ]; then echo "cloudfront"; else echo "domain"; fi'
  # NOTE: this taskfile-level var is evaluated ONCE at load time (before the platform
  # CloudFront is created mid-install), so it is only used for informational messaging
  # in pre-install. Tasks that need the LIVE value (idc:configure, setup-env) resolve it
  # in their own task-level vars from private/cloudfront-domain (+ AWS fallback).
  CLOUDFRONT_DOMAIN:
    sh: cat {{.REPO}}/private/cloudfront-domain 2>/dev/null | tr -d '[:space:]' || true
  C_STEP:
    sh: printf '\033[1;33m'
  C_OK:
    sh: printf '\033[1;32m'
  C_ERR:
    sh: printf '\033[1;31m'
  C_INFO:
    sh: printf '\033[1;36m'
  C_RESET:
    sh: printf '\033[0m'

tasks:
  # ============================================================
  # FULL WORKSHOP INSTALL
  # Single entry point: task workshop:install
  # Orchestrates platform install + workshop-specific setup
  # ============================================================

  install:
    desc: "Full workshop install (platform + GitLab + Ray + IDC federation)"
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-crossplane"' {{.CONFIG_FILE}}
      # PROVIDER_SPOKE maps clusterProvider to the spoke enable task suffix:
      #   kind-kro-ack    → spokes:enable-kro
      #   kind-crossplane → spokes:enable-crossplane
      PROVIDER_SPOKE:
        sh: 'if [ "$(yq ''.clusterProvider // "kind-crossplane"'' {{.CONFIG_FILE}})" = "kind-kro-ack" ]; then echo "kro"; else echo "crossplane"; fi'
      INSTALL_START:
        sh: date +%s
    cmds:
      - printf '{{.C_STEP}}▸ Workshop install starting...{{.C_RESET}}\n'
      # Initialize GitLab FIRST — it starts at EC2 boot and is ready before platform install.
      # This ensures fleet-config exists when hub:set-overlay-repo and spokes run inside
      # {{.PROVIDER}}:install (which needs fleet-config during phase2).
      - task: gitlab:init-ec2
      - 'printf "{{.C_INFO}}  [%ds] gitlab:init-ec2 done{{.C_RESET}}\n" "$(($(date +%s) - {{.INSTALL_START}}))"'
      # Platform install as a black box (OAP model): prepare the platform artifact
      # (in-place parent repo, or a pinned clone into .platform), then run its own
      # `task install`. The platform provisions the hub + addons only.
      - task: platform:prepare
      - 'cd {{.PLATFORM_DIR}} && task install'
      - 'printf "{{.C_INFO}}  [%ds] platform install done ({{.PLATFORM_DIR}}){{.C_RESET}}\n" "$(($(date +%s) - {{.INSTALL_START}}))"'
      - printf '{{.C_OK}}✓ Platform hub install complete.{{.C_RESET}}\n'
      # Wire the GitLab fleet-config overlay to the hub, then declare spokes into it.
      # The platform's guarded ApplicationSets reconcile these into live clusters.
      - task: set-overlay-repo
      # Declare both spokes via Crossplane. Each lands in its environment (dev/prod)
      # and inherits that env's enabled-addons overlay — which enables crossplane +
      # kubevela (app deployment) on the spoke. The platform's guarded ApplicationSets
      # reconcile the cluster + addons.
      - task: spokes:enable-{{.PROVIDER_SPOKE}}
        vars: { CLI_ARGS: "{{.RESOURCE_PREFIX}}-spoke-dev" }
      - task: spokes:enable-{{.PROVIDER_SPOKE}}
        vars: { CLI_ARGS: "{{.RESOURCE_PREFIX}}-spoke-prod" }
      - 'printf "{{.C_INFO}}  [%ds] spokes declared (spoke-dev + spoke-prod via {{.PROVIDER_SPOKE}}){{.C_RESET}}\n" "$(($(date +%s) - {{.INSTALL_START}}))"'
      # Ray ML infrastructure (image builds in background)
      - 'cd {{.PLATFORM_DIR}} && task {{.PROVIDER}}:ray:setup'
      - 'printf "{{.C_INFO}}  [%ds] ray:setup done{{.C_RESET}}\n" "$(($(date +%s) - {{.INSTALL_START}}))"'
      # IDC/Keycloak federation (ArgoCD SSO)
      - task: post-install
      - 'printf "{{.C_INFO}}  [%ds] post-install done{{.C_RESET}}\n" "$(($(date +%s) - {{.INSTALL_START}}))"'
      # Wait for Ray image to be ready
      - 'cd {{.PLATFORM_DIR}} && task {{.PROVIDER}}:ray:wait-image'
      # Download ML models to S3
      - 'cd {{.PLATFORM_DIR}} && task {{.PROVIDER}}:ray:prestage-models'
      # Final tolerant gate: spokes are enabled asynchronously during {{.PROVIDER}}:install
      # (git push only), so their EKS clusters + ArgoCD apps finish provisioning while the
      # ray/IDC/model tail above runs. Confirm they landed before we declare success.
      # Non-fatal: never fails the install (spoke apps may legitimately still be settling).
      - task: wait-for-spokes
      - 'printf "{{.C_INFO}}  [%ds] wait-for-spokes done{{.C_RESET}}\n" "$(($(date +%s) - {{.INSTALL_START}}))"'
      # Write platform URLs + credentials to ~/.bashrc.d/platform.sh for IDE use
      - task: setup-env
      - |
        # Restore hub context as the active kubectl context.
        # install steps (wait-for-spokes, idc:configure) may switch to spoke contexts.
        aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
          --alias {{.HUB_CLUSTER_NAME}} 2>/dev/null || true
        kubectl config use-context {{.HUB_CLUSTER_NAME}} 2>/dev/null || true
        printf '{{.C_INFO}}  kubectl context → {{.HUB_CLUSTER_NAME}}{{.C_RESET}}\n'
      - 'printf "{{.C_OK}}✓ Workshop install complete in %ds.{{.C_RESET}}\n" "$(($(date +%s) - {{.INSTALL_START}}))"'

  # ============================================================
  # DESTROY — full ordered teardown
  # ============================================================
  credentials:refresh:
    desc: "Refresh AWS credentials in the bootstrap kind cluster (call when ACK shows ExpiredTokenException)"
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-crossplane"' {{.CONFIG_FILE}}
    cmds:
      - 'cd {{.PLATFORM_DIR}} && task {{.PROVIDER}}:credentials:refresh'

  destroy:
    desc: "Full teardown: drain workloads from spokes → delete spokes → destroy hub platform"
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-crossplane"' {{.CONFIG_FILE}}
      HUB_KUBECONFIG: "{{.REPO}}/private/hub-kubeconfig"
    cmds:
      - printf '{{.C_STEP}}▸ Workshop destroy starting (workloads → spokes → hub){{.C_RESET}}\n'

      # Phase 0: hub kubeconfig
      - |
        aws eks update-kubeconfig \
          --name $(yq '.hub.clusterName // "peeks-hub"' {{.CONFIG_FILE}}) \
          --region $(yq '.aws.region' {{.CONFIG_FILE}}) \
          --kubeconfig {{.HUB_KUBECONFIG}} 2>/dev/null || true

      # Phase 1: drain workloads (Ingress → ALBs, LB Services → NLBs, PVCs → EBS)
      # from every spoke BEFORE deleting the spoke clusters, so no ENI-locked VPCs
      # block the spoke VPC deletion.
      - |
        printf '{{.C_STEP}}▸ Phase 1 — draining workloads from spoke clusters...{{.C_RESET}}\n'
        PREFIX=$(yq '.resourcePrefix // "peeks"' {{.CONFIG_FILE}})
        REGION=$(yq '.aws.region' {{.CONFIG_FILE}})
        SPOKES=$(aws eks list-clusters --region "$REGION" \
          --query "clusters[?starts_with(@,'${PREFIX}-spoke')]" \
          --output text 2>/dev/null | tr '\t' '\n' | grep -v '^$' || true)
        if [ -z "$SPOKES" ]; then
          printf '{{.C_INFO}}  No spoke clusters found — skipping workload drain.{{.C_RESET}}\n'
        else
          for SPOKE in $SPOKES; do
            printf '{{.C_STEP}}  Draining %s...{{.C_RESET}}\n' "$SPOKE"
            KC=$(mktemp)
            aws eks update-kubeconfig --name "$SPOKE" --region "$REGION" \
              --kubeconfig "$KC" 2>/dev/null || { rm -f "$KC"; continue; }
            kubectl --kubeconfig "$KC" delete ingress --all-namespaces --all \
              --timeout=120s 2>/dev/null || true
            kubectl --kubeconfig "$KC" get svc --all-namespaces -o json 2>/dev/null \
              | jq -r '.items[]|select(.spec.type=="LoadBalancer")|"\(.metadata.namespace) \(.metadata.name)"' \
              | while read NS SVC; do
                  kubectl --kubeconfig "$KC" delete svc "$SVC" -n "$NS" \
                    --timeout=60s 2>/dev/null || true
                done
            kubectl --kubeconfig "$KC" delete pvc --all-namespaces --all \
              --timeout=120s 2>/dev/null || true
            rm -f "$KC"
            printf '{{.C_OK}}  ✓ %s drained.{{.C_RESET}}\n' "$SPOKE"
          done
        fi

      # Phase 2: delete spoke clusters via fleet overlay + wait for AWS deletion
      - printf '{{.C_STEP}}▸ Phase 2 — deleting spoke clusters...{{.C_RESET}}\n'
      - task: spokes:disable-all

      # Phase 3: destroy the hub (addons → EKS → Kind → IAM → Secrets)
      - printf '{{.C_STEP}}▸ Phase 3 — destroying hub platform ({{.PROVIDER}})...{{.C_RESET}}\n'
      - 'cd {{.PLATFORM_DIR}} && task {{.PROVIDER}}:destroy'

      - printf '{{.C_OK}}✓ Workshop destroy complete.{{.C_RESET}}\n'

  # ============================================================
  # PLATFORM ARTIFACT (OAP-style consumption)
  # ============================================================
  # ============================================================
  # PLATFORM ARTIFACT (OAP-style consumption)
  # ============================================================
  platform:prepare:
    desc: "Prepare the platform artifact: in-place (platform.ref unset) or clone a pinned ref into .platform"
    cmds:
      - |
        if [ -z "{{.PLATFORM_REF}}" ]; then
          printf '{{.C_INFO}}  platform.ref unset — using in-place platform at {{.REPO}}{{.C_RESET}}\n'
          exit 0
        fi
        DIR="{{.REPO}}/.platform"
        if [ -d "$DIR/.git" ]; then
          printf '{{.C_STEP}}▸ Updating pinned platform ({{.PLATFORM_REF}}) in .platform...{{.C_RESET}}\n'
          git -C "$DIR" fetch origin --quiet && git -C "$DIR" checkout "{{.PLATFORM_REF}}" --quiet && git -C "$DIR" pull origin "{{.PLATFORM_REF}}" --quiet 2>/dev/null || true
        else
          printf '{{.C_STEP}}▸ Cloning platform {{.PLATFORM_REPO}}@{{.PLATFORM_REF}} into .platform...{{.C_RESET}}\n'
          git clone --branch "{{.PLATFORM_REF}}" --single-branch "{{.PLATFORM_REPO}}" "$DIR"
        fi
        # The workshop config.local.yaml is a superset of the platform contract; the
        # platform reads the fields it needs and ignores the workshop-only ones.
        cp "{{.REPO}}/config.local.yaml" "$DIR/config.local.yaml"
        printf '{{.C_OK}}✓ Platform artifact ready at %s{{.C_RESET}}\n' "$DIR"

  # ============================================================
  # FINAL SPOKE GATE (tolerant, non-fatal)
  # ============================================================
  wait-for-spokes:
    desc: "Wait for spoke EKS clusters ACTIVE + their ArgoCD cluster secrets + spoke apps synced (tolerant, non-fatal)"
    vars:
      SPOKES: "{{.RESOURCE_PREFIX}}-spoke-dev {{.RESOURCE_PREFIX}}-spoke-prod"
      MAX_OUTOFSYNC: '{{.MAX_OUTOFSYNC | default "5"}}'
    cmds:
      - |
        # Strictly non-fatal: disable errexit so no internal check can fail the install.
        set +e
        KC=$(mktemp)
        if ! aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --kubeconfig "$KC" >/dev/null 2>&1; then
          printf '{{.C_ERR}}⚠ wait-for-spokes: cannot get hub kubeconfig — skipping (non-fatal).{{.C_RESET}}\n'
          rm -f "$KC"; exit 0
        fi
        export KUBECONFIG="$KC"

        # 1) Spoke EKS clusters ACTIVE (~20min budget each, tolerant)
        for S in {{.SPOKES}}; do
          printf '{{.C_STEP}}▸ [%s] waiting for EKS cluster ACTIVE...{{.C_RESET}}\n' "$S"
          OK=false
          for i in $(seq 1 80); do
            ST=$(aws eks describe-cluster --name "$S" --region {{.AWS_REGION}} --query 'cluster.status' --output text 2>/dev/null || echo "NONE")
            if [ "$ST" = "ACTIVE" ]; then OK=true; break; fi
            sleep 15
          done
          if [ "$OK" = "true" ]; then
            printf '{{.C_OK}}  ✓ %s ACTIVE{{.C_RESET}}\n' "$S"
          else
            printf '{{.C_ERR}}  ⚠ %s not ACTIVE after ~20min — continuing (non-fatal).{{.C_RESET}}\n' "$S"
          fi
        done

        # 2) Spoke ArgoCD cluster secrets registered on the hub (needed for CD ApplicationSets)
        for S in {{.SPOKES}}; do
          for i in $(seq 1 40); do
            if kubectl get secret -n argocd -l argocd.argoproj.io/secret-type=cluster \
                 -o custom-columns=NAME:.metadata.name --no-headers 2>/dev/null | grep -qx "$S"; then
              break
            fi
            if [ "$i" = "40" ]; then
              printf '{{.C_ERR}}  ⚠ %s ArgoCD cluster secret not registered — continuing (non-fatal).{{.C_RESET}}\n' "$S"
            fi
            sleep 15
          done
        done

        # 3) Spoke-targeted apps synced within tolerance, nudging stuck ones (resets ArgoCD backoff)
        printf '{{.C_STEP}}▸ Waiting for spoke apps to sync (tolerance %s, non-fatal)...{{.C_RESET}}\n' "{{.MAX_OUTOFSYNC}}"
        SPOKE_RE=$(echo "{{.SPOKES}}" | tr ' ' '|')
        TIMEOUT=1200; INTERVAL=30; ELAPSED=0; LAST_NUDGE=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          ALL=$(kubectl get applications.argoproj.io -n argocd \
            -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,DEST:.spec.destination.name --no-headers 2>/dev/null || echo "")
          APPS=$(echo "$ALL" | awk -v re="$SPOKE_RE" '$3 ~ ("^("re")$")')
          TOTAL=$(echo "$APPS" | awk 'NF>0' | wc -l | tr -d ' ')
          OOS=$(echo "$APPS" | awk '$2!="Synced" && NF>0' | wc -l | tr -d ' ')
          printf '{{.C_INFO}}  spoke apps: %s total, %s out-of-sync (%ss elapsed){{.C_RESET}}\n' "$TOTAL" "$OOS" "$ELAPSED"
          if [ "$TOTAL" -gt 0 ] && [ "$OOS" -le {{.MAX_OUTOFSYNC}} ]; then
            printf '{{.C_OK}}✓ spoke apps synced within tolerance.{{.C_RESET}}\n'
            break
          fi
          # After a 3min grace period, nudge out-of-sync apps every 5min to reset stuck backoff
          if [ $ELAPSED -ge 180 ] && [ $((ELAPSED - LAST_NUDGE)) -ge 300 ]; then
            for a in $(echo "$APPS" | awk '$2!="Synced" && NF>0 {print $1}'); do
              kubectl patch application "$a" -n argocd --type merge \
                -p '{"operation":{"initiatedBy":{"username":"admin"},"sync":{"revision":"HEAD"}}}' >/dev/null 2>&1 || true
            done
            LAST_NUDGE=$ELAPSED
            printf '{{.C_INFO}}  ↻ nudged out-of-sync spoke apps{{.C_RESET}}\n'
          fi
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          printf '{{.C_ERR}}⚠ spoke apps still syncing after %ss — continuing (non-fatal).{{.C_RESET}}\n' "$TIMEOUT"
        fi
        rm -f "$KC"
      - printf '{{.C_OK}}✓ Spoke wait-gate complete.{{.C_RESET}}\n'

  # ============================================================
  # PRE-REQUISITES
  # Run before task install to prepare workshop-specific resources
  # ============================================================

  pre-install:
    desc: Verify workshop pre-requisites (normally provisioned by CDK in guided events)
    cmds:
      - task: create-ray-models-bucket
      - |
        printf '{{.C_INFO}}Workshop pre-requisites check:{{.C_RESET}}\n'
        printf '  In Workshop Studio (guided) events:\n'
        printf '    1. CDK bootstrap.sh provisions the IDE/GitLab CloudFront + GitLab CE,\n'
        printf '       writes private/gitlab-cloudfront-domain\n'
        printf '    2. SSM SetupIDE runs create-config.sh which generates config.local.yaml\n'
        printf '       (auto-detects region, account, IDC; sets domain: "" for cloudfront mode\n'
        printf '        and cloudfront.gitlabDomain from private/gitlab-cloudfront-domain).\n'
        printf '       NOTE: the PLATFORM CloudFront domain is NOT a prerequisite and is NOT\n'
        printf '       stored in config.local.yaml — it is created by cloudfront:hub-distribution\n'
        printf '       during task install and recorded in private/cloudfront-domain.\n'
        printf '    3. task install + task workshop:post-install run automatically\n'
        printf '  For self-paced: just run create-config.sh; task install creates the platform CloudFront.\n'
        if [ -z "{{.CLOUDFRONT_DOMAIN}}" ]; then
          printf '{{.C_INFO}}  ℹ platform CloudFront domain not created yet — it will be created during task install.{{.C_RESET}}\n'
        else
          printf '{{.C_OK}}✓ platform CloudFront domain: {{.CLOUDFRONT_DOMAIN}}{{.C_RESET}}\n'
        fi

  # ============================================================
  # POST-INSTALL
  # Run after task install to complete workshop-specific setup
  # ============================================================

  create-ray-models-bucket:
    desc: Create the Ray model staging S3 bucket for AI/ML modules (idempotent)
    status:
      - aws s3api head-bucket --bucket {{.HUB_CLUSTER_NAME}}-ray-models-{{.AWS_ACCOUNT_ID}} --region {{.AWS_REGION}} 2>/dev/null
    cmds:
      - printf '{{.C_STEP}}▸ Creating Ray model staging bucket...{{.C_RESET}}\n'
      - |
        BUCKET="{{.HUB_CLUSTER_NAME}}-ray-models-{{.AWS_ACCOUNT_ID}}"
        aws s3api create-bucket --bucket "$BUCKET" --region {{.AWS_REGION}} \
          {{if ne .AWS_REGION "us-east-1"}}--create-bucket-configuration LocationConstraint={{.AWS_REGION}}{{end}} \
          --no-cli-pager >/dev/null
        aws s3api put-public-access-block --bucket "$BUCKET" --region {{.AWS_REGION}} \
          --public-access-block-configuration "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true" >/dev/null
      - printf '{{.C_OK}}✓ s3://{{.HUB_CLUSTER_NAME}}-ray-models-{{.AWS_ACCOUNT_ID}} ready.{{.C_RESET}}\n'

  post-install:
    desc: Workshop post-install steps (IDC/Keycloak federation for ArgoCD SSO)
    cmds:
      - task: idc:configure


  setup-env:
    desc: Write platform URLs and credentials to ~/.bashrc.d/platform.sh (workshop IDE env vars)
    ignore_error: true
    vars:
      ARGOCD_URL:
        sh: aws eks describe-capability --cluster-name {{.HUB_CLUSTER_NAME}} --capability-name argocd --query 'capability.configuration.argoCd.serverUrl' --output text --region {{.AWS_REGION}} 2>/dev/null || echo ""
      CF_DOMAIN:
        sh: |
          D=$(cat {{.REPO}}/private/cloudfront-domain 2>/dev/null | tr -d '[:space:]')
          [ -z "$D" ] && D=$(aws cloudfront list-distributions --region {{.AWS_REGION}} \
            --query "DistributionList.Items[?Comment=='{{.HUB_CLUSTER_NAME}}-platform'].DomainName | [0]" \
            --output text 2>/dev/null | tr -d '[:space:]')
          [ "$D" = "None" ] && D=""
          echo "$D"
      GITLAB_CF_DOMAIN_VAR:
        sh: yq '.cloudfront.gitlabDomain // ""' {{.CONFIG_FILE}} | grep -v '^$' || cat {{.REPO}}/private/gitlab-cloudfront-domain 2>/dev/null || true
      USER_PASSWORD:
        sh: aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password // ""'
      KC_ADMIN_PASSWORD:
        sh: aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.keycloak_admin_password // ""'
    cmds:
      - |
        set +e
        PLATFORM_FILE="$HOME/.bashrc.d/platform.sh"
        set_var() { local n="$1" v="$2"
          grep -q "^export ${n}=" "$PLATFORM_FILE" 2>/dev/null             && sed -i "s|^export ${n}=.*|export ${n}=\"${v}\"|" "$PLATFORM_FILE"             || echo "export ${n}=\"${v}\"" >> "$PLATFORM_FILE"
        }
        CF="{{.CF_DOMAIN}}"
        GITLAB_CF="{{.GITLAB_CF_DOMAIN_VAR}}"
        # Fall back to platform domain if gitlabDomain not set
        [ -z "$GITLAB_CF" ] && GITLAB_CF="$CF"
        ARGOCD="{{.ARGOCD_URL}}"
        ARGOCD_SERVER=$(echo "$ARGOCD" | sed 's|https://||;s|/.*||')
        UP="{{.USER_PASSWORD}}"
        KC="{{.KC_ADMIN_PASSWORD}}"
        set_var BACKSTAGE_URL "https://${CF}/backstage"
        set_var KEYCLOAK_ADMIN_URL "https://${CF}/keycloak/admin"
        set_var WORKFLOWS_URL "https://${CF}/argo-workflows"
        set_var KARGO_URL "https://${CF}"
        set_var GRAFANA_URL "https://${CF}/grafana"
        set_var GITLAB_URL "https://${GITLAB_CF}"
        set_var GITLAB_DOMAIN "${GITLAB_CF}"
        set_var CLOUDFRONT_DOMAIN "${CF}"
        set_var ARGOCD_URL "${ARGOCD}"
        set_var ARGOCD_SERVER "${ARGOCD_SERVER}"
        set_var ARGOCD_OPTS "--grpc-web"
        set_var USER_PASSWORD "${UP}"
        set_var USER1_PASSWORD "${UP}"
        set_var GIT_TOKEN "${UP}"
        set_var GIT_USERNAME "user1"
        set_var KEYCLOAK_ADMIN_PASSWORD "${KC}"
        printf '{{.C_OK}}✓ Platform env vars written to %s{{.C_RESET}}\n' "$PLATFORM_FILE"
        source "$PLATFORM_FILE" 2>/dev/null || true

  # ============================================================
  # IDC / KEYCLOAK FEDERATION
  # Configures IAM Identity Center with Keycloak as external IdP
  # ============================================================

  idc:configure:
    desc: Configure IDC with Keycloak as external IdP and sync users via SCIM
    status:
      - |
        IDENTITY_STORE_ID=$(aws sso-admin list-instances --region {{.AWS_REGION}} \
          --query "Instances[?InstanceArn=='{{.IDC_INSTANCE_ARN}}'].IdentityStoreId" --output text 2>/dev/null)
        aws identitystore list-users --identity-store-id "$IDENTITY_STORE_ID" --region {{.AWS_REGION}} \
          --filters "AttributePath=UserName,AttributeValue={{.GIT_USERNAME}}" \
          --query "Users[0].UserId" --output text 2>/dev/null | grep -qv "^None\|^$"
    vars:
      IDC_INSTANCE_ID:
        sh: echo "{{.IDC_INSTANCE_ARN}}" | awk -F'/' '{print $NF}' | sed 's/^ssoins-//'
      KC_ADMIN_PASSWORD:
        sh: aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text | jq -r '.keycloak_admin_password'
      KEYCLOAK_DNS:
        sh: |
          if [ "{{.EXPOSURE_MODE}}" = "cloudfront" ]; then
            # Resolve the platform CloudFront domain at TASK-RUN time from the runtime
            # artifact (created mid-install by cloudfront:hub-distribution), with an AWS
            # lookup fallback. Do NOT use the taskfile-level CLOUDFRONT_DOMAIN var:
            # global vars are evaluated once at load — before the distribution exists — so
            # it is always empty here (this was the cause of the empty --keycloak-dns).
            # Do NOT read config.local.yaml (the domain is not stored there).
            D=$(cat {{.REPO}}/private/cloudfront-domain 2>/dev/null | tr -d '[:space:]')
            if [ -z "$D" ]; then
              D=$(aws cloudfront list-distributions --region {{.AWS_REGION}} \
                --query "DistributionList.Items[?Comment=='{{.HUB_CLUSTER_NAME}}-platform'].DomainName | [0]" \
                --output text 2>/dev/null | tr -d '[:space:]')
            fi
            [ "$D" = "None" ] && D=""
            echo "$D"
          else
            yq '.domain' {{.CONFIG_FILE}}
          fi
    cmds:
      - printf '{{.C_STEP}}▸ Refreshing IDC integration credentials via Lambda...{{.C_RESET}}\n'
      - |
        [ "${DEBUG:-false}" = "true" ] && set -x
        LAMBDA_ARN=$(aws cloudformation describe-stacks --region {{.AWS_REGION}} \
          --query "Stacks[?contains(StackName,'peeks-workshop')].Outputs[?OutputKey=='KeycloakIDCCredentialsLambdaArn'].OutputValue | [0][0]" --output text 2>/dev/null) || LAMBDA_ARN=""
        # Fallback: find Lambda by name pattern if not in CFN outputs
        case "$LAMBDA_ARN" in
          ""|None)
            LAMBDA_ARN=$(aws lambda list-functions --region {{.AWS_REGION}} \
              --query "Functions[?contains(FunctionName,'KeycloakIDCIntegration')].FunctionArn | [0]" \
              --output text 2>/dev/null) || LAMBDA_ARN=""
            case "$LAMBDA_ARN" in None) LAMBDA_ARN="" ;; esac
          ;;
        esac
        case "$LAMBDA_ARN" in
          ""|None)
            echo "WARN: Lambda not found. Falling back to instance profile."
            TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")
            ROLE=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/)
            CREDS=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE)
            aws ssm put-parameter \
              --name "/{{.RESOURCE_PREFIX}}/keycloak-idc-integration-credentials" \
              --value "$(echo "$CREDS" | python3 -c "import json,sys; c=json.load(sys.stdin); print(json.dumps({'AccessKeyId':c['AccessKeyId'],'SecretAccessKey':c['SecretAccessKey'],'SessionToken':c['Token'],'Expiration':c['Expiration']}))")" \
              --type "SecureString" --overwrite --region {{.AWS_REGION}} > /dev/null
          ;;
          *)
            ROLE_ARN=$(aws cloudformation describe-stacks --region {{.AWS_REGION}} \
              --query "Stacks[?contains(StackName,'peeks-workshop')].Outputs[?OutputKey=='SharedRoleArn'].OutputValue | [0][0]" \
              --output text 2>/dev/null | grep -o 'arn:aws:iam::[^[:space:]]*' | head -1) || ROLE_ARN=""
            case "$ROLE_ARN" in
              ""|None)
                ROLE_ARN=$(aws iam list-roles --region {{.AWS_REGION}} \
                  --query "Roles[?contains(RoleName,'SharedRole')].Arn | [0]" \
                  --output text 2>/dev/null | grep -o 'arn:aws:iam::[^[:space:]]*' | head -1) || ROLE_ARN=""
                case "$ROLE_ARN" in None) ROLE_ARN="" ;; esac
              ;;
            esac
            echo "  DEBUG: LAMBDA_ARN=$LAMBDA_ARN ROLE_ARN=$ROLE_ARN"
            case "$ROLE_ARN" in
              "")
                echo "WARN: SharedRole ARN not found — falling back to instance profile."
              ;;
              *)
                PAYLOAD=$(python3 -c "import json; print(json.dumps({'RequestType':'Update','RoleArn':'$ROLE_ARN','ParameterPrefix':'/{{.RESOURCE_PREFIX}}/keycloak-idc-integration-credentials','SessionDuration':'3600'}))")
                aws lambda invoke --function-name "$LAMBDA_ARN" --payload "$PAYLOAD" \
                  --cli-binary-format raw-in-base64-out \
                  --region {{.AWS_REGION}} /tmp/lambda-response.json > /dev/null 2>&1 || true
                if python3 -c "import json,sys; d=json.load(open('/tmp/lambda-response.json')); sys.exit(0 if 'ParameterName' in d else 1)" 2>/dev/null; then
                  echo "Credentials refreshed via Lambda and stored in SSM"
                else
                  echo "WARN: Lambda invocation did not return credentials."
                  cat /tmp/lambda-response.json 2>/dev/null || true
                fi
              ;;
            esac
          ;;
        esac
      - printf '{{.C_STEP}}▸ Installing Playwright...{{.C_RESET}}\n'
      - pip install playwright boto3 requests --quiet 2>/dev/null
      - python3 -m playwright install chromium --quiet 2>/dev/null || python3 -m playwright install chromium
      - sudo yum install -y atk at-spi2-atk cups-libs libdrm libxkbcommon libXcomposite libXdamage libXrandr mesa-libgbm pango alsa-lib nss nspr libXScrnSaver libXtst gtk3 --quiet 2>/dev/null || true
      - printf '{{.C_STEP}}▸ Running IDC ↔ Keycloak SAML/SCIM configuration...{{.C_RESET}}\n'
      - aws ssm get-parameter --name "/{{.RESOURCE_PREFIX}}/keycloak-idc-integration-credentials" --with-decryption --region {{.AWS_REGION}} --query 'Parameter.Value' --output text > /tmp/keycloak-idc-integration-credentials.json
      - |
        IDC_SUCCESS=false
        # Fail-fast: if KEYCLOAK_DNS is empty (domain not written to config/cloudfront-domain),
        # don't waste time curling — skip immediately with a clear message.
        case "{{.KEYCLOAK_DNS}}" in
          ""|null|None)
            printf '{{.C_ERR}}⚠ KEYCLOAK_DNS is empty — platform CloudFront domain not set.{{.C_RESET}}\n'
            printf '{{.C_INFO}}  Fix: ensure private/cloudfront-domain exists, then run: task idc:configure{{.C_RESET}}\n'
          ;;
          *)
        # Pre-check: if Keycloak returns 404/000 the ALB/LBC is not reconciled yet.
        # No amount of retrying helps — skip immediately with a clear message.
        KC_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "https://{{.KEYCLOAK_DNS}}/keycloak/realms/master" --max-time 30 2>/dev/null || echo "000")
        case "$KC_STATUS" in
          000|000000|404)
            printf '{{.C_ERR}}⚠ Keycloak not reachable (HTTP %s) — skipping IDC config. Run: task idc:configure{{.C_RESET}}\n' "$KC_STATUS"
          ;;
          *)
            printf '{{.C_INFO}}  Keycloak reachable (HTTP %s) — running IDC configuration...{{.C_RESET}}\n' "$KC_STATUS"
            if python3 {{.REPO}}/platform/infra/terraform/scripts/configure_identity_center.py \
                --region {{.AWS_REGION}} \
                --instance-id {{.IDC_INSTANCE_ID}} \
                --keycloak-dns {{.KEYCLOAK_DNS}} \
                --keycloak-admin-password="{{.KC_ADMIN_PASSWORD}}"; then
              IDC_SUCCESS=true
            fi
          ;;
        esac
          ;;
        esac
        if [ "$IDC_SUCCESS" = true ]; then
          printf '{{.C_OK}}✓ IDC configured with Keycloak federation and SCIM sync.{{.C_RESET}}\n'
        else
          printf '{{.C_ERR}}⚠ IDC configuration failed. Run manually: task workshop:idc:configure{{.C_RESET}}\n'
        fi
      - printf '{{.C_STEP}}▸ Syncing admin group members into IDC admin group...{{.C_RESET}}\n'
      - |
        IDENTITY_STORE_ID=$(aws sso-admin list-instances --region {{.IDC_REGION}} --query 'Instances[0].IdentityStoreId' --output text | head -1)
        SCIM_ADMIN_GROUP=$(aws identitystore list-groups --identity-store-id "$IDENTITY_STORE_ID" --region {{.IDC_REGION}} \
          --query "Groups[?DisplayName=='admin'].GroupId | [0]" --output text 2>/dev/null)
        if [ -n "$SCIM_ADMIN_GROUP" ] && [ "$SCIM_ADMIN_GROUP" != "None" ]; then
          EXISTING_MEMBERS=$(aws identitystore list-group-memberships --identity-store-id "$IDENTITY_STORE_ID" \
            --group-id "{{.IDC_ADMIN_GROUP_ID}}" --region {{.IDC_REGION}} --query 'GroupMemberships[].MemberId.UserId' --output text 2>/dev/null)
          for USER_ID in $(aws identitystore list-group-memberships --identity-store-id "$IDENTITY_STORE_ID" \
            --group-id "$SCIM_ADMIN_GROUP" --region {{.IDC_REGION}} --query 'GroupMemberships[].MemberId.UserId' --output text 2>/dev/null); do
            echo "$EXISTING_MEMBERS" | grep -q "$USER_ID" && continue
            aws identitystore create-group-membership --identity-store-id "$IDENTITY_STORE_ID" \
              --group-id "{{.IDC_ADMIN_GROUP_ID}}" --member-id UserId="$USER_ID" --region {{.IDC_REGION}} 2>/dev/null || true
            echo "Added user $USER_ID to IDC admin group"
          done
          printf '{{.C_OK}}✓ Admin group members synced for ArgoCD access.{{.C_RESET}}\n'
        else
          printf '{{.C_ERR}}⚠ SCIM admin group not found.{{.C_RESET}}\n'
        fi

  # ---- Workshop: GitLab CE on EC2 (workshop-specific) ----
  gitlab:init-ec2:
    desc: Wait for GitLab CE (docker-compose on IDE EC2) to be ready, then initialise root token + user1 + repos
    status:
      # Skip if fleet-config git repo exists on disk AND git_token is a real GitLab PAT (starts with glpat-)
      - |
        docker exec gitlab-gitlab-1 test -d /var/opt/gitlab/git-data/repositories/@hashed 2>/dev/null && \
        docker exec gitlab-gitlab-1 find /var/opt/gitlab/git-data/repositories/@hashed -name "*.git" -maxdepth 3 | grep -q . && \
        aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -q '^glpat-'
    vars:
      GITLAB_CF_DOMAIN:
        sh: |
          if [ -f {{.REPO}}/private/gitlab-cloudfront-domain ]; then
            cat {{.REPO}}/private/gitlab-cloudfront-domain
          else
            echo "{{.DOMAIN}}"
          fi
      GIT_PASSWORD:
        sh: yq '.hub.gitlabRootPassword // ""' {{.CONFIG_FILE}} | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password // empty'
      GIT_USERNAME:
        sh: yq '.gitUsername // "user1"' {{.CONFIG_FILE}}
      REPOS:
        sh: echo "fleet-config java rust golang dotnet next-js"
    cmds:
      - printf '{{.C_STEP}}▸ Waiting for GitLab CE on EC2 to be ready...{{.C_RESET}}\n'
      - |
        set -e
        # GitLab CE starts in docker-compose at EC2 boot (bootstrap.sh). Wait up to 20min.
        GITLAB_URL="https://{{.GITLAB_CF_DOMAIN}}"
        for i in $(seq 1 120); do
          if curl -sf --max-time 10 "$GITLAB_URL/users/sign_in" >/dev/null 2>&1; then
            printf '  GitLab ready.\n'; break
          fi
          [ "$i" -eq 120 ] && { printf '  ⚠ GitLab not ready after 20min — continuing anyway.\n'; }
          sleep 10
        done
        # GitLab was started fresh by CDK bootstrap.sh — secrets are consistent on new events.
        # No need to wipe and restart.
        ROOT_TOKEN="root-{{.GIT_PASSWORD}}"
        # Bootstrap via gitlab-rails runner: create root PAT, user1, repos, unprotect branches.
        # Shell variables (ROOT_TOKEN, GIT_USERNAME, GIT_PASSWORD) are expanded by bash
        # before the string is passed to gitlab-rails runner as a Ruby script.
        printf '  Running GitLab Rails bootstrap (~60s)...\n'
        docker exec gitlab-gitlab-1 gitlab-rails runner "
          # Disable default branch protection + enable password auth for git
          s = ApplicationSetting.first
          s.password_authentication_enabled_for_git = true
          s.default_branch_protection = 0
          s.default_branch_protection_defaults = {allowed_to_push: [{access_level: 30}], allow_force_push: true, allowed_to_merge: [{access_level: 30}], developer_can_initial_push: true}
          s.save(validate: false)
          # Flush Rails cache so all workers (Sidekiq, web) pick up the new settings immediately
          Rails.cache.clear
          ApplicationSetting.expire
          pat = User.find(1).personal_access_tokens.find_or_initialize_by(name: 'initial-root-token')
          pat.scopes = ['api','write_repository','sudo']
          pat.expires_at = 365.days.from_now
          pat.save!
          u = User.find_by(username: '{{.GIT_USERNAME}}')
          if u.nil?
            Namespace.where(path: '{{.GIT_USERNAME}}', type: 'User').destroy_all
            svc = Users::CreateService.new(User.find(1), {
              name: 'Workshop User', username: '{{.GIT_USERNAME}}',
              email: '{{.GIT_USERNAME}}@workshop.local',
              password: '{{.GIT_PASSWORD}}', password_confirmation: '{{.GIT_PASSWORD}}',
              skip_confirmation: true,
              organization_id: (Organizations::Organization.find_by(id: 1)&.id || 1)
            }).execute
            u = svc.respond_to?(:payload) ? (svc.payload[:user] || User.find_by(username: '{{.GIT_USERNAME}}')) : User.find_by(username: '{{.GIT_USERNAME}}')
          end
          # Always ensure password is correctly hashed (CreateService may not hash correctly)
          if u && u.persisted?
            u.encrypted_password = Devise::Encryptor.digest(User, '{{.GIT_PASSWORD}}')
            u.update_columns(encrypted_password: u.encrypted_password, password_automatically_set: false)
          elsif u && !u.persisted?
            STDERR.puts 'ERROR: user1 not persisted: ' + u.errors.full_messages.inspect
            exit 1
          end
          if u.namespace_id.nil?
            org_id = Organizations::Organization.find_by(id: 1)&.id || 1
            ns = Namespace.new(owner: u, path: u.username, name: u.username, type: 'User', organization_id: org_id)
            ns.save(validate: false)
            u.update_columns(namespace_id: ns.id) if ns.persisted?
            u.reload
          end
          # Always recreate workshop-token PAT so we can capture the plaintext token value
          # (GitLab only exposes plaintext token at creation time — find_or_initialize reuses
          # an existing hashed token where .token returns nil)
          u.personal_access_tokens.where(name: 'workshop-token').delete_all
          u1pat = u.personal_access_tokens.create!(
            name: 'workshop-token',
            scopes: ['api','write_repository','read_repository'],
            expires_at: 365.days.from_now
          )
          puts 'user1_pat=' + u1pat.token.to_s
          %w[fleet-config java rust golang dotnet next-js].each do |repo|
            p = Project.find_by(path: repo, namespace_id: u.namespace_id)
            if p.nil?
              p = Projects::CreateService.new(u, name: repo, path: repo, visibility_level: 0, initialize_with_readme: false).execute
              sleep 1
            end
            ProtectedBranch.where(project: p).destroy_all if p.persisted?
            puts 'repo: ' + repo + ' ok=' + p.persisted?.to_s
          end
          puts 'init done'
        " 2>&1 | tail -20 || true
        # Capture user1's PAT token and update peeks-hub/secrets so Backstage/ESO use the real PAT
        USER1_PAT=$(docker exec gitlab-gitlab-1 gitlab-rails runner \
          "puts User.find_by(username:'{{.GIT_USERNAME}}').personal_access_tokens.where(name:'workshop-token').delete_all; pat=User.find_by(username:'{{.GIT_USERNAME}}').personal_access_tokens.create!(name:'workshop-token',scopes:['api','write_repository','read_repository'],expires_at:365.days.from_now); puts pat.token" \
          2>/dev/null | tail -1)
        if [ -n "$USER1_PAT" ] && [ ${#USER1_PAT} -gt 10 ]; then
          CURRENT=$(aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets \
            --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null)
          if [ -n "$CURRENT" ]; then
            NEW=$(echo "$CURRENT" | jq -c --arg pat "$USER1_PAT" '.git_token = $pat')
            aws secretsmanager put-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets \
              --region {{.AWS_REGION}} --secret-string "$NEW" >/dev/null 2>&1 && \
              printf '  Updated peeks-hub/secrets.git_token with real GitLab PAT\n'
          fi
        fi
        WORKSHOP_DIR="$HOME/environment/{{.WORKING_REPO}}"
        ROOT_TOKEN=$(docker exec gitlab-gitlab-1 gitlab-rails runner "puts User.find(1).personal_access_tokens.find_or_initialize_by(name: 'root-api').tap{|p| p.scopes=['api','sudo']; p.expires_at=365.days.from_now; p.save!}.token" 2>/dev/null | tail -1)
        for REPO in {{.REPOS}}; do
          REMOTE_URL="https://{{.GIT_USERNAME}}:{{.GIT_PASSWORD}}@{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/$REPO.git"
          # Unprotect via API (synchronous, handles Sidekiq async protection)
          if [ -n "$ROOT_TOKEN" ]; then
            curl -sf -X DELETE -H "PRIVATE-TOKEN: $ROOT_TOKEN" \
              "https://{{.GITLAB_CF_DOMAIN}}/api/v4/projects/{{.GIT_USERNAME}}%2F$REPO/protected_branches/main" 2>/dev/null || true
          fi
          if [ "$REPO" = "fleet-config" ]; then
            SRC="$WORKSHOP_DIR/gitops/fleet"
          else
            SRC="$WORKSHOP_DIR/applications/$REPO"
          fi
          [ -d "$SRC" ] || continue
          TMP=$(mktemp -d)
          if [ "$REPO" = "fleet-config" ]; then
            # fleet-config overlay structure must match overlay_repo_basepath + fleetRepoBasepath.
            # set-overlay-repo sets overlay_repo_basepath="" and the hub cluster secret has
            # fleetRepoBasepath="gitops/" → ArgoCD reads gitops/fleet/spoke-values/... from fleet-config.
            # spokes:enable-kro/crossplane also write to gitops/fleet/... inside the cloned repo.
            # Seed content at gitops/fleet/ so both paths align.
            mkdir -p "$TMP/gitops/fleet"
            cp -r "$SRC/." "$TMP/gitops/fleet/"
          else
            cp -r "$SRC/." "$TMP/"
          fi
          # For fleet-config also seed platform/backstage/templates (Backstage scaffolder catalog)
          if [ "$REPO" = "fleet-config" ] && [ -d "$WORKSHOP_DIR/platform/backstage/templates" ]; then
            mkdir -p "$TMP/platform/backstage/templates"
            cp -r "$WORKSHOP_DIR/platform/backstage/templates/." "$TMP/platform/backstage/templates/"
          fi
          cd "$TMP"
          git init -q && git add -A && git commit -qm "init" 2>/dev/null || true
          git remote add origin "$REMOTE_URL"
          REMOTE_EMPTY=$(git ls-remote "$REMOTE_URL" HEAD 2>/dev/null | wc -l | tr -d ' ')
          if [ "$REMOTE_EMPTY" = "0" ]; then
            git push -f origin HEAD:main
          else
            echo "  skipped (already populated): $REPO"
          fi
          cd - >/dev/null; rm -rf "$TMP"
          echo "  seeded: $REPO"
        done
        printf '{{.C_OK}}✓ GitLab init done.{{.C_RESET}}\n'
        # Unprotect branches again after seeding (seed push creates main which triggers auto-protection)
        docker exec gitlab-gitlab-1 gitlab-rails runner "
          u = User.find_by(username: ENV['GIT_USERNAME'] || 'user1')
          Project.where(namespace_id: u.namespace_id).each{|p| ProtectedBranch.where(project: p).destroy_all}
        " 2>/dev/null || true
      # After init, clone repos locally
      - task: gitlab:clone-repos


  gitlab:clone-repos:
    desc: Clone all GitLab repos locally into ~/environment
    vars:
      GITLAB_CF_DOMAIN:
        sh: |
          if [ -f {{.REPO}}/private/gitlab-cloudfront-domain ]; then
            cat {{.REPO}}/private/gitlab-cloudfront-domain
          else
            echo "{{.DOMAIN}}"
          fi
      GIT_USERNAME:
        sh: yq '.gitUsername // "user1"' {{.CONFIG_FILE}}
      GIT_PASSWORD:
        sh: yq '.hub.gitlabRootPassword // ""' {{.CONFIG_FILE}} | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password // empty'
      REPOS:
        sh: echo "fleet-config java rust golang dotnet next-js"
    cmds:
      - printf '{{.C_STEP}}▸ Cloning GitLab repos to ~/environment...{{.C_RESET}}\n'
      - |
        BASE_URL="https://{{.GIT_USERNAME}}:{{.GIT_PASSWORD}}@{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}"
        FAILED=""
        # Wait for GitLab (running via docker-compose on the IDE EC2) to be ready
        # and for the init script to have created all repos.
        # bootstrap.sh starts GitLab at boot; task install calls gitlab:init-ec2 first,
        # so by the time clone-repos runs the repos should exist. Poll as a safety net.
        printf '  Waiting for GitLab to be ready (up to 20min)...\n'
        GITLAB_BASE="https://{{.GITLAB_CF_DOMAIN}}"
        for i in $(seq 1 120); do
          if curl -sf --max-time 5 "$GITLAB_BASE/users/sign_in" >/dev/null 2>&1; then break; fi
          sleep 10
        done
        for REPO in {{.REPOS}}; do
          if [ "$REPO" = "fleet-config" ]; then
            DEST="$HOME/environment/$REPO"
          else
            DEST="$HOME/environment/applications/$REPO"
          fi
          REPO_URL="$BASE_URL/$REPO.git"
          if [ -d "$DEST/.git" ]; then
            # Already cloned. The gitlab-init Job creates each repo with only a
            # README first, then pushes the real source/overlay content later in
            # the same Job. An earlier clone-repos run (or this one racing ahead)
            # may therefore have captured the README-only state. Pull to pick up
            # any content pushed after the initial clone — fast-forward only so we
            # never clobber participant commits.
            echo "  $REPO already cloned — pulling latest"
            git -C "$DEST" pull --ff-only -q 2>/dev/null || echo "    ($REPO: pull skipped — local changes or no upstream)"
            continue
          fi
          # GitLab repos are created asynchronously by the gitlab-init Job (Helm
          # post-install hook, which waits for GitLab readiness). Without waiting,
          # this task ran before the repos existed and every clone failed, leaving
          # ~/environment/applications empty and no local fleet-config checkout.
          # Wait (up to ~5min) for each repo to be reachable AND seeded before
          # cloning. Reachable alone is not enough: the repo exists with only a
          # README the instant it is created, but the application source is pushed
          # a few seconds later. Cloning on first-reachable captured the stub
          # (README/.git only), leaving e.g. ~/environment/applications/next-js
          # without deployable code. Wait until the remote has a non-README file
          # (fleet-config is exempt — it is content-seeded differently).
          REACHABLE=false
          for i in $(seq 1 18); do
            if git ls-remote "$REPO_URL" >/dev/null 2>&1; then
              REACHABLE=true; break
            fi
            sleep 10
          done
          if [ "$REACHABLE" != true ]; then
            echo "  ⚠ $REPO not reachable/seeded after 5min — skipping (create later)."
            FAILED="$FAILED $REPO"
            continue
          fi
          mkdir -p "$(dirname "$DEST")"
          if git clone "$REPO_URL" "$DEST" 2>/dev/null; then
            echo "  ✓ $REPO cloned"
          else
            echo "  ⚠ $REPO clone failed"
            FAILED="$FAILED$REPO "
          fi
        done
        if [ -n "$FAILED" ]; then
          printf '{{.C_ERR}}⚠ Some GitLab repos were not cloned:%s{{.C_RESET}}\n' "$FAILED"
          printf '{{.C_INFO}}  Re-run later: task workshop:gitlab:clone-repos{{.C_RESET}}\n'
        else
          printf '{{.C_OK}}✓ GitLab repos cloned.{{.C_RESET}}\n'
        fi



  # ============================================================
  # SPOKES + FLEET OVERLAY (consumer-owned; writes to the GitLab
  # fleet-config repo). Moved out of the generic providers (b):
  # the platform provides the PlatformCluster abstraction; the
  # workshop declares/materializes spokes into its own gitops repo.
  # ============================================================
  set-overlay-repo:
    desc: >-
      Wire overlay_repo_url -> GitLab fleet-config on the hub cluster config so
      every overlay-aware Argo app (incl. multi-acct) reads $overlay from
      fleet-config instead of falling back to the GitHub addons repo. Runs LATE
      (after GitLab + fleet-config exist) because $overlay is a real Argo source:
      pointing it at a non-existent/unauthenticated repo breaks ALL overlay-aware
      apps. Self-protecting: verifies reachability, registers an ArgoCD repo
      credential, flips <hub>/config (ESO reconciles the cluster secret), then
      verifies the flip resolved and auto-reverts if it did not. Idempotent.
    vars:
      GITLAB_CF_DOMAIN:
        sh: |
          if [ -f {{.REPO}}/private/gitlab-cloudfront-domain ]; then
            cat {{.REPO}}/private/gitlab-cloudfront-domain
          else
            echo "{{.DOMAIN}}"
          fi
      GIT_USERNAME:
        sh: yq '.gitUsername // "user1"' {{.CONFIG_FILE}}
      GIT_PASSWORD:
        sh: yq '.hub.gitlabRootPassword // ""' {{.CONFIG_FILE}} | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password'
      # Root of the fleet-config overlay structure (configs/, overlays/) per the
      # GitLab init-job seed. Keep "" unless the overlay repo nests under a prefix.
      OVERLAY_REPO_BASEPATH: ""
    cmds:
      - |
        OVERLAY_URL="https://{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/fleet-config.git"
        SECRET_KEY="{{.HUB_CLUSTER_NAME}}/config"
        KC="{{.REPO}}/private/hub-kubeconfig"

        # 1. Reachability guard. $overlay is a REAL Argo source — never point it at
        #    an unreachable repo. This is one shell block, so exit 0 here correctly
        #    skips ALL wiring below (the earlier multi-block version did not).
        #    fleet-config is created asynchronously by the gitlab-init Job, so it
        #    can be a minute or two behind this step. Previously we skipped on the
        #    first miss — but then the overlay was never wired to fleet-config and
        #    the spoke entries that enable-crossplane/enable-kro push later were
        #    IGNORED by the appset (hub kept reading the GitHub addons fallback),
        #    so NO spoke EKS clusters were ever provisioned. Wait (up to ~5min)
        #    for it to become reachable before deciding.
        FLEET_LS="https://{{.GIT_USERNAME}}:{{.GIT_PASSWORD}}@{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/fleet-config.git"
        printf '{{.C_STEP}}▸ Verifying fleet-config overlay repo is reachable...{{.C_RESET}}\n'
        FLEET_OK=false
        for i in $(seq 1 30); do
          if git ls-remote "$FLEET_LS" >/dev/null 2>&1; then FLEET_OK=true; break; fi
          sleep 10
        done
        if [ "$FLEET_OK" != true ]; then
          printf '{{.C_ERR}}⚠ fleet-config not reachable after 5min — skipping overlay wiring (no change made).{{.C_RESET}}\n'
          printf '{{.C_INFO}}  Re-run later: task kind-crossplane:hub:set-overlay-repo{{.C_RESET}}\n'
          exit 0
        fi
        printf '{{.C_OK}}✓ fleet-config reachable.{{.C_RESET}}\n'

        # 2. Hub kubeconfig (inline so the guard governs everything)
        rm -f "$KC"
        aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --alias {{.HUB_CLUSTER_NAME}} --kubeconfig "$KC" >/dev/null

        # 3. ArgoCD repo credential for the private GitLab fleet-config repo
        printf '{{.C_STEP}}▸ Registering ArgoCD repository credential for fleet-config...{{.C_RESET}}\n'
        cat <<EOF | KUBECONFIG="$KC" kubectl apply -f -
        apiVersion: v1
        kind: Secret
        metadata:
          name: fleet-config-repo
          namespace: argocd
          labels:
            argocd.argoproj.io/secret-type: repository
        stringData:
          type: git
          url: https://{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/fleet-config.git
          username: "{{.GIT_USERNAME}}"
          password: "{{.GIT_PASSWORD}}"
        EOF

        # 3a. ArgoCD repo-creds credential TEMPLATE for all repos under the user's GitLab
        #     namespace. Backstage scaffolder creates per-app GitLab repos
        #     (https://<gitlab>/{{.GIT_USERNAME}}/<app>.git) that ArgoCD must pull; without a
        #     matching credential template those CD Applications fail with ComparisonError.
        #     A repo-creds secret applies to every repository whose URL starts with `url`.
        printf '{{.C_STEP}}▸ Registering ArgoCD repo-creds for {{.GIT_USERNAME}} GitLab namespace...{{.C_RESET}}\n'
        cat <<EOF | KUBECONFIG="$KC" kubectl apply -f -
        apiVersion: v1
        kind: Secret
        metadata:
          name: gitlab-user-repo-creds
          namespace: argocd
          labels:
            argocd.argoproj.io/secret-type: repo-creds
        stringData:
          type: git
          url: https://{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}
          username: "{{.GIT_USERNAME}}"
          password: "{{.GIT_PASSWORD}}"
        EOF

        # 3b. Snapshot the CURRENT overlay wiring BEFORE touching anything. This lets us
        #     (a) skip entirely when it is already correct, and (b) on failure restore the
        #     PREVIOUS good value instead of dropping to the GitHub base (clusters:{}),
        #     which is what cascade-deleted live spoke clusters on re-install.
        EXISTING=$(aws secretsmanager get-secret-value --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} --query SecretString --output text)
        PREV_URL=$(echo "$EXISTING" | jq -r '(.metadata | fromjson).overlay_repo_url // ""')
        PREV_REV=$(echo "$EXISTING" | jq -r '(.metadata | fromjson).overlay_repo_revision // ""')
        PREV_BP=$(echo "$EXISTING"  | jq -r '(.metadata | fromjson).overlay_repo_basepath // ""')

        # Idempotent fast-path: overlay already wired to the target repo -> leave it
        # untouched. Never re-flip/verify/revert an already-working overlay, since a
        # transient verify hiccup must never unset a good overlay.
        if [ "$PREV_URL" = "$OVERLAY_URL" ]; then
          printf '{{.C_OK}}✓ Overlay already wired to fleet-config (%s) — leaving untouched (idempotent).{{.C_RESET}}\n' "$OVERLAY_URL"
          rm -f "$KC"
          exit 0
        fi

        # 4. Flip overlay_* in <hub>/config (ESO reconciles the cluster secret annotations)
        printf '{{.C_STEP}}▸ Wiring overlay_repo_url into %s...{{.C_RESET}}\n' "$SECRET_KEY"
        EXISTING=$(aws secretsmanager get-secret-value --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} --query SecretString --output text)
        UPDATED=$(echo "$EXISTING" | jq --arg url "$OVERLAY_URL" --arg rev "main" --arg bp "{{.OVERLAY_REPO_BASEPATH}}" \
          '.metadata = (.metadata | fromjson | . + {overlay_repo_url: $url, overlay_repo_revision: $rev, overlay_repo_basepath: $bp} | tojson)')
        aws secretsmanager put-secret-value --secret-id "$SECRET_KEY" --secret-string "$UPDATED" --region {{.AWS_REGION}} >/dev/null
        echo "Set overlay_repo_url=$OVERLAY_URL (basepath='{{.OVERLAY_REPO_BASEPATH}}')"

        # 5. Force ESO re-sync; wait until the new overlay actually PROPAGATES to the
        #    cluster-addons app source (avoids the false-positive the old verify had).
        ES=$(KUBECONFIG="$KC" kubectl -n argocd get externalsecret -o name 2>/dev/null | grep -i fleet-secret | head -1 || true)
        [ -n "$ES" ] && KUBECONFIG="$KC" kubectl -n argocd annotate "$ES" force-sync="$(date +%s)" --overwrite >/dev/null 2>&1 || true
        printf '{{.C_STEP}}▸ Waiting for cluster-addons to pick up the new overlay source...{{.C_RESET}}\n'
        PROPAGATED=false
        for i in $(seq 1 30); do
          SRC=$(KUBECONFIG="$KC" kubectl -n argocd get application cluster-addons -o jsonpath='{.spec.sources[?(@.ref=="overlay")].repoURL}' 2>/dev/null || echo "")
          [ "$SRC" = "$OVERLAY_URL" ] && { PROPAGATED=true; break; }
          sleep 10
        done

        # 6. Verify it resolves cleanly; auto-revert on any ComparisonError/InvalidSpec.
        OK=false
        if [ "$PROPAGATED" = true ]; then
          printf '{{.C_STEP}}▸ Overlay propagated; verifying clean resolution...{{.C_RESET}}\n'
          for i in $(seq 1 24); do
            SYNC=$(KUBECONFIG="$KC" kubectl -n argocd get application cluster-addons -o jsonpath='{.status.sync.status}' 2>/dev/null || echo "")
            ERR=$(KUBECONFIG="$KC" kubectl -n argocd get application cluster-addons -o jsonpath='{range .status.conditions[*]}{.type}{"\n"}{end}' 2>/dev/null | grep -iE "error|invalid" || true)
            if [ -z "$ERR" ] && { [ "$SYNC" = "Synced" ] || [ "$SYNC" = "OutOfSync" ]; }; then OK=true; break; fi
            printf '{{.C_INFO}}  waiting for clean resolution (sync=%s) (%d/24)...{{.C_RESET}}\n' "$SYNC" "$i"
            sleep 10
          done
        else
          printf '{{.C_ERR}}⚠ Overlay did not propagate to cluster-addons in time.{{.C_RESET}}\n'
        fi

        if [ "$OK" != true ]; then
          EXISTING=$(aws secretsmanager get-secret-value --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} --query SecretString --output text)
          if [ -n "$PREV_URL" ]; then
            # A previous overlay was already wired — RESTORE it rather than dropping to
            # the GitHub base. Falling back to base renders clusters:{} and would
            # cascade-delete live spoke clusters; restoring keeps them intact.
            printf '{{.C_ERR}}⚠ New overlay not resolving cleanly — restoring previous overlay (%s).{{.C_RESET}}\n' "$PREV_URL"
            REVERTED=$(echo "$EXISTING" | jq --arg url "$PREV_URL" --arg rev "$PREV_REV" --arg bp "$PREV_BP" \
              '.metadata = (.metadata | fromjson | . + {overlay_repo_url: $url, overlay_repo_revision: $rev, overlay_repo_basepath: $bp} | tojson)')
          else
            # No overlay was set before this run — clean rollback to the GitHub base.
            printf '{{.C_ERR}}⚠ Overlay not resolving cleanly and none was set before — rolling back to GitHub base.{{.C_RESET}}\n'
            REVERTED=$(echo "$EXISTING" | jq '.metadata = (.metadata | fromjson | del(.overlay_repo_url, .overlay_repo_revision, .overlay_repo_basepath) | tojson)')
          fi
          aws secretsmanager put-secret-value --secret-id "$SECRET_KEY" --secret-string "$REVERTED" --region {{.AWS_REGION}} >/dev/null
          [ -n "$ES" ] && KUBECONFIG="$KC" kubectl -n argocd annotate "$ES" force-sync="$(date +%s)" --overwrite >/dev/null 2>&1 || true
          # Only strip the cluster-secret annotations on a true rollback-to-base (no prev);
          # for a restore, let ESO reconcile the previous values back from SecretsManager.
          if [ -z "$PREV_URL" ]; then
            KUBECONFIG="$KC" kubectl -n argocd annotate secret {{.HUB_CLUSTER_NAME}} overlay_repo_url- overlay_repo_revision- overlay_repo_basepath- >/dev/null 2>&1 || true
          fi
          printf '{{.C_ERR}}  Fix GitLab reachability/credential, then re-run.{{.C_RESET}}\n'
          rm -f "$KC"
          exit 0
        fi
        printf '{{.C_OK}}✓ Overlay wired to fleet-config and resolving fleet-wide (hub + spokes).{{.C_RESET}}\n'
        rm -f "$KC"

  spokes:enable-crossplane:
    desc: "Enable a spoke cluster via Crossplane (usage: task spokes:enable-crossplane -- <cluster-name>)"
    vars:
      CLUSTER: '{{.CLI_ARGS}}'
      GITLAB_CF_DOMAIN:
        sh: |
          if [ -f {{.REPO}}/private/gitlab-cloudfront-domain ]; then
            cat {{.REPO}}/private/gitlab-cloudfront-domain
          else
            echo "{{.DOMAIN}}"
          fi
      GIT_PASSWORD:
        sh: yq '.hub.gitlabRootPassword // ""' {{.CONFIG_FILE}} | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password'
    cmds:
      - |
        if [ -z "{{.CLUSTER}}" ]; then echo "Usage: task spokes:enable-crossplane -- <cluster-name>"; exit 1; fi
        FLEET_URL="https://{{.GIT_USERNAME}}:{{.GIT_PASSWORD}}@{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/fleet-config.git"
        # fleet-config is created asynchronously by the gitlab-init Job (Helm
        # post-install hook, which waits for GitLab readiness), so this task can
        # race ahead of it. Cloning an absent repo left $REPO_DIR without a .git
        # dir and the later `git add -A` failed with exit 128, taking down
        # `task install` (install:phase2-spoke-dev). Wait (up to ~5min) for the
        # repo to be reachable, then verify the clone produced a git repo.
        printf '{{.C_STEP}}▸ Waiting for fleet-config repo to be reachable...{{.C_RESET}}\n'
        for i in $(seq 1 30); do
          ERR=$(git ls-remote "$FLEET_URL" 2>&1) && break
          if [ "$i" -eq 30 ]; then
            printf '{{.C_ERR}}⚠ fleet-config not reachable after 5min — cannot enable spoke {{.CLUSTER}} via Crossplane.{{.C_RESET}}\n'
            printf '{{.C_INFO}}  GitLab/gitlab-init may still be initializing. Re-run later: task kind-crossplane:spokes:enable-crossplane -- {{.CLUSTER}}{{.C_RESET}}\n'
            exit 1
          fi
          sleep 10
        done
        printf '{{.C_OK}}✓ fleet-config reachable.{{.C_RESET}}\n'
        REPO_DIR=$(mktemp -d)
        git clone "$FLEET_URL" "$REPO_DIR"
        if [ ! -d "$REPO_DIR/.git" ]; then
          printf '{{.C_ERR}}⚠ fleet-config clone failed — aborting enable-crossplane for {{.CLUSTER}}.{{.C_RESET}}\n'
          rm -rf "$REPO_DIR"
          exit 1
        fi
        # Remove any stale kro-clusters entry for this cluster (symmetric cleanup).
        KRO_STALE="$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/kro-clusters/values.yaml"
        if [ -f "$KRO_STALE" ] && yq -e '.clusters.\"{{.CLUSTER}}\"' "$KRO_STALE" >/dev/null 2>&1; then
          yq -i 'del(.clusters.\"{{.CLUSTER}}\")' "$KRO_STALE"
          printf '{{.C_INFO}}  Removed stale kro entry for {{.CLUSTER}} (switching to Crossplane).{{.C_RESET}}\n'
        fi
        mkdir -p "$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/crossplane-clusters"
        XP_VALUES="$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/crossplane-clusters/values.yaml"
        # Idempotency: keep the existing vpcCidr if this spoke is already enabled so
        # re-running install does not generate a new random CIDR and churn the VPC.
        if [ -f "$XP_VALUES" ] && yq -e '.clusters."{{.CLUSTER}}".vpcCidr' "$XP_VALUES" >/dev/null 2>&1; then
          echo "  Spoke {{.CLUSTER}} already has a vpcCidr — keeping existing values (idempotent)."
        else
          # adminRoleArn grants the console/participant admin role cluster-admin on
          # the spoke. adminInstanceRoleArn grants the IDE/instance *SharedRole* a
          # SECOND cluster-admin access entry — required so `kubectl` run from the
          # IDE (which assumes the instance role, NOT adminRoleName) works against
          # the spoke. create-config.sh deliberately excludes the SharedRole from
          # adminRoleName, so we detect it here. Both are idempotent / optional.
          ADMIN_ROLE=$(yq '.adminRoleName // ""' {{.CONFIG_FILE}})
          ADMIN_ARN_LINE=""
          if [ -n "$ADMIN_ROLE" ]; then
            ADMIN_ARN_LINE="    adminRoleArn: arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/$ADMIN_ROLE"
          fi
          INSTANCE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName,'SharedRole')].RoleName | [0]" --output text 2>/dev/null || echo "")
          ADMIN_INSTANCE_ARN_LINE=""
          if [ -n "$INSTANCE_ROLE" ] && [ "$INSTANCE_ROLE" != "None" ] && [ "$INSTANCE_ROLE" != "null" ]; then
            ADMIN_INSTANCE_ARN_LINE="    adminInstanceRoleArn: arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/$INSTANCE_ROLE"
          fi
          cat > "$XP_VALUES" <<EOF
        clusters:
          {{.CLUSTER}}:
            clusterName: {{.CLUSTER}}
            vpcCidr: "10.$(printf '%s' '{{.CLUSTER}}' | cksum | awk '{print ($1 % 253) + 2}').0.0/16"
            kubernetesVersion: "{{.K8S_VERSION}}"
            autoMode: true
            resourcePrefix: {{.RESOURCE_PREFIX}}
            accountId: "{{.AWS_ACCOUNT_ID}}"
            capabilities:
              kro:
                enabled: true
              ack:
                enabled: true
        $ADMIN_ARN_LINE
        $ADMIN_INSTANCE_ARN_LINE
        EOF
        fi
        # Fleet member file: only Crossplane/Terraform spokes need a fleet-secret
        # ArgoCD registration. KRO spokes do NOT (their cluster Secret is created by
        # the EksclusterWithVpc RGD). The fleet-secrets appset discovers members from
        # the overlay (fleet-config), so write it here. environment is derived from
        # the cluster name (dev/prod/staging/test), defaulting to dev.
        ENV=$(echo "{{.CLUSTER}}" | grep -oE 'prod|staging|test|dev' | head -1); ENV="${ENV:-dev}"
        mkdir -p "$REPO_DIR/gitops/fleet/members/{{.CLUSTER}}"
        cat > "$REPO_DIR/gitops/fleet/members/{{.CLUSTER}}/values.yaml" <<EOF
        clusterName: {{.CLUSTER}}
        labels:
          environment: ${ENV}
          tenant: workshop
        EOF
        cd "$REPO_DIR"
        git add -A
        if git diff --cached --quiet; then
          printf '{{.C_INFO}}  No fleet-config changes for {{.CLUSTER}} — already enabled (idempotent).{{.C_RESET}}\n'
        else
          git commit -m "feat: enable spoke {{.CLUSTER}} via Crossplane (+ fleet member)"
          PUSHED=false
          for i in 1 2 3; do
            # NOTE: the fleet/gitops repo must allow pushes to its default branch.
            # Branch-protection is the consumer's concern (e.g. the workshop configures
            # GitLab when it provisions it). The generic platform never manipulates the git host.
            if git push 2>&1; then PUSHED=true; break; fi
            echo "  Push attempt $i failed, rebasing..."
            git pull --rebase 2>&1 && sleep 2
          done
          if [ "$PUSHED" != "true" ]; then
            printf '{{.C_ERR}}\u26a0 fleet-config push failed after 3 attempts.{{.C_RESET}}\n'
            exit 1
          fi
        fi
        rm -rf "$REPO_DIR"
        # Refresh the local fleet-config checkout so the committed overlay change is
        # visible in ~/environment/fleet-config (the task pushes from a temp clone).
        # Best-effort and non-fatal: skipped if absent, warns if not fast-forwardable.
        LOCAL_FLEET="$HOME/environment/fleet-config"
        if [ -d "$LOCAL_FLEET/.git" ]; then
          (git -C "$LOCAL_FLEET" fetch origin -q && git -C "$LOCAL_FLEET" pull --ff-only -q) \
            && printf '{{.C_INFO}}  Refreshed local fleet-config checkout.{{.C_RESET}}\n' \
            || printf '{{.C_INFO}}  Local fleet-config not auto-updated — run: git -C %s pull{{.C_RESET}}\n' "$LOCAL_FLEET"
        fi
        printf '{{.C_OK}}✓ Spoke {{.CLUSTER}} enabled via Crossplane in fleet-config overlay.{{.C_RESET}}\n'

  spokes:enable-kro:
    desc: "Enable a spoke cluster via KRO (usage: task spokes:enable-kro -- <cluster-name>)"
    vars:
      CLUSTER: '{{.CLI_ARGS}}'
      GITLAB_CF_DOMAIN:
        sh: |
          if [ -f {{.REPO}}/private/gitlab-cloudfront-domain ]; then
            cat {{.REPO}}/private/gitlab-cloudfront-domain
          else
            echo "{{.DOMAIN}}"
          fi
      GIT_PASSWORD:
        sh: yq '.hub.gitlabRootPassword // ""' {{.CONFIG_FILE}} | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password'
    cmds:
      - |
        if [ -z "{{.CLUSTER}}" ]; then echo "Usage: task spokes:enable-kro -- <cluster-name>"; exit 1; fi
        FLEET_URL="https://{{.GIT_USERNAME}}:{{.GIT_PASSWORD}}@{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/fleet-config.git"
        # fleet-config is created asynchronously by the gitlab-init Job (Helm
        # post-install hook), which itself waits for GitLab to become ready. When
        # enable-kro runs in phase2 it can race ahead of that job. Cloning an
        # absent/empty repo previously left $REPO_DIR without a .git dir, so the
        # later `git add -A` failed with exit 128 and took down the whole
        # `task install`. Wait (up to ~5min) for the repo to be reachable, then
        # verify the clone actually produced a git repo before proceeding.
        printf '{{.C_STEP}}▸ Waiting for fleet-config repo to be reachable...{{.C_RESET}}\n'
        for i in $(seq 1 30); do
          ERR=$(git ls-remote "$FLEET_URL" 2>&1) && break
          if [ "$i" -eq 30 ]; then
            printf '{{.C_ERR}}⚠ fleet-config not reachable after 5min — cannot enable spoke {{.CLUSTER}} via KRO.{{.C_RESET}}\n'
            printf '{{.C_INFO}}  GitLab/gitlab-init may still be initializing. Re-run later: task kind-crossplane:spokes:enable-kro -- {{.CLUSTER}}{{.C_RESET}}\n'
            exit 1
          fi
          sleep 10
        done
        printf '{{.C_OK}}✓ fleet-config reachable.{{.C_RESET}}\n'
        REPO_DIR=$(mktemp -d)
        git clone "$FLEET_URL" "$REPO_DIR"
        if [ ! -d "$REPO_DIR/.git" ]; then
          printf '{{.C_ERR}}⚠ fleet-config clone failed — aborting enable-kro for {{.CLUSTER}}.{{.C_RESET}}\n'
          rm -rf "$REPO_DIR"
          exit 1
        fi
        # Remove any stale crossplane-clusters entry for this cluster.
        # When switching from crossplane → kro-ack provider, a previous run may have
        # left a crossplane entry that would cause ArgoCD to create a duplicate
        # Crossplane XR alongside the KRO EksclusterWithVpc.
        XP_STALE="$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/crossplane-clusters/values.yaml"
        if [ -f "$XP_STALE" ] && yq -e '.clusters.\"{{.CLUSTER}}\"' "$XP_STALE" >/dev/null 2>&1; then
          yq -i 'del(.clusters.\"{{.CLUSTER}}\")' "$XP_STALE"
          printf '{{.C_INFO}}  Removed stale crossplane entry for {{.CLUSTER}} (switching to KRO).{{.C_RESET}}\n'
        fi
        mkdir -p "$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/kro-clusters/clusters"
        cat > "$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/kro-clusters/clusters/{{.CLUSTER}}.json" <<EOF
        {"clusterName": "{{.CLUSTER}}"}
        EOF
        # Deterministic second octet derived from cluster name (stable across re-runs).
        # Uses cksum to hash the name into a value 2-254.
        KRO_VALUES="$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/kro-clusters/values.yaml"
        if [ -f "$KRO_VALUES" ] && yq -e '.clusters."{{.CLUSTER}}".cidr.vpcCidr' "$KRO_VALUES" >/dev/null 2>&1; then
          echo "  Spoke {{.CLUSTER}} already has a CIDR — keeping existing values (idempotent)."
        else
          OCTET=$(printf '%s' '{{.CLUSTER}}' | cksum | awk '{print ($1 % 253) + 2}')
          # Ensure the file exists with a clusters: map (may already have other spokes)
          [ -f "$KRO_VALUES" ] || printf 'clusters: {}\n' > "$KRO_VALUES"
          # Merge this cluster into the existing map (preserves other spokes already written)
          OCTET=$OCTET CLUSTER={{.CLUSTER}} AWS_REGION={{.AWS_REGION}} K8S_VERSION={{.K8S_VERSION}} \
          AWS_ACCOUNT_ID={{.AWS_ACCOUNT_ID}} RESOURCE_PREFIX={{.RESOURCE_PREFIX}} \
          yq -i '.clusters.[env(CLUSTER)] = {
            "clusterName": env(CLUSTER),
            "tenant": "workshop",
            "environment": "prod",
            "region": env(AWS_REGION),
            "k8sVersion": env(K8S_VERSION),
            "accountId": env(AWS_ACCOUNT_ID),
            "managementAccountId": env(AWS_ACCOUNT_ID),
            "resourcePrefix": env(RESOURCE_PREFIX),
            "cidr": {
              "vpcCidr": ("10." + env(OCTET) + ".0.0/16"),
              "publicSubnet1Cidr": ("10." + env(OCTET) + ".1.0/24"),
              "publicSubnet2Cidr": ("10." + env(OCTET) + ".2.0/24"),
              "privateSubnet1Cidr": ("10." + env(OCTET) + ".11.0/24"),
              "privateSubnet2Cidr": ("10." + env(OCTET) + ".12.0/24")
            }
          }' "$KRO_VALUES"
        fi
        # admin roles: grant cluster-admin to BOTH the console/participant role
        # (config.local.yaml .adminRoleName) and the IDE/instance role (the
        # peeks-ide *SharedRole*, which create-config.sh deliberately excludes
        # from adminRoleName). The EksCluster RGD turns each into its own
        # cluster-admin AccessEntry. Set on every run (idempotent) so existing
        # spokes also pick up the instance role.
        CONSOLE_ROLE=$(yq '.adminRoleName // ""' {{.CONFIG_FILE}})
        INSTANCE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName,'SharedRole')].RoleName | [0]" --output text 2>/dev/null || echo "")
        yq -i 'del(.clusters."{{.CLUSTER}}".adminRoles)' "$KRO_VALUES" 2>/dev/null || true
        if [ -n "$CONSOLE_ROLE" ] && [ "$CONSOLE_ROLE" != "null" ]; then
          CONSOLE_ROLE="$CONSOLE_ROLE" yq -i '.clusters."{{.CLUSTER}}".adminRoleName = env(CONSOLE_ROLE)' "$KRO_VALUES"
        fi
        if [ -n "$INSTANCE_ROLE" ] && [ "$INSTANCE_ROLE" != "None" ] && [ "$INSTANCE_ROLE" != "null" ]; then
          INSTANCE_ROLE="$INSTANCE_ROLE" yq -i '.clusters."{{.CLUSTER}}".adminInstanceRoleName = env(INSTANCE_ROLE)' "$KRO_VALUES"
        fi
        # multi-acct (ACK CARM): map this spoke's namespace -> AWS account so the
        # hub's ACK controllers render an IAMRoleSelector per service and assume
        # the {{.RESOURCE_PREFIX}}-cluster-mgmt-<svc> roles when provisioning the
        # spoke. The KRO EksclusterWithVpc lands in namespace == clusterName, which
        # is the key the multi-acct chart selects on. Only KRO spokes need this —
        # ACK does the provisioning; Crossplane spokes do not use CARM.
        # Path = the appset-chart external per-addon overlay tier:
        #   $overlay/<overlay_repo_basepath>configs/multi-acct/values.yaml
        # The fleet-config repo (seeded by the GitLab init-job) keeps configs/ and
        # overlays/ at the REPO ROOT (overlay_repo_basepath=""), so this lives at
        # configs/multi-acct/values.yaml — NOT under gitops/. (Spoke cluster values
        # use gitops/fleet/... because that appset falls back to fleetRepoBasepath.)
        # yq merge keeps it idempotent and accumulates entries across spokes.
        mkdir -p "$REPO_DIR/configs/multi-acct"
        MA_FILE="$REPO_DIR/configs/multi-acct/values.yaml"
        [ -f "$MA_FILE" ] || printf 'clusters: {}\n' > "$MA_FILE"
        yq -i '.clusters."{{.CLUSTER}}" = "{{.AWS_ACCOUNT_ID}}"' "$MA_FILE"
        # platform-manifests: disable HuggingFaceModel CRs on KRO spokes. The
        # HuggingFaceModel CRD (kro.run) is not installed on spokes, so the chart's
        # CRs fail to apply ("no matches for kind HuggingFaceModel"); these models
        # target GPU/Trainium clusters, not spokes. An empty list makes the chart's
        # huggingfaceModels guard render nothing. Written to the per-cluster overlay
        # tier the platform-manifests appset reads last:
        #   $overlay/overlays/clusters/<cluster>/platform-manifests/values.yaml
        mkdir -p "$REPO_DIR/overlays/clusters/{{.CLUSTER}}/platform-manifests"
        printf 'huggingfaceModels: []\n' > "$REPO_DIR/overlays/clusters/{{.CLUSTER}}/platform-manifests/values.yaml"
        # Fleet member file for the KRO spoke. Unlike Crossplane spokes (which use
        # the fleet-secret chart's "direct" mode and let the Crossplane Composition
        # patch dynamic per-cluster annotations), KRO spokes use "externalSecret"
        # mode: the EksclusterWithVpc RGD writes <cluster>/config to Secrets Manager
        # (rich fleet-secret contract, incl. live aws_vpc_id / eks_oidc_issuer), and
        # this member file makes the fleet-secrets ApplicationSet render the
        # fleet-secret chart's ExternalSecret to build the ArgoCD cluster
        # registration Secret from it. Requires the EksclusterWithVpc RGD to be on
        # its default createArgocdClusterSecret=false path. `labels` drives the
        # enabled-addons overlay selection (tenant/environment). ENV is derived from
        # the cluster name to match the Crossplane convention.
        ENV=$(echo "{{.CLUSTER}}" | grep -oE 'prod|staging|test|dev' | head -1); ENV="${ENV:-dev}"
        mkdir -p "$REPO_DIR/gitops/fleet/members/{{.CLUSTER}}"
        cat > "$REPO_DIR/gitops/fleet/members/{{.CLUSTER}}/values.yaml" <<EOF
        clusterName: {{.CLUSTER}}
        mode: externalSecret
        externalSecret:
          enabled: true
        labels:
          environment: ${ENV}
          tenant: workshop
        EOF
        cd "$REPO_DIR"
        git add -A
        if git diff --cached --quiet; then
          printf '{{.C_INFO}}  No fleet-config changes for {{.CLUSTER}} — already enabled (idempotent).{{.C_RESET}}\n'
        else
          git commit -m "feat: enable spoke {{.CLUSTER}} via KRO (+ fleet member, multi-acct CARM mapping)"
          PUSHED=false
          for i in 1 2 3; do
            # NOTE: the fleet/gitops repo must allow pushes to its default branch.
            # Branch-protection is the consumer's concern (e.g. the workshop configures
            # GitLab when it provisions it). The generic platform never manipulates the git host.
            if git push 2>&1; then PUSHED=true; break; fi
            echo "  Push attempt $i failed, rebasing..."
            git pull --rebase 2>&1 && sleep 2
          done
          if [ "$PUSHED" != "true" ]; then
            printf '{{.C_ERR}}\u26a0 fleet-config push failed after 3 attempts.{{.C_RESET}}\n'
            exit 1
          fi
        fi
        rm -rf "$REPO_DIR"
        # Refresh the local fleet-config checkout so the committed overlay change is
        # visible in ~/environment/fleet-config (the task pushes from a temp clone).
        # Best-effort and non-fatal: skipped if absent, warns if not fast-forwardable.
        LOCAL_FLEET="$HOME/environment/fleet-config"
        if [ -d "$LOCAL_FLEET/.git" ]; then
          (git -C "$LOCAL_FLEET" fetch origin -q && git -C "$LOCAL_FLEET" pull --ff-only -q) \
            && printf '{{.C_INFO}}  Refreshed local fleet-config checkout.{{.C_RESET}}\n' \
            || printf '{{.C_INFO}}  Local fleet-config not auto-updated — run: git -C %s pull{{.C_RESET}}\n' "$LOCAL_FLEET"
        fi
        printf '{{.C_OK}}✓ Spoke {{.CLUSTER}} enabled via KRO + multi-acct CARM mapping in fleet-config overlay.{{.C_RESET}}\n'

  spokes:disable-crossplane:
    desc: "DELETE a Crossplane spoke on purpose: remove from overlay, then prune (usage: task spokes:disable-crossplane -- <cluster-name>)"
    vars:
      CLUSTER: '{{.CLI_ARGS}}'
      GITLAB_CF_DOMAIN:
        sh: |
          if [ -f {{.REPO}}/private/gitlab-cloudfront-domain ]; then
            cat {{.REPO}}/private/gitlab-cloudfront-domain
          else
            echo "{{.DOMAIN}}"
          fi
      GIT_PASSWORD:
        sh: yq '.hub.gitlabRootPassword // ""' {{.CONFIG_FILE}} | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password'
    cmds:
      - |
        if [ -z "{{.CLUSTER}}" ]; then echo "Usage: task spokes:disable-crossplane -- <cluster-name>"; exit 1; fi
        # Crossplane clusters are grouped under one per-tenant app (clusters-<tenant>).
        APP="clusters-workshop"

        # 1. Declarative removal: drop the cluster entry from the overlay (Git).
        FLEET_URL="https://{{.GIT_USERNAME}}:{{.GIT_PASSWORD}}@{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/fleet-config.git"
        # Guard: a silently-failed clone would leave an empty $REPO_DIR, making us
        # wrongly conclude the cluster is absent from the overlay and skip the Git
        # removal (stale overlay left behind). Wait for fleet-config then verify.
        printf '{{.C_STEP}}▸ Waiting for fleet-config repo to be reachable...{{.C_RESET}}\n'
        for i in $(seq 1 30); do
          ERR=$(git ls-remote "$FLEET_URL" 2>&1) && break
          if [ "$i" -eq 30 ]; then
            printf '{{.C_ERR}}⚠ fleet-config not reachable after 5min — cannot disable spoke {{.CLUSTER}} via Crossplane.{{.C_RESET}}\n'
            exit 1
          fi
          sleep 10
        done
        REPO_DIR=$(mktemp -d)
        git clone "$FLEET_URL" "$REPO_DIR"
        if [ ! -d "$REPO_DIR/.git" ]; then
          printf '{{.C_ERR}}⚠ fleet-config clone failed — aborting disable-crossplane for {{.CLUSTER}}.{{.C_RESET}}\n'
          rm -rf "$REPO_DIR"
          exit 1
        fi
        XP_VALUES="$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/crossplane-clusters/values.yaml"
        if [ -f "$XP_VALUES" ] && yq -e '.clusters."{{.CLUSTER}}"' "$XP_VALUES" >/dev/null 2>&1; then
          yq -i 'del(.clusters."{{.CLUSTER}}")' "$XP_VALUES"
          ( cd "$REPO_DIR" && git add -A && git commit -m "feat: disable spoke {{.CLUSTER}} (remove from Crossplane overlay)" && git push 2>/dev/null )
          printf '{{.C_OK}}✓ Removed {{.CLUSTER}} from the Crossplane overlay (Git).{{.C_RESET}}\n'
        else
          printf '{{.C_INFO}}  {{.CLUSTER}} not present in Crossplane overlay — proceeding to prune any leftover resources.{{.C_RESET}}\n'
        fi
        rm -rf "$REPO_DIR"

        # 2. Deliberate prune. With prune:false on the appset this manual --prune is
        #    the explicit destructive step. Refresh + show the diff first so the
        #    operator sees exactly what will be deleted.
        printf '{{.C_ERR}}▸ Pruning app %s — this DELETES the live cluster {{.CLUSTER}} + its VPC.{{.C_RESET}}\n' "$APP"
        if command -v argocd >/dev/null 2>&1; then
          argocd app get "$APP" --refresh >/dev/null 2>&1 || true
          argocd app diff "$APP" || true
          if ! argocd app sync "$APP" --prune --timeout 600; then
            printf '{{.C_ERR}}⚠ argocd prune failed (auth?). Run: argocd-refresh-token && source ~/.bashrc.d/platform.sh, then:{{.C_RESET}}\n'
            printf '    argocd app sync %s --prune\n' "$APP"
          fi
        else
          printf '{{.C_INFO}}  argocd CLI not found. Finish the deletion manually:{{.C_RESET}}\n'
          printf '    argocd app sync %s --prune\n' "$APP"
        fi

  spokes:disable-kro:
    desc: "DELETE a KRO spoke on purpose: remove from overlay, then prune (usage: task spokes:disable-kro -- <cluster-name>)"
    vars:
      CLUSTER: '{{.CLI_ARGS}}'
      GITLAB_CF_DOMAIN:
        sh: |
          if [ -f {{.REPO}}/private/gitlab-cloudfront-domain ]; then
            cat {{.REPO}}/private/gitlab-cloudfront-domain
          else
            echo "{{.DOMAIN}}"
          fi
      GIT_PASSWORD:
        sh: yq '.hub.gitlabRootPassword // ""' {{.CONFIG_FILE}} | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password'
    cmds:
      - |
        if [ -z "{{.CLUSTER}}" ]; then echo "Usage: task spokes:disable-kro -- <cluster-name>"; exit 1; fi
        # KRO generates one app per cluster: clusters-kro-<name>.
        APP="clusters-kro-{{.CLUSTER}}"
        FLEET_URL="https://{{.GIT_USERNAME}}:{{.GIT_PASSWORD}}@{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/fleet-config.git"
        # Guard: a silently-failed clone would leave an empty $REPO_DIR, making the
        # overlay cleanup below a no-op (stale kro overlay + marker left behind).
        # Wait for fleet-config then verify the clone produced a git repo.
        printf '{{.C_STEP}}▸ Waiting for fleet-config repo to be reachable...{{.C_RESET}}\n'
        for i in $(seq 1 30); do
          ERR=$(git ls-remote "$FLEET_URL" 2>&1) && break
          if [ "$i" -eq 30 ]; then
            printf '{{.C_ERR}}⚠ fleet-config not reachable after 5min — cannot disable spoke {{.CLUSTER}} via KRO.{{.C_RESET}}\n'
            exit 1
          fi
          sleep 10
        done
        REPO_DIR=$(mktemp -d)
        git clone "$FLEET_URL" "$REPO_DIR"
        if [ ! -d "$REPO_DIR/.git" ]; then
          printf '{{.C_ERR}}⚠ fleet-config clone failed — aborting disable-kro for {{.CLUSTER}}.{{.C_RESET}}\n'
          rm -rf "$REPO_DIR"
          exit 1
        fi
        BASE="$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/kro-clusters"
        KRO_VALUES="$BASE/values.yaml"
        MARKER="$BASE/clusters/{{.CLUSTER}}.json"
        MA_FILE="$REPO_DIR/configs/multi-acct/values.yaml"

        # PHASE 1: remove ONLY the cluster spec from values.yaml. Keep the clusters/*.json
        # marker for now so the appset still generates clusters-kro-<name> and we can prune
        # through it. (Deleting the marker first would make the appset remove the app with
        # preserveResourcesOnDeletion=true -> the EksclusterWithVpc would be ORPHANED, not
        # deleted.)
        if [ -f "$KRO_VALUES" ] && yq -e '.clusters."{{.CLUSTER}}"' "$KRO_VALUES" >/dev/null 2>&1; then
          yq -i 'del(.clusters."{{.CLUSTER}}")' "$KRO_VALUES"
          ( cd "$REPO_DIR" && git add -A && git commit -m "feat: disable spoke {{.CLUSTER}} (remove KRO cluster spec)" && git push 2>/dev/null )
          printf '{{.C_OK}}✓ Removed {{.CLUSTER}} spec from the KRO overlay (Git).{{.C_RESET}}\n'
        else
          printf '{{.C_INFO}}  {{.CLUSTER}} spec not present in KRO overlay — proceeding to prune any leftovers.{{.C_RESET}}\n'
        fi

        # PHASE 2: deliberate prune through the still-existing app.
        printf '{{.C_ERR}}▸ Pruning app %s — this DELETES the live cluster {{.CLUSTER}} + its VPC.{{.C_RESET}}\n' "$APP"
        PRUNED=false
        if command -v argocd >/dev/null 2>&1; then
          argocd app get "$APP" --refresh >/dev/null 2>&1 || true
          argocd app diff "$APP" || true
          if argocd app sync "$APP" --prune --timeout 600; then PRUNED=true; else
            printf '{{.C_ERR}}⚠ argocd prune failed (auth?). Run: argocd-refresh-token && source ~/.bashrc.d/platform.sh, then: argocd app sync %s --prune{{.C_RESET}}\n' "$APP"
          fi
        else
          printf '{{.C_INFO}}  argocd CLI not found. Run manually then re-run this task to clean up: argocd app sync %s --prune{{.C_RESET}}\n' "$APP"
        fi

        # PHASE 3: cleanup the now-empty app + CARM mapping (only after a successful prune,
        # so we never orphan a live resource). The appset removes clusters-kro-<name> once
        # the marker is gone; its resources are already pruned.
        if [ "$PRUNED" = true ]; then
          CHANGED=0
          [ -f "$MARKER" ] && { rm -f "$MARKER"; CHANGED=1; }
          [ -f "$MA_FILE" ] && yq -e '.clusters."{{.CLUSTER}}"' "$MA_FILE" >/dev/null 2>&1 && { yq -i 'del(.clusters."{{.CLUSTER}}")' "$MA_FILE"; CHANGED=1; }
          if [ "$CHANGED" = "1" ]; then
            ( cd "$REPO_DIR" && git add -A && git commit -m "chore: remove {{.CLUSTER}} KRO marker + multi-acct mapping (post-prune cleanup)" && git push 2>/dev/null )
            printf '{{.C_OK}}✓ Cleaned up {{.CLUSTER}} marker + multi-acct mapping; app will be removed by the appset.{{.C_RESET}}\n'
          fi
        else
          printf '{{.C_INFO}}  Skipped marker/CARM cleanup (prune not confirmed). Re-run this task after a successful prune.{{.C_RESET}}\n'
        fi
        rm -rf "$REPO_DIR"

  spokes:disable-all:
    desc: >-
      DELETE every spoke cluster (KRO + Crossplane) declared in the fleet-config
      overlay, then wait for them to disappear from AWS. Used as Phase 0 of
      `destroy` so spokes are removed while the hub controllers (KRO/ACK/Crossplane)
      are still alive to reconcile their deletion. Idempotent.
    vars:
      GITLAB_CF_DOMAIN:
        sh: |
          if [ -f {{.REPO}}/private/gitlab-cloudfront-domain ]; then
            cat {{.REPO}}/private/gitlab-cloudfront-domain
          else
            echo "{{.DOMAIN}}"
          fi
      GIT_PASSWORD:
        sh: yq '.hub.gitlabRootPassword // ""' {{.CONFIG_FILE}} | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/secrets --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.git_token // empty' | grep -v '^$' || aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password'
    cmds:
      - |
        set -u
        # 1. Discover spokes from the fleet-config overlay (the single source of truth
        #    for cluster specs). If the overlay is unreachable we must NOT silently
        #    proceed to hub teardown — surviving spokes would be orphaned.
        REPO_DIR=$(mktemp -d)
        if ! git clone "https://{{.GIT_USERNAME}}:{{.GIT_PASSWORD}}@{{.GITLAB_CF_DOMAIN}}/{{.GIT_USERNAME}}/fleet-config.git" "$REPO_DIR" 2>/dev/null; then
          printf '{{.C_ERR}}⚠ fleet-config overlay unreachable — cannot discover spokes automatically.{{.C_RESET}}\n'
          printf '{{.C_INFO}}  If any spoke clusters exist, delete them first with:{{.C_RESET}}\n'
          printf '    task spokes:disable-kro -- <name>   /   task spokes:disable-crossplane -- <name>\n'
          rm -rf "$REPO_DIR"; exit 0
        fi
        KRO_VALUES="$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/kro-clusters/values.yaml"
        XP_VALUES="$REPO_DIR/gitops/fleet/spoke-values/tenants/workshop/crossplane-clusters/values.yaml"
        KRO_SPOKES=""; XP_SPOKES=""
        [ -f "$KRO_VALUES" ] && KRO_SPOKES=$(yq '.clusters // {} | keys | .[]' "$KRO_VALUES" 2>/dev/null)
        [ -f "$XP_VALUES" ]  && XP_SPOKES=$(yq '.clusters // {} | keys | .[]' "$XP_VALUES" 2>/dev/null)
        rm -rf "$REPO_DIR"

        if [ -z "$(echo $KRO_SPOKES $XP_SPOKES | tr -d ' ')" ]; then
          printf '{{.C_OK}}✓ No spoke clusters declared in the overlay — nothing to tear down.{{.C_RESET}}\n'
          exit 0
        fi
        printf '{{.C_STEP}}▸ Spokes to delete — KRO: [%s]  Crossplane: [%s]{{.C_RESET}}\n' "$(echo $KRO_SPOKES | tr '\n' ' ')" "$(echo $XP_SPOKES | tr '\n' ' ')"

        # 2. Deliberate deletion via the existing per-cluster disable tasks (they remove
        #    the cluster from the overlay in Git, then run a scoped `argocd app sync --prune`).
        for c in $KRO_SPOKES; do
          printf '{{.C_STEP}}▸ Disabling KRO spoke %s...{{.C_RESET}}\n' "$c"
          task spokes:disable-kro -- "$c" || printf '{{.C_ERR}}⚠ disable-kro failed for %s (continuing).{{.C_RESET}}\n' "$c"
        done
        for c in $XP_SPOKES; do
          printf '{{.C_STEP}}▸ Disabling Crossplane spoke %s...{{.C_RESET}}\n' "$c"
          task spokes:disable-crossplane -- "$c" || printf '{{.C_ERR}}⚠ disable-crossplane failed for %s (continuing).{{.C_RESET}}\n' "$c"
        done

        # 3. Wait for the spoke EKS clusters to actually disappear from AWS BEFORE the
        #    hub teardown removes the controllers that reconcile their deletion. Without
        #    this, killing the hub mid-deletion leaves orphaned EKS clusters + VPCs.
        ALL_SPOKES="$KRO_SPOKES $XP_SPOKES"
        printf '{{.C_STEP}}▸ Waiting for spoke EKS clusters to delete in AWS (up to 30m)...{{.C_RESET}}\n'
        for i in $(seq 1 90); do
          LIVE=""
          for c in $ALL_SPOKES; do
            aws eks describe-cluster --name "$c" --region {{.AWS_REGION}} >/dev/null 2>&1 && LIVE="$LIVE $c"
          done
          if [ -z "$(echo $LIVE | tr -d ' ')" ]; then
            printf '{{.C_OK}}✓ All spoke clusters deleted from AWS.{{.C_RESET}}\n'; break
          fi
          printf '{{.C_INFO}}  Still deleting:%s ... (%s/90){{.C_RESET}}\n' "$LIVE" "$i"
          sleep 20
        done
        # Final check — warn loudly (but do not hard-fail) if a spoke survived, so the
        # operator can intervene before/after the hub goes away.
        STILL_LIVE=""
        for c in $ALL_SPOKES; do
          aws eks describe-cluster --name "$c" --region {{.AWS_REGION}} >/dev/null 2>&1 && STILL_LIVE="$STILL_LIVE $c"
        done
        if [ -n "$(echo $STILL_LIVE | tr -d ' ')" ]; then
          printf '{{.C_ERR}}⚠ Spoke clusters still present after wait:%s{{.C_RESET}}\n' "$STILL_LIVE"
          printf '{{.C_ERR}}  Proceeding with hub teardown will ORPHAN them. See troubleshooting.md →{{.C_RESET}}\n'
          printf '{{.C_ERR}}  "Spoke Cluster Stuck Deletion / Recovery". Recommend aborting and fixing first.{{.C_RESET}}\n'
        fi

