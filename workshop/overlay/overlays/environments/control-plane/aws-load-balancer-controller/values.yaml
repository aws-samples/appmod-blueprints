# Workshop: pin aws-load-balancer-controller to the tuned system-peeks pool.
# Generic default (no overlay) lets it land on general-purpose. system-peeks carries
# the CriticalAddonsOnly:NoSchedule taint, so the toleration is required alongside the
# nodeSelector. Upstream eks-charts aws-load-balancer-controller honors both top-level keys.
nodeSelector:
  karpenter.sh/nodepool: system-peeks
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
    effect: NoSchedule
