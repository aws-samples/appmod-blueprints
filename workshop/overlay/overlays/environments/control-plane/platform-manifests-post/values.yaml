# Workshop-only: pre-staged HuggingFace models for the AI/ML modules.
#
# These live in the WORKSHOP overlay (seeded to the fleet-config root and read through
# $overlay/overlays/environments/<env>/platform-manifests-post/values.yaml), not in the
# generic control-plane overlay. Each model's download Workflow uploads to
# <resource_prefix>-ray-models-<account>, a bucket the generic platform does not create:
# only the workshop install creates it (`<provider>:ray:setup`). Declaring the models in
# the generic overlay made every non-workshop hub start downloads that waited 20 min for
# a bucket that never comes, then failed. A non-workshop install that wants pre-staged
# models provides the bucket and adds this same list to its own overlay.
#
# HuggingFace models are in platform-manifests-post (wave 8) to ensure the
# HuggingFaceModel KRO RGD is fully processed before these resources are applied.
# kro-manifests-hub (wave -2) installs the RGD but KRO needs time to reconcile it
# into a CRD — wave 8 gives sufficient buffer after wave -2.
huggingfaceModels:
  - name: gpt2-neuron
    modelId: "gpt2"
    namespace: "ray-system"

  - name: mistral-7b-neuron
    modelId: "mistralai/Mistral-7B-v0.1"
    namespace: "ray-system"

  - name: tinyllama
    modelId: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    namespace: "ray-system"
