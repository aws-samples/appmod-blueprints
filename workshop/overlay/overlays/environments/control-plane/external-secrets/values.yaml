# Workshop: pin external-secrets (controller + certController + webhook) to the
# tuned system-peeks pool. Generic default is the built-in `system` pool.
nodeSelector:
  karpenter.sh/nodepool: system-peeks
certController:
  nodeSelector:
    karpenter.sh/nodepool: system-peeks
webhook:
  nodeSelector:
    karpenter.sh/nodepool: system-peeks
