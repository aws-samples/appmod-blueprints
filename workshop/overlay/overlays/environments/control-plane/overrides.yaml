# Environment-level value overrides for the control-plane environment — WORKSHOP VARIANT.
#
# This file is seeded into the fleet-config repo (GitLab, in the workshop) by
# workshop/Taskfile.yaml, at path overlays/environments/control-plane/overrides.yaml —
# the exact path the cluster-addons ApplicationSet resolves via the $overlay source
# (see gitops/bootstrap/addons.yaml). It is layered AFTER the base solution's own
# overrides.yaml (gitops/overlays/environments/control-plane/overrides.yaml, currently
# empty) and lets the workshop customize addon values without touching the generic
# solution. Any consumer of the solution can provide their own fleet-config repo with
# an equivalent file to customize their own control-plane environment.
#
# Kargo ingress is handled separately via
# overlays/environments/control-plane/kargo/values.yaml (loaded by the kargo
# ApplicationSet directly) — not here.
#
# Add any other control-plane addon overrides below as needed:
#
# Example:
#   metrics_server:
#     valuesObject:
#       replicas: 2

# NOTE: the aiops-agent registry entry is NOT here. It lives upstream in
# gitops/addons/registry/platform.yaml (disabled by default, gated by enable_aiops_agent).
# This overlay only DECIDES whether it is deployed, via `aiops_agent: true|false` in
# enabled-addons.yaml; per-cluster values go to overlays/clusters/<cluster>/aiops-agent/values.yaml.

# aiops-agent-rbac — read-only cluster-wide ClusterRole + ClusterRoleBinding (group
# aiops-agent-cluster-read) on the hub AND every spoke. The aiops-agent AccessEntries
# (chart/files/aiops-agent-app.yaml, agent-access) map the agent's role into that group;
# AmazonEKSViewPolicy alone 403s on nodes and on every CRD (argoproj.io, ACK, kro).
# Delivery mirrors gitops/addons/charts/eks-capabilities-rbac: this hub appset-chart
# entry's cluster generator targets every fleet cluster secret, so the ClusterRole lands
# on spokes without anything running there. Deliberately NOT gated on enable_aiops_agent:
# that label exists only on the hub, and the binding is inert on any cluster where no
# AccessEntry maps a principal into the group (no members = no access).
aiops-agent-rbac:
  namespace: kube-system
  path: 'workshop/aiops-agent/rbac-chart'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '9'
