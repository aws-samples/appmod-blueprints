# Workshop pins Backstage to the tuned general-purpose-peeks pool: amd64 (its image
# is amd64-only), a do-not-disrupt budget, and larger instances. Backstage is a heavy
# user-facing app, not critical control-plane, so it is kept OFF the CriticalAddonsOnly
# system-peeks pool. The generic default is the built-in `general-purpose` pool.
global:
  generalPurposeNodepool: general-purpose-peeks
