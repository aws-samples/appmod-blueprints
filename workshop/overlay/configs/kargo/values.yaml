# Workshop: pin Kargo (all components) to the tuned system-peeks pool.
# In the workshop `configs` layer for a uniform pin location. Kargo currently runs on the
# hub only (no spoke Application), so this is effectively hub-scoped, but keeping it here
# keeps all workshop system-addon pins in one place and is correct if a spoke Kargo is added.
# This local chart wraps the upstream Kargo chart under the `kargo` key; the upstream chart
# exposes global.nodeSelector / global.tolerations as the default for every Kargo pod.
# system-peeks carries the CriticalAddonsOnly:NoSchedule taint, hence the toleration.
kargo:
  global:
    nodeSelector:
      karpenter.sh/nodepool: system-peeks
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
        effect: NoSchedule
