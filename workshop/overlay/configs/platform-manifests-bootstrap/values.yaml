# Workshop-specific tuned Karpenter NodePools — applied to ALL workshop clusters
# (hub AND spokes) via this shared `configs/` layer, which every
# platform-manifests-bootstrap Application composes (hub also reads
# overlays/environments/control-plane; spokes also read overlays/environments/dev|prod;
# all three read $overlay/configs).
#
# Previously these pools lived ONLY in overlays/environments/control-plane, so the
# spokes (which read overlays/environments/dev|prod, which do not exist) rendered
# customNodepools.pools=[] and fell back to just the built-in system/general-purpose
# pools. Defining them here fixes that: spokes now also get general-purpose-peeks and
# system-peeks.
#
# Reconciliation policy is workshop-specific: a daytime "do-not-disrupt" budget
# (nodes: "0") with a nightly consolidation window, plus a 48h termination grace,
# so Karpenter does not consolidate/recycle platform nodes while a (possibly
# pre-provisioned, multi-day) workshop is in use. Rendered by the generic
# platform-manifests-bootstrap chart from this caller-supplied list.
#
# The built-in "system" pool remains enabled (it provides the `default`
# NodeClass these pools reference); the built-in "general-purpose" pool is
# dropped on the hub (enableGeneralPurposeNodePool="false"), and the workshop
# pins its critical addons to the custom *-peeks pools via the per-addon overlays.
customNodepools:
  pools:
    - name: general-purpose-peeks
      spec:
        # Prefer this tuned pool over the built-in general-purpose (weight 0) so
        # unpinned workloads land here and inherit the do-not-disrupt budget instead
        # of the built-in's default consolidation. Adjust to your own precedence.
        weight: 100
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
          budgets:
            # Consolidation OFF ~23h/day, allowed only in a single ~1h daily
            # maintenance window. Karpenter takes the MOST RESTRICTIVE (minimum) of
            # all budgets, and a SCHEDULED budget is enforced ONLY inside its window
            # (an UNscheduled `nodes: "0"` would be always-active and mask any window
            # — issue #892). So "off by default" is expressed as a scheduled `nodes:
            # "0"` that covers 23h and deliberately leaves a 1h gap. During that gap
            # no budget is active, so Karpenter's own default (`nodes: 10%`) applies
            # and consolidation can proceed.
            #
            # Window below: BLOCK 03:00->02:00 (next day) UTC = 23h; the 02:00-03:00
            # UTC gap is the only time consolidation runs. CHANGE this schedule to
            # whatever low-traffic hour suits your audience (schedules are UTC only).
            - nodes: "0"
              schedule: "0 3 * * *"
              duration: 23h
        template:
          metadata:
            labels:
              node-type: general-purpose
              managed-by: peeks
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]
              - key: "eks.amazonaws.com/instance-size"
                operator: In
                values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]
            terminationGracePeriod: 48h
    - name: system-peeks
      spec:
        # Prefer this tuned system pool over the built-in system (weight 0) for
        # critical add-ons that tolerate the CriticalAddonsOnly taint. Adjust to taste.
        weight: 100
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
          budgets:
            # Consolidation OFF ~23h/day, allowed only in a single ~1h daily
            # maintenance window. See general-purpose-peeks above for the rationale:
            # a SCHEDULED `nodes: "0"` covering 23h (most-restrictive-wins + a
            # scheduled budget only enforced inside its window) leaves a 1h gap
            # (02:00-03:00 UTC) where Karpenter's default `nodes: 10%` applies.
            # CHANGE this schedule to your own low-traffic hour (UTC only).
            - nodes: "0"
              schedule: "0 3 * * *"
              duration: 23h
        template:
          metadata:
            labels:
              node-type: system
              managed-by: peeks
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]
              - key: "eks.amazonaws.com/instance-size"
                operator: In
                values: ["xlarge", "2xlarge"]
            taints:
              - key: CriticalAddonsOnly
                effect: NoSchedule
            terminationGracePeriod: 48h
