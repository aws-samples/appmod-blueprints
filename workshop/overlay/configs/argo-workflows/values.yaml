# Workshop: pin argo-workflows (controller + server) to the tuned system-peeks pool.
# In the workshop `configs` layer for a uniform pin location. argo-workflows currently runs
# on the hub only (no spoke Application), so this is effectively hub-scoped.
#
# system-peeks carries the CriticalAddonsOnly:NoSchedule taint, so the toleration is
# required in addition to the nodeSelector. The local argo-workflows chart now templates
# nodeSelector/tolerations from these values (previously it hard-coded
# nodeSelector: kubernetes.io/os=linux and ignored them).
controller:
  nodeSelector:
    karpenter.sh/nodepool: system-peeks
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule
server:
  nodeSelector:
    karpenter.sh/nodepool: system-peeks
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule
