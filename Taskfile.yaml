# Root Taskfile — delegates to the cluster provider specified in config.yaml
# Usage: task install / task status / task destroy-kind / task hub:update
version: "3"
set: [errexit, nounset, pipefail]

vars:
  CONFIG_FILE: "{{.ROOT_DIR}}/config.local.yaml"

includes:
  kind-crossplane:
    taskfile: ./cluster-providers/kind-crossplane/Taskfile.yaml
    dir: ./cluster-providers/kind-crossplane
    vars:
      CONFIG_FILE: "{{.CONFIG_FILE}}"
    optional: true
  byoc:
    taskfile: ./cluster-providers/byoc/Taskfile.yaml
    dir: ./cluster-providers/byoc
    vars:
      CONFIG_FILE: "{{.CONFIG_FILE}}"
    optional: true
  terraform:
    taskfile: ./cluster-providers/terraform/Taskfile.yaml
    dir: ./cluster-providers/terraform
    vars:
      CONFIG_FILE: "{{.CONFIG_FILE}}"
    optional: true
  kind-kro-ack:
    taskfile: ./cluster-providers/kind-kro-ack/Taskfile.yaml
    dir: ./cluster-providers/kind-kro-ack
    vars:
      CONFIG_FILE: "{{.CONFIG_FILE}}"
    optional: true

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  validate:
    desc: Pre-flight checks for the configured provider
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    cmds:
      - task: "{{.PROVIDER}}:validate"

  test-pod-identity-drift:
    desc: Assert crossplane-pod-identity and ack-pod-identity have not diverged
    cmds:
      - python3 {{.ROOT_DIR}}/platform/validation/pod-identity/test_chart_drift.py

  verify:
    desc: "Read-only post-install verification (clusters, ArgoCD, Crossplane/kro, pods, endpoints, SSO discovery, gateway auth, DNS). Non-zero on any FAIL (run `task -x verify` to get the script's own 0=ok/1=FAIL/2=config-error codes). Extra flags: task verify -- --json-out out.json"
    cmds:
      - python3 {{.ROOT_DIR}}/scripts/post_install_verify.py --config {{.CONFIG_FILE}} {{.CLI_ARGS}}

  install:
    desc: Bootstrap the platform using the configured cluster provider
    preconditions:
      - sh: 'case "$(yq ''.privilegedSteps // "inline"'' {{.CONFIG_FILE}})" in inline|external) exit 0 ;; esac; exit 1'
        msg: "privilegedSteps in {{.CONFIG_FILE}} must be inline or external (an unknown value is refused, not read as inline)."
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
      PRIVILEGED_STEPS:
        sh: yq '.privilegedSteps // "inline"' {{.CONFIG_FILE}}
      INSTALL_START:
        sh: date +%s
    cmds:
      - echo "Using cluster provider {{.PROVIDER}}"
      # privilegedSteps=external: check read-only, before kind/ACK/kro, that the privileged
      # runner created what this host no longer creates (task privileged:pre).
      - task: 'privileged:verify:{{.PRIVILEGED_STEPS}}'
      # Timing log: a standalone run starts a new one; under the workshop install
      # (INSTALL_TIMING_T0 set) this keeps appending to the workshop's.
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" init {{.INSTALL_START}}'
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" step platform {{.PROVIDER}}:install'
      - task: "{{.PROVIDER}}:install"
      # Activate EKS Capability (kro) controller log delivery for all provisioned
      # clusters. Idempotent; skips clusters whose kro capability is not yet
      # ACTIVE or DEGRADED after waiting up to CAP_LOGS_WAIT s in total (default 600) while
      # CREATING/UPDATING or not created yet on a cluster still being created, and
      # lists them in a final ⚠ line (re-run `task enable-capability-logs` after enabling more spokes).
      # NOTE: imperative for now because ACK/Crossplane lack DeliverySource/
      # DeliveryDestination/Delivery CRDs. Tracking issue to move this into the
      # RGD/composition (option 2) or declarative CRs (option 3).
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" step platform enable-capability-logs'
      # privilegedSteps=external: the privileged runner does this (task privileged:post).
      - task: 'enable-capability-logs{{if eq .PRIVILEGED_STEPS "external"}}:external{{end}}'
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" step platform -'
      # Final, unmistakable completion marker + total elapsed time. This is the
      # LAST line of `task install`; anything after it means a step ran post-install.
      - |
        ELAPSED=$(($(date +%s) - {{.INSTALL_START}}))
        H=$((ELAPSED/3600)); M=$(((ELAPSED%3600)/60)); S=$((ELAPSED%60))
        printf '\n'
        printf '\033[1;32m============================================================\033[0m\n'
        printf '\033[1;32m✓✓✓  TASK INSTALL COMPLETE  ✓✓✓\033[0m\n'
        printf '\033[1;32m     Total time: %02dh%02dm%02ds (%ds)\033[0m\n' "$H" "$M" "$S" "$ELAPSED"
        printf '\033[1;32m     Next: run `task status` to check the platform.\033[0m\n'
        printf '\033[1;32m============================================================\033[0m\n'

  # `install` in two phases, for consumers that run their own steps in between
  # (the workshop declares spokes after install:hub, before Keycloak finalizes).
  # install:hub + install:complete == install.
  install:hub:
    desc: "Install phase 1 (hub bootstrap, returns before the Keycloak-dependent finalize)"
    preconditions:
      - sh: 'case "$(yq ''.privilegedSteps // "inline"'' {{.CONFIG_FILE}})" in inline|external) exit 0 ;; esac; exit 1'
        msg: "privilegedSteps in {{.CONFIG_FILE}} must be inline or external (an unknown value is refused, not read as inline)."
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
      PRIVILEGED_STEPS:
        sh: yq '.privilegedSteps // "inline"' {{.CONFIG_FILE}}
      INSTALL_START:
        sh: date +%s
    cmds:
      - echo "Using cluster provider {{.PROVIDER}}"
      # privilegedSteps=external: check read-only, before kind/ACK/kro, that the privileged
      # runner created what this host no longer creates (task privileged:pre).
      - task: 'privileged:verify:{{.PRIVILEGED_STEPS}}'
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" init {{.INSTALL_START}}'
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" step platform {{.PROVIDER}}:install:hub'
      - task: "{{.PROVIDER}}:install:hub"
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" step platform -'

  install:complete:
    desc: "Install phase 2 (Keycloak-dependent finalize, observability converge, capability logs)"
    preconditions:
      - sh: 'case "$(yq ''.privilegedSteps // "inline"'' {{.CONFIG_FILE}})" in inline|external) exit 0 ;; esac; exit 1'
        msg: "privilegedSteps in {{.CONFIG_FILE}} must be inline or external (an unknown value is refused, not read as inline)."
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
      PRIVILEGED_STEPS:
        sh: yq '.privilegedSteps // "inline"' {{.CONFIG_FILE}}
    cmds:
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" step platform {{.PROVIDER}}:install:complete'
      - task: "{{.PROVIDER}}:install:complete"
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" step platform enable-capability-logs'
      # privilegedSteps=external: the privileged runner does this (task privileged:post).
      - task: 'enable-capability-logs{{if eq .PRIVILEGED_STEPS "external"}}:external{{end}}'
      - 'sh "{{.ROOT_DIR}}/scripts/install-timing.sh" step platform -'
      - printf '\033[1;32m✓ Platform install complete (install:hub + install:complete).\033[0m\n'

  status:
    desc: Check bootstrap and cluster status
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    cmds:
      - task: "{{.PROVIDER}}:status"

  backstage-catalog:
    desc: Update backstage-dynamic-catalog ConfigMap with environment-specific values
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    cmds:
      - task: "{{.PROVIDER}}:hub:backstage-catalog"

  destroy-kind:
    desc: Delete the Kind cluster (hub persists)
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    cmds:
      - task: "{{.PROVIDER}}:destroy-kind"

  destroy:
    desc: Full teardown
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    cmds:
      - task: "{{.PROVIDER}}:destroy"

  hub-update:
    desc: Update hub infrastructure via the cluster provider
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    cmds:
      - task: "{{.PROVIDER}}:hub:update"

  observability-seed:
    desc: Seed observability credentials (AMP/AMG) into Secrets Manager (run after workspaces are created)
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    cmds:
      - task: "{{.PROVIDER}}:secrets-manager:seed-observability"

  hub-destroy-addons:
    desc: Remove all addons from the hub cluster (no git changes needed)
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    cmds:
      - task: "{{.PROVIDER}}:hub:destroy-addons"

  grant-ide-access:
    desc: Grant the current caller (IDE) role cluster-admin access entries on the hub and all spoke clusters
    vars:
      RESOURCE_PREFIX:
        sh: yq '.resourcePrefix' {{.CONFIG_FILE}}
      AWS_REGION:
        sh: yq '.aws.region' {{.CONFIG_FILE}}
    cmds:
      - |
        # The RGD (spokes) and terraform (hub) already grant cluster-admin to the
        # participant SSO role via `adminRoleName`. The IDE, however, runs kubectl
        # as the EC2 instance role (e.g. *SharedRole*), which create-config.sh
        # intentionally excludes from adminRoleName — so it has NO access entry on
        # KRO-provisioned spokes and kubectl returns 401 there. This task adds the
        # *current caller* role as a cluster-admin access entry on every
        # {{.RESOURCE_PREFIX}}-* cluster. Idempotent and additive (does not touch
        # the participant adminRoleName entry).
        CALLER_ARN="$(aws sts get-caller-identity --query Arn --output text)"
        ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
        ROLE_NAME="${CALLER_ARN##*assumed-role/}"; ROLE_NAME="${ROLE_NAME%%/*}"
        if [ -z "$ROLE_NAME" ] || [ "$ROLE_NAME" = "$CALLER_ARN" ]; then
          echo "✗ Caller is not an assumed-role ARN ($CALLER_ARN); cannot derive role." >&2
          exit 1
        fi
        ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/${ROLE_NAME}"
        POLICY_ARN="arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
        echo "▸ Ensuring cluster-admin for ${ROLE_ARN} on {{.RESOURCE_PREFIX}}-* clusters"
        for CLUSTER in $(aws eks list-clusters --region {{.AWS_REGION}} --query "clusters[?starts_with(@, '{{.RESOURCE_PREFIX}}-')]" --output text); do
          echo "  • ${CLUSTER}"
          if aws eks create-access-entry --cluster-name "$CLUSTER" --region {{.AWS_REGION}} \
               --principal-arn "$ROLE_ARN" --type STANDARD >/dev/null 2>&1; then
            echo "    ✓ access entry created"
          else
            echo "    • access entry already present"
          fi
          if aws eks associate-access-policy --cluster-name "$CLUSTER" --region {{.AWS_REGION}} \
               --principal-arn "$ROLE_ARN" --policy-arn "$POLICY_ARN" \
               --access-scope type=cluster >/dev/null 2>&1; then
            echo "    ✓ cluster-admin policy associated"
          else
            echo "    • cluster-admin policy already associated"
          fi
        done
        echo "✓ IDE access ensured"

  # ── Privileged-step offload (privilegedSteps: external) ─────────────────────
  # Some install steps call AWS write APIs directly (not through kind/ACK/Crossplane):
  # the IAM roles the host creates with the AWS CLI and the EKS capability log delivery.
  # With `privilegedSteps: external` in config.yaml, `task install` skips them (it only
  # verifies the roles, read-only) and a separate, more privileged runner runs them:
  #   privileged:pre   before task install  (<provider>:privileged:pre: the IAM roles)
  #   privileged:post  after  task install  (cluster-mgmt roles again, now the hub
  #                                          exists, + capability log delivery)
  # The runner uses its own config.local.yaml WITHOUT privilegedSteps (inline mode).
  # Default (no key / "inline"): nothing changes, task install does everything itself.
  # What the host still needs in external mode: docs/install/privileged-steps.md.
  privileged:pre:
    desc: "Privileged runner, before task install: create the IAM roles task install only verifies in external mode"
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    preconditions:
      - sh: '[ "$(yq ''.privilegedSteps // "inline"'' {{.CONFIG_FILE}})" = "inline" ]'
        msg: "privileged:* runs the privileged steps itself: its config must not set privilegedSteps (or must set it to inline)."
    cmds:
      - task: "{{.PROVIDER}}:privileged:pre"
      - printf '\033[1;32m✓ privileged:pre complete.\033[0m\n'

  privileged:post:
    desc: "Privileged runner, after task install: re-apply cluster-mgmt roles (hub now exists) + capability log delivery"
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    preconditions:
      - sh: '[ "$(yq ''.privilegedSteps // "inline"'' {{.CONFIG_FILE}})" = "inline" ]'
        msg: "privileged:* runs the privileged steps itself: its config must not set privilegedSteps (or must set it to inline)."
    cmds:
      # Second pass, same as hub:seed does inline: the ACK capability role exists now.
      - task: "{{.PROVIDER}}:hub:create-mgmt-roles"
      - task: enable-capability-logs
      - printf '\033[1;32m✓ privileged:post complete.\033[0m\n'

  privileged:destroy:
    desc: "Privileged runner, after task destroy: delete the roles privileged:pre created and the capability-log deliveries"
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    preconditions:
      - sh: '[ "$(yq ''.privilegedSteps // "inline"'' {{.CONFIG_FILE}})" = "inline" ]'
        msg: "privileged:* runs the privileged steps itself: its config must not set privilegedSteps (or must set it to inline)."
    cmds:
      - task: "{{.PROVIDER}}:privileged:destroy"
      - printf '\033[1;32m✓ privileged:destroy complete.\033[0m\n'

  # Called at the top of install / install:hub with the (already validated) mode.
  privileged:verify:inline:
    internal: true

  privileged:verify:external:
    internal: true
    vars:
      PROVIDER:
        sh: yq '.clusterProvider // "kind-kro-ack"' {{.CONFIG_FILE}}
    preconditions:
      - sh: 'case "{{.PROVIDER}}" in kind-kro-ack|kind-crossplane) exit 0 ;; esac; exit 1'
        msg: "privilegedSteps: external is supported by the kind-kro-ack and kind-crossplane providers only (clusterProvider is {{.PROVIDER}})."
    cmds:
      - task: "{{.PROVIDER}}:privileged:verify"

  # install:codebuild: earlier name, kept so existing callers keep working.
  install:external:
    desc: "task install for a host whose privileged steps run elsewhere (privilegedSteps: external; see privileged:pre/post)"
    aliases: [install:codebuild]
    preconditions:
      - sh: '[ "$(yq ''.privilegedSteps // "inline"'' {{.CONFIG_FILE}})" = "external" ]'
        msg: "install:external needs privilegedSteps: external in {{.CONFIG_FILE}} (use task install otherwise)."
    cmds:
      # task install verifies, read-only and before kind/ACK, that privileged:pre ran.
      - task: install

  enable-capability-logs:external:
    internal: true
    cmds:
      - "printf '  enable-capability-logs skipped (privilegedSteps=external), the privileged runner runs it (task privileged:post).\\n'"

  enable-capability-logs:
    desc: 'Enable EKS Capability controller log delivery to CloudWatch for hub + all spokes (CAP=kro|ack, default kro)'
    vars:
      RESOURCE_PREFIX:
        sh: yq '.resourcePrefix' {{.CONFIG_FILE}}
      AWS_REGION:
        sh: yq '.aws.region' {{.CONFIG_FILE}}
      AWS_ACCOUNT_ID:
        sh: aws sts get-caller-identity --query Account --output text
      CAP: '{{.CAP | default "kro"}}'
    env:
      # Settable as a task var (task enable-capability-logs CAP_LOGS_WAIT=30) or as an env var;
      # an env var already set in the caller wins (go-task does not override it).
      CAP_LOGS_WAIT: '{{.CAP_LOGS_WAIT}}'
    cmds:
      - |
        REGION="{{.AWS_REGION}}"; ACCT="{{.AWS_ACCOUNT_ID}}"; CAP="{{.CAP}}"
        case "$CAP" in
          kro) LOGTYPE=EKS_CAPABILITY_KRO_LOGS ;;
          ack) LOGTYPE=EKS_CAPABILITY_ACK_LOGS ;;
          *) echo "Unsupported CAP '$CAP' (use kro|ack)"; exit 1 ;;
        esac
        # Account-level CloudWatch Vended Logs resource policy (idempotent) letting
        # the delivery service write to any EKS capability log group in this region.
        POLICY='{"Version":"2012-10-17","Statement":[{"Sid":"EKSCapabilityVendedLogsDelivery","Effect":"Allow","Principal":{"Service":"delivery.logs.amazonaws.com"},"Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":"arn:aws:logs:'"$REGION"':'"$ACCT"':log-group:/aws/eks/*/capability/*:*","Condition":{"StringEquals":{"aws:SourceAccount":"'"$ACCT"'"}}}]}'
        aws logs put-resource-policy --policy-name EKSCapabilityVendedLogs --policy-document "$POLICY" --region "$REGION" >/dev/null
        WAIT_MAX="${CAP_LOGS_WAIT:-600}"
        case "$WAIT_MAX" in ''|*[!0-9]*|0?*|???????*) echo "  CAP_LOGS_WAIT='$WAIT_MAX' is not a number of seconds — using 600"; WAIT_MAX=600 ;; esac
        ERRF=$(mktemp); ERRC=$(mktemp); trap 'rm -f "$ERRF" "$ERRC"' EXIT
        SKIPPED=""
        # CAP_LOGS_WAIT is ONE budget for the whole run (all clusters): the clusters create in
        # parallel, so time spent waiting on one is time the next one has already progressed.
        TOTAL=0
        CLUSTERS=$(aws eks list-clusters --region "$REGION" --query "clusters[?starts_with(@, '{{.RESOURCE_PREFIX}}-')]" --output text 2>"$ERRF") \
          || { echo "  WARN: list-clusters failed: $(head -c 300 "$ERRF")"; SKIPPED=" (all: list-clusters failed)"; CLUSTERS=""; }
        for C in $CLUSTERS; do
          # A capability still CREATING/UPDATING rejects put-delivery-source with a
          # ConflictException, which aborted the install when spokes were just created.
          # Wait while CREATING/UPDATING, then deliver for ACTIVE or DEGRADED and skip any
          # other state. A capability does not exist before its cluster is ACTIVE, so a spoke
          # still being created has NO capability yet (ResourceNotFound): that is "not yet",
          # not "absent". Keep waiting for it once the cluster has been seen CREATING (PENDING),
          # also after the cluster turns ACTIVE. All waits share the CAP_LOGS_WAIT budget
          # (TOTAL, default 600 s). A cluster that is already ACTIVE with no capability is
          # skipped at once (shortcut: it may never get one, e.g. a cluster without kro;
          # the narrow window between a cluster turning ACTIVE and its capability being
          # created is only covered when the cluster was seen CREATING first).
          WAITED=0; PENDING=""; CL_STATUS=""
          while :; do
            RC=0
            OUT=$(aws eks describe-capability --cluster-name "$C" --capability-name "$CAP" --region "$REGION" --query 'capability.[arn,status]' --output text 2>"$ERRF") || RC=$?
            CAP_ARN=$(echo "$OUT" | awk '{print $1}'); CAP_STATUS=$(echo "$OUT" | awk '{print $2}')
            if [ "$RC" -eq 0 ]; then
              case "$CAP_STATUS" in CREATING|UPDATING) ;; *) break ;; esac
            else
              # Only ResourceNotFound can mean "not created yet"; any other error is reported below.
              if ! grep -q ResourceNotFoundException "$ERRF"; then break; fi
              CL_STATUS=$(aws eks describe-cluster --name "$C" --region "$REGION" --query 'cluster.status' --output text 2>"$ERRC") \
                || CL_STATUS="UNKNOWN ($(head -c 200 "$ERRC"))"
              case "$CL_STATUS" in
                CREATING) PENDING=1 ;;
                ACTIVE) if [ -z "$PENDING" ]; then break; fi ;;
                *) break ;;
              esac
            fi
            if [ "$TOTAL" -ge "$WAIT_MAX" ]; then break; fi
            NAP=$((WAIT_MAX - TOTAL)); if [ "$NAP" -gt 15 ]; then NAP=15; fi
            sleep "$NAP"; WAITED=$((WAITED + NAP)); TOTAL=$((TOTAL + NAP))
          done
          if [ "$RC" -ne 0 ]; then
            # Only ResourceNotFound means "no capability"; anything else (expired
            # credentials, AccessDenied, throttling) is reported, not hidden.
            if grep -q ResourceNotFoundException "$ERRF"; then
              if [ "$CL_STATUS" = "ACTIVE" ] && [ -z "$PENDING" ]; then echo "  $C: no '$CAP' capability — skipping"
              else echo "  $C: cluster is $CL_STATUS, no '$CAP' capability yet after ${WAITED}s — skipping (re-run task enable-capability-logs later)"; SKIPPED="$SKIPPED $C"; fi
            else echo "  WARN $C: describe-capability failed (rc=$RC): $(head -c 300 "$ERRF") — skipping, re-run task enable-capability-logs"; SKIPPED="$SKIPPED $C"; fi
            continue
          fi
          if [ -z "$CAP_ARN" ] || [ "$CAP_ARN" = "None" ]; then echo "  $C: no '$CAP' capability — skipping"; continue; fi
          case "$CAP_STATUS" in
            ACTIVE|DEGRADED) ;;
            *) echo "  $C: '$CAP' capability is $CAP_STATUS after ${WAITED}s — skipping (re-run task enable-capability-logs later)"; SKIPPED="$SKIPPED $C"; continue ;;
          esac
          LG="/aws/eks/$C/capability/$CAP"; LG_ARN="arn:aws:logs:$REGION:$ACCT:log-group:$LG"
          aws logs create-log-group --log-group-name "$LG" --region "$REGION" 2>/dev/null || true
          aws logs put-retention-policy --log-group-name "$LG" --retention-in-days 30 --region "$REGION" >/dev/null 2>&1 || true
          # put-delivery-source is NOT idempotent across cluster re-creation. On a REUSED
          # account a delivery source named "$C-$CAP" can survive from a prior cluster
          # incarnation, still pointing at the OLD capability ARN. CloudWatch then rejects
          # the update to the new ARN with a hard error ("Update to existing Delivery Source
          # with new ResourceId is not allowed. Please create a new Delivery Source
          # instead."), which aborts the whole `task install` (and, in the workshop consumer
          # flow, everything after it: overlay wiring, spokes, IDC). Reconcile first: if a
          # stale source points elsewhere, delete its dependent delivery + the source, then
          # (re)create. Same/absent ARN -> put is a no-op create.
          EXISTING_SRC_ARN=$(aws logs describe-delivery-sources --region "$REGION" --query "deliverySources[?name=='$C-$CAP'].resourceArns[0] | [0]" --output text 2>/dev/null || echo "None")
          if [ -n "$EXISTING_SRC_ARN" ] && [ "$EXISTING_SRC_ARN" != "None" ] && [ "$EXISTING_SRC_ARN" != "$CAP_ARN" ]; then
            echo "  $C: stale '$CAP' delivery source ($EXISTING_SRC_ARN) — recreating for $CAP_ARN"
            # A delivery source cannot be deleted while a delivery references it — delete the delivery first.
            for D in $(aws logs describe-deliveries --region "$REGION" --query "deliveries[?deliverySourceName=='$C-$CAP'].id" --output text 2>/dev/null); do
              [ -n "$D" ] && [ "$D" != "None" ] && aws logs delete-delivery --id "$D" --region "$REGION" >/dev/null 2>&1 || true
            done
            aws logs delete-delivery-source --name "$C-$CAP" --region "$REGION" >/dev/null 2>&1 || true
          fi
          aws logs put-delivery-source --name "$C-$CAP" --resource-arn "$CAP_ARN" --log-type "$LOGTYPE" --region "$REGION" >/dev/null
          aws logs put-delivery-destination --name "$C-$CAP-cwl" --delivery-destination-configuration "destinationResourceArn=$LG_ARN" --region "$REGION" >/dev/null
          DEST_ARN=$(aws logs describe-delivery-destinations --region "$REGION" --query "deliveryDestinations[?name=='$C-$CAP-cwl'].arn | [0]" --output text)
          EXISTS=$(aws logs describe-deliveries --region "$REGION" --query "deliveries[?deliverySourceName=='$C-$CAP' && deliveryDestinationArn=='$DEST_ARN'] | [0].id" --output text 2>/dev/null || echo "None")
          if [ "$EXISTS" = "None" ] || [ -z "$EXISTS" ]; then
            aws logs create-delivery --delivery-source-name "$C-$CAP" --delivery-destination-arn "$DEST_ARN" --region "$REGION" >/dev/null
            echo "  $C: $CAP log delivery created -> $LG"
          else
            echo "  $C: $CAP log delivery already present -> $LG"
          fi
        done
        if [ -n "$SKIPPED" ]; then
          echo "⚠ $CAP capability logs NOT enabled for:$SKIPPED (see above); re-run task enable-capability-logs"
        else
          echo "✓ $CAP capability logs enabled for {{.RESOURCE_PREFIX}}-* clusters (CloudWatch Vended Logs; billable)"
        fi

  kubeconfig:
    desc: Grant IDE access and write kubeconfig contexts for the hub and all spoke clusters
    vars:
      RESOURCE_PREFIX:
        sh: yq '.resourcePrefix' {{.CONFIG_FILE}}
      AWS_REGION:
        sh: yq '.aws.region' {{.CONFIG_FILE}}
    cmds:
      - task: grant-ide-access
      - |
        for CLUSTER in $(aws eks list-clusters --region {{.AWS_REGION}} --query "clusters[?starts_with(@, '{{.RESOURCE_PREFIX}}-')]" --output text); do
          aws eks update-kubeconfig --name "$CLUSTER" --region {{.AWS_REGION}} --alias "$CLUSTER"
        done
      # `update-kubeconfig` switches current-context on every call, and cluster
      # order from `list-clusters` is not guaranteed — without this, we can end
      # up on a spoke context instead of the hub. Always finish on the hub.
      - kubectl config use-context {{.RESOURCE_PREFIX}}-hub 2>/dev/null || true
      - echo ""
      - echo "Kubeconfig contexts written for all {{.RESOURCE_PREFIX}}-* clusters"
      - echo "Current context set to {{.RESOURCE_PREFIX}}-hub"
      - echo ""
