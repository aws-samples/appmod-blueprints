# Platform Bootstrap Configuration
# DO NOT edit this file directly — copy to config.local.yaml and customize there.
# yaml-language-server: $schema=config.schema.json

# Cluster provider — which approach to use for hub cluster provisioning
# Options: kind-kro-ack, kind-crossplane, terraform, byoc
clusterProvider: "kind-kro-ack"

# Git repository hosting the gitops platform code
repo:
  url: "https://github.com/<your-org>/<your-repo>.git"
  revision: "main"
  basepath: "gitops/"

# Optional: OAP (Open Agentic Platform) addon-repo coordinates — the Git repo that
# hosts the agent-platform addon registry. Two independent readers consume this block:
#   - the appmod kind-kro-ack / kind-crossplane providers read ONLY 'url' and 'revision'
#     and stamp them onto the hub cluster-secret as the addons_repo_url / addons_repo_revision
#     annotations that the OAP addon registry (gitops/addons/registry/_defaults.yaml) and
#     the agent-platform fan-out appsets consume;
#   - OAP's own 'task agentic:install' reads the FULL block: 'url', 'revision', 'basepath',
#     and the optional in-cluster overlay keys 'overlayUrl', 'overlayRevision', 'overlayBasepath'.
# NOTE: under appmod's 'task install' this block only stamps the annotations — it does NOT
# install the agent platform (see #1157). Omit the whole block to leave the annotations empty:
# the registry's own fallback then applies (awslabs/open-agentic-platform + main) and a
# non-OAP config behaves exactly as before. 'basepath' is read only by OAP's install and
# must be "gitops/addons/".
# agenticRepo:
#   url: "https://github.com/awslabs/open-agentic-platform"
#   revision: "main"
#   basepath: "gitops/addons/"          # OAP install only (appmod providers never read it)
#   # Optional in-cluster overlay (OAP install only) — override addon values without
#   # committing to the addon repo. Leave unset to disable the overlay.
#   # overlayUrl: "https://<in-cluster-gitops-repo>"
#   # overlayRevision: "main"
#   # overlayBasepath: "gitops/addons/"

# Hub cluster configuration
hub:
  clusterName: "<unique-cluster-name>"       # Must be DNS-compatible, unique per account+region
  kubernetesVersion: "1.37"
  vpcCidr: "10.0.0.0/16"
  autoMode: true                             # EKS Auto Mode — disables OSS LBC, uses built-in ALB
  # Optional: managed node group alongside Auto Mode
  # managedNodeGroup:
  #   enabled: true
  #   instanceTypes: ["m5.large"]
  #   desiredSize: 2
  #   minSize: 1
  #   maxSize: 5
  #   diskSize: 50
  #   capacityType: "ON_DEMAND"
  # Managed EKS Capabilities (KRO / ACK) for this cluster. AWS-managed platform
  # controllers created via provider-aws-eks Capability MRs (wired in the
  # platform-cluster Composition). KRO serves ResourceGraphDefinitions; ACK manages
  # GA AWS resources (iam/s3/…) as Kubernetes CRs. Enabled on the hub by default;
  # set enabled: false (or omit) to opt out. See docs/EKS-Capabilities-KRO-ACK-Setup.md.
  capabilities:
    kro:
      enabled: true
    ack:
      enabled: true

# AWS configuration
aws:
  region: "<aws-region>"                     # e.g. us-west-2
  accountId: "<12-digit-account-id>"         # e.g. 123456789012
  profile: "default"                         # AWS CLI profile (local dev only)

# Domain and networking
# `domain` is the ingress hostname, provisioned by YOU (Route53, CloudFront, etc.).
# The platform never creates it — it only uses it for ingress host rules and URLs.
# It must be known before `task install`, because Keycloak realm URLs, the OIDC issuer
# and every ingress host are derived from it.
domain: "<your-domain>"                      # e.g. idp.example.com

# No registered domain? Reserve a free CloudFront hostname before installing:
#
#   domain=$(scripts/cloudfront-reserve-domain.sh)   # ~1s, no VPC or ALB needed
#   # put that value in `domain` below, and set insecure: true
#   task install
#   scripts/cloudfront-attach-origin.sh              # after install, points CF at the ALB
#
# See docs/platform/cloudfront-exposure.md.

# TLS / exposure:
#   insecure: false (default) — ALB serves HTTPS; uses an ACM cert (auto-discovered
#             by host, or set certificateArn). You bring the domain + cert.
#   insecure: true            — ALB serves plain HTTP; YOU terminate TLS upstream
#             (e.g. CloudFront in front of the ALB). No cert managed by the platform.
#             Also makes the platform ALB `internal`, named <clusterName>-platform.
insecure: false
certificateArn: ""                           # optional ACM ARN for the HTTPS listener (insecure=false)
resourcePrefix: "<prefix>"                   # Used for KRO tenant-facing resources only
# Multi-hub fleet scoping (opt-in, kind-kro-ack). When true, hub:seed stamps
# fleet_scope_by_prefix="true" on <hub>/config, and the hub discovers only
# clusters/<resourcePrefix>/*.json and fleet/members/<resourcePrefix>/*/values.yaml.
# Default false: the flat clusters/*.json + fleet/members/*/values.yaml layout.
# A value set by hand on <hub>/config is kept across re-seeds.
fleetScopeByPrefix: false
ingressName: ""                              # Defaults to {clusterName}-ingress if empty
ingressSecurityGroups: ""

# Platform-wide AWS tags applied to every AWS resource the platform creates:
#   - hub resources (EKS cluster, VPC, NAT, EIP) via CDK Tags.of(stack).add() in
#     platform-engineering-on-eks (Layer 1);
#   - spoke resources (EKS cluster, VPC, NAT, EIP) via the kro EksclusterWithVpc
#     `awsTags` schema field (Layer 2/3), stamped through the hub cluster-secret
#     `platform_tags` annotation.
# Primary use: SpringClean retention (auto-delete=no) so cost/janitor sweepers do
# not reap long-lived workshop infrastructure; also cost-allocation / compliance.
# Values must be strings. Empty/omitted -> no extra tags are applied, and
# `task install` (kind-kro-ack) prints a warning. For a long-lived install in an
# account that runs a cleanup sweeper, set its retention tag here BEFORE installing,
# e.g. auto-delete: "no" (adding tags later needs a re-run of `task install`).
# The same map takes any other AWS tag (e.g. owner, cost-center); every key is
# propagated to the hub, the spokes and their VPCs.
platformTags:
  auto-delete: "no"
  # owner: "<your-team>"
  # cost-center: "<your-cost-center>"

# AWS Identity Center (required for EKS ArgoCD Capability)
identityCenter:
  instanceArn: "<identity-center-instance-arn>"
  region: "<identity-center-region>"         # Often us-east-1
  adminGroupId: "<admin-group-id>"

# EKS ArgoCD Capability
argocdCapability:
  name: "argocd"

# Console admin role name (used by Backstage templates and added as cluster admin if specified)
adminRoleName: "<console-role-name>"       # e.g. WSParticipantRole

# ML model S3 bucket (created by Taskfile if enabled)
modelS3Bucket:
  enabled: false
