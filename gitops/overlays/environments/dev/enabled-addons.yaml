enabledAddons:
  # Core
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  external_secrets: true
  external_dns: true
  # cert-manager is required by the AWS Load Balancer Controller webhook serving
  # certificate (enableCertManager: true) and by kubevela's admission webhook, both
  # enabled above. prod already lists it; workshop spokes also get it from
  # overlays/tenants/workshop, so this is a no-op there and only fixes dev spokes
  # of any other tenant.
  cert_manager: true
  # Security
  kyverno: true
  kyverno_policies: true
  kyverno_policy_reporter: true
  # Observability
  kube_state_metrics: true
  prometheus_node_exporter: true
  aws_for_fluentbit: true
  kubevela: true
  argo_rollouts: true
  # Platform
  platform_manifests_bootstrap: true
  crossplane: true
  kro_manifests: true
