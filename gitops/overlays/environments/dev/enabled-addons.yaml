enabledAddons:
  # Core
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  external_secrets: true
  external_dns: true
  # Security
  kyverno: true
  kyverno_policies: true
  kyverno_policy_reporter: true
  # Observability
  kube_state_metrics: true
  prometheus_node_exporter: true
  aws_for_fluentbit: true
  kubevela: true
  argo_rollouts: true
  # Platform
  platform_manifests_bootstrap: true
  crossplane: true
  kro_manifests: true
  # Agent Platform (OAP) -- enable the agentic layer on this spoke so agent
  # workloads run here: agent runtime ComponentDefinitions (mcp-server / agent /
  # agentcore-memory), Bifrost (model gateway), Agent Gateway, and the ADOT
  # (otel_collector) that ships traces to the SINGLE hub Langfuse. These keys
  # make the spoke fleet-secret emit enable_agent_platform / enable_bifrost /
  # enable_agent_gateway / enable_oam_components / enable_otel_collector, which
  # the hub-resident OAP agent-platform-addons appsets (useSelectors) select on
  # to deploy onto this spoke.
  # NOT set here (hub-only): langfuse (the single trace backend lives on the
  # hub) and aiops_agent (the read-only platform agent stays on the hub).
  agent_platform: true
  bifrost: true
  agent_gateway: true
  oam_components: true
  otel_collector: true
