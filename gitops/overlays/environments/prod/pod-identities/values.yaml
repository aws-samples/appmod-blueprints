# Spoke prod Pod Identity bootstrap.
#
# The hub's Crossplane provisions ONLY the foundational provider identities
# that have a genuine chicken-and-egg on the spoke:
#   - provider-aws-iam : needed before any IAM Role can be created
#   - provider-aws-eks : needed before any PodIdentityAssociation can be created
#   - external-secrets : foundational; reads Secrets Manager before Crossplane
#
# Everything else self-provisions its own IAM Role + PodIdentityAssociation
# via its own chart (crossplane-base for ec2/amp/grafana providers; workload
# charts like bifrost and agentcore for their own identities), reconciled by
# these credentialed iam/eks providers. Do not add per-workload identities
# here — that path is reserved for the bootstrap providers only.
identities:
  # eso is intentionally NOT set here: on kro-ack clusters the ESO pod identity
  # is owned by the EksCluster RGD (created at cluster-creation time, wave -1).
  # Enabling it here would make a second ACK/Crossplane CR target the same
  # (namespace, serviceAccount) and 409-conflict on the association.
  # Bootstrap the spoke's Crossplane iam/eks providers from the hub (see chart
  # values.yaml). Without these, the spoke's createIdentity:false providers have
  # no credentials and all spoke Crossplane providers fail (IMDS fallback).
  crossplane-iam-provider:
    enabled: true
  crossplane-eks-provider:
    enabled: true
  # Argo Rollouts needs AMP query permissions to run the metrics analysis gate
  # (Phase 30.5 — Metrics Driven Decisions). The SA annotation sets the role ARN
  # to <clusterName>-argo-rollouts; this entry creates that role + PIA via ACK.
  argo-rollouts:
    enabled: true
