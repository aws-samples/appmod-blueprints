# Enabled addons map for the control-plane (hub) environment.
# All addon keys use underscores matching the enable_<addon> label convention.
# All values are boolean. Every known addon is listed explicitly.
enabledAddons:
  # Core
  argocd: false
  metrics_server: true
  ingress_class_alb: true
  aws_load_balancer_controller: true
  default_storage_class: true
  cert_manager: true
  external_secrets: true
  external_dns: true
  aws_efs_csi_driver: false
  image_prepuller: true
  # GitOps
  argo_events: true
  argo_rollouts: true
  argo_workflows: true
  kargo: true
  flux: false
  # Security
  keycloak: true
  kyverno: false
  kyverno_policies: false
  kyverno_policy_reporter: false
  # Observability
  grafana: false
  grafana_operator: true
  grafana_dashboards: true
  kube_state_metrics: true
  prometheus_node_exporter: true
  opentelemetry_operator: false
  # OTel Collector (chart lives in the OAP repo; the enable_otel_collector label
  # emitted here is consumed by the OAP `observability` appset). Enables the
  # Agent -> collector -> Langfuse trace pipeline out of the box. GitOps-native
  # default so fresh deployments capture agent traces even if an older OAP
  # bootstrap.sh (which also stamps this label imperatively) is in play.
  otel_collector: true
  # Langfuse (OAP chart): trace backend the OTel collector exports to
  # (endpoint https://<ingress>/api/public/otel). enable_langfuse label is
  # consumed by the OAP `observability` appset. Enabled alongside otel_collector
  # so a fresh deploy has a working Agent -> collector -> Langfuse pipeline
  # instead of a Degraded collector with no backend.
  langfuse: true
  cw_prometheus: false
  aws_for_fluentbit: false
  cni_metrics_helper: false
  # Platform
  crossplane: true
  kro: false
  kro_manifests: false
  kro_manifests_hub: true
  multi_acct: true
  platform_manifests_bootstrap: true
  platform_manifests: true
  backstage: true
  kubevela: true
  devlake: true
  # PEEKS read-only platform-engineering agent (OAP Strands agent + skills-mcp +
  # eks-read-mcp + chat-ui + AgentCore memory + incident bridge). Requires KubeVela +
  # OAP agent-platform-addons on the hub. Default ON in this unified integration branch
  # (config-unique 2b + #926); flip to false in the fleet-config overlay to disable
  # per-deployment (overlays/environments/control-plane/enabled-addons.yaml).
  peeks_agent: true
  gitlab: false  # GitLab runs on EC2 (docker-compose), not EKS
  # ACK controllers
  ack_iam: false
  ack_eks: false
  ack_ec2: false
  ack_ecr: false
  ack_s3: false
  ack_dynamodb: false
  ack_efs: false
  # ML/AI
  jupyterhub: true
  kubeflow: false
  mlflow: false
  ray_operator: true
  spark_operator: true
  airflow: false
  # AWS Resources (Crossplane-managed VPC secrets etc.)
  aws_resources: true
  # Observability AWS (AMP + AMG via Crossplane)
  observability_aws: true
  # Agent Platform (OAP) — GitOps enablement of the open-agentic-platform layer.
  # These keys make the hub fleet-secret ExternalSecret emit
  # enable_agent_platform / enable_bifrost / enable_agent_gateway /
  # enable_oam_components on the hub cluster secret, which the OAP
  # `agent-platform-addons` appsets (useSelectors) select on to deploy the agent
  # ComponentDefinitions (mcp-server / agent / agentcore-memory), bifrost,
  # agent-gateway and OAM components. This REPLACES the imperative `kubectl label`
  # in the CDK SETUP_SCRIPT: the hub is a GitOps-managed member of this
  # control-plane overlay and its fleet-secret ExternalSecret is ESO-owned
  # (creationPolicy Owner) — a live label is reconciled away within ~1 min, so
  # enablement MUST be declared here. Required by peeks_agent: true (the agent
  # references these ComponentDefinitions).
  agent_platform: true
  bifrost: true
  agent_gateway: true
  oam_components: true
