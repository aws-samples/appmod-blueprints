images:
  - public.ecr.aws/seb-demo/ray:2.49.0-py311-gpu
  - jupyter/base-notebook:latest
  - jupyter/datascience-notebook:latest
  - artilleryio/artillery:latest

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

tolerations:
  - key: 'CriticalAddonsOnly'
    operator: 'Exists'
    effect: 'NoSchedule'

# nodeSelector intentionally unset: the chart defaults it to
# global.generalPurposeNodepool, which the registry routes from the
# enable_general_purpose_nodepool flag (general-purpose | platform-general).
