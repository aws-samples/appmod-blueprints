devlake:
  mysql:
    useExternal: true
    externalServer: "devlake-mysql-service"
    externalPort: "3306"
  option:
    database: mysql
    connectionSecretName: "devlake-mysql-auth"
    autoCreateSecret: false
  lake:
    envs:
      # DevLake refuses to serve when it detects pending DB migration scripts,
      # returning HTTP 428 ("New migration scripts detected...") until a manual
      # confirmation is sent to /proceed-db-migration. On a fresh workshop deploy
      # nothing performs that confirmation (the dora-provisioner GET is unreliable
      # and can leave the schema half-migrated), so the entire DORA data path
      # (trigger-devlake / project + blueprint creation) is blocked out of the box.
      # FORCE_MIGRATION lets the lake apply pending migrations automatically at
      # boot, so DevLake comes up ready to serve on a clean deploy.
      FORCE_MIGRATION: "true"
    image:
      tag: v1.0.3-beta7
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    encryptionSecret:
      secretName: devlake-encryption-secret
      autoCreateSecret: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 1010
      runAsGroup: 1010
      fsGroup: 1010
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  alpine:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  ui:
    image:
      tag: v1.0.3-beta7
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
    containerSecurityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault
  service:
    type: ClusterIP
  ingress:
    enabled: false
