jupyterhub:
  hub:
    config:
      JupyterHub:
        authenticator_class: generic-oauth
      GenericOAuthenticator:
        client_id: jupyterhub
        username_claim: preferred_username
        auth_state_groups_key: groups
        manage_groups: true
        allow_all: true
        scope:
          - openid
          - profile
          - email
          - groups
        auto_login: true
    extraEnv:
      OAUTH_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: keycloak-clients
            key: JUPYTERHUB_CLIENT_SECRET
    pdb:
      enabled: true
      minAvailable: 1

  proxy:
    service:
      type: ClusterIP

  # The platform ships its own Ingress for JupyterHub (templates/ingress.yaml:
  # ALB, ingressClassName: platform, named "jupyterhub"). Leaving the upstream
  # chart's ingress enabled here renders a SECOND Ingress named "jupyterhub" in
  # the same namespace, so ArgoCD reports
  #   RepeatedResourceWarning: Ingress/jupyterhub/jupyterhub appeared 2 times
  # and the application never syncs. Keep the upstream ingress disabled; the
  # custom nginx annotations below are also wrong for this platform (it uses ALB,
  # not nginx) and are intentionally dropped.
  ingress:
    enabled: false

  singleuser:
    defaultUrl: '/lab'
    image:
      name: jupyter/datascience-notebook
      tag: 'latest'
    cpu:
      limit: 2
      guarantee: 0.1
    memory:
      limit: 2G
      guarantee: 512M
    storage:
      capacity: 10Gi
      dynamic:
        storageClass: gp3

  scheduling:
    userScheduler:
      enabled: false

  prePuller:
    hook:
      enabled: false
    continuous:
      enabled: false
