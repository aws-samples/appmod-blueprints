# Machine learning and AI addons
# Wave ordering: 5 (all ML/AI tools)

jupyterhub:
  namespace: jupyterhub
  path: '{{.metadata.annotations.addonsRepoBasepath}}addons/charts/jupyterhub'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '5'
  selector:
    matchExpressions:
      - key: enable_jupyterhub
        operator: In
        values: ['true']
  valuesObject:
    global:
      ingress_domain_name: '{{.metadata.annotations.ingress_domain_name}}'
      insecure: '{{default "false" .metadata.annotations.insecure}}'
      clusterName: '{{.metadata.annotations.aws_cluster_name}}'
    # Keycloak endpoints for the GenericOAuthenticator (client 'jupyterhub' is seeded
    # in the platform realm by the keycloak-config job). Without authorize_url the hub
    # redirects /hub/oauth_login to an empty URL and loops on itself, never reaching
    # Keycloak. The URLs are built from the same ingress_domain_name annotation as the
    # other SSO apps (argocd, kargo), so they work for a custom domain and for
    # CloudFront alike. The callback is pinned to https: in insecure (CloudFront) mode
    # the ALB forwards plain HTTP, so the hub would otherwise derive an http:// callback
    # that does not match the redirect URI registered in Keycloak.
    jupyterhub:
      hub:
        config:
          GenericOAuthenticator:
            oauth_callback_url: https://{{.metadata.annotations.ingress_domain_name}}/jupyterhub/hub/oauth_callback
            authorize_url: https://{{.metadata.annotations.ingress_domain_name}}/keycloak/realms/platform/protocol/openid-connect/auth
            token_url: https://{{.metadata.annotations.ingress_domain_name}}/keycloak/realms/platform/protocol/openid-connect/token
            userdata_url: https://{{.metadata.annotations.ingress_domain_name}}/keycloak/realms/platform/protocol/openid-connect/userinfo
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/generation
        - /metadata/managedFields
      jqPathExpressions:
        - '.spec.data[]?.remoteRef.nullBytePolicy'
        - '.spec.dataFrom[]?.extract.nullBytePolicy'
    - group: ''
      kind: Secret
      jsonPointers:
        - /metadata/managedFields
    - group: ''
      kind: Secret
      name: hub
      # z2jh generates these values via Helm 'lookup'; ArgoCD's repo-server
      # cannot lookup, so the rendered values differ from live on every sync.
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
        - /spec/template/metadata/annotations/checksum~1config-map
        - /spec/template/metadata/annotations/checksum~1auth-token
        - /spec/template/metadata/annotations/checksum~1proxy-secret

