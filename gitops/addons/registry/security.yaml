# Security and policy addons
# Wave ordering: 3 (kyverno) → 4 (policies/reporter) → 6 (keycloak, needs Ingress/LBC)

# Keep ArgoCD's GitLab repository / repo-creds secrets in sync with the canonical
# peeks-hub/secrets.git_token PAT (fixes stale-PAT #7). Hub-only (ArgoCD runs on
# the control-plane) and sourced from the GitHub defaults path so it does not need
# the very GitLab credentials it provisions.
argocd-gitlab-repo-creds:
  namespace: argocd
  path: '{{.metadata.annotations.addonsRepoBasepath}}addons/charts/argocd-gitlab-repo-creds'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  selector:
    matchExpressions:
      - key: environment
        operator: In
        values: ['control-plane']
  valuesObject:
    namespace: argocd
    aws_cluster_name: '{{.metadata.annotations.aws_cluster_name}}'
    gitlab_domain_name: '{{ or (index .metadata.annotations "gitlab_domain_name") .metadata.annotations.ingress_domain_name }}'
    git_username: '{{ default "user1" (index .metadata.annotations "git_username") }}'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/generation
        - /metadata/managedFields
        - /metadata/resourceVersion

keycloak:
  namespace: keycloak
  path: '{{.metadata.annotations.addonsRepoBasepath}}addons/charts/keycloak'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '6'
  selector:
    matchExpressions:
      - key: enable_keycloak
        operator: In
        values: ['true']
  valuesObject:
    global:
      ingress_domain_name: '{{.metadata.annotations.ingress_domain_name}}'
      gitlab_domain_name: '{{ or (index .metadata.annotations "gitlab_domain_name") .metadata.annotations.ingress_domain_name }}'
      insecure: '{{default "false" .metadata.annotations.insecure}}'
    aws:
      region: '{{.metadata.annotations.aws_region}}'
      cluster_name: '{{.metadata.annotations.aws_cluster_name}}'
      grafana_url: '{{index .metadata.annotations "aws_grafana_url" | default (printf "%s/grafana" .metadata.annotations.ingress_domain_name)}}'
  ignoreDifferences:
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
        - /metadata/generation
        - /metadata/managedFields
        - /metadata/resourceVersion
      jqPathExpressions:
        - '.spec.data[]?.remoteRef.nullBytePolicy'
        - '.spec.dataFrom[]?.extract.nullBytePolicy'
    - group: ''
      kind: Secret
      jsonPointers:
        - /metadata/managedFields
        - /metadata/resourceVersion
        - /data
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /metadata/managedFields
        - /metadata/generation
        - /status
        - /spec/replicas
        - /spec/template/metadata/annotations
    - group: ''
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /metadata/managedFields

kyverno:
  namespace: kyverno
  chartName: kyverno
  releaseName: kyverno
  chartRepository: https://kyverno.github.io/kyverno
  defaultVersion: '3.8.0'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '3'
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
  syncPolicy:
    automated:
      selfHeal: false
      allowEmpty: true
      prune: false
    retry:
      limit: -1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  selector:
    matchExpressions:
      - key: enable_kyverno
        operator: In
        values: ['true']
  valuesObject:
    environment: '{{.metadata.labels.environment}}'

kyverno-policies:
  namespace: kyverno
  chartName: kyverno-policies
  releaseName: kyverno-policies
  chartRepository: https://kyverno.github.io/kyverno
  defaultVersion: '3.8.0'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '4'
  selector:
    matchExpressions:
      - key: enable_kyverno_policies
        operator: In
        values: ['true']
  ignoreDifferences:
    - group: kyverno.io
      kind: ClusterPolicy
      jqPathExpressions:
        - .spec.rules | .. | .allowExistingViolations?

kyverno-policy-reporter:
  namespace: kyverno
  chartName: policy-reporter
  releaseName: kyverno-policy-reporter
  chartRepository: https://kyverno.github.io/policy-reporter
  defaultVersion: '3.7.4'
  annotationsAppSet:
    argocd.argoproj.io/sync-wave: '4'
  selector:
    matchExpressions:
      - key: enable_kyverno_policy_reporter
        operator: In
        values: ['true']
