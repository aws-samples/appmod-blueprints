apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: devlake-k8s-local
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.namespace | default "devlake" }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: {{ .Values.namespace | default "devlake" }}
      auth:
        serviceAccount:
          name: devlake-eso-reader
          namespace: {{ .Values.namespace | default "devlake" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devlake-mysql-auth
  namespace: {{ .Values.namespace | default "devlake" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: devlake-mysql-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        MYSQL_USER: "merico"
        MYSQL_DATABASE: "lake"
        MYSQL_ROOT_PASSWORD: "{{ `{{ .root_password }}` }}"
        MYSQL_PASSWORD: "{{ `{{ .merico_password }}` }}"
        DB_URL: "mysql://merico:{{ `{{ .merico_password }}` }}@devlake-mysql-service:3306/lake?charset=utf8mb4&parseTime=True"
        EXTERNAL_URL: "{{ `{{ .host }}` }}"
  data:
  # root password + endpoint: sourced from the in-cluster credentials secret
  - secretKey: root_password
    sourceRef:
      storeRef:
        name: devlake-k8s-local
        kind: ClusterSecretStore
    remoteRef:
      key: devlake-mysql-credentials
      property: password
  - secretKey: host
    sourceRef:
      storeRef:
        name: devlake-k8s-local
        kind: ClusterSecretStore
    remoteRef:
      key: devlake-mysql-credentials
      property: host
  - secretKey: merico_password
    remoteRef:
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
      key: {{ .Values.clusterName }}/secrets
      property: devlake_mysql_password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: devlake-mysql-endpoint-push
  namespace: {{ .Values.namespace | default "devlake" }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 30s
  secretStoreRefs:
  - name: aws-secrets-manager
    kind: ClusterSecretStore
  selector:
    secret:
      name: devlake-mysql-auth
  data:
  - conversionStrategy: None
    match:
      secretKey: EXTERNAL_URL
      remoteRef:
        remoteKey: {{ .Values.clusterName }}/devlake-mysql-connection
        property: db_url
  - conversionStrategy: None
    match:
      secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        remoteKey: {{ .Values.clusterName }}/devlake-mysql-connection
        property: root_password


