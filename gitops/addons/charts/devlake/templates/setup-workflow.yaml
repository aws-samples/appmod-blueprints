---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devlake-mysql-setup-sa
  namespace: {{ .Values.namespace | default "devlake" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
---
# The workflow steps only connect to MySQL and read creds from injected env vars;
# they make no Kubernetes API calls. The only permission the pod SA needs is the
# Argo emissary executor requirement to report task results.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: devlake-mysql-setup-executor
  namespace: {{ .Values.namespace | default "devlake" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
rules:
- apiGroups: ["argoproj.io"]
  resources: ["workflowtaskresults"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devlake-mysql-setup-access-binding
  namespace: {{ .Values.namespace | default "devlake" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
subjects:
- kind: ServiceAccount
  name: devlake-mysql-setup-sa
  namespace: {{ .Values.namespace | default "devlake" }}
roleRef:
  kind: Role
  name: devlake-mysql-setup-executor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: mysql-setup-workflow
  namespace: {{ .Values.namespace | default "devlake" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  serviceAccountName: devlake-mysql-setup-sa
  entrypoint: mysql-setup
  # NOTE: no ttlStrategy. This Workflow is a sync-wave -1 resource tracked by
  # ArgoCD; if the workflow-controller TTL-deletes it after completion, ArgoCD
  # reports it as Missing/OutOfSync and re-applies it in a loop. Keeping it
  # persisted (Succeeded) lets ArgoCD see it Healthy/Synced.
  templates:
  - name: mysql-setup
    dag:
      tasks:
      - name: wait-for-mysql
        template: wait-for-mysql
      - name: create-users
        template: create-users
        dependencies: [wait-for-mysql]

  - name: wait-for-mysql
    # Tolerate slow Aurora readiness + ExternalName/DNS propagation of devlake-mysql-service.
    retryStrategy:
      limit: 80
      retryPolicy: "Always"
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "300s"
    container:
      image: mysql:8
      command: ["/bin/bash", "-c"]
      args:
      - |
        # devlake-mysql-auth is populated by the ExternalSecret once RDS is up; the
        # secretKeyRef is optional so this pod always starts, and we retry until the
        # secret is present AND MySQL is reachable.
        if [ -z "${MYSQL_ROOT_PASSWORD}" ]; then
          echo "devlake-mysql-auth not populated yet, will retry..."
          exit 1
        fi

        echo "Waiting for MySQL to be fully initialized..."
        sleep 60

        if mysql -h devlake-mysql-service -P 3306 -u root -p${MYSQL_ROOT_PASSWORD} -e "SELECT 1"; then
          echo "MySQL is ready!"
          exit 0
        else
          echo "MySQL not ready yet, will retry..."
          exit 1
        fi
      env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: devlake-mysql-auth
            key: MYSQL_ROOT_PASSWORD
            optional: true

  - name: create-users
    container:
      image: mysql:8
      command: ["/bin/bash", "-c"]
      args:
      - |
        echo "Creating lake database..."
        mysql -h devlake-mysql-service -P 3306 -u root -p${MYSQL_ROOT_PASSWORD} -e "
        CREATE DATABASE IF NOT EXISTS lake;
        "
        
        echo "Creating devlake user..."
        mysql -h devlake-mysql-service -P 3306 -u root -p${MYSQL_ROOT_PASSWORD} -e "
        CREATE USER IF NOT EXISTS 'merico' IDENTIFIED BY '${MERICO_PASSWORD}';
        GRANT ALL PRIVILEGES ON lake.* TO 'merico';
        FLUSH PRIVILEGES;
        "
      
        echo "Creating Grafana user..."
        mysql -h devlake-mysql-service -P 3306 -u root -p${MYSQL_ROOT_PASSWORD} -e "
        CREATE USER IF NOT EXISTS 'grafanaReader' IDENTIFIED BY '${GRAFANA_PASSWORD}';
        GRANT SELECT ON lake.* TO 'grafanaReader';
        FLUSH PRIVILEGES;
        "
        echo "User creation completed."
      env:
      - name: MYSQL_ROOT_PASSWORD
        valueFrom:
          secretKeyRef:
            name: devlake-mysql-auth
            key: MYSQL_ROOT_PASSWORD
      - name: MERICO_PASSWORD
        valueFrom:
          secretKeyRef:
            name: devlake-mysql-auth
            key: MYSQL_PASSWORD
      - name: GRAFANA_PASSWORD
        valueFrom:
          secretKeyRef:
            name: mysql-passwords
            key: GRAFANA_MYSQL_PASSWORD
