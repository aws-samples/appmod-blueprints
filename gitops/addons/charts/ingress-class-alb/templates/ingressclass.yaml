{{- if eq (default "auto" .Values.controllerMode) "oss" }}
apiVersion: elbv2.k8s.aws/v1beta1
{{- else }}
apiVersion: eks.amazonaws.com/v1
{{- end }}
kind: IngressClassParams
metadata:
  name: platform
spec:
  group:
    name: platform
  scheme: {{ .Values.scheme | default "internet-facing" }}
{{- /*
  Optional group-wide source-IP allowlist for the shared "platform" ALB, rendered into
  IngressClassParams.spec.inboundCIDRs (group-level form of the inbound-cidrs annotation:
  applied once to the shared managed SG, so identical for every ingress of the group, and
  it overrides any per-ingress annotation). Supported by elbv2.k8s.aws/v1beta1 (OSS LBC)
  and eks.amazonaws.com/v1 (EKS Auto Mode). Two CONCATENATED keys, so a deployment keeps a
  stable base and appends ad-hoc entries without touching the base:
    inboundCidrs       - base allowlist
    extraInboundCidrs  - extra entries appended after the base
  Each accepts a YAML list OR a comma-separated string. All empty/unset => field omitted
  => ALB open (unchanged behaviour). IPv4/IPv6 may be mixed (the LBC splits them).
  When set, include the NAT gateway EIP(s) of the hub VPC and of every spoke running OAP
  addons (<nat-eip>/32): in-cluster apps reach the public Keycloak issuer through this ALB,
  so SSO times out without them. The EIP changes when the VPC is recreated (reinstall).
  See docs/platform/alb-ip-allowlist.md, pitfall 1.
  Do not set on an internal ALB fronted by a CloudFront VPC origin: the ALB then sees
  private origin ENI IPs, not client IPs.
*/}}
{{- $raw := list }}
{{- range $v := list .Values.inboundCidrs .Values.extraInboundCidrs }}
{{- if kindIs "string" $v }}
{{- $raw = concat $raw (splitList "," $v) }}
{{- else if $v }}
{{- $raw = concat $raw $v }}
{{- end }}
{{- end }}
{{- $cidrs := list }}
{{- range $raw }}
{{- $t := . | toString | trim }}
{{- if $t }}
{{- $cidrs = append $cidrs $t }}
{{- end }}
{{- end }}
{{- with $cidrs }}
  inboundCIDRs:
{{- range . }}
    - {{ . | quote }}
{{- end }}
{{- end }}
{{- if .Values.loadBalancerName }}
  loadBalancerName: {{ .Values.loadBalancerName | quote }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: platform
spec:
{{- if eq (default "auto" .Values.controllerMode) "oss" }}
  controller: ingress.k8s.aws/alb
  parameters:
    apiGroup: elbv2.k8s.aws
{{- else }}
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
{{- end }}
    kind: IngressClassParams
    name: platform
