{{- /* insecure: HTTP-only ingress, no cert. Explicit .Values.insecure wins;
       falls back to the legacy exposure_mode == "cloudfront" during transition. */ -}}
{{- $insecure := or .Values.insecure (eq (default "domain" .Values.exposure_mode) "cloudfront") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argo-workflows
  namespace: argo
  annotations:
    alb.ingress.kubernetes.io/target-type: ip
{{- if $insecure }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
{{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
{{- end }}
    alb.ingress.kubernetes.io/transforms.argo-server: |
      [{"type":"url-rewrite","urlRewriteConfig":{"rewrites":[{"regex":"^\\/argo-workflows\\/?(.*)$","replace":"/$1"}]}}]
spec:
  ingressClassName: platform
  rules:
{{- if $insecure }}
    - http:
{{- else }}
    - host: {{ .Values.ingress_domain_name }}
      http:
{{- end }}
        paths:
          - path: /argo-workflows
            pathType: Prefix
            backend:
              service:
                name: argo-server
                port:
                  name: web
