# peeks-agent addon — workshop-generic values.
# Images default to the public workshop registry (public.ecr.aws/seb-demo), pinned by
# tag; override imageRegistry/imageTag per-cluster in the fleet-config overlay
# (overlays/clusters/<cluster>/peeks-agent/values.yaml) to point at your own registry.
imageRegistry: "public.ecr.aws/seb-demo"
imageTag: "v1"

# Per-component image overrides (optional). Empty string => inherit imageRegistry/imageTag
# above. This lets you pin a SINGLE component to a different registry and/or tag without
# moving all images — e.g. publish only the corrected incident-bridge under a new tag on
# the public demo registry and pin just that component:
#   images:
#     incidentBridge:
#       tag: "v1.1"          # registry inherits imageRegistry (public.ecr.aws/seb-demo)
# Component keys: skillsMcp, agent (strands-agent), eksMcp, gitlabMcp, chatUi, incidentBridge.
images:
  skillsMcp:      { registry: "", tag: "v3" }
  agent:          { registry: "", tag: "v1.8" }   # strands-agent — v1.8 = configurable max_tokens (default 4096, was hard-coded 1000 → truncated long answers); v1.7 = also drop a2a.utils.* helper spans (append_artifact_to_task noise); v1.6 = Langfuse tags via langfuse.trace.tags (v1.5 = session.id + source:{rca,chat} tags & drop noisy a2a event-queue spans, v1.4 = OTEL context isolation for pooled MCP conns, v1.3 = MCP pool rebuild on token recycle, v1.2 = contextId sanitize)
  eksMcp:         { registry: "", tag: "" }   # eks-read-mcp
  gitlabMcp:      { registry: "", tag: "" }
  chatUi:         { registry: "", tag: "v1.4" }   # v1.4 = fleet-level default suggestion prompts (v1.3 = copy buttons + scrollable suggestions + auto-grow, v1.2 = markdown/suggestions overhaul)
  incidentBridge: { registry: "", tag: "v1.4" }   # v1.4 = ISO-8601 UTC timestamp log prefix (v1.3 = _subject dedup component-only) (v1.2 = deterministic open-MR dup-check, v1.1 = contextId sanitize)

# Per-deployment values — NOT hardcoded: injected from cluster-secret annotations by the
# registry entry (the fleet-secret/ESO stamps resource_prefix, aws_account_id, aws_region,
# ingress_domain_name, gitlab_domain_name). The literals below are only fallback defaults for
# a standalone `helm template`; a real deploy overrides every one from the cluster annotations.
accountId: ""                 # aws_account_id       (per-account, injected)
clusterPrefix: "peeks"        # resource_prefix      (platform default "peeks"; injected per env, e.g. a different prefix)
region: "us-west-2"           # aws_region           (platform default; injected/overridable per env)
cloudfrontDomain: ""          # ingress_domain_name  (chat-ui ingress host, injected)
gitlabDomain: ""              # gitlab_domain_name   (gitlab-mcp GITLAB_API_URL host, injected)
# Project (path or numeric id) the agent opens remediation MRs on — the overlay/
# fleet-config repo. When set, the incident-bridge does a deterministic, restart-
# proof duplicate check (skip forwarding if an OPEN MR already addresses the failing
# component). Leave "" to disable the check (bridge still forwards; fail-open).
gitlabMrProject: ""

# NOTE: no ampWorkspaceId. The AMP incident path (AlertManagerDefinition + SNS/SQS) is
# provisioned by the AmpIncident kro RGD (ampincident.kro.run — shipped via kro-manifests /
# kro-peeks-agent-rgd-hub), which reads the workspace id LIVE from the Crossplane AMP
# Workspace CR via externalRef — no literal id, no cluster-secret stamp. The AmpIncident
# INSTANCE is the `amp-incident` component in files/peeks-agent-app.yaml; its workspaceName
# defaults to "<clusterPrefix>-amp" — edit that component if your AMP Workspace CR differs.
