# peeks-agent addon — workshop-generic values.
# Images default to the public workshop registry (public.ecr.aws/seb-demo), pinned by
# tag; override imageRegistry/imageTag per-cluster in the fleet-config overlay
# (overlays/clusters/<cluster>/peeks-agent/values.yaml) to point at your own registry.
imageRegistry: "public.ecr.aws/seb-demo"
imageTag: "v1"

# Per-deployment values — injected from cluster-secret annotations by the registry entry.
accountId: ""                 # aws_account_id
clusterPrefix: "peeks"        # resource_prefix
cloudfrontDomain: ""          # ingress_domain_name (chat-ui ingress host)
gitlabDomain: ""              # gitlab_domain_name (gitlab-mcp GITLAB_API_URL host)

# NOTE: no ampWorkspaceId. The AMP incident path (AlertManagerDefinition + SNS/SQS) is
# provisioned by the AmpIncident kro RGD (ampincident.kro.run — shipped via kro-manifests /
# kro-peeks-agent-rgd-hub), which reads the workspace id LIVE from the Crossplane AMP
# Workspace CR via externalRef — no literal id, no cluster-secret stamp. The AmpIncident
# INSTANCE is the `amp-incident` component in files/peeks-agent-app.yaml; its workspaceName
# defaults to "<clusterPrefix>-amp" — edit that component if your AMP Workspace CR differs.
