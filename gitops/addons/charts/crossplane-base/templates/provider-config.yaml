{{- if .Values.providerConfig.enabled }}
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: {{ .Values.providerConfig.name | default "default" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    source: PodIdentity
{{- end }}
{{- range $name, $provider := .Values.providers }}
{{- if and $provider.version $provider.serviceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $provider.serviceAccount }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ $name }}-drc
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          serviceAccountName: {{ $provider.serviceAccount }}
          containers:
          - name: package-runtime
            # Tune reconcile concurrency to avoid IAM/EKS API throttling during the initial
            # bootstrap burst. IAM is a global, low-limit, token-bucket-rate-limited service;
            # the provider default --max-reconcile-rate=100 fires far too many concurrent
            # CreateRole/AttachRolePolicy calls, causing throttled/timed-out Create calls that
            # Crossplane records as a stuck 'crossplane.io/external-create-pending' annotation
            # (it then refuses to retry, to avoid duplicate creation). Lowering the rate spreads
            # the writes out. Override per-provider via providers.<name>.maxReconcileRate.
            args:
              - --max-reconcile-rate={{ $provider.maxReconcileRate | default ($.Values.providerDefaults).maxReconcileRate | default 6 }}
            # Resources and Go GC settings: providerResources in values.yaml (measurements
            # and rationale there), overridden key by key by providers.<name>.resources.
            # hasKey (not `| default`) so an explicit "" is honoured: for goMemLimit/goGC
            # it means "do not set the env var".
            {{- $r := dict "cpuRequest" "250m" "memoryRequest" "320Mi" "memoryLimit" "512Mi" "goGC" "50" }}
            {{- range $k, $v := ($.Values.providerResources | default dict) }}{{ $_ := set $r $k $v }}{{ end }}
            {{- range $k, $v := ($provider.resources | default dict) }}{{ $_ := set $r $k $v }}{{ end }}
            {{- /* GOMEMLIMIT defaults to 90% of the memory limit (Go GC guide: 5-10% headroom
                   for non-Go memory), so it can never drift away from the limit it protects. */}}
            {{- if not (hasKey $r "goMemLimit") }}
            {{-   $lim := toString $r.memoryLimit }}
            {{-   $mib := 0 }}
            {{-   if hasSuffix "Gi" $lim }}{{ $mib = mul (atoi (trimSuffix "Gi" $lim)) 1024 }}
            {{-   else if hasSuffix "Mi" $lim }}{{ $mib = atoi (trimSuffix "Mi" $lim) }}
            {{-   else }}{{ fail (printf "crossplane-base: memoryLimit %q for %s must end in Mi or Gi (or set goMemLimit explicitly)" $lim $name) }}
            {{-   end }}
            {{-   $_ := set $r "goMemLimit" (printf "%dMiB" (div (mul $mib 9) 10)) }}
            {{- end }}
            {{- if or $r.goMemLimit $r.goGC }}
            env:
              {{- if $r.goMemLimit }}
              - name: GOMEMLIMIT
                value: {{ $r.goMemLimit | quote }}
              {{- end }}
              {{- if $r.goGC }}
              - name: GOGC
                value: {{ $r.goGC | quote }}
              {{- end }}
            {{- end }}
            resources:
              requests:
                cpu: {{ $r.cpuRequest }}
                memory: {{ $r.memoryRequest }}
              limits:
                memory: {{ $r.memoryLimit }}
{{- end }}
{{- end }}
