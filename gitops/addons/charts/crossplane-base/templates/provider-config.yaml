{{- if .Values.providerConfig.enabled }}
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: {{ .Values.providerConfig.name | default "default" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    source: PodIdentity
{{- end }}
{{- range $name, $provider := .Values.providers }}
{{- if and $provider.version $provider.serviceAccount }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $provider.serviceAccount }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: {{ $name }}-drc
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-1"
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          serviceAccountName: {{ $provider.serviceAccount }}
          containers:
          - name: package-runtime
            # Tune reconcile concurrency to avoid IAM/EKS API throttling during the initial
            # bootstrap burst. IAM is a global, low-limit, token-bucket-rate-limited service;
            # the provider default --max-reconcile-rate=100 fires far too many concurrent
            # CreateRole/AttachRolePolicy calls, causing throttled/timed-out Create calls that
            # Crossplane records as a stuck 'crossplane.io/external-create-pending' annotation
            # (it then refuses to retry, to avoid duplicate creation). Lowering the rate spreads
            # the writes out. Override per-provider via providers.<name>.maxReconcileRate.
            args:
              - --max-reconcile-rate={{ $provider.maxReconcileRate | default ($.Values.providerDefaults).maxReconcileRate | default 6 }}
            # Pod resources come from providerResources in values.yaml, which documents how
            # the defaults were measured. The limit was previously hardcoded at 2Gi with no
            # override, so a consumer could lower the request but never the cap.
            #
            # GOMEMLIMIT makes the memory limit enforceable BY THE GO RUNTIME instead of only
            # by the kernel. These providers are Go programs, and without GOMEMLIMIT the Go
            # GC has no knowledge of the cgroup limit at all: it paces the heap purely off
            # GOGC (default 100, so the heap grows to roughly twice the live heap before a
            # collection) and a pod that crosses the limit is OOMKilled rather than collected.
            # With it set just under the limit, approaching the ceiling triggers GC instead,
            # so the failure mode degrades from "killed" to "spends more CPU on GC".
            #
            # Resolved with hasKey, not `| default`, so the three cases stay distinct:
            #   key absent       -> the default below (a nil providerResources must NOT get a
            #                       lowered limit with the runtime unaware of it)
            #   key set to ""    -> deliberately disabled (pre-change behaviour)
            #   key set to a size-> that value
            {{- $pr := $.Values.providerResources | default dict }}
            {{- $goMemLimit := "460MiB" }}
            {{- if hasKey $pr "goMemLimit" }}
            {{-   $goMemLimit = $pr.goMemLimit }}
            {{- end }}
            {{- if $goMemLimit }}
            env:
              - name: GOMEMLIMIT
                value: {{ $goMemLimit | quote }}
            {{- end }}
            resources:
              requests:
                cpu: {{ ($.Values.providerResources).cpuRequest | default "250m" }}
                memory: {{ ($.Values.providerResources).memoryRequest | default "384Mi" }}
              limits:
                memory: {{ ($.Values.providerResources).memoryLimit | default "512Mi" }}
{{- end }}
{{- end }}
