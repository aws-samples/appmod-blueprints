{{- range $name, $provider := .Values.providers }}
{{- if and $provider.version $provider.serviceAccount $provider.roleName (not (eq (toString $provider.createIdentity) "false")) }}
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: Role
metadata:
  name: {{ $name }}-provider-role
  annotations:
    crossplane.io/external-name: {{ $.Values.aws.clusterName }}-{{ $provider.roleName }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "4"
  labels:
    platform.gitops.io/role: {{ $name }}-provider
spec:
  forProvider:
    assumeRolePolicy: |
      {
        "Version": "2012-10-17",
        "Statement": [{
          "Effect": "Allow",
          "Principal": {"Service": "pods.eks.amazonaws.com"},
          "Action": ["sts:AssumeRole", "sts:TagSession"]
        }]
      }
    tags:
      managed-by: crossplane
      purpose: {{ $name }}-provider
  providerConfigRef:
    name: default
{{- end }}
{{- end }}
{{- range $name, $provider := .Values.providers }}
{{- if and $provider.version $provider.serviceAccount $provider.roleName (not (eq (toString $provider.createIdentity) "false")) }}
{{- if not $provider.policyArns }}
{{- fail (printf "crossplane-base: providers.%s has createIdentity but no policyArns (the role would get no permissions)" $name) }}
{{- end }}
{{- /* One attachment per scoped managed policy (values.yaml policyArns), not
       AdministratorAccess. Named after the policy, not its list index, so reordering the list
       does not rename (and, with prune: false, orphan) an attachment. Upgrade: the addon syncs
       with prune: false, so on a live cluster the old <name>-provider-admin-attachment stays (and
       keeps AdministratorAccess attached) until it is deleted by hand; deleting it makes
       provider-aws-iam detach the policy. */}}
{{- range $arn := $provider.policyArns }}
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicyAttachment
metadata:
  name: {{ $name }}-provider-{{ base $arn | lower | replace "_" "-" }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  forProvider:
    policyArn: {{ $arn | quote }}
    roleRef:
      name: {{ $name }}-provider-role
  providerConfigRef:
    name: default
{{- end }}
{{- if $provider.inlineStatements }}
---
apiVersion: iam.aws.upbound.io/v1beta1
kind: RolePolicy
metadata:
  name: {{ $name }}-provider-inline
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  forProvider:
    policy: {{ tpl (dict "Version" "2012-10-17" "Statement" $provider.inlineStatements | toJson) $ | quote }}
    roleRef:
      name: {{ $name }}-provider-role
  providerConfigRef:
    name: default
{{- end }}
{{- end }}
{{- end }}
{{- range $name, $provider := .Values.providers }}
{{- if and $provider.version $provider.serviceAccount $provider.roleName (not (eq (toString $provider.createIdentity) "false")) }}
---
apiVersion: eks.aws.upbound.io/v1beta1
kind: PodIdentityAssociation
metadata:
  name: {{ $name }}-provider-pod-identity
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "5"
spec:
  forProvider:
    clusterName: {{ $.Values.aws.clusterName }}
    namespace: {{ $.Values.namespace }}
    serviceAccount: {{ $provider.serviceAccount }}
    roleArnSelector:
      matchLabels:
        platform.gitops.io/role: {{ $name }}-provider
    region: {{ $.Values.aws.region }}
  providerConfigRef:
    name: default
{{- end }}
{{- end }}
