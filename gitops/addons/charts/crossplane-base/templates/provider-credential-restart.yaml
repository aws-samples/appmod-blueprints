{{- /*
  Provider Pod Identity credential bootstrap (#2).

  EKS Pod Identity injects credentials into a pod's environment via a webhook at
  pod CREATION time only. The Crossplane AWS provider pods (provider-aws-dynamodb,
  -rds, -ec2, ...) are started by the package manager at wave 3, but their
  PodIdentityAssociations (iam.yaml, same chart) only become active a bit later.
  A provider pod that started before its PIA was active runs credential-less
  ("cannot retrieve the AWS credentials: no EC2 IMDS role found") and every
  managed resource it owns (e.g. a DynamoDB Table) stays Synced=False forever.

  The hub fixes this with `task hub:restart-identity-pods`, but spokes are pure
  GitOps with no Taskfile run against them. This PostSync hook is the spoke-side
  equivalent: it deletes any provider pod that is missing the injected
  AWS_CONTAINER_CREDENTIALS_FULL_URI env var so the Deployment recreates it and
  the webhook injects the (now active) credentials.

  NOTE: the shared pod-identity-restart-hook cannot be reused here — it does
  `kubectl rollout restart deployment -l <label>`, but the Crossplane provider
  *Deployments* carry no labels (only the pods have pkg.crossplane.io/provider),
  so a deployment label selector matches nothing. This hook selects pods.
*/}}
{{- if .Values.providerCredentialRestart | default true }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-provider-credential-check-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-provider-credential-check-role
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-provider-credential-check-binding
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-provider-credential-check-role
subjects:
  - kind: ServiceAccount
    name: crossplane-provider-credential-check-sa
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: crossplane-provider-credential-check
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 120
  template:
    spec:
      serviceAccountName: crossplane-provider-credential-check-sa
      restartPolicy: Never
      containers:
        - name: check
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              NS="{{ .Release.Namespace }}"
              LABEL="pkg.crossplane.io/provider"
              # Wait up to ~5min for every provider pod to carry injected pod
              # identity creds, deleting credential-less pods so they respawn
              # after their PIA is active.
              for i in $(seq 1 20); do
                PENDING=0
                for POD in $(kubectl get pods -n "$NS" -l "$LABEL" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
                  if kubectl get pod "$POD" -n "$NS" -o jsonpath='{.spec.containers[*].env[*].name}' 2>/dev/null | grep -q AWS_CONTAINER_CREDENTIALS_FULL_URI; then
                    continue
                  fi
                  echo "[$i] $POD missing pod-identity creds -> deleting"
                  kubectl delete pod "$POD" -n "$NS" --wait=false 2>/dev/null || true
                  PENDING=1
                done
                [ "$PENDING" = "0" ] && echo "All provider pods have pod-identity creds" && exit 0
                sleep 15
              done
              echo "Timed out waiting for provider pod identity creds (non-fatal)"
              exit 0
{{- end }}
