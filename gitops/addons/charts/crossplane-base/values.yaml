aws:
  region: ""
  clusterName: ""
  accountId: ""

# Name of the hub/control-plane cluster. The argocd-namespace secret-writer RBAC
# (in provider-kubernetes.yaml) is only rendered when aws.clusterName == hubClusterName,
# because spoke clusters have no "argocd" namespace and would fail to sync.
hubClusterName: hub

providerConfig:
  enabled: true
  name: default

# All functions disabled by default. Set version to enable.
functions:
  patchAndTransform:
    version: ""
  environmentConfigs:
    version: ""
  celFilter:
    version: ""

# All providers disabled by default. Set version to enable.
# Each enabled provider (except family) gets its own SA, DRC, IAM role, and pod identity.
# Set createIdentity: false to skip IAM role + pod identity creation (for bootstrap-managed providers).
providers:
  family:
    version: ""
  iam:
    version: ""
    serviceAccount: provider-aws-iam
    roleName: CrossplaneIAMProviderRole
    createIdentity: true
  ec2:
    version: ""
    serviceAccount: provider-aws-ec2
    roleName: CrossplaneEC2ProviderRole
    createIdentity: true
  eks:
    version: ""
    serviceAccount: provider-aws-eks
    roleName: CrossplaneEKSProviderRole
    createIdentity: true
  s3:
    version: ""
    serviceAccount: provider-aws-s3
    roleName: CrossplaneS3ProviderRole
    createIdentity: true
  dynamodb:
    version: ""
    serviceAccount: provider-aws-dynamodb
    roleName: CrossplaneDynamoDBProviderRole
    createIdentity: true
  rds:
    version: ""
    serviceAccount: provider-aws-rds
    roleName: CrossplaneRDSProviderRole
    createIdentity: true
  secretsmanager:
    version: ""
    serviceAccount: provider-aws-secretsmanager
    roleName: CrossplaneSecretsManagerProviderRole
    createIdentity: true
  amp:
    version: ""
    serviceAccount: provider-aws-amp
    roleName: CrossplaneAMPProviderRole
    createIdentity: true
  grafana:
    version: ""
    serviceAccount: provider-aws-grafana
    roleName: CrossplaneGrafanaProviderRole
    createIdentity: true
  kubernetes:
    version: ""
    serviceAccount: provider-kubernetes
    createIdentity: false

namespace: crossplane-system

# Default reconcile tuning applied to every provider's DeploymentRuntimeConfig.
# Lower maxReconcileRate reduces concurrent AWS API calls during the initial bootstrap
# burst, avoiding IAM/EKS throttling that leaves resources stuck in
# 'crossplane.io/external-create-pending'. The Upbound provider default is 100 (very
# aggressive for global, rate-limited IAM). Override per-provider with
# providers.<name>.maxReconcileRate.
providerDefaults:
  maxReconcileRate: 6

# Per-provider pod resources, applied to every provider's DeploymentRuntimeConfig.
#
# Sized from measurement, not guesswork. Observed steady-state memory on a hub running
# ten providers (`kubectl top pods -n crossplane-system`):
#
#   provider-aws-ec2                384Mi   <- high-water mark
#   provider-aws-amp                344Mi
#   provider-aws-iam                317Mi
#   provider-aws-rds                311Mi
#   provider-aws-eks                310Mi
#   provider-aws-grafana            306Mi
#   upbound-provider-family-aws     293Mi
#   provider-aws-dynamodb           289Mi
#   provider-kubernetes             153Mi   <- small schema, same runtime
#
# The previous defaults requested 1Gi each and capped at 2Gi, so nine providers reserved
# 9Gi to use ~2.6Gi: over-requested ~3.4x, leaving ~6.4Gi of a nodepool held and idle.
# 512Mi keeps ~33% headroom over the observed high-water mark and halves the reservation.
#
# Why these providers are not ~100Mi: Upjet providers do not exec the Terraform CLI. They
# embed the Terraform provider plugin and load its resource schema into memory, plus
# controller-runtime informer caches for every CRD they own. The AWS schema size is the
# cost, which is why the monolithic provider was split into family providers.
# provider-kubernetes is the control: same Go runtime, tiny schema, 153Mi.
#
# Do not lower memoryRequest to the observed figure. Informer caches grow with the number
# of managed resources, so a cluster managing many resources needs the headroom. Raise
# these if providers are OOMKilled or evicted under memory pressure.
providerResources:
  cpuRequest: 250m
  memoryRequest: 512Mi
  memoryLimit: 1Gi

# PostSync hook that restarts credential-less Crossplane provider pods so they
# pick up their EKS Pod Identity token once the PIA is active (spoke-side
# equivalent of `task hub:restart-identity-pods`). Set false to disable.
providerCredentialRestart: true
