aws:
  region: ""
  clusterName: ""
  accountId: ""

# Name of the hub/control-plane cluster. The argocd-namespace secret-writer RBAC
# (in provider-kubernetes.yaml) is only rendered when aws.clusterName == hubClusterName,
# because spoke clusters have no "argocd" namespace and would fail to sync.
hubClusterName: hub

providerConfig:
  enabled: true
  name: default

# All functions disabled by default. Set version to enable.
functions:
  patchAndTransform:
    version: ""
  environmentConfigs:
    version: ""
  celFilter:
    version: ""

# All providers disabled by default. Set version to enable.
# Each enabled provider (except family) gets its own SA, DRC, IAM role, and pod identity.
# Set createIdentity: false to skip IAM role + pod identity creation (for bootstrap-managed providers).
#
# policyArns: the managed policies attached to the provider's role (templates/iam.yaml), one
# RolePolicyAttachment each. Scoped to the AWS service the provider manages, not
# AdministratorAccess. A provider with createIdentity and no policyArns fails the render.
# Every AWS managed ARN listed here must also be in the attach allowlist of
# cluster-providers/common/iam/crossplane-provider-policy.json (Sid
# DenyAttachAwsManagedPolicyOutsideAllowlist): provider-aws-iam, which makes these
# attachments, is denied any other AWS managed policy. A test keeps the two in step.
# inlineStatements: optional IAM statements for an inline policy on the provider role (a
# RolePolicy), for what no allowlisted AWS managed policy gives. Keep them narrowly scoped, with
# no IAM write beyond a service's own service-linked role (grafana, see below) and no
# cluster-admin action (amp creates its scraper's EKS access entry, see below).
# iam and eks default to createIdentity: false: a provider cannot create the credentials it
# runs with, so their role comes from outside this addon's GitOps sync. kind-kro-ack: the
# cluster provider's <cluster>-crossplane-provider role. kind-crossplane: the bootstrap render
# of this chart from kind (cluster-providers/kind-crossplane/Taskfile.yaml crossplane:claims),
# which sets createIdentity and policyArns for them explicitly.
providers:
  family:
    version: ""
  iam:
    version: ""
    serviceAccount: provider-aws-iam
    roleName: CrossplaneIAMProviderRole
    createIdentity: false
  ec2:
    version: ""
    serviceAccount: provider-aws-ec2
    roleName: CrossplaneEC2ProviderRole
    createIdentity: true
    policyArns:
      - arn:aws:iam::aws:policy/AmazonEC2FullAccess
    # ec2 holds the most (live heap ~203MB, ~5k goroutines, highest fragmentation), so it
    # gets more room than the default. Any key of providerResources can be set here.
    resources:
      memoryRequest: 384Mi
      memoryLimit: 640Mi
  eks:
    version: ""
    serviceAccount: provider-aws-eks
    roleName: CrossplaneEKSProviderRole
    createIdentity: false
  s3:
    version: ""
    serviceAccount: provider-aws-s3
    roleName: CrossplaneS3ProviderRole
    createIdentity: true
    policyArns:
      - arn:aws:iam::aws:policy/AmazonS3FullAccess
  dynamodb:
    version: ""
    serviceAccount: provider-aws-dynamodb
    roleName: CrossplaneDynamoDBProviderRole
    createIdentity: true
    policyArns:
      - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess_v2
  rds:
    version: ""
    serviceAccount: provider-aws-rds
    roleName: CrossplaneRDSProviderRole
    createIdentity: true
    policyArns:
      - arn:aws:iam::aws:policy/AmazonRDSFullAccess
  secretsmanager:
    version: ""
    serviceAccount: provider-aws-secretsmanager
    roleName: CrossplaneSecretsManagerProviderRole
    createIdentity: true
    policyArns:
      - arn:aws:iam::aws:policy/SecretsManagerReadWrite
  amp:
    version: ""
    serviceAccount: provider-aws-amp
    roleName: CrossplaneAMPProviderRole
    createIdentity: true
    policyArns:
      - arn:aws:iam::aws:policy/AmazonPrometheusFullAccess
    # AMP CreateScraper creates an EKS access entry for the scraper with the CALLER's rights.
    # AmazonPrometheusFullAccess has no eks:CreateAccessEntry, so every Scraper (hub and spokes)
    # fails with 403 "not authorized to perform: eks:CreateAccessEntry on resource:
    # .../cluster/<name>". CloudTrail shows the call made as this role (invokedBy
    # aps.amazonaws.com) with principalArn
    # role/aws-service-role/scraper.aps.amazonaws.com/AWSServiceRoleForAmazonPrometheusScraper_<id>.
    # The grant is limited by eks:principalArn to that exact service-linked-role shape: the
    # /aws-service-role/scraper.aps.amazonaws.com/ path and a role name starting with
    # AWSServiceRoleFor (reserved for service-linked roles), with no further "/" (StringLike's *
    # also matches "/", so the StringNotLike stops a deeper path from posing as the name). It
    # applies to any cluster of this account and region: the hub name is set by the consumer
    # (hub.clusterName) and need not share a prefix with the spokes. CreateAccessEntry is further
    # bounded by Null on eks:kubernetesGroups and eks:username: the live calls send neither, so the
    # role may only create an entry with no custom groups and no username (eks:accessEntryType is
    # left unbounded; the live calls send no type either, but it is not pinned here).
    # CreateScraper then needs eks:AssociateAccessPolicy (observed live after the create succeeded):
    # it attaches AmazonPrometheusScraperPolicy at cluster scope to the scraper's own entry. That
    # one association is allowed, bounded to that policy (eks:policyArn), that scope
    # (eks:accessScope cluster) and the scraper entries only; no other policy or scope can be
    # associated, and no other principal's entry can be touched. Describe/Delete of those entries
    # follow, for the scraper delete path.
    # Condition keys verified against the EKS service authorization reference (eks:principalArn,
    # eks:kubernetesGroups, eks:username on access-entry requests; eks:policyArn, eks:accessScope
    # on associate requests). An empty aws.accountId or aws.region renders ARNs that match nothing
    # (fails closed).
    # Rendered with tpl: {{ }} below is resolved by the chart, not by Helm values.
    inlineStatements:
      - Effect: Allow
        Action: eks:CreateAccessEntry
        Resource: 'arn:aws:eks:{{ .Values.aws.region }}:{{ .Values.aws.accountId }}:cluster/*'
        Condition:
          StringLike:
            eks:principalArn: 'arn:aws:iam::{{ .Values.aws.accountId }}:role/aws-service-role/scraper.aps.amazonaws.com/AWSServiceRoleForAmazonPrometheusScraper_*'
          StringNotLike:
            eks:principalArn: 'arn:aws:iam::{{ .Values.aws.accountId }}:role/aws-service-role/scraper.aps.amazonaws.com/AWSServiceRoleForAmazonPrometheusScraper_*/*'
          "Null":
            eks:kubernetesGroups: "true"
            eks:username: "true"
      - Effect: Allow
        Action: eks:AssociateAccessPolicy
        Resource: 'arn:aws:eks:{{ .Values.aws.region }}:{{ .Values.aws.accountId }}:access-entry/*/role/{{ .Values.aws.accountId }}/AWSServiceRoleForAmazonPrometheusScraper_*/*'
        Condition:
          StringEquals:
            eks:policyArn: 'arn:aws:eks::aws:cluster-access-policy/AmazonPrometheusScraperPolicy'
            eks:accessScope: 'cluster'
      - Effect: Allow
        Action:
          - eks:DescribeAccessEntry
          - eks:DeleteAccessEntry
        Resource: 'arn:aws:eks:{{ .Values.aws.region }}:{{ .Values.aws.accountId }}:access-entry/*/role/{{ .Values.aws.accountId }}/AWSServiceRoleForAmazonPrometheusScraper_*/*'
  grafana:
    version: ""
    serviceAccount: provider-aws-grafana
    roleName: CrossplaneGrafanaProviderRole
    createIdentity: true
    policyArns:
      - arn:aws:iam::aws:policy/AWSGrafanaAccountAdministrator
    # AWSGrafanaAccountAdministrator has no ec2:*, so CreateWorkspace with a VPC fails 403
    # "Access denied when fetching EC2 subnet details" (ec2:DescribeSubnets refused).
    # Proven by CloudTrail (UnauthorizedOperation, caller grafana.amazonaws.com): DescribeSubnets,
    # DescribeDhcpOptions. The others are read-only and unproven (the create fails before them):
    # DescribeSecurityGroups, DescribeVpcs, DescribeVpcAttribute, DescribeNetworkInterfaces,
    # DescribeAvailabilityZones.
    # CreateWorkspace with a VPC also creates the Grafana service-linked role with the caller's
    # rights: 403 "You do not have permissions to create a service-linked role" without
    # iam:CreateServiceLinkedRole. Limited to Grafana's own service-linked role path and
    # service name. The role carries only the permissions Grafana defines, and no other iam:*
    # action is granted.
    inlineStatements:
      - Effect: Allow
        Action:
          - ec2:DescribeSubnets
          - ec2:DescribeDhcpOptions
          - ec2:DescribeSecurityGroups
          - ec2:DescribeVpcs
          - ec2:DescribeVpcAttribute
          - ec2:DescribeNetworkInterfaces
          - ec2:DescribeAvailabilityZones
        Resource: "*"
      - Effect: Allow
        Action: iam:CreateServiceLinkedRole
        Resource: arn:aws:iam::*:role/aws-service-role/grafana.amazonaws.com/*
        Condition:
          StringEquals:
            iam:AWSServiceName: grafana.amazonaws.com
  kubernetes:
    version: ""
    serviceAccount: provider-kubernetes
    createIdentity: false

namespace: crossplane-system

# Default reconcile tuning applied to every provider's DeploymentRuntimeConfig.
# Lower maxReconcileRate reduces concurrent AWS API calls during the initial bootstrap
# burst, avoiding IAM/EKS throttling that leaves resources stuck in
# 'crossplane.io/external-create-pending'. The Upbound provider default is 100 (very
# aggressive for global, rate-limited IAM). Override per-provider with
# providers.<name>.maxReconcileRate.
providerDefaults:
  maxReconcileRate: 6

# Provider pod resources and Go GC settings, applied to every provider's
# DeploymentRuntimeConfig. Override any key per provider via providers.<name>.resources.
#
# What the memory is (measured, bedrockagentcore v2.5.3 run locally against kind with the
# hub's 790 CRDs, GODEBUG=gctrace=1): building the in-process Terraform AWS provider holds
# ~140MB briefly and keeps ~66MB; starting the controllers takes live heap to 150-190MB.
# It does not depend on managed-resource count or the number of CRDs, so it is a fixed cost
# per provider. On the clusters, every aws provider's live heap is 174-203MB.
#
# Why the old pods were large and some were OOMKilled: Go does not know the cgroup limit.
# Without GOMEMLIMIT it lets the heap grow to 2x live (GOGC=100) whatever the limit is.
# Locally, the same binary at a 280Mi limit was OOMKilled without GOMEMLIMIT and ran with it.
#
#   goGC 50          heap goal 1.5x live instead of 2x. Roughly halved steady memory in the
#                    tests; GC uses 0.06-0.5% CPU on the clusters, so the extra GC is cheap.
#   goMemLimit       defaults to 90% of memoryLimit (Go GC guide: 5-10% headroom for
#                    non-Go memory). Makes the runtime collect near the limit instead of
#                    being killed. "" disables.
#   memoryLimit 512Mi  OOM safety. Startup peaks at ~190MB live; 256Mi was OOMKilled even with
#                    GOMEMLIMIT, 288Mi was the smallest that survived. On Auto Mode the limit
#                    costs nothing; only the request reserves capacity.
#   memoryRequest 320Mi  expected steady usage with GOGC=50 (to be confirmed on a cluster).
#
# Raise these if a provider is OOMKilled or its usage stays above its request.
providerResources:
  cpuRequest: 250m
  memoryRequest: 320Mi
  memoryLimit: 512Mi
  goGC: "50"

# PostSync hook that restarts credential-less Crossplane provider pods so they
# pick up their EKS Pod Identity token once the PIA is active (spoke-side
# equivalent of `task hub:restart-identity-pods`). Set false to disable.
providerCredentialRestart: true
