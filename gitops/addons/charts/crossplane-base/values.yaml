aws:
  region: ""
  clusterName: ""
  accountId: ""

# Name of the hub/control-plane cluster. The argocd-namespace secret-writer RBAC
# (in provider-kubernetes.yaml) is only rendered when aws.clusterName == hubClusterName,
# because spoke clusters have no "argocd" namespace and would fail to sync.
hubClusterName: hub

providerConfig:
  enabled: true
  name: default

# All functions disabled by default. Set version to enable.
functions:
  patchAndTransform:
    version: ""
  environmentConfigs:
    version: ""
  celFilter:
    version: ""

# All providers disabled by default. Set version to enable.
# Each enabled provider (except family) gets its own SA, DRC, IAM role, and pod identity.
# Set createIdentity: false to skip IAM role + pod identity creation (for bootstrap-managed providers).
providers:
  family:
    version: ""
  iam:
    version: ""
    serviceAccount: provider-aws-iam
    roleName: CrossplaneIAMProviderRole
    createIdentity: true
  ec2:
    version: ""
    serviceAccount: provider-aws-ec2
    roleName: CrossplaneEC2ProviderRole
    createIdentity: true
    # ec2 holds the most (live heap ~203MB, ~5k goroutines, highest fragmentation), so it
    # gets more room than the default. Any key of providerResources can be set here.
    resources:
      memoryRequest: 384Mi
      memoryLimit: 640Mi
  eks:
    version: ""
    serviceAccount: provider-aws-eks
    roleName: CrossplaneEKSProviderRole
    createIdentity: true
  s3:
    version: ""
    serviceAccount: provider-aws-s3
    roleName: CrossplaneS3ProviderRole
    createIdentity: true
  dynamodb:
    version: ""
    serviceAccount: provider-aws-dynamodb
    roleName: CrossplaneDynamoDBProviderRole
    createIdentity: true
  rds:
    version: ""
    serviceAccount: provider-aws-rds
    roleName: CrossplaneRDSProviderRole
    createIdentity: true
  secretsmanager:
    version: ""
    serviceAccount: provider-aws-secretsmanager
    roleName: CrossplaneSecretsManagerProviderRole
    createIdentity: true
  amp:
    version: ""
    serviceAccount: provider-aws-amp
    roleName: CrossplaneAMPProviderRole
    createIdentity: true
  grafana:
    version: ""
    serviceAccount: provider-aws-grafana
    roleName: CrossplaneGrafanaProviderRole
    createIdentity: true
  kubernetes:
    version: ""
    serviceAccount: provider-kubernetes
    createIdentity: false

namespace: crossplane-system

# Default reconcile tuning applied to every provider's DeploymentRuntimeConfig.
# Lower maxReconcileRate reduces concurrent AWS API calls during the initial bootstrap
# burst, avoiding IAM/EKS throttling that leaves resources stuck in
# 'crossplane.io/external-create-pending'. The Upbound provider default is 100 (very
# aggressive for global, rate-limited IAM). Override per-provider with
# providers.<name>.maxReconcileRate.
providerDefaults:
  maxReconcileRate: 6

# Provider pod resources and Go GC settings, applied to every provider's
# DeploymentRuntimeConfig. Override any key per provider via providers.<name>.resources.
#
# What the memory is (measured, bedrockagentcore v2.5.3 run locally against kind with the
# hub's 790 CRDs, GODEBUG=gctrace=1): building the in-process Terraform AWS provider holds
# ~140MB briefly and keeps ~66MB; starting the controllers takes live heap to 150-190MB.
# It does not depend on managed-resource count or the number of CRDs, so it is a fixed cost
# per provider. On the clusters, every aws provider's live heap is 174-203MB.
#
# Why the old pods were large and some were OOMKilled: Go does not know the cgroup limit.
# Without GOMEMLIMIT it lets the heap grow to 2x live (GOGC=100) whatever the limit is.
# Locally, the same binary at a 280Mi limit was OOMKilled without GOMEMLIMIT and ran with it.
#
#   goGC 50          heap goal 1.5x live instead of 2x. Roughly halved steady memory in the
#                    tests; GC uses 0.06-0.5% CPU on the clusters, so the extra GC is cheap.
#   goMemLimit       defaults to 90% of memoryLimit (Go GC guide: 5-10% headroom for
#                    non-Go memory). Makes the runtime collect near the limit instead of
#                    being killed. "" disables.
#   memoryLimit 512Mi  OOM safety. Startup peaks at ~190MB live; 256Mi was OOMKilled even with
#                    GOMEMLIMIT, 288Mi was the smallest that survived. On Auto Mode the limit
#                    costs nothing; only the request reserves capacity.
#   memoryRequest 320Mi  expected steady usage with GOGC=50 (to be confirmed on a cluster).
#
# Raise these if a provider is OOMKilled or its usage stays above its request.
providerResources:
  cpuRequest: 250m
  memoryRequest: 320Mi
  memoryLimit: 512Mi
  goGC: "50"

# PostSync hook that restarts credential-less Crossplane provider pods so they
# pick up their EKS Pod Identity token once the PIA is active (spoke-side
# equivalent of `task hub:restart-identity-pods`). Set false to disable.
providerCredentialRestart: true
