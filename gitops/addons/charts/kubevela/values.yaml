# Ambient, platform-supplied environment config consumed by the OAM definitions in
# templates/. It is NOT developer-facing: a developer's OAM Application must deploy
# unchanged to any region, so the region can never appear in their manifest.
#
# awsRegion is read by templates/traits/aws-service-identity.yaml, which injects it
# as AWS_REGION / AWS_DEFAULT_REGION into the workload (SDKs differ on which they
# read). It is supplied per-cluster by the addon ApplicationSet from the cluster
# secret's aws_region annotation — see the kubevela entry in
# gitops/addons/registry/platform.yaml. Left empty here so a bare `helm template`
# still renders; on a real cluster the registry always sets it.
global:
  awsRegion: ""

vela-core:
  multicluster:
    enabled: false

  # Longer workflow timeouts
  workflow:
    backoff:
      maxTime:
        failedState: 180
    step:
      errorRetryTimes: 15

  
  # High Availability Configuration
  replicaCount: 2
  
  # Pod Disruption Budget
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  
  # Node Selection for System Nodepool
  nodeSelector:
    karpenter.sh/nodepool: system
  
  # Tolerations for system nodes
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule
    - key: system
      operator: Equal
      value: "true"
      effect: NoSchedule
  
  # Topology Spread Constraints
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: vela-core
          app.kubernetes.io/name: vela-core
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/instance: vela-core
          app.kubernetes.io/name: vela-core
  
  # Rolling Update Strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  
  # Resource requests/limits for stability
  resources:
    requests:
      cpu: 50m
      memory: 20Mi
    limits:
      cpu: 500m
      memory: 1Gi
  
  # Priority Class for critical system components
  priorityClassName: system-cluster-critical
