# RBAC for the env-config discovery Job. Applied as normal (non-hook) resources
# at an early sync-wave so they exist before the Job hook runs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Values.namespace | default "crossplane-system" }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: env-config-creator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  # Create/maintain the cluster-scoped EnvironmentConfig.
  - apiGroups: ["apiextensions.crossplane.io"]
    resources: ["environmentconfigs"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Needed for kubectl apply's dry-run/discovery against the CRD.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: env-config-creator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount }}
    namespace: {{ .Values.namespace | default "crossplane-system" }}
roleRef:
  kind: ClusterRole
  name: env-config-creator
  apiGroup: rbac.authorization.k8s.io
