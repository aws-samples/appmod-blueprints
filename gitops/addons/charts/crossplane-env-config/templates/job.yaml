# Self-discovery Job: resolves this cluster's VPC facts from the AWS API and
# applies the 'env-config' EnvironmentConfig. Runs as an ArgoCD Sync hook so it
# re-runs on every sync (keeps the data fresh, and sidesteps Job immutability).
# It retries via backoffLimit while the Pod Identity association becomes active.
apiVersion: batch/v1
kind: Job
metadata:
  name: env-config-publisher
  namespace: {{ .Values.namespace | default "crossplane-system" }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Never (not OnFailure): EKS Pod Identity injects credentials at POD ADMISSION.
  # A pod admitted before the PodIdentityAssociation is active never gets creds,
  # and OnFailure only restarts the container in that same pod. With Never, each
  # backoff retry creates a FRESH pod that receives the credential injection, so
  # the Job self-heals once the association becomes active — no ordering guarantee
  # needed between this addon and the pod-identity addon.
  backoffLimit: 30
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      restartPolicy: Never
      containers:
        - name: env-config-publisher
          image: {{ .Values.image }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              CLUSTER_NAME='{{ .Values.global.clusterName }}'
              REGION='{{ .Values.aws.region }}'
              [ -n "$CLUSTER_NAME" ] || { echo "ERROR: global.clusterName is empty"; exit 1; }
              [ -n "$REGION" ] || { echo "ERROR: aws.region is empty"; exit 1; }

              # Resolve VPC id + cluster security group from EKS. If Pod Identity
              # creds aren't active yet this fails and the Job retries (backoffLimit).
              VPCCFG=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region "$REGION" \
                --query 'cluster.resourcesVpcConfig' --output json)
              VPC_ID=$(echo "$VPCCFG" | jq -r '.vpcId')
              CLUSTER_SG=$(echo "$VPCCFG" | jq -r '.clusterSecurityGroupId // ""')
              [ -n "$VPC_ID" ] && [ "$VPC_ID" != "null" ] || { echo "ERROR: could not resolve vpcId"; exit 1; }

              # Classify subnets by the standard EKS role tags (present on hub and
              # composition-provisioned spokes alike), scoped to this cluster's VPC.
              PRIVATE_IDS=$(aws ec2 describe-subnets --region "$REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:kubernetes.io/role/internal-elb,Values=1" \
                --query 'Subnets[].SubnetId' --output text)
              PUBLIC_IDS=$(aws ec2 describe-subnets --region "$REGION" \
                --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:kubernetes.io/role/elb,Values=1" \
                --query 'Subnets[].SubnetId' --output text)

              # Build the manifest with echo (each line emits exact indentation) to
              # avoid heredoc/YAML block-scalar dedent pitfalls. data.* subnet values
              # are YAML sequences (consumers read them as lists).
              {
                echo 'apiVersion: apiextensions.crossplane.io/v1beta1'
                echo 'kind: EnvironmentConfig'
                echo 'metadata:'
                echo '  name: env-config'
                echo '  labels:'
                echo "    env: ${CLUSTER_NAME}"
                echo 'data:'
                echo "  clusterName: \"${CLUSTER_NAME}\""
                echo "  region: \"${REGION}\""
                echo "  vpcId: \"${VPC_ID}\""
                echo "  clusterSecurityGroupId: \"${CLUSTER_SG}\""
                echo '  privateSubnetIds:'
                for s in ${PRIVATE_IDS}; do echo "    - \"${s}\""; done
                echo '  publicSubnetIds:'
                for s in ${PUBLIC_IDS}; do echo "    - \"${s}\""; done
              } > /tmp/env-config.yaml

              echo "--- rendered env-config ---"
              cat /tmp/env-config.yaml
              kubectl apply -f /tmp/env-config.yaml
              echo "env-config published for cluster ${CLUSTER_NAME}"
