# Bootstrap NodePools. Defaults keep the chart self-contained for `helm template`.
#
# ─────────────────────────────────────────────────────────────────────────────
# enableGeneralPurposeNodePool — GATE for customNodepools.pools below.
#
# Threaded from the cluster-secret annotation `enable_general_purpose_nodepool`
# (via the registry valuesObject). It mirrors the cluster's own
# enableGeneralPurposeNodePool setting:
#   "true"  (default) → the EKS Auto Mode built-in `general-purpose` pool is KEPT
#                        → customNodepools.pools are NOT rendered. The generic
#                          solution is unchanged and relies on the built-in pools.
#   "false"           → the built-in `general-purpose` pool was DROPPED at cluster
#                        creation → customNodepools.pools ARE rendered so an
#                        untainted `general-purpose-peeks` exists from sync-wave -1.
#                        Without this, every add-on (cert-manager, keycloak,
#                        load-balancer-controller, …) is Pending because the only
#                        remaining pools (built-in `system`, gpu, trainium) are all
#                        tainted — the fresh-hub bootstrap deadlock.
#
# Default "true" is the SAFE value: if the annotation is absent, nothing extra is
# rendered and generic-solution behavior is preserved.
enableGeneralPurposeNodePool: "true"
#
# ─────────────────────────────────────────────────────────────────────────────
# customNodepools.pools — custom Karpenter NodePools, rendered at sync-wave -1
# ONLY when the gate above is "false". These are opinionated, workshop-tuned pools
# (a daytime do-not-disrupt budget, a 48h termination grace, `managed-by: peeks`
# labels). Adopters who drop the built-in general-purpose pool but want different
# replacements can retune or empty this list (`customNodepools.pools: []`).
# ─────────────────────────────────────────────────────────────────────────────
customNodepools:
  pools:
    - name: general-purpose-peeks
      spec:
        # Prefer this tuned pool over the built-in general-purpose (weight 0) so
        # unpinned workloads land here and inherit the do-not-disrupt budget instead
        # of the built-in's default consolidation. Adjust to your own precedence.
        weight: 100
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
          budgets:
            # Daytime hours (06:00-20:00): block ALL voluntary disruption.
            # A budget with no schedule is ALWAYS active, so an unscheduled
            # `nodes: "0"` would permanently mask the nightly window below (issue #892).
            - nodes: "0"
              schedule: "0 6 * * *"
              duration: 14h
            # Nightly consolidation window (20:00-22:00): allow up to 30%.
            - nodes: "30%"
              schedule: "0 20 * * *"
              duration: 2h
        template:
          metadata:
            labels:
              node-type: general-purpose
              managed-by: peeks
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]
              - key: "eks.amazonaws.com/instance-size"
                operator: In
                values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]
            terminationGracePeriod: 48h
    - name: system-peeks
      spec:
        # Prefer this tuned system pool over the built-in system (weight 0) for
        # critical add-ons that tolerate the CriticalAddonsOnly taint. Adjust to taste.
        weight: 100
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
          budgets:
            # Daytime hours (06:00-20:00): block ALL voluntary disruption.
            # A budget with no schedule is ALWAYS active, so an unscheduled
            # `nodes: "0"` would permanently mask the nightly window below (issue #892).
            - nodes: "0"
              schedule: "0 6 * * *"
              duration: 14h
            # Nightly consolidation window (20:00-22:00): allow up to 30%.
            - nodes: "30%"
              schedule: "0 20 * * *"
              duration: 2h
        template:
          metadata:
            labels:
              node-type: system
              managed-by: peeks
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]
              - key: "eks.amazonaws.com/instance-size"
                operator: In
                values: ["xlarge", "2xlarge"]
            taints:
              - key: CriticalAddonsOnly
                effect: NoSchedule
            terminationGracePeriod: 48h
gpu:
  enabled: true
