# Bootstrap NodePools. Defaults keep the chart self-contained for `helm template`.
#
# ─────────────────────────────────────────────────────────────────────────────
# enableGeneralPurposeNodePool — GATE for fallbackNodepools.pools below.
# (customNodepools.pools is the consumer list and is ALWAYS rendered — see below.)
#
# Threaded from the cluster-secret annotation `enable_general_purpose_nodepool`
# (via the registry valuesObject). It mirrors the cluster's own
# enableGeneralPurposeNodePool setting:
#   "true"  (default) → the EKS Auto Mode built-in `general-purpose` pool is KEPT
#                        → fallbackNodepools are NOT added. The generic solution is
#                          unchanged and relies on the built-in pools. (The consumer's
#                          customNodepools.pools still render if the overlay sets them.)
#   "false"           → the built-in `general-purpose` pool was DROPPED at cluster
#                        creation → fallbackNodepools are appended to the consumer list
#                        so an untainted `general-purpose-peeks` exists on the app's
#                        first sync. Without it, every add-on (cert-manager, keycloak,
#                        load-balancer-controller, …) is Pending because the only
#                        remaining pools (built-in `system`, gpu, trainium) are all
#                        tainted — the fresh-hub bootstrap deadlock.
#
# Default "true" is the SAFE value: if the annotation is absent, no fallback pools are
# added and generic-solution behavior is preserved.
enableGeneralPurposeNodePool: "true"
#
# ─────────────────────────────────────────────────────────────────────────────
# customNodepools.pools — the CONSUMER's custom Karpenter NodePools. ALWAYS rendered,
# on every cluster, regardless of the gate (exactly as on main). The workshop overlay
# fills this from configs/ so the hub and every spoke get the -peeks pools that add-on
# configs pin to via nodeSelector. The generic solution leaves it empty and relies on
# the EKS Auto Mode built-in system/general-purpose pools.
#   OPT-OUT NOTE: emptying this on a cluster whose add-ons select the -peeks pools
#   leaves those pods Pending — only empty it if nothing pins to them.
# ─────────────────────────────────────────────────────────────────────────────
customNodepools:
  pools: []
#
# ─────────────────────────────────────────────────────────────────────────────
# fallbackNodepools.pools — built-in DEFAULT pools, appended to the consumer list
# ONLY when enableGeneralPurposeNodePool == "false" (the built-in general-purpose pool
# was dropped at cluster creation). Any name the consumer already defines wins, so
# nothing is duplicated. This covers the fresh-hub bootstrap window before the overlay
# is wired. These are opinionated, workshop-tuned pools (a daytime do-not-disrupt
# budget, a 48h termination grace, `managed-by: peeks` labels); retune to taste.
#   OPT-OUT NOTE: emptying this on a "false" cluster brings back the fresh-hub
#   deadlock (no untainted pool at bootstrap) — only empty it if the consumer list
#   already supplies an untainted pool.
# ─────────────────────────────────────────────────────────────────────────────
fallbackNodepools:
  pools:
    - name: general-purpose-peeks
      spec:
        # Prefer this tuned pool over the built-in general-purpose (weight 0) so
        # unpinned workloads land here and inherit the do-not-disrupt budget instead
        # of the built-in's default consolidation. Adjust to your own precedence.
        weight: 100
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
          budgets:
            # Daytime hours (06:00-20:00): block ALL voluntary disruption.
            # A budget with no schedule is ALWAYS active, so an unscheduled
            # `nodes: "0"` would permanently mask the nightly window below (issue #892).
            - nodes: "0"
              schedule: "0 6 * * *"
              duration: 14h
            # Nightly consolidation window (20:00-22:00): allow up to 30%.
            - nodes: "30%"
              schedule: "0 20 * * *"
              duration: 2h
        template:
          metadata:
            labels:
              node-type: general-purpose
              managed-by: peeks
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]
              - key: "eks.amazonaws.com/instance-size"
                operator: In
                values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]
            terminationGracePeriod: 48h
    - name: system-peeks
      spec:
        # Prefer this tuned system pool over the built-in system (weight 0) for
        # critical add-ons that tolerate the CriticalAddonsOnly taint. Adjust to taste.
        weight: 100
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
          budgets:
            # Daytime hours (06:00-20:00): block ALL voluntary disruption.
            # A budget with no schedule is ALWAYS active, so an unscheduled
            # `nodes: "0"` would permanently mask the nightly window below (issue #892).
            - nodes: "0"
              schedule: "0 6 * * *"
              duration: 14h
            # Nightly consolidation window (20:00-22:00): allow up to 30%.
            - nodes: "30%"
              schedule: "0 20 * * *"
              duration: 2h
        template:
          metadata:
            labels:
              node-type: system
              managed-by: peeks
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]
              - key: "eks.amazonaws.com/instance-size"
                operator: In
                values: ["xlarge", "2xlarge"]
            taints:
              - key: CriticalAddonsOnly
                effect: NoSchedule
            terminationGracePeriod: 48h
gpu:
  enabled: true
