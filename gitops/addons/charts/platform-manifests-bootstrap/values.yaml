# Bootstrap NodePools. Defaults keep the chart self-contained for `helm template`.
#
# ─────────────────────────────────────────────────────────────────────────────
# enableGeneralPurposeNodePool — GATE for fallbackNodepools.pools below.
# (customNodepools.pools is the consumer list and is ALWAYS rendered — see below.)
#
# Threaded from the cluster-secret annotation `enable_general_purpose_nodepool`
# (via the registry valuesObject). It mirrors the cluster's own
# enableGeneralPurposeNodePool setting:
#   "true"  (default) → the EKS Auto Mode built-in `general-purpose` pool is KEPT
#                        → fallbackNodepools are NOT added. The generic solution is
#                          unchanged and relies on the built-in pools. (The consumer's
#                          customNodepools.pools still render if the overlay sets them.)
#   "false"           → the built-in `general-purpose` pool was DROPPED at cluster
#                        creation → the neutral `platform-general` fallback pool is
#                        appended to the consumer list so an untainted pool exists on
#                        the app's first sync. Without it, every add-on (cert-manager,
#                        keycloak, load-balancer-controller, …) is Pending because the
#                        only remaining pools (built-in `system`, gpu, trainium) are all
#                        tainted — the fresh-hub bootstrap deadlock.
#
# Default "true" is the SAFE value: if the annotation is absent, no fallback pools are
# added and generic-solution behavior is preserved.
enableGeneralPurposeNodePool: "true"
#
# ─────────────────────────────────────────────────────────────────────────────
# customNodepools.pools — the CONSUMER's custom Karpenter NodePools. ALWAYS rendered,
# on every cluster, regardless of the gate. The workshop overlay
# fills this from configs/ so the hub and every spoke get the -peeks pools that add-on
# configs pin to via nodeSelector. The generic solution leaves it empty and relies on
# the EKS Auto Mode built-in system/general-purpose pools.
#   OPT-OUT NOTE: emptying this on a cluster whose add-ons select the -peeks pools
#   leaves those pods Pending — only empty it if nothing pins to them.
# ─────────────────────────────────────────────────────────────────────────────
customNodepools:
  pools: []
#
# ─────────────────────────────────────────────────────────────────────────────
# fallbackNodepools.pools -- the generic REPLACEMENT pool, appended to the consumer
# list ONLY when enableGeneralPurposeNodePool == "false" (the EKS Auto Mode built-in
# general-purpose pool was dropped at cluster creation). Any name the consumer already
# defines wins, so nothing is duplicated.
#
# ARCHITECTURE RULE: if the platform removes capacity, it provides the replacement.
# This is ONE neutral pool, not consumer tuning: no prefix, a low weight so any
# consumer pool outranks it, standard consolidation (no schedules, no long grace, no
# consumer labels), untainted, on the built-in `default` NodeClass. It only has to keep
# the add-on layer schedulable on a fresh "false" cluster before the consumer overlay
# is wired. Consumers tune their own pools in their overlay (customNodepools.pools) at a
# higher weight -- those simply outrank this fallback, so no name-based skip is needed.
#
# No fallback *system* pool is needed: the built-in `system` pool stays on (it also
# provides the `default` NodeClass this pool references).
#   OPT-OUT NOTE: emptying this on a "false" cluster brings back the fresh-hub deadlock
#   (no untainted pool at bootstrap) -- only empty it if the consumer list already
#   supplies an untainted pool.
#
# NOTE: `platform-general` deliberately avoids the Auto Mode names (system,
# general-purpose, default) so it never collides with a built-in pool/NodeClass.
# ---------------------------------------------------------------------------------
fallbackNodepools:
  # instanceSizeFloor -- the DEFAULT instance-size floor stamped onto each fallback pool
  # so the neutral `platform-general` pool matches the consumer overlay's own floor FROM
  # THE FIRST SYNC, before the overlay is wired. The workshop overlay's
  # general-purpose-peeks pool pins eks.amazonaws.com/instance-size In
  # [xlarge,2xlarge,4xlarge,8xlarge]; because the platform install runs before
  # set-overlay-repo, a "false" hub would otherwise schedule its first add-on pods on an
  # unfloored platform-general (any instance size). This default matches that overlay
  # floor. A fallback pool that already pins instance-size is left untouched.
  instanceSizeFloor:
    - xlarge
    - 2xlarge
    - 4xlarge
    - 8xlarge
  # instanceSizeFloorOverride -- per-cluster override for the floor above, threaded from
  # the cluster-secret annotation `fallback_nodepool_instance_size_floor` via the registry
  # valuesObject -- the SAME path the enableGeneralPurposeNodePool gate takes. It is a
  # SEPARATE key (a comma-separated STRING) so the registry sending it empty (annotation
  # absent) does NOT clobber the default list via deep-merge: empty -> use instanceSizeFloor
  # above; a comma-separated list (e.g. "2xlarge,4xlarge") -> that set; "none" -> disable
  # the floor entirely and let Karpenter pick any size.
  instanceSizeFloorOverride: ""
  pools:
    # NAME COUPLING: this pool name is also referenced by the image-prepuller route
    # in gitops/addons/registry/core.yaml (generalPurposeNodepool -> platform-general
    # when the flag is "false"). If you rename this pool, update that route too, or the
    # prepuller lands on a pool that doesn't exist (the #4 bug this PR fixed).
    - name: platform-general
      spec:
        # Low weight: any consumer-defined pool (customNodepools.pools) outranks this,
        # so the fallback is a floor, not a preference.
        weight: 10
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
        template:
          metadata:
            labels:
              node-type: general-purpose
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]

gpu:
  enabled: true

# warmCapacity (lever #2): optional "overprovisioning" to keep spare node capacity
# warm so the first wave of platform addons does not each wait on a cold Karpenter
# node (~20s on EKS Auto Mode, but serialized across the wave). A low/negative-
# priority pause Deployment reserves capacity; the instant a real workload needs the
# space it preempts the pause pods (near-zero steady cost beyond the warm node), and
# Karpenter provisions a replacement to stay warm. Default OFF (generic solution ships
# no warm pool); consumers enable + size it via their overlay. The pause Deployment
# renders at intra-app sync-wave 1 — AFTER the NodePools (wave 0) — so on a fresh hub
# the warm node can schedule on a freshly-created pool.
warmCapacity:
  enabled: false
  replicas: 1
  priorityClassName: warm-capacity-overprovisioning
  priorityValue: -10
  image: registry.k8s.io/pause:3.9
  # nodeSelector/tolerations target where the warm nodes should be kept (e.g. the
  # pool the first-wave addons run on — system-peeks in the workshop overlay).
  # Empty = scheduler/Karpenter default placement.
  nodeSelector: {}
  tolerations: []
  # Default 1 CPU / 2Gi is a modest reservation; consumers size it to ~one node of
  # their target pool (the workshop overlay bumps it to 2 CPU / 4Gi for system-peeks).
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
