# Bootstrap NodePools. Defaults keep the chart self-contained for `helm template`.
#
# ─────────────────────────────────────────────────────────────────────────────
# customNodepools.pools — custom Karpenter NodePools applied at sync-wave -1
# (before the platform add-ons that need a schedulable node).
#
# WHY THESE SHIP ENABLED BY DEFAULT
# The platform can be deployed with the EKS Auto Mode built-in `general-purpose`
# pool DISABLED (enableGeneralPurposeNodePool="false" — the workshop does this to
# apply its own reconciliation policy). When the built-in general-purpose pool is
# gone, SOMETHING untainted must still exist at bootstrap, otherwise every add-on
# (cert-manager, keycloak, load-balancer-controller, …) is Pending because the only
# remaining pools (built-in `system`, plus `gpu`/`trainium`) are all tainted. The
# replacement pools below are therefore shipped as a DEFAULT so a fresh cluster
# always has an untainted `general-purpose-peeks` pool from wave -1 — not only once
# a GitOps overlay is wired (which happens later and left a bootstrap gap).
#
# FOR USERS OF THE GENERIC SOLUTION (NOT the workshop)
# These are opinionated, workshop-tuned pools (a daytime do-not-disrupt budget, a
# 48h termination grace, `managed-by: peeks` labels). If you keep the built-in
# general-purpose pool (enableGeneralPurposeNodePool="true", the default) you do
# NOT need them — set `customNodepools.pools: []` to ship none, or replace/retune
# the entries below to whatever your environment prefers. They are a convenience
# default, not a requirement of the platform.
# ─────────────────────────────────────────────────────────────────────────────
customNodepools:
  pools:
    - name: general-purpose-peeks
      spec:
        # Prefer this tuned pool over the built-in general-purpose (weight 0) so
        # unpinned workloads land here and inherit the do-not-disrupt budget instead
        # of the built-in's default consolidation. Adjust to your own precedence.
        weight: 100
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
          budgets:
            # Daytime hours (06:00-20:00): block ALL voluntary disruption.
            # A budget with no schedule is ALWAYS active, so an unscheduled
            # `nodes: "0"` would permanently mask the nightly window below (issue #892).
            - nodes: "0"
              schedule: "0 6 * * *"
              duration: 14h
            # Nightly consolidation window (20:00-22:00): allow up to 30%.
            - nodes: "30%"
              schedule: "0 20 * * *"
              duration: 2h
        template:
          metadata:
            labels:
              node-type: general-purpose
              managed-by: peeks
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]
              - key: "eks.amazonaws.com/instance-size"
                operator: In
                values: ["xlarge", "2xlarge", "4xlarge", "8xlarge"]
            terminationGracePeriod: 48h
    - name: system-peeks
      spec:
        # Prefer this tuned system pool over the built-in system (weight 0) for
        # critical add-ons that tolerate the CriticalAddonsOnly taint. Adjust to taste.
        weight: 100
        disruption:
          consolidationPolicy: WhenEmptyOrUnderutilized
          consolidateAfter: 5m
          budgets:
            # Daytime hours (06:00-20:00): block ALL voluntary disruption.
            # A budget with no schedule is ALWAYS active, so an unscheduled
            # `nodes: "0"` would permanently mask the nightly window below (issue #892).
            - nodes: "0"
              schedule: "0 6 * * *"
              duration: 14h
            # Nightly consolidation window (20:00-22:00): allow up to 30%.
            - nodes: "30%"
              schedule: "0 20 * * *"
              duration: 2h
        template:
          metadata:
            labels:
              node-type: system
              managed-by: peeks
          spec:
            nodeClassRef:
              group: eks.amazonaws.com
              kind: NodeClass
              name: default
            requirements:
              - key: "karpenter.sh/capacity-type"
                operator: In
                values: ["on-demand"]
              - key: "kubernetes.io/arch"
                operator: In
                values: ["amd64"]
              - key: "eks.amazonaws.com/instance-category"
                operator: In
                values: ["c", "m", "r"]
              - key: "eks.amazonaws.com/instance-generation"
                operator: Gt
                values: ["5"]
              - key: "eks.amazonaws.com/instance-size"
                operator: In
                values: ["xlarge", "2xlarge"]
            taints:
              - key: CriticalAddonsOnly
                effect: NoSchedule
            terminationGracePeriod: 48h
gpu:
  enabled: true
