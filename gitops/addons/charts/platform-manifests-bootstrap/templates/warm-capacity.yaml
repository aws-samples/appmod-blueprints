{{- /*
Lever #2 (warm capacity): optional overprovisioning to pre-warm Karpenter node
capacity so the first wave of platform addons does not each wait on a cold node
(~20s on EKS Auto Mode, but serialized across the wave). A low/negative-priority
PriorityClass + a pause Deployment reserve
capacity; real workloads preempt the pause pods instantly (near-zero steady cost),
and Karpenter provisions a replacement node to stay warm. Default OFF — consumers
enable and size it via their overlay. The pause Deployment is ordered AFTER the
NodePools (custom-nodepools.yaml) via its own intra-app sync-wave, so the warm
node can actually schedule on a freshly-created pool.
*/ -}}
{{- /* nil-safe: a merge that drops (or partially drops) the chart `warmCapacity` default
       must not nil-pointer or render empty-but-required fields in the whole
       platform-manifests-bootstrap render (which would create ZERO NodePools and take the
       hub down). Bind $wc = caller values merged OVER these in-template defaults, so every
       sub-key (name/value/image/replicas/resources) is always populated even if an overlay
       sets `enabled: true` while the chart default block is gone. The caller wins per-key;
       the defaults only fill what the caller omits — same null-safe intent as #1056. */ -}}
{{- $wc := merge (deepCopy (.Values.warmCapacity | default dict)) (dict
     "enabled" false
     "replicas" 1
     "priorityClassName" "warm-capacity-overprovisioning"
     "priorityValue" -10
     "image" "registry.k8s.io/pause:3.9"
     "resources" (dict "requests" (dict "cpu" "1" "memory" "2Gi"))) }}
{{- if $wc.enabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $wc.priorityClassName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
value: {{ $wc.priorityValue }}
globalDefault: false
preemptionPolicy: Never
description: "Warm-capacity overprovisioning pause pods; preempted the instant real workloads need the space."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warm-capacity-overprovisioning
  namespace: {{ .Release.Namespace }}
  annotations:
    # Fix #1 (blocker): the NodePools (custom-nodepools.yaml) render at the default
    # intra-app wave 0. This pause Deployment MUST come after them — on a fresh hub
    # the warm pool does not exist until wave 0, so at wave -1 the pause pod is
    # unschedulable, the Deployment goes Degraded at its progress deadline, and the
    # whole app deadlocks before wave 0 ever applies. Wave 1 is still inside this
    # early bootstrap app, ahead of the heavy addon waves.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: warm-capacity-overprovisioning
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ $wc.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: warm-capacity-overprovisioning
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warm-capacity-overprovisioning
    spec:
      priorityClassName: {{ $wc.priorityClassName }}
      terminationGracePeriodSeconds: 0
      {{- with $wc.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $wc.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: pause
        image: {{ $wc.image }}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65535
          runAsGroup: 65535
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: {{ $wc.resources.requests.cpu | quote }}
            memory: {{ $wc.resources.requests.memory | quote }}
{{- end }}
