{{- /*
Karpenter NodePools for the platform.

customNodepools.pools — the CONSUMER's list. ALWAYS rendered, on every cluster,
  regardless of the gate. The workshop overlay fills this from
  configs/ so the hub and every spoke get the -peeks pools that add-on configs pin to
  via nodeSelector. The generic solution leaves it empty and relies on the EKS Auto
  Mode built-in system/general-purpose pools.

fallbackNodepools.pools — the generic neutral REPLACEMENT pool, appended to the consumer
  list ONLY when the cluster was created WITHOUT the EKS Auto Mode built-in general-purpose
  pool (enableGeneralPurposeNodePool="false"). Any name the consumer already defines wins,
  so nothing is duplicated. This covers the fresh-hub bootstrap window before the
  overlay is wired: without an untainted pool every add-on (cert-manager, keycloak,
  load-balancer-controller, …) is unschedulable. The pools are created on the app's
  first sync; add-on pods stay Pending until then.

enableGeneralPurposeNodePool is threaded from the cluster-secret annotation
`enable_general_purpose_nodepool` via the registry valuesObject; it defaults to "true"
(render only the consumer list) when absent, so the generic solution is unchanged.

Each entry: { name: <string>, spec: <karpenter.sh/v1 NodePool spec> }.
*/ -}}
{{- $pools := (.Values.customNodepools | default dict).pools | default list }}
{{- if eq (toString .Values.enableGeneralPurposeNodePool) "false" }}
{{- $names := list }}
{{- range $pools }}{{- $names = append $names .name }}{{- end }}
{{- /*
  instanceSizeFloor — the instance-size floor applied to each fallback pool. It is OFF
  by default in the generic chart (instanceSizeFloor: []), so a non-workshop consumer's
  platform-general is unfloored (any instance size). A consumer that wants a floor
  supplies it per-cluster via `instanceSizeFloorOverride` (threaded from the
  cluster-secret annotation `fallback_nodepool_instance_size_floor` via the registry
  valuesObject — the SAME path the enableGeneralPurposeNodePool gate takes), so the floor
  arrives FROM THE FIRST SYNC, before any overlay is wired.

  Precedence: `instanceSizeFloorOverride` (a comma-separated STRING) wins when non-empty;
  otherwise the chart default list `instanceSizeFloor` applies (empty by default -> no
  floor). The override is a SEPARATE key so the registry sending it empty (annotation
  absent) does NOT clobber the default list via deep-merge. Set the override to "none" to
  explicitly disable the floor. Override tokens are lower-cased and validated to a
  size shape; unknown tokens are dropped, and if none survive the chart default is used
  (never a `fail`), so a malformed value cannot render an unlaunchable pool. A fallback
  pool that already pins `eks.amazonaws.com/instance-size` is left untouched.
*/ -}}
{{- $fallbackCfg := (.Values.fallbackNodepools | default dict) }}
{{- $override := ($fallbackCfg.instanceSizeFloorOverride | default "") | toString | trim | lower }}
{{- $floor := list }}
{{- if eq $override "none" }}
{{- /* explicit opt-out: no floor */ -}}
{{- else if $override }}
{{- /*
  Lower-case + validate the override tokens. The floor is emitted with operator: In, so
  the list is also a CEILING -- a token no instance type matches (a typo, wrong delimiter,
  or upper-case) renders a clean-but-unlaunchable pool and re-opens the bootstrap deadlock
  this pool exists to prevent. So: lower-case (done above), then keep only size-shaped
  tokens (medium | [N]xlarge | metal...). If NONE survive, fall back to instanceSizeFloor
  rather than `fail` -- a fail here would take down every NodePool in the app, which is
  worse than an unfloored pool.
*/ -}}
{{- range (splitList "," $override) }}{{- $t := trim . }}{{- if and $t (regexMatch "^([0-9]*x)?large$|^medium$|^metal" $t) }}{{- $floor = append $floor $t }}{{- end }}{{- end }}
{{- if not $floor }}
{{- $floor = ($fallbackCfg.instanceSizeFloor | default list) }}
{{- end }}
{{- else }}
{{- $floor = ($fallbackCfg.instanceSizeFloor | default list) }}
{{- end }}
{{- range ($fallbackCfg.pools | default list) }}
{{- if not (has .name $names) }}
{{- $pool := . }}
{{- if $floor }}
{{- $reqs := (($pool.spec.template.spec).requirements | default list) }}
{{- $hasSize := false }}
{{- range $reqs }}{{- if eq .key "eks.amazonaws.com/instance-size" }}{{- $hasSize = true }}{{- end }}{{- end }}
{{- if not $hasSize }}
{{- $pool = deepCopy $pool }}
{{- $sizeReq := dict "key" "eks.amazonaws.com/instance-size" "operator" "In" "values" $floor }}
{{- $_ := set $pool.spec.template.spec "requirements" (append $reqs $sizeReq) }}
{{- end }}
{{- end }}
{{- $pools = append $pools $pool }}
{{- end }}
{{- end }}
{{- end }}
{{- range $pools }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .name }}
spec:
  {{- toYaml .spec | nindent 2 }}
{{- end }}
