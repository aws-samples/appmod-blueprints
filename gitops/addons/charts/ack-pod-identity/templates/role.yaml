{{- range $name, $identity := .Values.identities }}
{{- if not (eq (toString $identity.enabled) "false") }}
---
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: {{ $.Values.aws.clusterName }}-{{ $name }}-pod-identity-role
  namespace: {{ $.Release.Namespace }}
  annotations:
    services.k8s.aws/region: {{ $.Values.aws.region }}
    # IAM roles are keyed by name, which ACK derives from spec.name, so
    # adopt-or-create alone is sufficient -- no adoption-fields needed.
    services.k8s.aws/adoption-policy: adopt-or-create
    # Never delete the underlying IAM role on prune. The role may be shared with
    # bootstrap/Terraform-created PodIdentityAssociations and pruning here must
    # never break ESO/LBC/external-dns/keycloak.
    services.k8s.aws/deletion-policy: retain
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-2"
spec:
  name: {{ $.Values.aws.clusterName }}-{{ $identity.roleName }}
  {{- if and (eq (toString $identity.skipPIA) "true") $.Values.aws.oidcIssuer }}
  # skipPIA=true: this identity uses IRSA instead of Pod Identity.
  # The SA annotation eks.amazonaws.com/role-arn triggers IRSA injection
  # (AWS_WEB_IDENTITY_TOKEN_FILE) which is supported by aws-sdk-go v1.38+.
  # See: https://github.com/argoproj/argo-rollouts/issues/4536
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Federated": "arn:aws:iam::{{ $.Values.aws.accountId }}:oidc-provider/{{ trimPrefix "https://" $.Values.aws.oidcIssuer }}"
          },
          "Action": "sts:AssumeRoleWithWebIdentity",
          "Condition": {
            "StringEquals": {
              "{{ trimPrefix "https://" $.Values.aws.oidcIssuer }}:sub": "system:serviceaccount:{{ $identity.namespace }}:{{ $identity.serviceAccount }}",
              "{{ trimPrefix "https://" $.Values.aws.oidcIssuer }}:aud": "sts.amazonaws.com"
            }
          }
        }
      ]
    }
  {{- else }}
  assumeRolePolicyDocument: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Principal": {
            "Service": "pods.eks.amazonaws.com"
          },
          "Action": [
            "sts:AssumeRole",
            "sts:TagSession"
          ]
        }
      ]
    }
  {{- end }}
  {{- if $identity.managedPolicyArns }}
  policies:
    {{- range $identity.managedPolicyArns }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- if $identity.policy }}
  # Reference the Policy CR rather than building its ARN: ACK resolves the ARN
  # once the Policy is synced, which also gives us correct ordering for free.
  policyRefs:
    - from:
        name: {{ $.Values.aws.clusterName }}-{{ $name }}-pod-identity-policy
  {{- end }}
  {{- if $identity.tags }}
  tags:
    {{- range $k, $v := $identity.tags }}
    - key: {{ $k }}
      value: {{ $v | quote }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
