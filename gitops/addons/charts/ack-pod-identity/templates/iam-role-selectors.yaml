{{- if (default dict .Values.iamRoleSelectors).enabled }}
# ACK (as an EKS Capability) resolves which IAM role to assume per namespace +
# resource group via IAMRoleSelector (CARM). Without a selector covering THIS
# namespace for BOTH iam.services.k8s.aws and eks.services.k8s.aws, the Role /
# Policy / PodIdentityAssociation CRs below are created but never reconciled.
#
# The `multi-acct` chart already emits these for every cluster in its
# `.Values.clusters` map (namespaceSelector = cluster name). It does NOT currently
# cover the hub, so this chart ships its own to be self-sufficient. The ARNs are
# identical to multi-acct's, so an overlap is benign -- but if multi-acct is
# extended to cover this namespace, set iamRoleSelectors.enabled=false here.
#
# IAMRoleSelector is CLUSTER-scoped; names are prefixed to avoid colliding with
# multi-acct's `<service>-<cluster>` naming.
{{- range $group := .Values.iamRoleSelectors.groups }}
{{- $service := index (splitList "." $group) 0 }}
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: ack-pod-identity-{{ $service }}-{{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Must exist before any ACK CR in this chart is applied.
    argocd.argoproj.io/sync-wave: "-5"
spec:
  arn: "arn:aws:iam::{{ $.Values.aws.accountId }}:role/{{ $.Values.iamRoleSelectors.resourcePrefix }}-cluster-mgmt-{{ $service }}"
  namespaceSelector:
    names:
      - {{ $.Release.Namespace }}
  resourceTypeSelector:
    - group: {{ $group }}
      kind: ""
      version: ""
{{- end }}
{{- end }}
