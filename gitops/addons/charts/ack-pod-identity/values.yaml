# ACK-managed IAM roles/policies + EKS pod identity associations for platform addons.
#
# DO NOT hand-edit the identities[*].policy.document blocks. They MUST stay
# semantically identical to gitops/addons/charts/crossplane-pod-identity/values.yaml
# (this file was generated from it). A CI drift test asserts equality -- the two
# charts are per-backend mirrors and divergence here is a security bug.
#
# Only these identities live here: eso, lbc, external-dns, aws-for-fluentbit,
# keycloak, argo-rollouts. adot-collector / cloudwatch-observability /
# cni-metrics-helper / kyverno-policy-reporter are deliberately absent: they have no
# consumer on any cluster (see docs/platform/ack-pod-identity-design.md).
aws:
  region: ''
  clusterName: ''
  accountId: ''
  # Domain external-dns manages on this cluster (external_dns_domain_filters, else
  # ingress_domain_name). Scopes its Route 53 write permission; empty = no writes.
  ingressDomainName: ''
crdWait:
  enabled: true
  timeoutSeconds: 600
  image: bitnami/kubectl:latest
  crds:
  - policies.iam.services.k8s.aws
  - roles.iam.services.k8s.aws
  - podidentityassociations.eks.services.k8s.aws
identities:
  # eso: OWNED BY THE EksCluster RGD on kro-ack clusters, NOT by this chart. Kept here
  # (enabled: false) only so the drift test keeps comparing its policy document against
  # crossplane-pod-identity. Do NOT enable it via an overlay: the RGD targets the same
  # (namespace, serviceAccount), and two ACK CRs on one association fight over roleARN.
  # Rationale: external-secrets syncs at wave -1, far earlier than any pod-identity app
  # can run, so ESO's identity must exist from cluster-creation time.
  eso:
    enabled: false
    roleName: ESOPodIdentityRole
    namespace: external-secrets
    serviceAccount: external-secrets-sa
    tags:
      managed-by: ack
      purpose: eso-pod-identity
    policy:
      name: ESOSecretsManagerPolicy
      document: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "secretsmanager:ListSecrets",
                "secretsmanager:BatchGetSecretValue",
                "secretsmanager:ListSecretVersionIds",
                "secretsmanager:GetSecretValue",
                "secretsmanager:GetResourcePolicy",
                "secretsmanager:DescribeSecret",
                "secretsmanager:CreateSecret",
                "secretsmanager:PutSecretValue",
                "secretsmanager:TagResource",
                "secretsmanager:DeleteResourcePolicy"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "secretsmanager:DeleteSecret"
              ],
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "secretsmanager:ResourceTag/managed-by": "external-secrets"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ssm:DescribeParameters"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "ssm:GetParametersByPath",
                "ssm:GetParameters",
                "ssm:GetParameter"
              ],
              "Resource": "arn:aws:ssm:*:*:parameter/*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "kms:Decrypt"
              ],
              "Resource": "arn:aws:kms:*:*:key/*"
            }
          ]
        }
  lbc:
    enabled: false
    roleName: LBCPodIdentityRole
    namespace: kube-system
    serviceAccount: aws-load-balancer-controller-sa
    tags:
      managed-by: ack
      purpose: lbc-pod-identity
    policy:
      name: LBCControllerPolicy
      document: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["iam:CreateServiceLinkedRole"],
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "iam:AWSServiceName": "elasticloadbalancing.amazonaws.com"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:DescribeAccountAttributes",
                "ec2:DescribeAddresses",
                "ec2:DescribeAvailabilityZones",
                "ec2:DescribeInternetGateways",
                "ec2:DescribeVpcs",
                "ec2:DescribeVpcPeeringConnections",
                "ec2:DescribeSubnets",
                "ec2:DescribeSecurityGroups",
                "ec2:DescribeInstances",
                "ec2:DescribeNetworkInterfaces",
                "ec2:DescribeTags",
                "ec2:DescribeCoipPools",
                "ec2:GetCoipPoolUsage",
                "ec2:DescribeInstanceTypes",
                "ec2:GetSecurityGroupsForVpc",
                "elasticloadbalancing:DescribeLoadBalancers",
                "elasticloadbalancing:DescribeLoadBalancerAttributes",
                "elasticloadbalancing:DescribeListeners",
                "elasticloadbalancing:DescribeListenerAttributes",
                "elasticloadbalancing:DescribeListenerCertificates",
                "elasticloadbalancing:DescribeSSLPolicies",
                "elasticloadbalancing:DescribeRules",
                "elasticloadbalancing:DescribeTargetGroups",
                "elasticloadbalancing:DescribeTargetGroupAttributes",
                "elasticloadbalancing:DescribeTargetHealth",
                "elasticloadbalancing:DescribeTags",
                "elasticloadbalancing:DescribeTrustStores"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "cognito-idp:DescribeUserPoolClient",
                "acm:ListCertificates",
                "acm:DescribeCertificate",
                "iam:ListServerCertificates",
                "iam:GetServerCertificate",
                "waf-regional:GetWebACL",
                "waf-regional:GetWebACLForResource",
                "waf-regional:AssociateWebACL",
                "waf-regional:DisassociateWebACL",
                "wafv2:GetWebACL",
                "wafv2:GetWebACLForResource",
                "wafv2:AssociateWebACL",
                "wafv2:DisassociateWebACL",
                "shield:GetSubscriptionState",
                "shield:DescribeProtection",
                "shield:CreateProtection",
                "shield:DeleteProtection"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:AuthorizeSecurityGroupIngress",
                "ec2:RevokeSecurityGroupIngress"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": ["ec2:CreateSecurityGroup"],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": ["ec2:CreateTags"],
              "Resource": "arn:aws:ec2:*:*:security-group/*",
              "Condition": {
                "StringEquals": {
                  "ec2:CreateAction": "CreateSecurityGroup"
                },
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": ["ec2:CreateTags", "ec2:DeleteTags"],
              "Resource": "arn:aws:ec2:*:*:security-group/*",
              "Condition": {
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "true",
                  "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "ec2:AuthorizeSecurityGroupIngress",
                "ec2:RevokeSecurityGroupIngress",
                "ec2:DeleteSecurityGroup"
              ],
              "Resource": "*",
              "Condition": {
                "Null": {
                  "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:CreateLoadBalancer",
                "elasticloadbalancing:CreateTargetGroup"
              ],
              "Resource": "*",
              "Condition": {
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:CreateListener",
                "elasticloadbalancing:DeleteListener",
                "elasticloadbalancing:CreateRule",
                "elasticloadbalancing:DeleteRule"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:AddTags",
                "elasticloadbalancing:RemoveTags"
              ],
              "Resource": [
                "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*",
                "arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*",
                "arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*"
              ],
              "Condition": {
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "true",
                  "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:AddTags",
                "elasticloadbalancing:RemoveTags"
              ],
              "Resource": [
                "arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*",
                "arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*",
                "arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*",
                "arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*"
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:ModifyLoadBalancerAttributes",
                "elasticloadbalancing:SetIpAddressType",
                "elasticloadbalancing:SetSecurityGroups",
                "elasticloadbalancing:SetSubnets",
                "elasticloadbalancing:DeleteLoadBalancer",
                "elasticloadbalancing:ModifyTargetGroup",
                "elasticloadbalancing:ModifyTargetGroupAttributes",
                "elasticloadbalancing:DeleteTargetGroup"
              ],
              "Resource": "*",
              "Condition": {
                "Null": {
                  "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": ["elasticloadbalancing:AddTags"],
              "Resource": [
                "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*",
                "arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*",
                "arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*"
              ],
              "Condition": {
                "StringEquals": {
                  "elasticloadbalancing:CreateAction": [
                    "CreateTargetGroup",
                    "CreateLoadBalancer"
                  ]
                },
                "Null": {
                  "aws:RequestTag/elbv2.k8s.aws/cluster": "false"
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:RegisterTargets",
                "elasticloadbalancing:DeregisterTargets"
              ],
              "Resource": "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "elasticloadbalancing:SetWebAcl",
                "elasticloadbalancing:ModifyListener",
                "elasticloadbalancing:AddListenerCertificates",
                "elasticloadbalancing:RemoveListenerCertificates",
                "elasticloadbalancing:ModifyRule",
                "elasticloadbalancing:SetRulePriorities"
              ],
              "Resource": "*"
            }
          ]
        }
  external-dns:
    enabled: false
    roleName: ExternalDNSPodIdentityRole
    namespace: kube-system
    serviceAccount: external-dns-sa
    tags:
      managed-by: ack
      purpose: external-dns-pod-identity
    policy:
      name: ExternalDNSRoute53Policy
      # Writes are limited to records at or under the domain external-dns manages
      # (aws.ingressDomainName, see the registry entry), so
      # external-dns can never upsert into another zone of the account, e.g. another
      # hub's. IAM has no way to name a hosted zone by domain and the platform does
      # not publish zone IDs, so the record-name condition is the zone scope. With
      # an empty domain the condition matches no record name: writes are denied.
      # external-dns's TXT registry (registry: txt, no txtPrefix/txtSuffix) names the
      # ownership record of a host <type>-<first label>.<rest>. For a host under the
      # domain that stays under *.<domain>, but for the domain itself it is
      # a-<domain> / aaaa-<domain> / cname-<domain>, which is not a subdomain. The
      # record and its TXT go in one change batch, so ForAllValues would deny both.
      # Those three names (the types an Ingress/Service source produces) are allowed
      # explicitly, only when a domain is set: the if/end sit INSIDE the JSON strings
      # so the raw document stays valid JSON for test_chart_drift.py, and with an
      # empty domain the block renders away. Setting a txtPrefix/txtSuffix on
      # external-dns needs this list updated too.
      # The document is rendered through `tpl` (see templates/policy.yaml).
      document: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "route53:ChangeResourceRecordSets"
              ],
              "Resource": "arn:aws:route53:::hostedzone/*",
              "Condition": {
                "ForAllValues:StringLike": {
                  "route53:ChangeResourceRecordSetsNormalizedRecordNames": [
                    "{{ .Values.aws.ingressDomainName | lower | trimSuffix `.` }}",
                    "*.{{ .Values.aws.ingressDomainName | lower | trimSuffix `.` }}{{ if .Values.aws.ingressDomainName }}",
                    "a-{{ .Values.aws.ingressDomainName | lower | trimSuffix `.` }}",
                    "aaaa-{{ .Values.aws.ingressDomainName | lower | trimSuffix `.` }}",
                    "cname-{{ .Values.aws.ingressDomainName | lower | trimSuffix `.` }}{{ end }}"
                  ]
                }
              }
            },
            {
              "Effect": "Allow",
              "Action": [
                "route53:ListHostedZones",
                "route53:ListHostedZonesByName",
                "route53:ListResourceRecordSets"
              ],
              "Resource": "*"
            }
          ]
        }
  aws-for-fluentbit:
    enabled: false
    roleName: FluentBitPodIdentityRole
    namespace: kube-system
    serviceAccount: aws-for-fluent-bit
    tags:
      managed-by: ack
      purpose: aws-for-fluentbit-pod-identity
    policy:
      name: FluentBitCloudWatchLogsPolicy
      # Scoped to the chart's log group prefix (the registry sets cloudWatchLogs.
      # logGroupName to /aws/eks/fluentbit-cloudwatch/<cluster>/logs; the chart
      # default is /aws/eks/fluentbit-cloudwatch/logs). The trailing * also covers the
      # :log-stream:* ARNs PutLogEvents is authorised against.
      document: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogGroup",
                "logs:CreateLogStream",
                "logs:DescribeLogStreams",
                "logs:PutLogEvents",
                "logs:PutRetentionPolicy"
              ],
              "Resource": "arn:aws:logs:*:*:log-group:/aws/eks/fluentbit-cloudwatch/*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "logs:DescribeLogGroups"
              ],
              "Resource": "*"
            }
          ]
        }

  keycloak:
    enabled: false
    roleName: KeycloakConfigPodIdentityRole
    namespace: keycloak
    serviceAccount: keycloak-config
    tags:
      managed-by: ack
      purpose: keycloak-config-pod-identity
    policy:
      name: KeycloakConfigSecretsPolicy
      document: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "secretsmanager:CreateSecret",
                "secretsmanager:PutSecretValue",
                "secretsmanager:GetSecretValue",
                "secretsmanager:DescribeSecret",
                "secretsmanager:TagResource"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "sso:CreateApplication",
                "sso:PutApplicationGrant",
                "sso:PutApplicationAuthenticationMethod",
                "sso:PutApplicationAccessScope",
                "sso:DescribeApplication",
                "sso:ListApplications",
                "sso-directory:SearchUsers",
                "sso-directory:SearchGroups",
                "sso-directory:CreateUser",
                "sso-directory:DescribeUser",
                "sso-directory:UpdateUser",
                "sso-directory:ListGroupMemberships",
                "sso-directory:AddMemberToGroup",
                "identitystore:CreateUser",
                "identitystore:DescribeUser",
                "identitystore:ListUsers",
                "identitystore:CreateGroupMembership",
                "identitystore:ListGroupMemberships",
                "identitystore:ListGroups"
              ],
              "Resource": "*"
            }
          ]
        }

  argo-rollouts:
    enabled: false
    # skipPIA: skip creating the PodIdentityAssociation.
    # Argo Rollouts uses the IRSA SA annotation (eks.amazonaws.com/role-arn) which
    # requires IRSA (AWS_WEB_IDENTITY_TOKEN_FILE) not Pod Identity. The sigv4 library
    # (prometheus/common/sigv4 v0.1.0, aws-sdk-go v1.38) only supports the web-identity
    # token file, not the Pod Identity token file injected by AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE.
    skipPIA: true
    roleName: argo-rollouts
    namespace: argo-rollouts
    serviceAccount: argo-rollouts
    tags:
      managed-by: ack
      purpose: argo-rollouts-amp-query
    policy:
      name: ArgoRolloutsAMPQueryPolicy
      document: |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "aps:QueryMetrics",
                "aps:GetMetricMetadata",
                "aps:GetSeries",
                "aps:GetLabels",
                "aps:ListWorkspaces",
                "aps:DescribeWorkspace"
              ],
              "Resource": "*"
            }
          ]
        }
