{{- /*
Self-signed cert-manager Issuer for the aws-load-balancer-controller webhook
serving certificate, rendered LOCALLY (as an additionalResources source of the
aws-load-balancer-controller addon) so it carries an explicit ArgoCD sync-wave.

Same class of bug as gitops/addons/charts/kargo/templates/webhook-issuer.yaml.
The upstream chart emits Certificate/aws-load-balancer-serving-cert with no
ordering hint, so it gets the default wave 0. If its Issuer is applied in the
same wave, ArgoCD can gate on the Certificate's health before the Issuer exists,
and the Certificate never becomes Ready -> first-sync deadlock (observed on a
full event: LBC never deployed, no ALB created).

The addon sets certManager.issuerRef to this Issuer (gitops/addons/registry/core.yaml).
With issuerRef set, chart 1.17.1 points the serving Certificate at it
(templates/webhook.yaml) and renders none of its own Issuers or root CA
(templates/cert-manager.yaml is gated on `not .Values.certManager.issuerRef`).
Keep the name in sync with that issuerRef.
*/ -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: aws-load-balancer-selfsigned-issuer
  namespace: {{ .Release.Namespace }}
  annotations:
    # Negative wave so the Issuer is applied BEFORE the default-wave-0 webhook
    # Certificate (ArgoCD applies lowest wave first).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selfSigned: {}
