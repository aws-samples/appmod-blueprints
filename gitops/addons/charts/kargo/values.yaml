# Consumed by this chart's own templates (the API Ingress). The registry overlays
# these from cluster annotations (ingress_domain_name, insecure).
global:
  ingress_domain_name: ""
  # insecure=true: ALB serves plain HTTP:80 (consumer terminates TLS upstream, e.g.
  #   CloudFront in front of the ALB) — no ACM cert required.
  # insecure=false: ALB serves HTTPS:443 with an HTTP->HTTPS redirect (real domain + cert).
  insecure: "false"

# Passed through to the upstream Kargo chart (dependency name `kargo`). The upstream
# ingress is disabled here because this chart renders its own insecure-aware Ingress
# (see templates/ingress.yaml).
kargo:
  api:
    ingress:
      enabled: false
