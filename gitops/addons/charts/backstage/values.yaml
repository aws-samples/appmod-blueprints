backstage_image: ""
git_username: ""
gitlab_domain_name: ""
working_repo: ""
ingress_domain_name: ""
workshop_git_branch: "main"
# Upstream repo URLs exposed in the system-info entity (set from the hub cluster secret
# by gitops/addons/registry/platform.yaml); empty = the eks-cluster-template leaves them to the chart/RGD defaults.
addons_repo_url: ""
fleet_repo_url: ""
platform_repo_url: ""
workload_repo_url: ""
# spoke_clusters: list of {name, url, token} entries.
# Each entry registers a remote cluster in Backstage's Kubernetes plugin
# (kubernetes.clusters), kubernetesIngestor.clusters, and the k8s-config.yaml
# ConfigMap consumed by Argo CD. Empty list (default) means hub-only mode.
spoke_clusters: []
# Argo CD host (no scheme). Set by the registry to the EKS capability URL host, or to
# ingress_domain_name when there is none (Argo CD then lives under /argocd).
argocd_hostname: ""
# "true" when the cluster carries enable_langfuse=true; adds the Langfuse homepage Quick Link.
langfuse_enabled: "false"
global:
  aws_cluster_name: ""
  clusterName: ""

# ExternalSecret refresh intervals (how often External Secrets polls AWS Secrets Manager).
# Empty = chart built-in default. Precedence: per-object key > global key > built-in.
externalSecrets:
  # Global: backstage-oidc-vars, backstage-postgres-vars, backstage-session-vars (built-in 30s)
  # and git-credentials (built-in 5m).
  refreshInterval: ""
  gitCredentials:
    refreshInterval: ""      # built-in 5m
  argocdCredentials:
    # Built-in "0" = fetch once, never refresh. The global key does NOT apply here.
    refreshInterval: ""
