{{- /*
  Two ArgoCD secrets, sourced from Secrets Manager (peeks-hub/secrets.git_token)
  via ESO so they always track the canonical PAT and self-heal when it rotates:

    1. fleet-config-repo       (secret-type: repository)  — the private overlay repo
    2. gitlab-user-repo-creds  (secret-type: repo-creds)  — credential TEMPLATE that
       matches every repo under https://<gitlab>/<user> (Backstage-created app repos)

  The imperative `secrets-manager:seed` step still creates these for cold-start;
  ESO adopts (creationPolicy: Owner) and keeps them fresh thereafter.

  NOTE: this chart is deployed from the GitHub *defaults* path (public), NOT the
  GitLab overlay — otherwise ArgoCD would need these very credentials to pull the
  chart that provisions them.
*/}}
{{- $ns := .Values.namespace | default "argocd" }}
{{- $store := .Values.secretStoreName | default "aws-secrets-manager" }}
{{- $key := printf "%s/secrets" .Values.aws_cluster_name }}
{{- $gitlab := .Values.gitlab_domain_name }}
{{- $user := .Values.git_username | default "user1" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-config-repo
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  refreshInterval: "5m"
  target:
    name: fleet-config-repo
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: "https://{{ $gitlab }}/{{ $user }}/fleet-config.git"
        username: "{{ $user }}"
        password: "{{ `{{ .GIT_PASSWORD }}` }}"
  data:
    - secretKey: GIT_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $key }}
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: git_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-user-repo-creds
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  refreshInterval: "5m"
  target:
    name: gitlab-user-repo-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: "https://{{ $gitlab }}/{{ $user }}"
        username: "{{ $user }}"
        password: "{{ `{{ .GIT_PASSWORD }}` }}"
  data:
    - secretKey: GIT_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        key: {{ $key }}
        metadataPolicy: None
        nullBytePolicy: Ignore
        property: git_token
