{{- $ns := .Values.namespace | default "kube-system" }}
{{- if (.Values.attachmentReconcile | default dict).enabled | default true }}
# Migration step for the per-cluster IAM policy names.
#
# A RolePolicyAttachment resolves `policyArnRef` once and keeps the value. When a
# policy is renamed (crossplane.io/external-name changes), the Policy object keeps its
# name and still reports the OLD status.atProvider.arn until the provider has created
# the renamed policy. KubeVela applies the new attachment in the same pass, so it can
# latch the old ARN: the new role gets the old policy and the renamed one stays
# unattached. policy_arn is ForceNew, so `resolve: Always` cannot repair it.
#
# This job deletes an attachment whose resolved policyArn differs from the referenced
# Policy's status.atProvider.arn. KubeVela re-applies it, and the ref then resolves
# the renamed policy. Attachments with no ref, an unresolved ARN, a missing Policy or
# a Policy with no observed ARN yet are left alone, so this does nothing on an install
# that has no rename in flight.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iam-attachment-reconcile
rules:
  - apiGroups: ["iam.aws.upbound.io"]
    resources: ["rolepolicyattachments"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["iam.aws.upbound.io"]
    resources: ["policies"]
    verbs: ["get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iam-attachment-reconcile
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: iam-attachment-reconcile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: iam-attachment-reconcile
subjects:
  - kind: ServiceAccount
    name: iam-attachment-reconcile
    namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: iam-attachment-reconcile
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  schedule: {{ (.Values.attachmentReconcile | default dict).schedule | default "*/2 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 120
      template:
        spec:
          serviceAccountName: iam-attachment-reconcile
          restartPolicy: Never
          containers:
            - name: reconcile
              image: {{ .Values.image | default "bitnami/kubectl:latest" | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  kubectl get rolepolicyattachments.iam.aws.upbound.io >/dev/null 2>&1 || { echo "no RolePolicyAttachment CRD, nothing to do"; exit 0; }
                  # One line per attachment: name|policy object name|resolved policyArn
                  kubectl get rolepolicyattachments.iam.aws.upbound.io \
                    -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.spec.forProvider.policyArnRef.name}{"|"}{.spec.forProvider.policyArn}{"\n"}{end}' |
                  while IFS='|' read -r RPA POL ARN; do
                    [ -z "$RPA" ] && continue
                    [ -z "$POL" ] && continue
                    [ -z "$ARN" ] && continue
                    WANT=$(kubectl get policies.iam.aws.upbound.io "$POL" -o jsonpath='{.status.atProvider.arn}' 2>/dev/null || true)
                    [ -z "$WANT" ] && continue
                    [ "$WANT" = "$ARN" ] && continue
                    echo "delete: $RPA holds $ARN but policy $POL is $WANT, KubeVela re-applies it"
                    kubectl delete rolepolicyattachments.iam.aws.upbound.io "$RPA" --wait=false || true
                  done
                  echo "done"
{{- end }}
