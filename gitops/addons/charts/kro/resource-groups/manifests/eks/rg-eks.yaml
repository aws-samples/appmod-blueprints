    ###########################################################
    - id: ackCapabilityRole
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          namespace: "${schema.spec.name}"
          name: "${schema.spec.name}-ack-capability-role"
          # PRODUCTION SAFETY: Uncomment the annotation below to retain AWS resources when deleting this Kro instance
          # This prevents accidental deletion of IAM roles that may be in use by running workloads
