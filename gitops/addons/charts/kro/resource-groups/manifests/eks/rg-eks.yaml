          #   services.k8s.aws/deletion-policy: retain
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
              controller: false
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            services.k8s.aws/region: ${schema.spec.region}
        spec:
          # schema.spec.name already carries the resource prefix (e.g. peeks-spoke-dev),
          # so do NOT prepend resourcePrefix again (was producing peeks-peeks-...).
          name: "${schema.spec.name}-ack-capability-role"
          inlinePolicies:
            AssumeWorkloadRoles: |
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": ["sts:AssumeRole", "sts:TagSession"],
                    "Resource": ["arn:aws:iam::${schema.spec.accountId}:role/${schema.spec.resourcePrefix}-cluster-mgmt-*"]
                  }
                ]
              }
            ManageIRSARoles: |
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "iam:GetRole", "iam:CreateRole", "iam:DeleteRole",
                      "iam:TagRole", "iam:UntagRole", "iam:UpdateRole",
                      "iam:UpdateAssumeRolePolicy",
                      "iam:AttachRolePolicy", "iam:DetachRolePolicy",
                      "iam:ListAttachedRolePolicies", "iam:ListRolePolicies",
                      "iam:ListRoleTags", "iam:ListInstanceProfilesForRole",
                      "iam:PutRolePolicy", "iam:DeleteRolePolicy", "iam:GetRolePolicy"
                    ],
                    "Resource": ["arn:aws:iam::${schema.spec.accountId}:role/${schema.spec.name}-*"]
                  }
                ]
              }
          assumeRolePolicyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "capabilities.eks.amazonaws.com"
                  },
                  "Action": [
                    "sts:AssumeRole",
                    "sts:TagSession"
                  ]
                }
              ]
            }
