# yamllint disable rule:line-length
---
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: ekscluster.kro.run
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schema:
    apiVersion: v1alpha1
    kind: EksCluster
    spec:
      name: string
      tenant: string
      environment: string
      # Identity backend for this cluster's addons: "kro-ack" (pod identities created
      # by this ACK RGD) or "crossplane"/"" (crossplane-pod-identity app). Stamped onto
      # the argocd cluster secret label so the pod_identities app excludes kro-ack.
      provider: string | default=""
      region: string
      accountId: string
      managementAccountId: string
      managementRegion: string | default="us-west-2"
      argoCdHubRoleArn: string
      argoCdCapabilityRoleArn: string | default=""
      argocdCapability:
        enabled: string | default="false"
        idcInstanceArn: string | default=""
        idcRegion: string | default=""
        adminGroupId: string | default=""
      k8sVersion: string
      adminRoleName: string
      # Optional second cluster-admin role. kro SimpleSchema cannot express a
      # variable-length list of {label,role} objects, and forEach cannot safely
      # derive DNS-1123 AccessEntry names from arbitrary IAM role strings, so the
      # admin roles are modelled as two explicit fields: the console/participant
      # role (adminRoleName) and the IDE/instance role (adminInstanceRoleName).
      # When set, the instance role gets its own cluster-admin AccessEntry
      # (accessEntryAdminInstance) alongside the console one.
      adminInstanceRoleName: string | default=""
      fleetSecretManagerSecretNameSuffix: string
      domainName: string
      resourcePrefix: string | default="peeks"
      git_username: string | default="user1"
      aws_partition: string | default="aws"
      aws_dns_suffix: string | default="amazonaws.com"
      network:
        vpcID: string
        subnets:
          controlplane:
            subnet1ID: string
            subnet2ID: string
          workers:
            subnet1ID: string
            subnet2ID: string
      workloads: string # Define if we want to deploy workloads application
      gitops:
        addonsRepoBasePath: string
        addonsRepoPath: string
        addonsRepoRevision: string
        addonsRepoUrl: string
        fleetRepoBasePath: string
        fleetRepoPath: string
        fleetRepoRevision: string
        fleetRepoUrl: string
        platformRepoBasePath: string
        platformRepoPath: string
        platformRepoRevision: string
        platformRepoUrl: string
        workloadRepoBasePath: string
        workloadRepoPath: string
        workloadRepoRevision: string
        workloadRepoUrl: string
      addons:

        enable_ingress_class_alb: string
        enable_argo_rollouts: string
        enable_metrics_server: string
        enable_external_secrets: string
        enable_external_dns: string
        enable_adot_collector: string
        enable_cw_prometheus: string
        enable_kyverno: string
        enable_kyverno_policies: string
        enable_kyverno_policy_reporter: string
        enable_cni_metrics_helper: string
        enable_prometheus_node_exporter: string
        enable_kube_state_metrics: string
        enable_opentelemetry_operator: string
        enable_cert_manager: string
        enable_aws_for_fluentbit: string | default="true"
        enable_aws_efs_csi_driver: string
        enable_crossplane: string
        enable_crossplane_aws: string
        enable_flux: string
        enable_ingress_nginx: string
        enable_platform_manifests: string
        enable_kro_manifests: string | default="true"
        enable_platform_manifests_bootstrap: string | default="true"
        enable_kubevela: string

        adot_collector_namespace: string
        adot_collector_service_account: string

        external_dns_namespace: string
        external_dns_service_account: string
        external_dns_policy: string

        external_secrets_namespace: string
        external_secrets_service_account: string

        amp_endpoint_url: string
    status:
      clusterARN: ${ekscluster.status.ackResourceMetadata.arn}
      cdata: ${ekscluster.status.certificateAuthority.data}
      endpoint: ${ekscluster.status.endpoint}
      clusterState: ${ekscluster.status.status}


  resources:

    ###########################################################
    # Security Groups for Ingress
    ###########################################################
    - id: ingressHttpSecurityGroup
      template:
        apiVersion: ec2.services.k8s.aws/v1alpha1
        kind: SecurityGroup
        metadata:
          namespace: "${schema.spec.name}"
          name: "${schema.spec.name}-ingress-http"
          # PRODUCTION SAFETY: Uncomment the annotation below to retain AWS resources when deleting this Kro instance
          # This prevents accidental deletion of EC2 security groups that may be protecting production workloads
          # annotations:
          #   services.k8s.aws/deletion-policy: retain
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
              controller: false
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            services.k8s.aws/region: ${schema.spec.region}
        spec:
          name: "${schema.spec.name}-ingress-http"
          description: "HTTP from anywhere"
          vpcID: ${schema.spec.network.vpcID}
          ingressRules:
            - fromPort: 80
              toPort: 80
              ipProtocol: tcp
              ipRanges:
                - cidrIP: "0.0.0.0/0"
          egressRules:
            - fromPort: 0
              toPort: 0
              ipProtocol: "-1"
              ipRanges:
                - cidrIP: "0.0.0.0/0"
          tags:
            - key: Name
              value: "${schema.spec.name}-ingress-http"
            - key: tenant
              value: ${schema.spec.tenant}
            - key: environment
              value: ${schema.spec.environment}

    - id: ingressHttpsSecurityGroup
      template:
        apiVersion: ec2.services.k8s.aws/v1alpha1
        kind: SecurityGroup
        metadata:
          namespace: "${schema.spec.name}"
          name: "${schema.spec.name}-ingress-https"
          # PRODUCTION SAFETY: Uncomment the annotation below to retain AWS resources when deleting this Kro instance
          # This prevents accidental deletion of EC2 security groups that may be protecting production workloads
          # annotations:
          #   services.k8s.aws/deletion-policy: retain
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
              controller: false
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            services.k8s.aws/region: ${schema.spec.region}
        spec:
          name: "${schema.spec.name}-ingress-https"
          description: "HTTPS from anywhere"
          vpcID: ${schema.spec.network.vpcID}
          ingressRules:
            - fromPort: 443
              toPort: 443
              ipProtocol: tcp
              ipRanges:
                - cidrIP: "0.0.0.0/0"
          egressRules:
            - fromPort: 0
              toPort: 0
              ipProtocol: "-1"
              ipRanges:
                - cidrIP: "0.0.0.0/0"
          tags:
            - key: Name
              value: "${schema.spec.name}-ingress-https"
            - key: tenant
              value: ${schema.spec.tenant}
            - key: environment
              value: ${schema.spec.environment}

    ###########################################################
    # EKS Cluster
    ###########################################################
    - id: clusterRole
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          namespace: "${schema.spec.name}"
          name: "${schema.spec.name}-cluster-role"
          # PRODUCTION SAFETY: Uncomment the annotation below to retain AWS resources when deleting this Kro instance
          # This prevents accidental deletion of IAM roles that may be in use by running workloads
          # annotations:
          #   services.k8s.aws/deletion-policy: retain
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
              controller: false
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            services.k8s.aws/region: ${schema.spec.region}
        spec:
          name: "${schema.spec.name}-cluster-role"
          policies:
            - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
            - arn:aws:iam::aws:policy/AmazonEKSComputePolicy
            - arn:aws:iam::aws:policy/AmazonEKSBlockStoragePolicy
            - arn:aws:iam::aws:policy/AmazonEKSLoadBalancingPolicy
            - arn:aws:iam::aws:policy/AmazonEKSNetworkingPolicy
          assumeRolePolicyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "eks.amazonaws.com"
                  },
                  "Action": [
                    "sts:AssumeRole",
                    "sts:TagSession"
                  ]
                }
              ]
            }
    - id: nodeRole
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          namespace: "${schema.spec.name}"
          name: "${schema.spec.name}-cluster-node-role"
          # PRODUCTION SAFETY: Uncomment the annotation below to retain AWS resources when deleting this Kro instance
          # This prevents accidental deletion of IAM roles that may be in use by running workloads
          # annotations:
          #   services.k8s.aws/deletion-policy: retain
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
              controller: false
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            services.k8s.aws/region: ${schema.spec.region}
        spec:
          name: "${schema.spec.name}-cluster-node-role"
          policies:
            - arn:aws:iam::aws:policy/AmazonEKSWorkerNodeMinimalPolicy
            - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
            - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
            - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
          assumeRolePolicyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "ec2.amazonaws.com"
                  },
                  "Action": "sts:AssumeRole"
                }
              ]
            }
    # https://aws-controllers-k8s.github.io/community/reference/eks/v1alpha1/cluster/
    - id: ekscluster
      readyWhen:
        - ${ekscluster.status.status == "ACTIVE"}
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: Cluster
        metadata:
          namespace: "${schema.spec.name}"
          name: "${schema.spec.name}"
          # implicit dependencies with roles
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
              controller: false
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            clusterRoleArn: "${clusterRole.status.ackResourceMetadata.arn}"
            nodeRoleArn: "${nodeRole.status.ackResourceMetadata.arn}"
            services.k8s.aws/region: ${schema.spec.region}
        spec:
          name: "${schema.spec.name}"
          roleARN: "${clusterRole.status.ackResourceMetadata.arn}"
          version: "${schema.spec.k8sVersion}"
          accessConfig:
            authenticationMode: "API_AND_CONFIG_MAP"
            bootstrapClusterCreatorAdminPermissions: true
          computeConfig:
            enabled: true
            nodeRoleARN: ${nodeRole.status.ackResourceMetadata.arn}
            nodePools:
              - system
              - general-purpose
          kubernetesNetworkConfig:
            ipFamily: ipv4
            elasticLoadBalancing:
              enabled: true
          logging: 
            clusterLogging:
            - enabled: true
              types:
              - api
              - audit
              - authenticator
              - controllerManager
              - scheduler
          storageConfig:
            blockStorage:
              enabled: true
          resourcesVPCConfig:
            endpointPrivateAccess: true
            endpointPublicAccess: true
            subnetIDs:
              - ${schema.spec.network.subnets.controlplane.subnet1ID}
              - ${schema.spec.network.subnets.controlplane.subnet2ID}
          zonalShiftConfig: 
            enabled: true
          tags: 
            kro-management: ${schema.spec.name}
            tenant: ${schema.spec.tenant}
            environment: ${schema.spec.environment}

    - id: podIdentityAddon
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: Addon
        metadata:
          name: eks-pod-identity-agent
          namespace: "${schema.spec.name}"
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
              controller: false
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            clusterArn: "${ekscluster.status.ackResourceMetadata.arn}"
            services.k8s.aws/region: ${schema.spec.region}
        spec:
          name: eks-pod-identity-agent
          addonVersion: v1.3.4-eksbuild.1
          clusterName: "${schema.spec.name}"

    ###########################################################
    # ArgoCD Integration
    ###########################################################
    - id: argocdRole
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: "${schema.spec.name}-argocd-role"
          # PRODUCTION SAFETY: Uncomment the annotation below to retain AWS resources when deleting this Kro instance
          # This prevents accidental deletion of IAM roles that may be in use by running workloads
          # annotations:
          #   services.k8s.aws/deletion-policy: retain
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
              controller: false
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            services.k8s.aws/region: ${schema.spec.region}
            #force dependency on ekscluster
            eksclusterArn: "${ekscluster.status.ackResourceMetadata.arn}"
            #force dependency on podIdentityAddon so that we create argo cluster secret after podIdentity correctly configured
            # Pod Identity enabled by default in EKS Auto Mode
        spec:
          name: "${schema.spec.name}-argocd-role"
          assumeRolePolicyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "AWS": [
                      "${schema.spec.argoCdHubRoleArn}",
                      "${schema.spec.argocdCapability.enabled == 'true' ? 'arn:' + schema.spec.aws_partition + ':iam::' + schema.spec.accountId + ':role/' + schema.spec.name + '-argocd-capability-role' : schema.spec.argoCdHubRoleArn}"
                    ]
                  },
                  "Action": [
                    "sts:TagSession",
                    "sts:AssumeRole"
                  ]
                }
              ]
            }

    - id: argocdSecret
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: "${schema.spec.name}"
          namespace: argocd
          labels:
            argocd.argoproj.io/secret-type: cluster
            # Compatible fleet-management
            fleet_member: spoke
            tenant: "${schema.spec.tenant}"
            environment: "${schema.spec.environment}"
            provider: "${schema.spec.provider}"
            aws_cluster_name: "${schema.spec.name}"
            workloads: "${schema.spec.workloads}"
            #using : useSelector: true for centralized mode

            enable_ingress_class_alb: "${schema.spec.addons.enable_ingress_class_alb}"
            enable_argo_rollouts: "${schema.spec.addons.enable_argo_rollouts}"
            enable_metrics_server: "${schema.spec.addons.enable_metrics_server}"
            enable_external_secrets: "${schema.spec.addons.enable_external_secrets}"
            enable_external_dns: "${schema.spec.addons.enable_external_dns}"
            enable_adot_collector: "${schema.spec.addons.enable_adot_collector}"
            enable_cw_prometheus: "${schema.spec.addons.enable_cw_prometheus}"
            enable_kyverno: "${schema.spec.addons.enable_kyverno}"
            enable_kyverno_policies: "${schema.spec.addons.enable_kyverno_policies}"
            enable_kyverno_policy_reporter: "${schema.spec.addons.enable_kyverno_policy_reporter}"
            enable_cni_metrics_helper: "${schema.spec.addons.enable_cni_metrics_helper}"
            enable_prometheus_node_exporter: "${schema.spec.addons.enable_prometheus_node_exporter}"
            enable_kube_state_metrics: "${schema.spec.addons.enable_kube_state_metrics}"
            enable_opentelemetry_operator: "${schema.spec.addons.enable_opentelemetry_operator}"
            enable_cert_manager: "${schema.spec.addons.enable_cert_manager}"
            enable_aws_efs_csi_driver: "${schema.spec.addons.enable_aws_efs_csi_driver}"
            enable_crossplane: "${schema.spec.addons.enable_crossplane}"
            enable_crossplane_aws: "${schema.spec.addons.enable_crossplane_aws}"
            enable_flux: "${schema.spec.addons.enable_flux}"
            enable_ingress_nginx: "${schema.spec.addons.enable_ingress_nginx}"
            enable_platform_manifests: "${schema.spec.addons.enable_platform_manifests}"
            enable_kro_manifests: "${schema.spec.addons.enable_kro_manifests}"
            enable_platform_manifests_bootstrap: "${schema.spec.addons.enable_platform_manifests_bootstrap}"
            enable_aws_for_fluentbit: "${schema.spec.addons.enable_aws_for_fluentbit}"
            enable_kubevela: "${schema.spec.addons.enable_kubevela}"

          # Note: Cannot use ownerReferences here as it would be cross-namespace
          # (EksCluster is in ${schema.spec.name} namespace, Secret is in argocd namespace)
          # Kubernetes doesn't allow cross-namespace owner references for security reasons
          annotations:
            argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
            # GitOps Bridge
            accountId: "${schema.spec.accountId}"
            aws_account_id: "${schema.spec.accountId}"
            region: "${schema.spec.region}"
            aws_region: "${schema.spec.region}"
            aws_central_region: "${schema.spec.region}"   # used in fleet-management gitops
            oidcProvider: "${ekscluster.status.identity.oidc.issuer}"
            eks_oidc_issuer: "${ekscluster.status.identity.oidc.issuer}"
            aws_cluster_name: "${schema.spec.name}"
            # Hub/control-plane cluster name. Consumed by the appset-chart
            # destinationHub resolution (application-set.yaml): addons with
            # destinationHub:true (e.g. pod-identities) deploy to this cluster
            # instead of the spoke, so the hub's already-credentialed Crossplane
            # providers can bootstrap the spoke's provider Pod Identity. Without
            # it the appset falls back to the spoke's own name (chicken-and-egg).
            # Derived from resourcePrefix to match the Crossplane fleet-secret
            # chart and the terraform convention (<prefix>-hub).
            hub_cluster_name: "${schema.spec.resourcePrefix}-hub"
            aws_vpc_id: "${schema.spec.network.vpcID}"
            # GitOps Configuration
            addonsRepoBasepath: "${schema.spec.gitops.addonsRepoBasePath}"
            addonsRepoPath: "${schema.spec.gitops.addonsRepoPath}"
            addonsRepoRevision: "${schema.spec.gitops.addonsRepoRevision}"
            addonsRepoURL: "${schema.spec.gitops.addonsRepoUrl}"
            fleetRepoBasepath: "${schema.spec.gitops.fleetRepoBasePath}"
            fleetRepoPath: "${schema.spec.gitops.fleetRepoPath}"
            fleetRepoRevision: "${schema.spec.gitops.fleetRepoRevision}"
            fleetRepoURL: "${schema.spec.gitops.fleetRepoUrl}"
            platformRepoBasepath: "${schema.spec.gitops.platformRepoBasePath}"
            platformRepoPath: "${schema.spec.gitops.platformRepoPath}"
            platformRepoRevision: "${schema.spec.gitops.platformRepoRevision}"
            platformRepoURL: "${schema.spec.gitops.platformRepoUrl}"
            workloadRepoBasepath: "${schema.spec.gitops.workloadRepoBasePath}"
            workloadRepoPath: "${schema.spec.gitops.workloadRepoPath}"
            workloadRepoRevision: "${schema.spec.gitops.workloadRepoRevision}"
            workloadRepoURL: "${schema.spec.gitops.workloadRepoUrl}"
            # Specific for External-DNS
            external_dns_domain_filters: "${schema.spec.domainName}"
            external_dns_namespace: "${schema.spec.addons.external_dns_namespace}"
            external_dns_policy: "${schema.spec.addons.external_dns_policy}"
            external_dns_service_account: "${schema.spec.addons.external_dns_service_account}"

            # Generic
            external_secrets_namespace: "${schema.spec.addons.external_secrets_namespace}"
            external_secrets_service_account: "${schema.spec.addons.external_secrets_service_account}"

            # aws_load_balancer_controller_namespace: "${schema.spec.addons.aws_load_balancer_controller_namespace}"
            # aws_load_balancer_controller_service_account: "${schema.spec.addons.aws_load_balancer_controller_service_account}"

            adot_collector_namespace: "${schema.spec.addons.adot_collector_namespace}"
            adot_collector_service_account: "${schema.spec.addons.adot_collector_service_account}"
            amp_endpoint_url: "${schema.spec.addons.amp_endpoint_url}"

            fleet_secret_manager_secret_name: "${schema.spec.name}-${schema.spec.fleetSecretManagerSecretNameSuffix}"
            ingress_name: "${schema.spec.name}-ingress"
            ingress_domain_name: "${schema.spec.domainName}"
            ingress_security_groups: "${ingressHttpSecurityGroup.status.id},${ingressHttpsSecurityGroup.status.id}"
            resource_prefix: "${schema.spec.resourcePrefix}"
            git_username: "${schema.spec.git_username}"
            # karpenter_namespace: "${schema.spec.addons.karpenter_namespace}"
            # karpenter_node_iam_role_name: "${nodeRole.metadata.name}"
            # karpenter_service_account: "${schema.spec.addons.karpenter_service_account}"
            # karpenter_sqs_queue_name: "${schema.spec.addons.karpenter_sqs_queue_name}"

        type: Opaque
        stringData:
          name: "${schema.spec.name}"
          server: "${ekscluster.status.ackResourceMetadata.arn}"
          config: |
            {
              "awsAuthConfig": {
                "clusterName": "${schema.spec.name}"
              },
              "tlsClientConfig": {
                "caData": "${ekscluster.status.certificateAuthority.data}",
                "insecure": false
              }
            }


    - id: clusterConfigK8sSecret
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${schema.spec.name}-config-data
          namespace: ${schema.spec.name}
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
        type: Opaque
        stringData:
          config: |
            {"vpc":{"id":"${schema.spec.network.vpcID}","cluster_security_group_id":"","subnet_ids":["${schema.spec.network.subnets.workers.subnet1ID}","${schema.spec.network.subnets.workers.subnet2ID}"]},"server":"${ekscluster.status.ackResourceMetadata.arn}","metadata":{"cluster_name":"${schema.spec.name}","region":"${schema.spec.region}","account_id":"${schema.spec.accountId}"}}

    - id: clusterConfigSecret
      template:
        apiVersion: secretsmanager.services.k8s.aws/v1alpha1
        kind: Secret
        metadata:
          name: ${schema.spec.name}-config
          namespace: ${schema.spec.name}
          annotations:
            services.k8s.aws/region: ${schema.spec.managementRegion}
            services.k8s.aws/owner-account-id: "${schema.spec.accountId}"
          ownerReferences:
            - apiVersion: kro.run/v1alpha1
              kind: ${schema.kind}
              name: ${schema.metadata.name}
              uid: ${schema.metadata.uid}
              blockOwnerDeletion: true
        spec:
          name: ${schema.spec.name}/config
          secretString:
            name: ${schema.spec.name}-config-data
            namespace: ${schema.spec.name}
            key: config

    - id: hubSecretsExternal
      template:
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ${schema.spec.name}-hub-secrets
          namespace: ${schema.spec.name}
        spec:
          secretStoreRef:
            kind: ClusterSecretStore
            name: aws-secrets-manager
          refreshInterval: "1h"
          target:
            name: ${schema.spec.name}-hub-secrets
            creationPolicy: Owner
            # ESO is authoritative for the generated Secret's labels. Without this
            # template, ESO propagates the ExternalSecret's own labels onto the
            # Secret — including KRO's applyset.kubernetes.io/part-of — which KRO's
            # applyset garbage-collector then prunes (the Secret is not in KRO's
            # desired set), so the Secret is deleted/recreated in a loop and
            # hubSecretsExternal never stays Ready. Verified on ESO v2.4.1:
            # target.template.metadata.labels REPLACE label propagation (they do
            # not merge), stripping the applyset label and breaking the loop.
            template:
