apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: vpc.kro.run
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  schema:
    apiVersion: v1alpha1
    kind: Vpc
    spec:
      name: string
      region: string
      # [#1033 N1] ACK deletion-policy applied to every EC2 node below. Passed down from
      # EksclusterWithVpc so a retain-born hub's VPC/NAT/EIP/subnets are never AWS-deleted
      # on an aborted pivot. Default "delete" keeps standalone VPC installs unchanged.
      deletionPolicy: string | default="delete"
      # Used only for the platform.gitops.io/prefix ownership tag below, so teardown
      # can discover this VPC without relying on the cluster name.
      resourcePrefix: string | default="peeks"
      cidr:
        vpcCidr: string | default="10.0.0.0/16"
        publicSubnet1Cidr: string | default="10.0.1.0/24"
        publicSubnet2Cidr: string | default="10.0.2.0/24"
        privateSubnet1Cidr: string | default="10.0.11.0/24"
        privateSubnet2Cidr: string | default="10.0.12.0/24"
      natGateways: integer | default=1 # Reserved for future HA (currently always 1 NAT Gateway)
      # Optional extra AWS tags merged into every EC2 resource below (SpringClean
      # auto-delete=no, cost allocation, compliance). Passed down from EksclusterWithVpc.
      awsTags: "map[string]string"
      # Opt-in VPC Block Public Access (BPA) exclusion for
      # this VPC. When true, a Job on the cluster running kro creates ONE exclusion in
      # mode allow-bidirectional for the whole VPC (covers the public subnets: ALBs, NAT),
      # and a guard Pod deletes it when this instance is deleted or the flag is turned
      # off. Needed when the account sets VPC BPA to block-ingress (only
      # allow-bidirectional exclusions take effect in that mode). ACK ec2-controller has
      # no VpcBlockPublicAccessExclusion CRD (generator.yaml ignore.resource_names), hence
      # the Job. Default false: no resource below is rendered, existing VPCs unchanged.
      vpcBlockPublicAccessExclusion: boolean | default=false
    status:
      vpcID: ${vpc.status.vpcID}
      publicSubnet1ID: ${publicSubnet1.status.subnetID}
      publicSubnet2ID: ${publicSubnet2.status.subnetID}
      privateSubnet1ID: ${privateSubnet1.status.subnetID}
      privateSubnet2ID: ${privateSubnet2.status.subnetID}
  resources: # how to publish a field in the RG claim e.g. vpcID
  - id: vpc
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: VPC
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-vpc
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        cidrBlocks: 
        - ${schema.spec.cidr.vpcCidr}
        enableDNSSupport: true
        enableDNSHostnames: true
        # Base ownership tags + optional user awsTags (SpringClean/cost/compliance).
        # awsTags (map[string]string) is rendered as {key,value} entries and appended;
        # keys are sorted so the list is stable across reconciles (kro CEL guidance:
        # a list built from a map has non-deterministic order otherwise, causing a
        # perpetual ArgoCD/ACK diff). Empty/absent awsTags -> base list unchanged.
        tags: '${[{"key": "Name", "value": schema.spec.name + "-vpc"}, {"key": "platform.gitops.io/prefix", "value": schema.spec.resourcePrefix}, {"key": "platform.gitops.io/cluster", "value": schema.spec.name}] + schema.spec.?awsTags.orValue({}).map(k, k).sort().map(k, {"key": k, "value": schema.spec.awsTags[k]})}'
  - id: internetGateway
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: InternetGateway
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-igw
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        vpc: ${vpc.status.vpcID}
        tags:
          - key: "Name"
            value: ${schema.spec.name}-igw
  - id: natGateway1
    # Gate the private route tables on the NAT gateway being available. A brand-new
    # NAT gateway ID is not visible to CreateRoute for a few seconds
    # (InvalidNatGatewayID.NotFound), and the ACK RouteTable create discards the route
    # table it just made when its route fails, so every retry left another orphan route
    # table in the VPC (and the orphans block the VPC deletion on teardown).
    readyWhen:
      - ${natGateway1.status.?state.orValue("") == "available"}
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: NATGateway
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-nat-gateway1
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        subnetID: ${publicSubnet1.status.subnetID}
        allocationID: ${eip1.status.allocationID}
        connectivityType: public
        tags: '${[{"key": "Name", "value": schema.spec.name + "-nat-gateway1"}] + schema.spec.?awsTags.orValue({}).map(k, k).sort().map(k, {"key": k, "value": schema.spec.awsTags[k]})}'
  - id: eip1
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: ElasticIPAddress
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-eip1
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        tags: '${[{"key": "Name", "value": schema.spec.name + "-eip1"}] + schema.spec.?awsTags.orValue({}).map(k, k).sort().map(k, {"key": k, "value": schema.spec.awsTags[k]})}'
  - id: publicRoutetable
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: RouteTable
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-public-routetable
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        vpcID: ${vpc.status.vpcID}
        routes:
        - destinationCIDRBlock: 0.0.0.0/0
          gatewayID: ${internetGateway.status.internetGatewayID}
        tags:
          - key: "Name"
            value: ${schema.spec.name}-public-routetable
  - id: privateRoutetable1
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: RouteTable
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-private-routetable1
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        vpcID: ${vpc.status.vpcID}
        routes:
        - destinationCIDRBlock: 0.0.0.0/0
          natGatewayID: ${natGateway1.status.natGatewayID}
        tags:
          - key: "Name"
            value: ${schema.spec.name}-private-routetable1
  - id: privateRoutetable2
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: RouteTable
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-private-routetable2
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        vpcID: ${vpc.status.vpcID}
        routes:
        - destinationCIDRBlock: 0.0.0.0/0
          natGatewayID: ${natGateway1.status.natGatewayID}
        tags:
          - key: "Name"
            value: ${schema.spec.name}-private-routetable2
  - id: publicSubnet1
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: Subnet
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-public-subnet1
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        availabilityZone: ${schema.spec.region}a
        cidrBlock: ${schema.spec.cidr.publicSubnet1Cidr}
        mapPublicIPOnLaunch: true
        vpcID: ${vpc.status.vpcID}
        routeTables:
        - ${publicRoutetable.status.routeTableID}
        tags:
          - key: "Name"
            value: ${schema.spec.name}-public-subnet1
          - key: kubernetes.io/role/elb
            value: '1'
  - id: publicSubnet2
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: Subnet
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-public-subnet2
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        availabilityZone: ${schema.spec.region}b
        cidrBlock: ${schema.spec.cidr.publicSubnet2Cidr}
        mapPublicIPOnLaunch: true
        vpcID: ${vpc.status.vpcID}
        routeTables:
        - ${publicRoutetable.status.routeTableID}
        tags:
          - key: "Name"
            value: ${schema.spec.name}-public-subnet2
          - key: kubernetes.io/role/elb
            value: '1'
  - id: privateSubnet1
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: Subnet
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-private-subnet1
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        availabilityZone: ${schema.spec.region}a
        cidrBlock: ${schema.spec.cidr.privateSubnet1Cidr}
        vpcID: ${vpc.status.vpcID}
        routeTables:
        - ${privateRoutetable1.status.routeTableID}
        tags:
          - key: "Name"
            value: ${schema.spec.name}-private-subnet1
          - key: kubernetes.io/role/internal-elb
            value: '1'
  - id: privateSubnet2
    template:
      apiVersion: ec2.services.k8s.aws/v1alpha1
      kind: Subnet
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-private-subnet2
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        availabilityZone: ${schema.spec.region}b
        cidrBlock: ${schema.spec.cidr.privateSubnet2Cidr}
        vpcID: ${vpc.status.vpcID}
        routeTables:
        - ${privateRoutetable2.status.routeTableID}
        tags:
          - key: "Name"
            value: ${schema.spec.name}-private-subnet2
          - key: kubernetes.io/role/internal-elb
            value: '1'
  ###########################################################
  # VPC Block Public Access exclusion (opt-in)
  #
  # Gated on schema.spec.vpcBlockPublicAccessExclusion (default false). Every resource
  # below runs on the cluster where kro runs (the hub; kind during the hub bootstrap),
  # in this instance's namespace. Credentials: EKS Pod Identity on that cluster, same
  # pattern as cicd-pipeline (ACK iam Role trusting pods.eks.amazonaws.com + ACK eks
  # PodIdentityAssociation + ServiceAccount annotated with the association ARN).
  #
  # Limitation: the association targets cluster "<resourcePrefix>-hub", the same
  # convention rg-eks.yaml already uses for hub_cluster_name. A hub named otherwise
  # needs a hubClusterName field (not added: one knob only). Upgrade when hub names
  # become arbitrary for this path.
  #
  # Lifecycle:
  #   create   Job vpcBpaExclusionJob: idempotent describe -> create -> wait.
  #   delete   Pod vpcBpaExclusionGuard: preStop deletes the exclusion, but only when
  #            this Vpc instance is being deleted (deletionTimestamp / 404) or the flag
  #            is false (includeWhen prune). An eviction or a manual pod delete keeps it.
  #            A bare Pod (not a Deployment) on purpose: kro deletes in apply-order
  #            waves and waits for a wave to disappear before the next one, and a Pod
  #            object stays until its preStop has finished, so the Role/association
  #            this preStop needs are still there. A Deployment deleted with the default
  #            background propagation would disappear at once and let kro delete the
  #            credentials while the pod is still terminating.
  # No readyWhen on the Job or the Pod: the exclusion only matters for inbound traffic
  # (ALBs). Blocking the Vpc instance on it would block the EKS cluster on kind, where
  # no Pod Identity exists. Check it with: kubectl -n <ns> get job <name>-vpc-bpa-exclusion
  ###########################################################
  - id: vpcBpaExclusionRole
    includeWhen:
      - ${schema.spec.vpcBlockPublicAccessExclusion}
    readyWhen:
      - ${vpcBpaExclusionRole.status.conditions.exists(x, x.type == 'ACK.ResourceSynced' && x.status == "True")}
    template:
      apiVersion: iam.services.k8s.aws/v1alpha1
      kind: Role
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-vpc-bpa-exclusion
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/adoption-policy: adopt-or-create
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        # <name>-vpc-bpa-exclusion: 18-char suffix, within the 34-char name cap of
        # kro-clusters (longest suffix there is 30).
        name: ${schema.spec.name}-vpc-bpa-exclusion
        description: "VPC BPA exclusion Job and guard for the VPC of ${schema.spec.name} (kro)"
        assumeRolePolicyDocument: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": {"Service": "pods.eks.amazonaws.com"},
                "Action": ["sts:AssumeRole","sts:TagSession"]
              }
            ]
          }
        # Least privilege. Create is allowed only on a VPC carrying this instance's
        # platform.gitops.io/cluster tag (set on the VPC above) and only with that tag and
        # managed-by=kro on the new exclusion; delete only on an exclusion carrying both.
        # Describe has no resource-level scope (Resource "*", per the VPC BPA IAM examples).
        inlinePolicies:
          VpcBpaExclusion: '{"Version":"2012-10-17","Statement":[{"Sid":"DescribeExclusions","Effect":"Allow","Action":"ec2:DescribeVpcBlockPublicAccessExclusions","Resource":"*"},{"Sid":"CreateOnOwnVpc","Effect":"Allow","Action":"ec2:CreateVpcBlockPublicAccessExclusion","Resource":"arn:*:ec2:${schema.spec.region}:*:vpc/*","Condition":{"StringEquals":{"aws:ResourceTag/platform.gitops.io/cluster":"${schema.spec.name}"}}},{"Sid":"CreateTaggedExclusion","Effect":"Allow","Action":"ec2:CreateVpcBlockPublicAccessExclusion","Resource":"arn:*:ec2:${schema.spec.region}:*:vpc-block-public-access-exclusion/*","Condition":{"StringEquals":{"aws:RequestTag/platform.gitops.io/cluster":"${schema.spec.name}","aws:RequestTag/managed-by":"kro"}}},{"Sid":"TagOnCreate","Effect":"Allow","Action":"ec2:CreateTags","Resource":"arn:*:ec2:${schema.spec.region}:*:vpc-block-public-access-exclusion/*","Condition":{"StringEquals":{"ec2:CreateAction":"CreateVpcBlockPublicAccessExclusion"}}},{"Sid":"DeleteOwnExclusion","Effect":"Allow","Action":"ec2:DeleteVpcBlockPublicAccessExclusion","Resource":"arn:*:ec2:${schema.spec.region}:*:vpc-block-public-access-exclusion/*","Condition":{"StringEquals":{"aws:ResourceTag/platform.gitops.io/cluster":"${schema.spec.name}","aws:ResourceTag/managed-by":"kro"}}}]}'
        tags:
          - key: platform.gitops.io/prefix
            value: ${schema.spec.resourcePrefix}
          - key: platform.gitops.io/cluster
            value: ${schema.spec.name}
  - id: vpcBpaExclusionPodIdentity
    includeWhen:
      - ${schema.spec.vpcBlockPublicAccessExclusion}
    readyWhen:
      - ${vpcBpaExclusionPodIdentity.status.conditions.exists(x, x.type == 'ACK.ResourceSynced' && x.status == "True")}
    template:
      apiVersion: eks.services.k8s.aws/v1alpha1
      kind: PodIdentityAssociation
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-vpc-bpa-exclusion
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          services.k8s.aws/region: ${schema.spec.region}
          services.k8s.aws/adoption-policy: adopt-or-create
          services.k8s.aws/deletion-policy: "${schema.spec.deletionPolicy}"
      spec:
        # The cluster where kro (and therefore the Job) runs, not the cluster this VPC
        # is for. See the limitation note above.
        clusterName: ${schema.spec.resourcePrefix}-hub
        namespace: ${schema.spec.name}
        serviceAccount: ${schema.spec.name}-vpc-bpa
        roleARN: ${vpcBpaExclusionRole.status.ackResourceMetadata.arn}
        tags:
          managedBy: kro
          application: vpc-bpa-exclusion
  - id: vpcBpaExclusionServiceAccount
    includeWhen:
      - ${schema.spec.vpcBlockPublicAccessExclusion}
    template:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-vpc-bpa
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          # Pod Identity only, like cicd-pipeline: no IRSA annotation. Referencing the
          # association makes kro create the SA (and the pods using it) after it, so the
          # Pod Identity webhook injects credentials at pod admission.
          eks.amazonaws.com/pod-identity-association: ${vpcBpaExclusionPodIdentity.status.ackResourceMetadata.arn}
  # Read-only access to this Vpc instance, for the guard's preStop decision.
  - id: vpcBpaExclusionGuardRole
    includeWhen:
      - ${schema.spec.vpcBlockPublicAccessExclusion}
    template:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-vpc-bpa-guard
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
      rules:
        - apiGroups: ["kro.run"]
          resources: ["vpcs"]
          resourceNames: ["${schema.metadata.name}"]
          verbs: ["get"]
  - id: vpcBpaExclusionGuardRoleBinding
    includeWhen:
      - ${schema.spec.vpcBlockPublicAccessExclusion}
    template:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-vpc-bpa-guard
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: ${vpcBpaExclusionGuardRole.metadata.name}
      subjects:
        - kind: ServiceAccount
          name: ${vpcBpaExclusionServiceAccount.metadata.name}
          namespace: ${schema.spec.name}
  - id: vpcBpaExclusionJob
    includeWhen:
      - ${schema.spec.vpcBlockPublicAccessExclusion}
    template:
      apiVersion: batch/v1
      kind: Job
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-vpc-bpa-exclusion
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        labels:
          app.kubernetes.io/name: vpc-bpa-exclusion
          app.kubernetes.io/instance: ${schema.spec.name}
          app.kubernetes.io/managed-by: kro
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
      spec:
        # No ttlSecondsAfterFinished: a TTL delete makes kro recreate and re-run the Job
        # (same note as cicd-pipeline). A Job pod template is immutable: changing this
        # template on a live instance needs the Job deleted first (kro recreates it).
        backoffLimit: 10
        template:
          metadata:
            labels:
              app.kubernetes.io/name: vpc-bpa-exclusion
              app.kubernetes.io/instance: ${schema.spec.name}
          spec:
            serviceAccountName: ${vpcBpaExclusionServiceAccount.metadata.name}
            restartPolicy: OnFailure
            containers:
              - name: create-exclusion
                image: amazon/aws-cli:latest
                env:
                  - name: VPC_ID
                    value: ${vpc.status.vpcID}
                  - name: AWS_REGION
                    value: ${schema.spec.region}
                  - name: CLUSTER
                    value: ${schema.spec.name}
                  - name: PREFIX
                    value: ${schema.spec.resourcePrefix}
                  - name: INSTANCE
                    value: ${schema.metadata.name}
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
                command: ["/bin/bash", "-c"]
                # Shell variables use $VAR, never the brace form: kro parses every
                # dollar-brace as a CEL expression.
                args:
                  - |
                    set -euo pipefail
                    INACTIVE="['delete-in-progress','delete-complete','disable-in-progress','disable-complete','create-failed']"
                    # Ours first (tag), then any live exclusion on this VPC (e.g. made by
                    # hand), so a re-run or a pre-existing exclusion never creates a second.
                    # --max-results is mandatory: without --exclusion-ids the API answers
                    # MissingParameter (verified on AWS 2026-11-23). 1000 is the API max; the
                    # account quota is 50 exclusions.
                    ID=$(aws ec2 describe-vpc-block-public-access-exclusions --max-results 1000 \
                      --filters Name=tag:platform.gitops.io/vpc-id,Values="$VPC_ID" \
                      --query "VpcBlockPublicAccessExclusions[?!contains($INACTIVE, State)] | [0].ExclusionId" --output text)
                    if [ "$ID" = "None" ] || [ -z "$ID" ]; then
                      # ResourceArn is the ARN of the excluded VPC (verified), so the native
                      # resource-arn filter finds an exclusion made by hand on this VPC.
                      VPC_ARN="arn:aws:ec2:$AWS_REGION:$(aws sts get-caller-identity --query Account --output text):vpc/$VPC_ID"
                      ID=$(aws ec2 describe-vpc-block-public-access-exclusions --max-results 1000 \
                        --filters Name=resource-arn,Values="$VPC_ARN" \
                        --query "VpcBlockPublicAccessExclusions[?!contains($INACTIVE, State)] | [0].ExclusionId" --output text)
                      if [ "$ID" != "None" ] && [ -n "$ID" ]; then
                        echo "existing exclusion $ID on $VPC_ID (not created by kro), reusing it"
                      fi
                    fi
                    if [ "$ID" = "None" ] || [ -z "$ID" ]; then
                      ID=$(aws ec2 create-vpc-block-public-access-exclusion \
                        --vpc-id "$VPC_ID" \
                        --internet-gateway-exclusion-mode allow-bidirectional \
                        --tag-specifications "ResourceType=vpc-block-public-access-exclusion,Tags=[{Key=Name,Value=$CLUSTER-vpc-bpa},{Key=managed-by,Value=kro},{Key=kro.run/instance-name,Value=$INSTANCE},{Key=platform.gitops.io/prefix,Value=$PREFIX},{Key=platform.gitops.io/cluster,Value=$CLUSTER},{Key=platform.gitops.io/vpc-id,Value=$VPC_ID}]" \
                        --query VpcBlockPublicAccessExclusion.ExclusionId --output text)
                      echo "created exclusion $ID on $VPC_ID"
                    fi
                    for i in $(seq 1 60); do
                      read -r STATE MODE < <(aws ec2 describe-vpc-block-public-access-exclusions \
                        --exclusion-ids "$ID" \
                        --query "VpcBlockPublicAccessExclusions[0].[State,InternetGatewayExclusionMode]" --output text)
                      echo "exclusion $ID state=$STATE mode=$MODE"
                      case "$STATE" in
                        create-complete|update-complete)
                          [ "$MODE" = "allow-bidirectional" ] || echo "WARNING: mode $MODE has no effect under account BPA block-ingress"
                          exit 0 ;;
                        create-failed|update-failed)
                          aws ec2 describe-vpc-block-public-access-exclusions --exclusion-ids "$ID" \
                            --query "VpcBlockPublicAccessExclusions[0].Reason" --output text
                          exit 1 ;;
                      esac
                      sleep 10
                    done
                    echo "timed out waiting for $ID"; exit 1
  - id: vpcBpaExclusionGuard
    includeWhen:
      - ${schema.spec.vpcBlockPublicAccessExclusion}
    template:
      apiVersion: v1
      kind: Pod
      metadata:
        namespace: ${schema.spec.name}
        name: ${schema.spec.name}-vpc-bpa-guard
        ownerReferences:
          - apiVersion: kro.run/v1alpha1
            kind: ${schema.kind}
            name: ${schema.metadata.name}
            uid: ${schema.metadata.uid}
            blockOwnerDeletion: true
            controller: false
        labels:
          app.kubernetes.io/name: vpc-bpa-guard
          app.kubernetes.io/instance: ${schema.spec.name}
          app.kubernetes.io/managed-by: kro
        annotations:
          argocd.argoproj.io/tracking-id: ${schema.metadata.?annotations["argocd.argoproj.io/tracking-id"].orValue("")}
          # Puts the guard in a later apply-order wave than its RBAC binding, so kro
          # deletes the guard (and waits for its preStop) before the binding.
          peeks/depends-on: ${vpcBpaExclusionGuardRoleBinding.metadata.name}
      spec:
        serviceAccountName: ${vpcBpaExclusionServiceAccount.metadata.name}
        restartPolicy: Always
        # Upper bound for the preStop delete + wait below.
        terminationGracePeriodSeconds: 300
        containers:
          - name: guard
            image: amazon/aws-cli:latest
            env:
              - name: VPC_ID
                value: ${vpc.status.vpcID}
              - name: AWS_REGION
                value: ${schema.spec.region}
              - name: CLUSTER
                value: ${schema.spec.name}
              - name: INSTANCE
                value: ${schema.metadata.name}
              - name: INSTANCE_NAMESPACE
                value: ${schema.metadata.namespace}
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
            command: ["/bin/bash", "-c"]
            args:
              - trap 'exit 0' TERM; while true; do sleep 3600 & wait $!; done
            lifecycle:
              preStop:
                exec:
                  command:
                    - /bin/bash
                    - -c
                    - |
                      exec >/proc/1/fd/1 2>&1
                      SA=/var/run/secrets/kubernetes.io/serviceaccount
                      CODE=$(curl -s -o /tmp/instance.json -w '%{http_code}' --cacert "$SA/ca.crt" \
                        -H "Authorization: Bearer $(cat "$SA/token")" \
                        "https://kubernetes.default.svc/apis/kro.run/v1alpha1/namespaces/$INSTANCE_NAMESPACE/vpcs/$INSTANCE")
                      if [ "$CODE" = "404" ] \
                        || { [ "$CODE" = "200" ] && grep -q '"deletionTimestamp"' /tmp/instance.json; } \
                        || { [ "$CODE" = "200" ] && grep -Eq '"vpcBlockPublicAccessExclusion": *false' /tmp/instance.json; }; then
                        echo "Vpc $INSTANCE is being deleted or its exclusion is turned off: deleting the exclusion of $VPC_ID"
                      else
                        # Eviction, node drain, manual pod delete, API error: keep it.
                        echo "Vpc $INSTANCE still wants its exclusion (HTTP $CODE): keeping it"
                        exit 0
                      fi
                      # Only exclusions this graph created (tags), never one made by hand.
                      for ID in $(aws ec2 describe-vpc-block-public-access-exclusions --max-results 1000 \
                        --filters Name=tag:platform.gitops.io/vpc-id,Values="$VPC_ID" Name=tag:managed-by,Values=kro Name=tag:platform.gitops.io/cluster,Values="$CLUSTER" \
                        --query "VpcBlockPublicAccessExclusions[?State=='create-complete' || State=='update-complete' || State=='create-in-progress'].ExclusionId" --output text); do
                        aws ec2 delete-vpc-block-public-access-exclusion --exclusion-id "$ID" >/dev/null && echo "delete requested for $ID"
                        for i in $(seq 1 25); do
                          STATE=$(aws ec2 describe-vpc-block-public-access-exclusions --exclusion-ids "$ID" \
                            --query "VpcBlockPublicAccessExclusions[0].State" --output text 2>/dev/null || echo gone)
                          echo "exclusion $ID state=$STATE"
                          case "$STATE" in delete-complete|gone|None) break ;; esac
                          sleep 10
                        done
                      done
