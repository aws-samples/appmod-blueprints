apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: huggingfacemodel
spec:
  schema:
    apiVersion: v1alpha1
    kind: HuggingFaceModel
    spec:
      modelId: string              # e.g., "meta-llama/Llama-2-7b-hf"
      s3Bucket: string             # Target S3 bucket name
      namespace: string            # Kubernetes namespace
      accountId: string            # AWS account ID
      region: string               # AWS region
      clusterName: string          # EKS cluster name
      # Prefix for the account-wide IAM names (the S3 policy and the role). Default "" keeps
      # the legacy <name>-s3-policy / <name>-role. Two stacks in one account must not share
      # them: adopt-or-create would let the second stack adopt and rewrite the first one's.
      iamNamePrefix: string | default=""
  
  resources:
    # Kubernetes Role for Argo Workflows
    - id: workflowRole
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: ${schema.metadata.name}-workflow-role
          namespace: ${schema.spec.namespace}
        rules:
        - apiGroups: ["argoproj.io"]
          resources: ["workflowtaskresults"]
          verbs: ["create", "patch"]
    
    # Kubernetes RoleBinding
    - id: workflowRoleBinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${schema.metadata.name}-workflow-binding
          namespace: ${schema.spec.namespace}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: ${schema.metadata.name}-workflow-role
        subjects:
        - kind: ServiceAccount
          name: ${schema.metadata.name}-sa
          namespace: ${schema.spec.namespace}
    
    # IAM Policy for S3 access
    - id: s3Policy
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Policy
        metadata:
          name: ${schema.metadata.name}-s3-policy
          namespace: ${schema.spec.namespace}
          annotations:
            services.k8s.aws/adoption-policy: adopt-or-create
            # Policies are identified by ARN, which ACK cannot derive from spec.name
            # alone. Without adoption-fields, adopt-or-create falls back to CreatePolicy
            # and fails with 409 EntityAlreadyExists when the policy already exists
            # (e.g. left over from a prior install). Provide the ARN so ACK adopts it.
            services.k8s.aws/adoption-fields: |
              {"arn":"arn:aws:iam::${schema.spec.accountId}:policy/${schema.spec.iamNamePrefix}${schema.metadata.name}-s3-policy"}
        spec:
          name: ${schema.spec.iamNamePrefix}${schema.metadata.name}-s3-policy
          policyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:PutObject",
                    "s3:GetObject",
                    "s3:ListBucket"
                  ],
                  "Resource": [
                    "arn:aws:s3:::${schema.spec.s3Bucket}",
                    "arn:aws:s3:::${schema.spec.s3Bucket}/*"
                  ]
                }
              ]
            }
    
    # IAM Role
    - id: iamRole
      readyWhen:
        - ${iamRole.status.conditions.exists(x, x.type == 'ACK.ResourceSynced' && x.status == "True")}
      template:
        apiVersion: iam.services.k8s.aws/v1alpha1
        kind: Role
        metadata:
          name: ${schema.metadata.name}-role
          namespace: ${schema.spec.namespace}
          annotations:
            services.k8s.aws/adoption-policy: adopt-or-create
        spec:
          name: ${schema.spec.iamNamePrefix}${schema.metadata.name}-role
          policyRefs:
            - from:
                name: ${s3Policy.metadata.name}
          assumeRolePolicyDocument: |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Service": "pods.eks.amazonaws.com"
                  },
                  "Action": [
                    "sts:AssumeRole",
                    "sts:TagSession"
                  ]
                }
              ]
            }
    
    # Pod Identity Association
    - id: podIdentity
      readyWhen:
        - ${podIdentity.status.conditions.exists(x, x.type == 'ACK.ResourceSynced' && x.status == "True")}
      template:
        apiVersion: eks.services.k8s.aws/v1alpha1
        kind: PodIdentityAssociation
        metadata:
          name: ${schema.metadata.name}-podidentity
          namespace: ${schema.spec.namespace}
          annotations:
            services.k8s.aws/adoption-policy: adopt-or-create
        spec:
          clusterName: ${schema.spec.clusterName}
          namespace: ${schema.spec.namespace}
          serviceAccount: ${schema.metadata.name}-sa
          roleARN: ${iamRole.status.ackResourceMetadata.arn}
    
    # Service Account (created after PodIdentity)
    - id: serviceAccount
      readyWhen:
        - ${serviceAccount.metadata.name != ""}
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: ${schema.metadata.name}-sa
          namespace: ${schema.spec.namespace}
          annotations:
            eks.amazonaws.com/role-arn: ${podIdentity.spec.roleARN}
    
    # Argo Workflow for model download
    - id: downloadWorkflow
      # The instance is Ready only once the model is actually staged in S3. Before, the
      # instance went ACTIVE/Ready as soon as the Workflow object existed, so a Workflow
      # that failed (e.g. bucket never created) still showed a Ready model. A Failed
      # Workflow now leaves the instance not Ready. This is a leaf node: nothing in the
      # graph waits on it, and ArgoCD has no health check for kro.run instances, so the
      # platform-manifests-post app's sync/health is unchanged.
      readyWhen:
        - ${downloadWorkflow.status.?phase.orValue("") == "Succeeded"}
      template:
        apiVersion: argoproj.io/v1alpha1
        kind: Workflow
        metadata:
          name: ${schema.metadata.name}-download
          namespace: ${schema.spec.namespace}
        spec:
          serviceAccountName: ${serviceAccount.metadata.name}
          entrypoint: download-and-upload
          # On success, GC ALL of this workflow's pods (download/upload included): a
          # succeeded run needs no debugging and the stack doesn't archive pod logs.
          # On failure, keep the pods so the run stays debuggable. That no longer means
          # dozens of pods: wait-bucket polls inside ONE pod (see below) instead of one
          # pod per retry attempt, so a failed run keeps 1 wait-bucket pod (with the
          # whole poll log), not ~23. A single podGC strategy cannot express "drop
          # failed wait attempts, keep the rest", which is why the fix is in the step.
          podGC:
            strategy: OnWorkflowSuccess
          
          templates:
            - name: download-and-upload
              steps:
                # Ordering gate (durable fix for the provisioning race): the model
                # staging bucket (${schema.spec.s3Bucket}) is created out-of-band -- by
                # the install Taskfile (`<provider>:ray:setup`, run by the workshop flow)
                # -- asynchronously from this ArgoCD-rendered Workflow (sync-wave 10).
                # With no ordering between the two, the upload step could run before the
                # bucket existed and fail hard with NoSuchBucket on a one-shot Workflow
                # that never retried, leaving the model un-staged for good. This gate
                # blocks download/upload until the bucket is reachable.
                - - name: wait-for-bucket
                    template: wait-bucket
                - - name: download-model
                    template: download
                - - name: upload-to-s3
                    template: upload
            
            - name: wait-bucket
              # Poll until the bucket exists, covering ~20 min of the provisioning race
              # before giving up. The loop runs inside ONE pod: a step-level
              # retryStrategy (the previous approach) created a new Pod per attempt and
              # left one Failed pod per attempt behind when the bucket never appeared.
              # retryStrategy is kept only for pod-level errors (eviction, node loss).
              retryStrategy:
                limit: "2"
                retryPolicy: "OnError"
              activeDeadlineSeconds: 1500
              container:
                image: amazon/aws-cli:latest
                command: [bash, -c]
                args:
                  - |
                    BUCKET="${schema.spec.s3Bucket}"
                    echo "Waiting for s3://$BUCKET to exist (region ${schema.spec.region})..."
                    i=0
                    while [ "$i" -lt 60 ]; do
                      i=$((i + 1))
                      if ERR=$(aws s3api head-bucket --bucket "$BUCKET" --region ${schema.spec.region} 2>&1); then
                        echo "Bucket $BUCKET is ready."
                        exit 0
                      fi
                      echo "[$i/60] not ready yet: $ERR"
                      sleep 20
                    done
                    echo "Bucket $BUCKET still missing after ~20 min; giving up."
                    exit 1
            
            - name: download
              container:
                image: python:3.11-slim
                command: [bash, -c]
                args:
                  - |
                    set -e
                    # gpt2 and other Xet-backed HF repos fail to download when the hf_xet
                    # backend is used in this minimal pod (missing xet deps / restricted
                    # egress). Force the classic HTTP transfer.
                    export HF_HUB_DISABLE_XET=1
                    echo "Installing dependencies..."
                    pip install -q huggingface_hub
                    
                    echo "Downloading model: ${schema.spec.modelId}"
                    python3 << 'PYEOF'
                    from huggingface_hub import snapshot_download
                    import os
                    
                    model_id = "${schema.spec.modelId}"
                    local_dir = "/workspace/model"
                    
                    print(f"Downloading {model_id} to {local_dir}")
                    snapshot_download(
                        repo_id=model_id,
                        local_dir=local_dir,
                        local_dir_use_symlinks=False
                    )
                    print("Download complete!")
                    PYEOF
                volumeMounts:
                  - name: workspace
                    mountPath: /workspace
            
            - name: upload
              # Defence in depth: even past the gate, retry transient S3 errors so a
              # one-shot provisioning hiccup cannot leave the model un-staged.
              retryStrategy:
                limit: "5"
                retryPolicy: "Always"
                backoff:
                  duration: "15s"
                  factor: "2"
                  maxDuration: "5m"
              container:
                image: amazon/aws-cli:latest
                command: [bash, -c]
                args:
                  - |
                    set -e
                    MODEL_NAME=$(echo "${schema.spec.modelId}" | tr '/' '-')
                    S3_PATH="s3://${schema.spec.s3Bucket}/models/$MODEL_NAME/"
                    
                    echo "Uploading model to $S3_PATH"
                    aws s3 sync /workspace/model/ $S3_PATH --region ${schema.spec.region}
                    echo "Upload complete!"
                    
                    echo "Model available at: $S3_PATH"
                volumeMounts:
                  - name: workspace
                    mountPath: /workspace
          
          volumeClaimTemplates:
            - metadata:
                name: workspace
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 50Gi
