# ampincident.kro.run — RGD DEFINITION for the PEEKS agent autonomous-incident bridge.
#
# Placement: this lives in kro-manifests (like every other RGD) but is EXCLUDED from the
# always-applied kro-manifests / kro-manifests-hub apps and shipped instead by the dedicated
# `kro-peeks-agent-rgd-hub` registry app, gated on enable_peeks_agent. WHY (ray-service
# precedent): the graph references sns/sqs/prometheusservice (managed ACK capability) and
# amp.aws.upbound.io/Workspace (Crossplane). If those kinds are ever absent, KRO cannot build
# the graph and the RGD stays Ready=False; in the shared kro-manifests-hub wave chain that
# would stall eksclusterwithvpc and break spoke provisioning. Gating on enable_peeks_agent
# ties the RGD's lifecycle to the agent that already depends on those CRDs.
#
# Cluster-agnostic by design: accountId/region/workspaceName/topicName are schema spec fields
# supplied by the AmpIncident INSTANCE (an OAM component in the peeks-agent Application), so
# no REPLACE_ token substitution is needed here.
#
# RBAC PREREQUISITE (now in the eks-capabilities-rbac chart, NOT here): the kro capability
# controller (<cluster>-kro-capability-role/KRO) is granted get/list/watch on
# amp.aws.upbound.io/workspaces via the shared `eks-capabilities-kro` ClusterRole, so the
# externalRef below can read the Crossplane Workspace CR.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: ampincident.kro.run
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  schema:
    apiVersion: v1alpha1
    kind: AmpIncident
    spec:
      # AMP Workspace CR name (Crossplane amp.aws.upbound.io/Workspace). Default
      # matches the PEEKS naming (<prefix>-amp); override per deployment.
      workspaceName: string | default="peeks-amp"
      accountId: string
      region: string | default="us-west-2"
      # SNS/SQS resource base name (topic == queue == this).
      topicName: string | default="peeks-agent-incidents"
    status:
      # Surface the resolved id so `kubectl get ampincident` shows what was read.
      workspaceId: ${ampworkspace.status.atProvider.id}
      workspaceArn: ${ampworkspace.status.atProvider.arn}
  resources:
    # 1) READ-ONLY reference to the existing Crossplane AMP Workspace (not created here).
    - id: ampworkspace
      externalRef:
        apiVersion: amp.aws.upbound.io/v1beta2
        kind: Workspace
        metadata:
          name: ${schema.spec.workspaceName}

    # 2) SNS topic — AMP AlertManager (aps.amazonaws.com) publishes here, scoped to
    #    THIS workspace ARN (read from the external Workspace CR).
    - id: topic
      template:
        apiVersion: sns.services.k8s.aws/v1alpha1
        kind: Topic
        metadata:
          name: ${schema.spec.topicName}
          namespace: peeks-agent
        spec:
          name: ${schema.spec.topicName}
          policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"AllowAMPPublish","Effect":"Allow","Principal":{"Service":"aps.amazonaws.com"},"Action":"sns:Publish","Resource":"arn:aws:sns:${schema.spec.region}:${schema.spec.accountId}:${schema.spec.topicName}","Condition":{"ArnEquals":{"aws:SourceArn":"${ampworkspace.status.atProvider.arn}"},"StringEquals":{"aws:SourceAccount":"${schema.spec.accountId}"}}}]}

    # 3) SQS queue — SNS delivers here; the in-cluster consumer reads it.
    - id: queue
      template:
        apiVersion: sqs.services.k8s.aws/v1alpha1
        kind: Queue
        metadata:
          name: ${schema.spec.topicName}
          namespace: peeks-agent
        spec:
          queueName: ${schema.spec.topicName}
          messageRetentionPeriod: "3600"
          receiveMessageWaitTimeSeconds: "20"
          visibilityTimeout: "120"
          policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"AllowSNSDelivery","Effect":"Allow","Principal":{"Service":"sns.amazonaws.com"},"Action":"sqs:SendMessage","Resource":"arn:aws:sqs:${schema.spec.region}:${schema.spec.accountId}:${schema.spec.topicName}","Condition":{"ArnEquals":{"aws:SourceArn":"arn:aws:sns:${schema.spec.region}:${schema.spec.accountId}:${schema.spec.topicName}"}}}]}

    # 4) SNS→SQS subscription.
    - id: subscription
      template:
        apiVersion: sns.services.k8s.aws/v1alpha1
        kind: Subscription
        metadata:
          name: ${schema.spec.topicName}-sqs
          namespace: peeks-agent
        spec:
          protocol: sqs
          topicARN: arn:aws:sns:${schema.spec.region}:${schema.spec.accountId}:${schema.spec.topicName}
          endpoint: arn:aws:sqs:${schema.spec.region}:${schema.spec.accountId}:${schema.spec.topicName}
          rawMessageDelivery: "true"

    # 5) AMP AlertManager routing (actionable workload alerts -> SNS). workspaceID is
    #    the id READ from the external Crossplane Workspace CR — no literal, no stamp.
    - id: alertmanager
      template:
        apiVersion: prometheusservice.services.k8s.aws/v1alpha1
        kind: AlertManagerDefinition
        metadata:
          name: peeks-agent-alertmanager
          namespace: peeks-agent
        spec:
          workspaceID: ${ampworkspace.status.atProvider.id}
          configuration: |
            alertmanager_config: |
              route:
                receiver: null-receiver
                group_by: ['alertname','cluster','namespace','pod']
                routes:
                  - receiver: peeks-agent-sns
                    matchers:
                      - severity=~"warning|critical"
                    group_wait: 30s
                    group_interval: 5m
                    repeat_interval: 4h
              receivers:
                - name: null-receiver
                - name: peeks-agent-sns
                  sns_configs:
                    - topic_arn: arn:aws:sns:${schema.spec.region}:${schema.spec.accountId}:${schema.spec.topicName}
                      sigv4:
                        region: ${schema.spec.region}
                      subject: 'PEEKS incident {{ .CommonLabels.alertname }} {{ .CommonLabels.namespace }}/{{ .CommonLabels.pod }}'
                      message: |
                        {{ range .Alerts }}{"status":"{{ .Status }}","alertname":"{{ .Labels.alertname }}","signal":"{{ .Labels.signal }}","remediation":"{{ .Labels.remediation }}","severity":"{{ .Labels.severity }}","cluster":"{{ .Labels.cluster }}","namespace":"{{ .Labels.namespace }}","pod":"{{ .Labels.pod }}","container":"{{ .Labels.container }}","persistentvolumeclaim":"{{ .Labels.persistentvolumeclaim }}","summary":"{{ .Annotations.summary }}","description":"{{ .Annotations.description }}"}{{ end }}
