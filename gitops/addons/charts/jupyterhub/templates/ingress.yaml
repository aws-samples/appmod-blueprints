{{- /* insecure: HTTP-only ingress, no cert (consumer terminates TLS upstream, e.g. CloudFront). */ -}}
{{- /* global.insecure arrives as the STRING "true"/"false" from the cluster-secret metadata; a non-empty string is truthy in Go templates, so compare it explicitly (same idiom as keycloak/kargo/argo-workflows). */ -}}
{{- $insecure := eq (toString (.Values.global.insecure | default "false")) "true" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyterhub
  namespace: jupyterhub
  annotations:
    # JupyterHub's proxy-public returns 302 on "/" (redirects to {baseUrl}/hub/),
    # so the AWS LBC default health check (GET / expecting 200) marks the target
    # unhealthy (Target.ResponseCodeMismatch [302]). Point the health check at the
    # hub's dedicated health endpoint (200) under the configured baseUrl instead.
    alb.ingress.kubernetes.io/healthcheck-path: /jupyterhub/hub/health
{{- if $insecure }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
{{- else }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
{{- end }}
spec:
  ingressClassName: platform
  rules:
{{- if $insecure }}
    - http:
{{- else }}
    - host: {{ .Values.global.ingress_domain_name }}
      http:
{{- end }}
        paths:
          - path: /jupyterhub
            pathType: Prefix
            backend:
              service:
                name: proxy-public
                port:
                  number: 80
