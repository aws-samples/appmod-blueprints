global:
  ingress_domain_name: ""
  clusterName: ""
jupyterhub:
  ingress:
    enabled: false
  hub:
    # JupyterHub must know its base URL so it generates correct redirect URLs
    # and correctly handles requests arriving at /jupyterhub on the shared ALB.
    baseUrl: /jupyterhub
  proxy:
    service:
      type: ClusterIP

# ExternalSecret refresh interval for jupyterhub-oidc-secret (how often External Secrets
# polls AWS Secrets Manager). Empty = built-in 30s.
externalSecrets:
  refreshInterval: ""
