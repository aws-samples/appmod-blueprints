apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    dashboards: external-grafana
  name: external-grafana
  namespace: {{ .Values.namespace | default "grafana-operator" }}
spec:
  external:
    apiKey:
      key: GF_SECURITY_ADMIN_APIKEY
      name: grafana-admin-credentials
    {{- /* grafana_url is empty until the provider seeds aws_grafana_url. Render a reserved,
    self-describing host (RFC 6761 .invalid never resolves) instead of a bare "https://"
    or a plausible dead URL, so the Grafana CR status names the missing key. */}}
    url: "https://{{ .Values.grafana_url | default "aws-grafana-url-not-seeded.invalid" }}"
