# DevLake >= v1.0.3-beta14 serves its dashboards from grafana/dashboards/mysql/ with
# kebab-case detail names (beta7 used grafana/dashboards/DORADetails-*.json). Keep these
# paths in step with devlake_version (registry/observability.yaml).
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dora-grafanadashboard
  namespace: grafana-operator
spec:
  folder: "DORA Dashboards"
  instanceSelector:
    matchLabels:
      dashboards: "external-grafana"
  url: "https://raw.githubusercontent.com/apache/incubator-devlake/{{ .Values.devlake_version | default "v1.0.3-beta14" }}/grafana/dashboards/mysql/DORA.json"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dora-deploymentfreq-grafanadashboard
  namespace: grafana-operator
spec:
  folder: "DORA Dashboards"
  instanceSelector:
    matchLabels:
      dashboards: "external-grafana"
  url: "https://raw.githubusercontent.com/apache/incubator-devlake/{{ .Values.devlake_version | default "v1.0.3-beta14" }}/grafana/dashboards/mysql/dora-details-deployment-frequency.json"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dora-changefailure-grafanadashboard
  namespace: grafana-operator
spec:
  folder: "DORA Dashboards"
  instanceSelector:
    matchLabels:
      dashboards: "external-grafana"
  url: "https://raw.githubusercontent.com/apache/incubator-devlake/{{ .Values.devlake_version | default "v1.0.3-beta14" }}/grafana/dashboards/mysql/dora-details-change-failure-rate.json"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dora-recoverytime-grafanadashboard
  namespace: grafana-operator
spec:
  folder: "DORA Dashboards"
  instanceSelector:
    matchLabels:
      dashboards: "external-grafana"
  url: "https://raw.githubusercontent.com/apache/incubator-devlake/{{ .Values.devlake_version | default "v1.0.3-beta14" }}/grafana/dashboards/mysql/dora-details-failed-deployment-recovery-time.json"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: dora-leadtime-grafanadashboard
  namespace: grafana-operator
spec:
  folder: "DORA Dashboards"
  instanceSelector:
    matchLabels:
      dashboards: "external-grafana"
  url: "https://raw.githubusercontent.com/apache/incubator-devlake/{{ .Values.devlake_version | default "v1.0.3-beta14" }}/grafana/dashboards/mysql/dora-details-lead-timefor-changes.json"
