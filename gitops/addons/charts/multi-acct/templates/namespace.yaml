{{/* The hub's own Namespace only -- see templates/_helpers.tpl (multi-acct.hub). */}}
{{- with include "multi-acct.hub" . }}
{{- $key := index (splitList "=" .) 0 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $key }}
  annotations:
    services.k8s.aws/team-id: "{{ $key }}"
{{- end }}
