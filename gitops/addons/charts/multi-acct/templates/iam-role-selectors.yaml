{{/*
Effective cluster map = .Values.clusters PLUS the cluster this chart runs on.

Why self-coverage: multi-acct is the sole owner of IAMRoleSelector (CARM), and ACK cannot
reconcile ANY resource in a namespace that no selector covers -- it creates the CR and then
silently never reconciles it (no error, no events). `.Values.clusters` is populated only for
SPOKES (by the spokes:enable-* task, in the fleet-config overlay), so without this the hub
itself would never be covered and every hub-side ACK resource -- notably the
ack-pod-identity addon -- would fail silently on a from-scratch install.

Derived from global.clusterName rather than a hardcoded name or the resource prefix: cluster
names are customer-supplied and arbitrary. An explicit entry in .Values.clusters always wins
(hasKey guard), so an operator can still pin a different account for this cluster.
*/}}
{{- $all := deepCopy (default dict .Values.clusters) }}
{{- $self := default "" .Values.global.clusterName }}
{{- $acct := default "" .Values.global.accountId }}
{{- if and $self $acct (not (hasKey $all $self)) }}
{{-   $_ := set $all $self $acct }}
{{- end }}
{{- range $key, $value := $all }}
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: ec2-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $value }}:role/{{ $.Values.global.resourcePrefix }}-cluster-mgmt-ec2"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: ec2.services.k8s.aws
      kind: ""
      version: ""
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: eks-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $value }}:role/{{ $.Values.global.resourcePrefix }}-cluster-mgmt-eks"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: eks.services.k8s.aws
      kind: ""
      version: ""
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: iam-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $value }}:role/{{ $.Values.global.resourcePrefix }}-cluster-mgmt-iam"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: iam.services.k8s.aws
      kind: ""
      version: ""
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: ecr-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $value }}:role/{{ $.Values.global.resourcePrefix }}-cluster-mgmt-ecr"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: ecr.services.k8s.aws
      kind: ""
      version: ""
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: s3-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $value }}:role/{{ $.Values.global.resourcePrefix }}-cluster-mgmt-s3"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: s3.services.k8s.aws
      kind: ""
      version: ""
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: dynamodb-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $value }}:role/{{ $.Values.global.resourcePrefix }}-cluster-mgmt-dynamodb"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: dynamodb.services.k8s.aws
      kind: ""
      version: ""
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: secretsmanager-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $value }}:role/{{ $.Values.global.resourcePrefix }}-cluster-mgmt-secretsmanager"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: secretsmanager.services.k8s.aws
      kind: ""
      version: ""
{{- end }}
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: rds-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $value }}:role/{{ $.Values.global.resourcePrefix | default "peeks" }}-cluster-mgmt-rds"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: rds.services.k8s.aws
      kind: ""
      version: ""
---
