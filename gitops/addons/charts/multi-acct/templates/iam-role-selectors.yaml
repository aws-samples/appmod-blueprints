{{/* The hub's own CARM coverage only -- see templates/_helpers.tpl (multi-acct.hub). */}}
{{- with include "multi-acct.hub" . }}
{{- $parts := splitList "=" . }}
{{- $key := index $parts 0 }}
{{- $acctFor := index $parts 1 }}
---
apiVersion: services.k8s.aws/v1alpha1
kind: IAMRoleSelector
metadata:
  name: ec2-{{ $key }}
spec:
  arn: "arn:aws:iam::{{ $acctFor }}:role/{{ $.Values.global.resourcePrefix }}-cluster-mgmt-ec2"
  namespaceSelector:
    names:
      - {{ $key }}
  resourceTypeSelector:
    - group: ec2.services.k8s.aws
      kind: ""
      version: ""
---
