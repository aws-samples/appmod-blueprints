{{- if and .Values.amp.enabled .Values.amp.alerting.enabled }}
# AMP alerting rules — evaluated centrally by Amazon Managed Prometheus across
# ALL scraped clusters (hub + spokes) since every metric carries an external
# `cluster` label. Fires `ALERTS{alertstate="firing"}` series (queryable via the
# AMP query API) AND drives the AlertManagerDefinition (SNS) when one is defined.
#
# Consumers (either pattern):
#   - pull: an in-cluster bridge on the hub queries ALERTS{...} and POSTs the agent
#   - push: AlertManagerDefinition -> SNS -> Lambda -> agent
apiVersion: amp.aws.upbound.io/v1beta1
kind: RuleGroupNamespace
metadata:
  name: {{ .Values.resourcePrefix }}-alerting-rules
  annotations:
    crossplane.io/external-name: {{ .Values.resourcePrefix }}-alerting-rules
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  forProvider:
    region: {{ .Values.aws.region }}
    workspaceIdRef:
      name: {{ .Values.resourcePrefix }}-amp
    data: |
      groups:
        - name: peeks-workload-incidents
          rules:
            # A container whose LAST termination was an OOMKill. This gauge is 1
            # while the last-terminated reason is OOMKilled and clears to 0 once the
            # container runs healthy again — so it fires precisely during the incident.
            - alert: PodOOMKilled
              expr: |
                max by (cluster, namespace, pod, container) (
                  kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
                )
              for: {{ .Values.amp.alerting.oomkill.for | default "1m" | quote }}
              labels:
                severity: warning
                signal: oomkill
                remediation: gitops-memory-bump
              annotations:
                summary: "OOMKilled: {{ "{{ $labels.container }}" }} in {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} on cluster {{ "{{ $labels.cluster }}" }}"
                description: "Container was terminated with reason=OOMKilled. Propose a GitOps memory-limit increase via a Merge Request; do not mutate the cluster."
            # Fast-restart guard: a container restarting repeatedly in a short window
            # (catches OOM crash-loops even before the reason gauge settles).
            - alert: PodFrequentRestarts
              expr: |
                max by (cluster, namespace, pod, container) (
                  increase(kube_pod_container_status_restarts_total[10m])
                ) >= {{ .Values.amp.alerting.oomkill.restartThreshold | default 3 }}
              for: {{ .Values.amp.alerting.oomkill.for | default "1m" | quote }}
              labels:
                severity: warning
                signal: crashloop
              annotations:
                summary: "Frequent restarts: {{ "{{ $labels.container }}" }} in {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} on cluster {{ "{{ $labels.cluster }}" }}"
                description: "Container restarted repeatedly in the last 10m — likely an OOM or crash loop."
            # Image cannot be pulled (bad tag/repo/registry auth). Fixable in GitOps
            # by correcting the image reference or pull-secret wiring.
            - alert: PodImagePullError
              expr: |
                max by (cluster, namespace, pod, container) (
                  kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|InvalidImageName"} == 1
                )
              for: "2m"
              labels:
                severity: warning
                signal: imagepull
                remediation: gitops-image-fix
              annotations:
                summary: "ImagePullError: {{ "{{ $labels.container }}" }} in {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} on cluster {{ "{{ $labels.cluster }}" }}"
                description: "Container cannot pull its image (reason waiting). Propose a GitOps fix to the image reference (tag/repo/registry) or the imagePullSecret via a Merge Request; do not mutate the cluster."
            # Container stuck in CrashLoopBackOff (waiting reason set) — distinct from
            # the restart-rate guard; catches persistent crash loops.
            - alert: PodCrashLoopBackOff
              expr: |
                max by (cluster, namespace, pod, container) (
                  kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
                )
              for: "3m"
              labels:
                severity: warning
                signal: crashloop
                remediation: gitops-config-or-probe-fix
              annotations:
                summary: "CrashLoopBackOff: {{ "{{ $labels.container }}" }} in {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} on cluster {{ "{{ $labels.cluster }}" }}"
                description: "Container is crash-looping. Perform RCA (logs, probes, config/env) and propose the appropriate GitOps fix (command/args, env/config, liveness-probe timing) via a Merge Request; do not mutate the cluster."
            # Pod cannot be scheduled (insufficient resources / affinity / taints).
            - alert: PodUnschedulable
              expr: |
                max by (cluster, namespace, pod) (
                  kube_pod_status_unschedulable == 1
                )
              for: "5m"
              labels:
                severity: warning
                signal: unschedulable
                remediation: gitops-resources-or-nodepool
              annotations:
                summary: "Unschedulable: {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.pod }}" }} on cluster {{ "{{ $labels.cluster }}" }}"
                description: "Pod cannot be scheduled for >5m. RCA the cause (requests too high, node affinity/taints, nodepool capacity) and propose a GitOps fix (right-size requests, tolerations/affinity, or a Karpenter NodePool change) via a Merge Request; do not mutate the cluster."
            # PersistentVolumeClaim stuck Pending (missing/incorrect StorageClass, no
            # provisioner, or capacity limits).
            - alert: PVCPending
              expr: |
                max by (cluster, namespace, persistentvolumeclaim) (
                  kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
                )
              for: "5m"
              labels:
                severity: warning
                signal: storage
                remediation: gitops-pvc-or-storageclass
              annotations:
                summary: "PVC Pending: {{ "{{ $labels.namespace }}" }}/{{ "{{ $labels.persistentvolumeclaim }}" }} on cluster {{ "{{ $labels.cluster }}" }}"
                description: "PVC has been Pending for >5m. RCA (StorageClass exists? provisioner healthy? capacity?) and propose a GitOps fix (correct storageClassName / requested size) via a Merge Request; do not mutate the cluster."
  providerConfigRef:
    name: default
{{- end }}
