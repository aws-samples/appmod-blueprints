apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-fleet-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: control-plane
  template:
    metadata:
      name: 'fleet-secret-{{ .metadata.annotations.aws_cluster_name }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.fleetRepoURL }}'
          targetRevision: '{{ .metadata.annotations.fleetRepoRevision }}'
          ref: values
        - repoURL: '{{ or (index .metadata.annotations "overlay_repo_url") .metadata.annotations.fleetRepoURL }}'
          targetRevision: '{{ or (index .metadata.annotations "overlay_repo_revision") .metadata.annotations.fleetRepoRevision }}'
          ref: overlay
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          path: 'platform-charts/fleet-secret'
          helm:
            releaseName: 'fleet-secret-{{ .metadata.annotations.aws_cluster_name }}'
            ignoreMissingValueFiles: true
            valuesObject:
              mode: externalSecret
              clusterName: '{{ .metadata.annotations.aws_cluster_name }}'
              externalSecret:
                enabled: true
                creationPolicy: Merge
            valueFiles:
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}fleet/hub/values.yaml'
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}overlays/environments/control-plane/enabled-addons.yaml'
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}overlays/clusters/{{ .metadata.annotations.aws_cluster_name }}/addon-overrides.yaml'
              # Overlay (fleet-config) content lives at the REPO ROOT (overlay_repo_basepath="")
              # — see workshop/Taskfile.yaml seed. Use overlay_repo_basepath AS-IS (no gitops/
              # fallback): the fallback wrongly prepended fleetRepoBasepath="gitops/" and the
              # root-seeded overlays/.../enabled-addons.yaml was silently skipped (agent never
              # enabled). The fleet/* paths below keep the fallback (fleet IS under gitops/).
              - '$overlay/{{ index .metadata.annotations "overlay_repo_basepath" }}overlays/environments/control-plane/enabled-addons.yaml'
              - '$overlay/{{ index .metadata.annotations "overlay_repo_basepath" }}overlays/clusters/{{ .metadata.annotations.aws_cluster_name }}/addon-overrides.yaml'
      destination:
        name: '{{ .name }}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /status
            - /metadata/generation
            - /metadata/managedFields
          jqPathExpressions:
            - '.spec.data[]?.remoteRef.nullBytePolicy'
            - '.spec.dataFrom[]?.extract.nullBytePolicy'
