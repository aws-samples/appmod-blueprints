apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hub-fleet-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: control-plane
  template:
    metadata:
      name: 'fleet-secret-{{ .metadata.annotations.aws_cluster_name }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.fleetRepoURL }}'
          targetRevision: '{{ .metadata.annotations.fleetRepoRevision }}'
          ref: values
        - repoURL: '{{ or (index .metadata.annotations "overlay_repo_url") .metadata.annotations.fleetRepoURL }}'
          targetRevision: '{{ or (index .metadata.annotations "overlay_repo_revision") .metadata.annotations.fleetRepoRevision }}'
          ref: overlay
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          path: 'platform-charts/fleet-secret'
          helm:
            releaseName: 'fleet-secret-{{ .metadata.annotations.aws_cluster_name }}'
            ignoreMissingValueFiles: true
            valuesObject:
              mode: externalSecret
              clusterName: '{{ .metadata.annotations.aws_cluster_name }}'
              externalSecret:
                enabled: true
                creationPolicy: Merge
              # Platform defaults for the hub. The Crossplane abstractions
              # (bootstrap/abstractions.yaml) are selected by these labels and have
              # always run on the hub, so they stay on by default. They live here,
              # not in an enabled-addons.yaml, because the fleet repo may be a
              # consumer repo that does not know these keys exist. A consumer turns
              # one off with `abstraction_<name>: false` in its control-plane
              # enabled-addons.yaml. See gitops/abstractions/README.md.
              defaultEnabledAddons:
                abstraction_aws_resources: true
                abstraction_platform_cluster: true
                abstraction_pod_identity: true
            valueFiles:
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}fleet/hub/values.yaml'
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}overlays/environments/control-plane/enabled-addons.yaml'
              - '$values/{{ .metadata.annotations.fleetRepoBasepath }}overlays/clusters/{{ .metadata.annotations.aws_cluster_name }}/addon-overrides.yaml'
              - '$overlay/{{ or (index .metadata.annotations "overlay_repo_basepath") .metadata.annotations.fleetRepoBasepath }}overlays/environments/control-plane/enabled-addons.yaml'
              - '$overlay/{{ or (index .metadata.annotations "overlay_repo_basepath") .metadata.annotations.fleetRepoBasepath }}overlays/clusters/{{ .metadata.annotations.aws_cluster_name }}/addon-overrides.yaml'
      destination:
        name: '{{ .name }}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /status
            - /metadata/generation
            - /metadata/managedFields
          jqPathExpressions:
            - '.spec.data[]?.remoteRef.nullBytePolicy'
            - '.spec.dataFrom[]?.extract.nullBytePolicy'
