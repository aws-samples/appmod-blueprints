apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: abstractions
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    # Hub: every abstraction. Spokes: set `abstractions: true` in the environment's
    # enabled-addons.yaml (-> label enable_abstractions) to get all but platform-cluster,
    # which provisions clusters and stays on the hub. Spokes need `crossplane: true`.
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update  # never delete Apps: deleting an XRD deletes its claims
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  fleet_member: control-plane
          - git:
              repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
              revision: '{{ .metadata.annotations.addonsRepoRevision }}'
              directories:
                - path: '{{ .metadata.annotations.addonsRepoBasepath }}abstractions/crossplane/*'
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  enable_abstractions: 'true'
                matchExpressions:
                  - {key: fleet_member, operator: NotIn, values: [control-plane]}
          - git:
              repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
              revision: '{{ .metadata.annotations.addonsRepoRevision }}'
              directories:
                - path: '{{ .metadata.annotations.addonsRepoBasepath }}abstractions/crossplane/*'
                - path: '{{ .metadata.annotations.addonsRepoBasepath }}abstractions/crossplane/platform-cluster'
                  exclude: true
  template:
    metadata:
      name: '{{ .path.basename }}-{{ .name }}'
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          ref: values
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          path: '{{ .path.path }}'
          helm:
            releaseName: '{{ .path.basename }}'
            valuesObject:
              aws:
                region: '{{ .metadata.annotations.aws_region }}'
              global:
                clusterName: '{{ .metadata.annotations.aws_cluster_name }}'
      destination:
        namespace: crossplane-system
        name: '{{ .name }}'
      syncPolicy:
        automated:
          selfHeal: false
          allowEmpty: true
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      ignoreDifferences:
        - group: apiextensions.crossplane.io
          kind: CompositeResourceDefinition
          jsonPointers:
            - /status
            - /metadata/generation
            - /metadata/managedFields
        - group: apiextensions.crossplane.io
          kind: Composition
          jsonPointers:
            - /status
            - /metadata/generation
            - /metadata/managedFields
