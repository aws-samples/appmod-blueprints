apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: control-plane
  template:
    metadata:
      name: cluster-addons
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          ref: defaults
        - repoURL: '{{ or (index .metadata.annotations "overlay_repo_url") .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ or (index .metadata.annotations "overlay_repo_revision") .metadata.annotations.addonsRepoRevision }}'
          ref: overlay
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          path: 'platform-charts/appset-chart'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          helm:
            releaseName: cluster-addons
            ignoreMissingValueFiles: true
            valueFiles:
              - values.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/_defaults.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/core.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/gitops.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/security.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/observability.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/platform.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/ml.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}overlays/environments/{{ .metadata.labels.environment }}/overrides.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}overlays/clusters/{{ .nameNormalized }}/overrides.yaml
              # Overlay (fleet-config) overlays/* content is at the REPO ROOT
              # (overlay_repo_basepath=""). Use it AS-IS (no gitops/ fallback) so the
              # root-seeded overlays/environments/<env>/overrides.yaml (which INTRODUCES the
              # aiops-agent registry entry on the hub) is actually read. Matches the appset-chart
              # Convention (overlayRepoURLGitBasePath, also no fallback) for configs/* + per-addon
              # overlay values. The $defaults/* lines above already cover the base repo overrides.
              - $overlay/{{ index .metadata.annotations "overlay_repo_basepath" }}overlays/environments/{{ .metadata.labels.environment }}/overrides.yaml
              - $overlay/{{ index .metadata.annotations "overlay_repo_basepath" }}overlays/clusters/{{ .nameNormalized }}/overrides.yaml
            valuesObject:
              overlayRepoURLGit: '{{ index .metadata.annotations "overlay_repo_url" }}'
              overlayRepoURLGitRevision: '{{ or (index .metadata.annotations "overlay_repo_revision") "main" }}'
              overlayRepoURLGitBasePath: '{{ index .metadata.annotations "overlay_repo_basepath" }}'
      destination:
        namespace: argocd
        name: '{{ .name }}'
      syncPolicy:
        automated:
          # selfHeal:true so addons auto-converge to Git without a manual sync
          # (e.g. when a spoke first becomes reachable). Safe with prune:false:
          # ArgoCD adds/updates to match Git but never deletes.
          selfHeal: true
          allowEmpty: true
          prune: false
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
