apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - clusters:
        selector:
          matchLabels:
            fleet_member: control-plane
  template:
    metadata:
      name: cluster-addons
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          ref: defaults
        # $overlay = fleet-config "layer 5". Resolution (same order as hub-fleet-secret /
        # fleet-secrets / clusters-kro, which already read fleet-config this way):
        #   1. overlay_repo_url/revision when wired (workshop set-overlay-repo, or any seed);
        #   2. else the hub's own fleetRepoURL/Revision when it is a SEPARATE repo from
        #      addonsRepoURL (a dedicated fleet repo = the GitOps-owned overlay);
        #   3. else addonsRepoURL (unchanged): providers that set fleetRepoURL to the addons
        #      repo itself (terraform, byoc, workshop before the flip) stay byte-identical.
        # Basepath stays overlay_repo_basepath AS-IS ("" = repo ROOT when unset): overlay
        # content (configs/, overlays/) lives at the fleet repo root, NOT under
        # fleetRepoBasepath (that locates fleet/ content, e.g. "gitops/").
        - repoURL: '{{ if (index .metadata.annotations "overlay_repo_url") }}{{ index .metadata.annotations "overlay_repo_url" }}{{ else if (and (index .metadata.annotations "fleetRepoURL") (ne (trimSuffix ".git" (index .metadata.annotations "fleetRepoURL")) (trimSuffix ".git" .metadata.annotations.addonsRepoURL))) }}{{ index .metadata.annotations "fleetRepoURL" }}{{ else }}{{ .metadata.annotations.addonsRepoURL }}{{ end }}'
          targetRevision: '{{ if (index .metadata.annotations "overlay_repo_url") }}{{ or (index .metadata.annotations "overlay_repo_revision") .metadata.annotations.addonsRepoRevision }}{{ else if (and (index .metadata.annotations "fleetRepoURL") (ne (trimSuffix ".git" (index .metadata.annotations "fleetRepoURL")) (trimSuffix ".git" .metadata.annotations.addonsRepoURL))) }}{{ or (index .metadata.annotations "fleetRepoRevision") "main" }}{{ else }}{{ or (index .metadata.annotations "overlay_repo_revision") .metadata.annotations.addonsRepoRevision }}{{ end }}'
          ref: overlay
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          path: 'platform-charts/appset-chart'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          helm:
            releaseName: cluster-addons
            ignoreMissingValueFiles: true
            valueFiles:
              - values.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/_defaults.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/core.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/gitops.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/security.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/observability.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/platform.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}addons/registry/ml.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}overlays/environments/{{ .metadata.labels.environment }}/overrides.yaml
              - $defaults/{{ .metadata.annotations.addonsRepoBasepath }}overlays/clusters/{{ .nameNormalized }}/overrides.yaml
              # Overlay (fleet-config) overlays/* content is at the REPO ROOT
              # (overlay_repo_basepath=""). Use it AS-IS (no gitops/ fallback) so the
              # root-seeded overlays/environments/<env>/overrides.yaml (consumer addon
              # valuesObject overrides) is actually read. Matches the appset-chart
              # Convention (overlayRepoURLGitBasePath, also no fallback) for configs/* + per-addon
              # overlay values. The $defaults/* lines above already cover the base repo overrides.
              - $overlay/{{ index .metadata.annotations "overlay_repo_basepath" }}overlays/environments/{{ .metadata.labels.environment }}/overrides.yaml
              - $overlay/{{ index .metadata.annotations "overlay_repo_basepath" }}overlays/clusters/{{ .nameNormalized }}/overrides.yaml
            valuesObject:
              # Same resolution as the $overlay source above (empty = per-addon overlay tier off).
              overlayRepoURLGit: '{{ if (index .metadata.annotations "overlay_repo_url") }}{{ index .metadata.annotations "overlay_repo_url" }}{{ else if (and (index .metadata.annotations "fleetRepoURL") (ne (trimSuffix ".git" (index .metadata.annotations "fleetRepoURL")) (trimSuffix ".git" .metadata.annotations.addonsRepoURL))) }}{{ index .metadata.annotations "fleetRepoURL" }}{{ end }}'
              overlayRepoURLGitRevision: '{{ if (index .metadata.annotations "overlay_repo_url") }}{{ or (index .metadata.annotations "overlay_repo_revision") "main" }}{{ else if (and (index .metadata.annotations "fleetRepoURL") (ne (trimSuffix ".git" (index .metadata.annotations "fleetRepoURL")) (trimSuffix ".git" .metadata.annotations.addonsRepoURL))) }}{{ or (index .metadata.annotations "fleetRepoRevision") "main" }}{{ else }}{{ or (index .metadata.annotations "overlay_repo_revision") "main" }}{{ end }}'
              overlayRepoURLGitBasePath: '{{ index .metadata.annotations "overlay_repo_basepath" }}'
      destination:
        namespace: argocd
        name: '{{ .name }}'
      syncPolicy:
        automated:
          # selfHeal:true so addons auto-converge to Git without a manual sync
          # (e.g. when a spoke first becomes reachable). Safe with prune:false:
          # ArgoCD adds/updates to match Git but never deletes.
          selfHeal: true
          allowEmpty: true
          prune: false
        retry:
          limit: -1
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 10m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
