apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Platform infrastructure and addons managed by the platform team
  sourceNamespaces:
  - argocd
  sourceRepos:
  - '*'
  destinations:
  - namespace: '*'
    server: '*'
    name: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: spoke-workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: Workload deployments to spoke clusters with scoped access
  sourceNamespaces:
  - argocd
  sourceRepos:
  - '*'
  destinations:
  - namespace: '*'
    # Match any spoke cluster by name. Cluster names are customer-supplied and
    # arbitrary, so a '*-spoke-*' glob would refuse apps on spokes named e.g.
    # 'prod-eu'; scoping is enforced via the resource whitelists below instead.
    name: '*'
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
