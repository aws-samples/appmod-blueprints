apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: client-provisioner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - matrix:
        generators:
          # Outer: the hub cluster (source of repo URLs, region, account, etc.)
          - clusters:
              selector:
                matchLabels:
                  fleet_member: control-plane
          # Inner: reads the SAME fleet/members/<cluster>/values.yaml that
          # fleet-secrets.yaml already reads (see that file's git generator).
          # OIDC client provisioning is OPT-IN via the `clients:` key in that one
          # file — a spoke does not need a second, separate
          # client-provisioner.yaml just to get a Keycloak client. Members that
          # omit `clients:` resolve to an empty list, which the provisioner Job
          # treats as a safe no-op (realm-ensure only, no client created).
          # This generator-path filter replaces the old top-level spec.selector
          # (matchExpressions on client_provisioner), which is not supported by the
          # EKS ArgoCD capability's ApplicationSet CRD (added in ArgoCD 2.9) and was
          # pruned on apply, causing a permanent OutOfSync. Reads from the overlay
          # (fleet-config) repo where spokes push their member files — falling back
          # to the base fleet repo — mirroring fleet-secrets.
          - git:
              repoURL: '{{ or (index .metadata.annotations "overlay_repo_url") .metadata.annotations.fleetRepoURL }}'
              revision: '{{ or (index .metadata.annotations "overlay_repo_revision") .metadata.annotations.fleetRepoRevision }}'
              files:
                - path: '{{ or (index .metadata.annotations "overlay_repo_basepath") .metadata.annotations.fleetRepoBasepath }}fleet/members/*/values.yaml'
  template:
    metadata:
      name: 'client-provisioner-{{ .clusterName }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: '{{ .metadata.annotations.addonsRepoURL }}'
          targetRevision: '{{ .metadata.annotations.addonsRepoRevision }}'
          # Path selects the provisioner chart by type. Defaults to "keycloak"
          # (platform-charts/keycloak-client-provisioner). A member overrides it by
          # setting `provisioner: <type>` in its fleet/members/<cluster>/values.yaml.
          path: 'platform-charts/{{ index . "provisioner" | default "keycloak" }}-client-provisioner'
          helm:
            releaseName: 'client-provisioner-{{ .clusterName }}'
            valuesObject:
              environment: '{{ dig "labels" "environment" "" . }}'
              region: '{{ .metadata.annotations.aws_region }}'
              keycloakUrl: 'http://keycloak.keycloak.svc.cluster.local:8080/keycloak'
              secretPathPrefix: '{{ or (index .metadata.annotations "resource_prefix") "oidc" }}'
              # Realm defaults to the shared "platform" realm; a fleet member can
              # override per hub/spoke by declaring oidc.realm in its member file.
              realmName: '{{ dig "oidc" "realm" "platform" . }}'
              # Generic passthrough of whatever clients the fleet member declares.
              # Not provisioner-specific — the fleet repo owns the client list.
              # Serialized to JSON here; the chart normalizes string-or-list.
              clients: '{{ index . "clients" | default list | toJson }}'
      # The Job runs on the hub where Keycloak lives, not on the spoke
      destination:
        name: '{{ .name }}'
        namespace: keycloak
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
