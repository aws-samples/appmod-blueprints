{{- if .Values.xrd.enabled }}
# XPodIdentity — grants a workload an AWS IAM identity via EKS Pod Identity.
# Callers pass only the ServiceAccount + namespace; clusterName/region are
# resolved from the env-config EnvironmentConfig by the Composition.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xpodidentities.platform.gitops.io
spec:
  group: platform.gitops.io
  names:
    kind: XPodIdentity
    plural: xpodidentities
  claimNames:
    kind: PodIdentity
    plural: podidentities
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                serviceAccount:
                  type: string
                  description: Name of the ServiceAccount to bind the IAM role to
                namespace:
                  type: string
                  description: Namespace of the ServiceAccount
                roleName:
                  type: string
                  maxLength: 64
                  description: >-
                    Name of the IAM role to create. Set by the aws-service-identity trait,
                    unique per region, cluster, namespace and ServiceAccount (IAM names
                    are account-global).
              required:
                - serviceAccount
                - namespace
                - roleName
            status:
              type: object
              properties:
                roleArn:
                  type: string
                  description: ARN of the IAM role created for this identity
                roleName:
                  type: string
                  description: >-
                    Name of the IAM role as observed in AWS. Equals spec.roleName once that
                    role exists; the aws-service-identity trait's init gate waits for it.
{{- end }}
