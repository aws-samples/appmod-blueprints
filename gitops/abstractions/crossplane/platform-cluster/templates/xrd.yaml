{{- if .Values.xrd.enabled }}
# Unified PlatformCluster XRD
# Creates VPC + subnets + IGW + NAT + EKS + IAM + node groups in a single claim.
# Used by both Kind bootstrap (hub) and hub Crossplane (spokes).
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xplatformclusters.platform.gitops.io
spec:
  group: platform.gitops.io
  names:
    kind: XPlatformCluster
    plural: xplatformclusters
  claimNames:
    kind: PlatformCluster
    plural: platformclusters
  connectionSecretKeys:
    - kubeconfig
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                region:
                  type: string
                  description: AWS region
                clusterName:
                  type: string
                  description: Cluster name (used for tagging and external-name)
                vpcCidr:
                  type: string
                  description: VPC CIDR block
                  default: "10.0.0.0/16"
                kubernetesVersion:
                  type: string
                  description: EKS Kubernetes version
                  default: "1.32"
                autoMode:
                  type: boolean
                  description: Enable EKS Auto Mode (manages compute, storage, networking)
                  default: true
                resourcePrefix:
                  type: string
                  description: Prefix for resource tagging and identification
                accountId:
                  type: string
                  description: AWS account ID (used to build capability-role inline policy ARNs, e.g. <prefix>-cluster-mgmt-*)
                capabilities:
                  type: object
                  description: |
                    Native EKS Capabilities (KRO / ACK / ArgoCD) created for this cluster via
                    provider-aws-eks Capability MRs. Replaces the imperative
                    `spokes:create-capabilities` / create-capability.yaml Job path.
                  properties:
                    kro:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                    ack:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          default: false
                    argocd:
                      type: object
                      description: ArgoCD capability (hub only). Needs IDC config for SSO RBAC.
                      properties:
                        enabled:
                          type: boolean
                          default: false
                        idcInstanceArn:
                          type: string
                          description: IAM Identity Center instance ARN
                        idcRegion:
                          type: string
                          description: IAM Identity Center region
                        adminGroupId:
                          type: string
                          description: IDC group id mapped to the ArgoCD ADMIN role
                argoCDRoleArn:
                  type: string
                  description: ARN of the hub ArgoCD capability role for spoke access
                adminRoleArn:
                  type: string
                  description: ARN of the console/participant admin role granted cluster-admin access entry on the cluster (e.g. WSParticipantRole)
                adminInstanceRoleArn:
                  type: string
                  description: ARN of the IDE/instance role (the workshop *SharedRole*) granted a second cluster-admin access entry, so kubectl from the IDE works against the spoke
                managedNodeGroup:
                  type: object
                  description: Optional managed node group alongside Auto Mode
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    instanceTypes:
                      type: array
                      items:
                        type: string
                      default: ["m5.large"]
                    desiredSize:
                      type: integer
                      default: 2
                    minSize:
                      type: integer
                      default: 1
                    maxSize:
                      type: integer
                      default: 5
                    diskSize:
                      type: integer
                      default: 50
                    capacityType:
                      type: string
                      description: ON_DEMAND or SPOT
                      default: "ON_DEMAND"
              required:
                - region
                - clusterName
            status:
              type: object
              properties:
                vpcId:
                  type: string
                clusterEndpoint:
                  type: string
                oidcIssuer:
                  type: string
                nodeRoleArn:
                  type: string
                natGatewayId:
                  type: string
{{- end }}
