apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: progressive-app
  namespace: team-java
spec:
  components:
    - name: progressive-demo
      type: service-rollout
      properties:
        image: argoproj/rollouts-demo:blue
        port: 8080
      traits:
        - type: path-based-ingress
          properties:
            domain: ""
            rewritePath: true
            http:
              /progressive: 8080