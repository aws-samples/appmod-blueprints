# Kargo Stages for the Java app.
#
# Promotion steps are inlined (not referenced via PromotionTask) because
# Kargo v1.7.5 admission webhook rejects Stages that only carry a task
# reference ("Stage defines no promotion steps"). Inline steps work reliably
# with both auto-promotion (controller-initiated) and manual promotion.
#
# Each stage updates the image for both formats: kro (spec.image) and kubevela
# (spec.components.0.properties.image). The steps use continueOnError so the
# promotion succeeds regardless of which manifest format is present.
#
# The prod stage also updates the KubeVela app.oam.dev/publishVersion annotation.
# The PROD KubeVela manifest carries that annotation, and KubeVela only rolls out
# a change to such an Application when the annotation changes, so an image-only
# update would change Git without deploying anything. Kargo >= 1.11 yaml-update
# accepts literal dots escaped with a backslash (app\.oam\.dev). This is a separate
# step so a manifest without the annotation (kro) does not block the image update.
# The dev stage does not need it: CI already sets publishVersion when it updates
# the dev image.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: dev
  namespace: java-app-kargo
  annotations:
    kargo.akuity.io/color: green
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: java-app
    sources:
      direct: true
  promotionTemplate:
    spec:
      vars:
      - name: gitURL
        value: ${GITLAB_URL}/${GIT_USERNAME}/java.git
      - name: image
        value: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${RESOURCE_PREFIX}/java
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitURL }}
          checkout:
          - branch: main
            path: ./src
      - uses: yaml-update
        as: update-image-kro
        continueOnError: true
        config:
          path: ./src/deployment/${{ ctx.stage }}/application.yaml
          updates:
          - key: spec.image
            value: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}
      - uses: yaml-update
        as: update-image-kubevela
        continueOnError: true
        config:
          path: ./src/deployment/${{ ctx.stage }}/application.yaml
          updates:
          - key: spec.components.0.properties.image
            value: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}
      - uses: git-commit
        config:
          path: ./src
          message: "Promote ${{ ctx.stage }} to ${{ imageFrom(vars.image).Tag }}"
          author:
            name: Kargo
            email: kargo@akuity.io
      - uses: git-push
        config:
          path: ./src
      - uses: argocd-update
        config:
          apps:
          - name: java-${{ ctx.stage }}-cd
            sources:
            - repoURL: ${{ vars.gitURL }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prod
  namespace: java-app-kargo
  annotations:
    kargo.akuity.io/color: blue
spec:
  requestedFreight:
  - origin:
      kind: Warehouse
      name: java-app
    sources:
      stages:
      - dev
  promotionTemplate:
    spec:
      vars:
      - name: gitURL
        value: ${GITLAB_URL}/${GIT_USERNAME}/java.git
      - name: image
        value: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${RESOURCE_PREFIX}/java
      steps:
      - uses: git-clone
        config:
          repoURL: ${{ vars.gitURL }}
          checkout:
          - branch: main
            path: ./src
      - uses: yaml-update
        as: update-image-kro
        continueOnError: true
        config:
          path: ./src/deployment/${{ ctx.stage }}/application.yaml
          updates:
          - key: spec.image
            value: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}
      - uses: yaml-update
        as: update-image-kubevela
        continueOnError: true
        config:
          path: ./src/deployment/${{ ctx.stage }}/application.yaml
          updates:
          - key: spec.components.0.properties.image
            value: ${{ vars.image }}:${{ imageFrom(vars.image).Tag }}
      - uses: yaml-update
        as: update-publishversion-kubevela
        continueOnError: true
        config:
          path: ./src/deployment/${{ ctx.stage }}/application.yaml
          updates:
          - key: 'metadata.annotations.app\.oam\.dev/publishVersion'
            value: ${{ imageFrom(vars.image).Tag }}
      - uses: git-commit
        config:
          path: ./src
          message: "Promote ${{ ctx.stage }} to ${{ imageFrom(vars.image).Tag }}"
          author:
            name: Kargo
            email: kargo@akuity.io
      - uses: git-push
        config:
          path: ./src
      - uses: argocd-update
        config:
          apps:
          - name: java-${{ ctx.stage }}-cd
            sources:
            - repoURL: ${{ vars.gitURL }}
