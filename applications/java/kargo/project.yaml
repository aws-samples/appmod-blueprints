apiVersion: kargo.akuity.io/v1alpha1
kind: Project
metadata:
  name: java-app-kargo
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Auto-promotion for dev only. Freight flows: Warehouse → dev (auto) → prod (MANUAL).
# Prod is a manual promotion gate on purpose: it is the pedagogical point of module
# 30.4 ("Production deploy with Kargo") — the participant promotes to prod deliberately.
#
# Historical note: auto-promotion was previously enabled for prod too, to work around
# a Kargo v1.7.5 admission-webhook bug that rejected manually-created Promotions on
# stages using inline `uses:` steps ("Stage defines no promotion steps"). That bug is
# NOT present in the Kargo version shipped here (v1.11.0) — verified: a server-side
# dry-run of a manual Promotion on the prod stage is accepted — so prod is a manual gate.
apiVersion: kargo.akuity.io/v1alpha1
kind: ProjectConfig
metadata:
  name: java-app-kargo
  namespace: java-app-kargo
spec:
  promotionPolicies:
  - stageSelector:
      name: dev
    autoPromotionEnabled: true
  - stageSelector:
      name: prod
    autoPromotionEnabled: false
