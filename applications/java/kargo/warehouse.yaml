apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: java-app
  namespace: java-app-kargo
spec:
  interval: 30s
  subscriptions:
  - image:
      repoURL: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${RESOURCE_PREFIX}/java
      imageSelectionStrategy: NewestBuild
      # Ignore the one-shot seed tag so NewestBuild tracks real CI (commit-SHA) images.
      # The initial-build workflow re-pushes :initial periodically, which would otherwise
      # become "newest" and get promoted to prod instead of the latest feature build.
      ignoreTagsRegexes:
        - "^initial$"