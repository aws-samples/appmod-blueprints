apiVersion: kro.run/v1alpha1
kind: AppmodService
metadata:
  name: next-js-app
  namespace: team-nextjs
spec:
  # Multi-arch (amd64+arm64) build of applications/next-js at 60132533 (includes b44b1985 unoptimized product images)
  image: public.ecr.aws/seb-demo/peeks/nextjs-ui@sha256:54c160e354f82993648c65f37bc81f91fe3c164a2b04828e9e000a2268b585fd
  image_name: next-js-app
  replicas: 2
  port: 8080
  targetPort: 8080
  serviceAccount: nextjs-service-account
  clusterName: "${CLUSTER_NAME}"
  accountId: "${AWS_ACCOUNT_ID}"
  resourcePrefix: "${RESOURCE_PREFIX}"
  env:
    - name: API_BASE_URL
      value: "http://rust-microservice.team-rust.svc.cluster.local:8080"
  components:
    dynamodb:
      enabled: false
  ingress:
    enabled: true
    path: /unicorn
    rewrite: false
    healthcheckPath: /unicorn
