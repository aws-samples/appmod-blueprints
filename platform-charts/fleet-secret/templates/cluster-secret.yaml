{{- if eq .Values.mode "direct" }}
{{- $clusterName := required "clusterName is required" .Values.clusterName -}}
{{- $environment := index .Values.labels "environment" | default "" -}}
{{- $oidcCtx := dict "domain" .Values.hub.domain "environment" $environment "realm" (.Values.oidc.realm | default "platform") -}}
{{- $oidcIssuerUrl := tpl .Values.oidc.issuerUrlTemplate $oidcCtx -}}
{{- $overlay := .Values.overlay | default dict -}}
{{- $overlayRepoURL := $overlay.repoURL | default (ternary .Values.hub.fleetRepoURL "" (default false $overlay.useFleetRepo)) -}}
{{- $overlayRepoRevision := $overlay.revision | default (ternary .Values.hub.fleetRepoRevision "" (default false $overlay.useFleetRepo)) | default "main" -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $clusterName }}
  namespace: argocd
  annotations:
    addonsRepoURL: {{ .Values.hub.addonsRepoURL | quote }}
    addonsRepoRevision: {{ .Values.hub.addonsRepoRevision | quote }}
    addonsRepoBasepath: {{ .Values.hub.addonsRepoBasepath | quote }}
    fleetRepoURL: {{ .Values.hub.fleetRepoURL | quote }}
    fleetRepoRevision: {{ .Values.hub.fleetRepoRevision | quote }}
    fleetRepoBasepath: {{ .Values.hub.fleetRepoBasepath | quote }}
    aws_region: {{ .Values.region | quote }}
    aws_account_id: {{ .Values.hub.accountId | quote }}
    aws_cluster_name: {{ $clusterName | quote }}
    ingress_domain_name: {{ .Values.hub.domain | quote }}
    exposure_mode: {{ .Values.hub.exposureMode | default "domain" | quote }}
    # The platform IngressClass must ALWAYS be backed by the OSS AWS Load Balancer
    # Controller (ingress.k8s.aws/alb), never EKS Auto Mode's native controller
    # (eks.amazonaws.com/alb), because the solution relies on LBC-only features
    # (e.g. alb.ingress.kubernetes.io/transforms URL rewrite) not yet supported by
    # Auto Mode. The ingress-class-alb chart reads this annotation (default "auto")
    # to pick the controller — spokes MUST get "oss".
    alb_controller_mode: {{ .Values.hub.albControllerMode | default "oss" | quote }}
    resource_prefix: {{ .Values.hub.resourcePrefix | quote }}
    {{- with .Values.hub.platformTags }}
    # Platform-wide AWS tags (SpringClean auto-delete=no, cost, compliance) as a
    # compact JSON object string, mirrored from the hub so a spoke that itself
    # provisions kro clusters propagates the same retention/cost tags downstream.
    # Consumed by clusters-kro.yaml's global.platformTags (see rg-eks-vpc.yaml awsTags).
    platform_tags: {{ . | quote }}
    {{- end }}
    hub_cluster_name: {{ .Values.hub.clusterName | quote }}
    oidc_issuer_url: {{ $oidcIssuerUrl | quote }}
    oidc_insecure_origin: {{ .Values.oidc.insecureOrigin | default "false" | quote }}
    {{- if $overlayRepoURL }}
    # External overlay repo ("layer 5"). Lets a CONSUMER repo override Helm values
    # for addons whose chart + registry entry live in the platform repo, without
    # editing the platform repo: bootstrap/addons.yaml reads these three
    # annotations into the appset-chart's overlayRepoURLGit*, which appends a
    # $overlay source plus, per addon,
    #   $overlay/<basepath>configs/<addon>/values.yaml
    #   $overlay/<basepath>overlays/environments/<env>/<addon>/values.yaml
    #   $overlay/<basepath>overlays/clusters/<cluster>/<addon>/values.yaml
    # AFTER the in-repo layers, so the consumer's file wins. All are
    # ignoreMissingValueFiles, so unpopulated paths are silent no-ops.
    #
    # overlay.useFleetRepo: true (see values.yaml) inherits hub.fleetRepoURL /
    # hub.fleetRepoRevision here instead of requiring them to be repeated in a
    # second place — for a consumer whose fleet repo and overlay repo are the same
    # repo, which is the common case. An explicit overlay.repoURL still wins.
    #
    # Emitted ONLY when a URL resolves: $overlay becomes a REAL ArgoCD source, so
    # an unreachable/unauthenticated URL would break EVERY overlay-aware app on
    # this cluster. Point it only at a repo ArgoCD can already read.
    overlay_repo_url: {{ $overlayRepoURL | quote }}
    overlay_repo_revision: {{ $overlayRepoRevision | quote }}
    overlay_repo_basepath: {{ $overlay.basepath | default "" | quote }}
    {{- end }}
  labels:
    argocd.argoproj.io/secret-type: cluster
    {{- $labels := .Values.labels | default dict }}
    # Direct mode only renders for spokes (the hub uses externalSecret mode), so
    # tag every fleet-secret-provisioned spoke with fleet_member=spoke to match
    # kro-provisioned spokes (rg-eks.yaml). Overridable via .Values.labels.fleet_member.
    fleet_member: {{ $labels.fleet_member | default "spoke" | quote }}
    {{- range $key, $val := (omit $labels "fleet_member") }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
    {{- range $addon, $enabled := .Values.enabledAddons }}
    {{- if $enabled }}
    enable_{{ $addon }}: 'true'
    {{- end }}
    {{- end }}
stringData:
  name: {{ $clusterName }}
  server: arn:aws:eks:{{ .Values.region }}:{{ .Values.hub.accountId }}:cluster/{{ $clusterName }}
  config: '{"awsAuthConfig":{"clusterName":"{{ $clusterName }}"},"tlsClientConfig":{"insecure":false}}'
{{- end }}
