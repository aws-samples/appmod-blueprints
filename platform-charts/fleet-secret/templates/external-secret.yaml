{{- if eq .Values.mode "externalSecret" }}
{{- $clusterName := required "clusterName is required" .Values.clusterName -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fleet-secret.fullname" . }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRefKind }}
    name: {{ .Values.externalSecret.secretStoreRefName }}
  refreshInterval: "1m"
  target:
    name: {{ $clusterName }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy | default "Owner" }}
    deletionPolicy: Retain
    template:
      engineVersion: v2
      templateFrom:
      - target: Annotations
        literal: "{{`{{ .metadata }}`}}"
      {{- if .Values.externalSecret.annotations }}
      - target: Annotations
        literal: |-
          {{- .Values.externalSecret.annotations | toYaml | nindent 10 }}
      {{- end }}
      {{- with .Values.overlay }}
      {{- if .repoURL }}
      # External overlay repo ("layer 5") — the same three annotations the
      # direct-mode cluster-secret emits, so hub and spokes behave identically.
      # See cluster-secret.yaml (and README.md) for the full explanation and the
      # reachability caveat.
      - target: Annotations
        literal: |-
          overlay_repo_url: {{ .repoURL | quote }}
          overlay_repo_revision: {{ .revision | default "main" | quote }}
          overlay_repo_basepath: {{ .basepath | default "" | quote }}
      {{- end }}
      {{- end }}
      {{- if .Values.externalSecret.labels }}
      - target: Labels
        literal: |-
          {{- .Values.externalSecret.labels | toYaml | nindent 10 }}
      {{- end }}
      - target: Labels
        literal: "{{`{{ .addons }}`}}"
      {{- if .Values.enabledAddons }}
      {{- range $addon, $enabled := .Values.enabledAddons }}
      {{- if $enabled }}
      - target: Labels
        literal: |-
          enable_{{ $addon }}: 'true'
      {{- end }}
      {{- end }}
      {{- end }}
      - target: Labels
        literal: "argocd.argoproj.io/secret-type: cluster"
      data:
        config: "{{`{{ .config }}`}}"
        name: {{ $clusterName }}
        {{- if .Values.externalSecret.clusterArn }}
        server: {{ .Values.externalSecret.clusterArn | quote }}
        {{- else }}
        server: "{{`{{ .server }}`}}"
        {{- end }}
  dataFrom:
    - extract:
        key: {{ $clusterName }}/config
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
