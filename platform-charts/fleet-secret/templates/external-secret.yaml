{{- if eq .Values.mode "externalSecret" }}
{{- $clusterName := required "clusterName is required" .Values.clusterName -}}
{{- $environment := index .Values.labels "environment" | default "" -}}
{{- $oidcCtx := dict "domain" .Values.hub.domain "environment" $environment "realm" (.Values.oidc.realm | default "platform") -}}
{{- $oidcIssuerUrl := tpl .Values.oidc.issuerUrlTemplate $oidcCtx -}}
{{- $overlay := .Values.overlay | default dict -}}
{{- $overlayRepoURL := $overlay.repoURL | default (ternary .Values.hub.fleetRepoURL "" (default false $overlay.useFleetRepo)) -}}
{{- $overlayRepoRevision := $overlay.revision | default (ternary .Values.hub.fleetRepoRevision "" (default false $overlay.useFleetRepo)) | default "main" -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "fleet-secret.fullname" . }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRefKind }}
    name: {{ .Values.externalSecret.secretStoreRefName }}
  refreshInterval: "1m"
  target:
    name: {{ $clusterName }}
    creationPolicy: {{ .Values.externalSecret.creationPolicy | default "Owner" }}
    deletionPolicy: Retain
    template:
      engineVersion: v2
      templateFrom:
      - target: Annotations
        literal: "{{`{{ .metadata }}`}}"
      {{- if .Values.hub.domain }}
      # Provider-neutral OIDC issuer for JWT-validating workloads on this spoke
      # (e.g. agent-gateway). The IdP (Keycloak or any other OIDC provider) is
      # hub-only, so the issuer is always derived from the HUB's public domain,
      # never an in-cluster Service URL. Computed the same way as the direct-mode
      # cluster-secret (see cluster-secret.yaml and values.yaml's oidc.* comment).
      - target: Annotations
        literal: |-
          oidc_issuer_url: {{ $oidcIssuerUrl | quote }}
      {{- end }}
      {{- if .Values.externalSecret.annotations }}
      - target: Annotations
        literal: |-
          {{- .Values.externalSecret.annotations | toYaml | nindent 10 }}
      {{- end }}
      {{- if $overlayRepoURL }}
      # External overlay repo ("layer 5") — the same three annotations the
      # direct-mode cluster-secret emits, so hub and spokes behave identically.
      # See cluster-secret.yaml (and README.md) for the full explanation, the
      # reachability caveat, and overlay.useFleetRepo (inherit the fleet repo
      # instead of repeating its URL/revision here).
      - target: Annotations
        literal: |-
          overlay_repo_url: {{ $overlayRepoURL | quote }}
          overlay_repo_revision: {{ $overlayRepoRevision | quote }}
          overlay_repo_basepath: {{ $overlay.basepath | default "" | quote }}
      {{- end }}
      {{- if .Values.externalSecret.labels }}
      - target: Labels
        literal: |-
          {{- .Values.externalSecret.labels | toYaml | nindent 10 }}
      {{- end }}
      - target: Labels
        literal: "{{`{{ .addons }}`}}"
      {{- if .Values.enabledAddons }}
      {{- range $addon, $enabled := .Values.enabledAddons }}
      {{- if $enabled }}
      - target: Labels
        literal: |-
          enable_{{ $addon }}: 'true'
      {{- end }}
      {{- end }}
      {{- end }}
      - target: Labels
        literal: "argocd.argoproj.io/secret-type: cluster"
      data:
        config: "{{`{{ .config }}`}}"
        name: {{ $clusterName }}
        {{- if .Values.externalSecret.clusterArn }}
        server: {{ .Values.externalSecret.clusterArn | quote }}
        {{- else }}
        server: "{{`{{ .server }}`}}"
        {{- end }}
  dataFrom:
    - extract:
        key: {{ $clusterName }}/config
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end }}
