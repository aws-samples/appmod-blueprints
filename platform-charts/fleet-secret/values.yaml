# Mode: "externalSecret" (hub) or "direct" (spokes)
mode: "direct"

# Common fields
clusterName: ""
region: ""
labels: {}

# External Secret mode (hub only)
externalSecret:
  enabled: false
  creationPolicy: Owner
  secretStoreRefKind: ClusterSecretStore
  secretStoreRefName: aws-secrets-manager

# Direct mode fields — populated from hub cluster secret annotations
hub:
  clusterName: ""
  accountId: ""
  addonsRepoURL: ""
  addonsRepoRevision: ""
  addonsRepoBasepath: ""
  fleetRepoURL: ""
  fleetRepoRevision: ""
  fleetRepoBasepath: ""
  domain: ""
  resourcePrefix: ""
  # platform IngressClass controller mode: "oss" (AWS LBC, ingress.k8s.aws/alb) or
  # "auto" (EKS Auto Mode, eks.amazonaws.com/alb). Spokes default to "oss" so the
  # platform class is always the OSS LBC (required for transforms/URL-rewrite).
  albControllerMode: "oss"

# External overlay repo ("layer 5") — OPTIONAL, default OFF.
#
# Set repoURL to a CONSUMER repo to let it override Helm values for addons whose
# chart + registry entry live in THIS repo, without editing this repo. Rendered as
# the overlay_repo_* cluster-secret annotations, which bootstrap/addons.yaml feeds
# to the appset-chart as overlayRepoURLGit* — that appends a $overlay source and,
# per addon, three extra valueFiles that layer AFTER the in-repo ones.
# See README.md § External overlay repo for the full walkthrough.
#
# WARNING: when set, $overlay becomes a REAL ArgoCD source for every overlay-aware
# app on that cluster — an unreachable or unauthenticated repo breaks all of them.
# Leave empty unless ArgoCD can already read the repo.
overlay:
  repoURL: ""
  # MUST be a revision that actually contains the overlay files.
  revision: "main"
  # Repo-relative root holding configs/ + overlays/ (e.g. "gitops/"). Falls back to
  # addonsRepoBasepath when empty.
  basepath: ""

# Addon enablement map — populated from enabled-addons.yaml via valueFiles
enabledAddons: {}

# OIDC configuration — used to derive oidc_issuer_url on spoke cluster secrets.
# issuerUrlTemplate is a Go template evaluated with:
#   .domain      = hub.domain (ingress_domain_name)
#   .environment = labels.environment from the fleet-member values file
#   .realm       = oidc.realm (below)
# The issuer realm MUST match the realm where the client is created by the
# client-provisioner. Both default to the shared "platform" realm.
# Customers override .realm per hub/spoke via the fleet-member values
# (oidc.realm), or swap issuerUrlTemplate entirely for an external IdP.
oidc:
  realm: "platform"
  issuerUrlTemplate: "https://{{ .domain }}/keycloak/realms/{{ .realm }}"
  insecureOrigin: "false"
