version: "3"
set: [errexit, nounset, pipefail]
silent: true

includes:
  ray:
    taskfile: ../common/Taskfile.ray.yaml
    vars:
      AWS_REGION: '{{.AWS_REGION}}'
      AWS_ACCOUNT_ID: '{{.AWS_ACCOUNT_ID}}'
      HUB_CLUSTER_NAME: '{{.HUB_CLUSTER_NAME}}'
      RESOURCE_PREFIX: '{{.RESOURCE_PREFIX}}'
      ROOT_DIR: '{{.ROOT_DIR}}'

env:
  KUBECONFIG: "{{.ROOT_DIR}}/private/kubeconfig"
  AWS_PAGER: ""
  # A 40-minute install makes many AWS calls; a single unretried transient failure
  # used to discard all prior work (observed: one `describe-cluster` hit
  # "Could not connect to the endpoint URL" after the hub was already ACTIVE and
  # aborted the run). The CLI already retries — v2 defaults to standard mode, 3
  # total attempts with exponential backoff — so the fix is a bigger budget, not a
  # hand-rolled retry wrapper around a client that is already retrying. Set here so
  # every aws call in install and destroy inherits it.
  AWS_RETRY_MODE: "standard"
  AWS_MAX_ATTEMPTS: "10"

vars:
  GITOPS_ROOT: "{{.ROOT_DIR}}/gitops"
  REQUIRED_CLIS: [kind, kubectl, helm, yq, aws]
  HUB_CLUSTER_NAME:
    sh: yq '.hub.clusterName' {{.CONFIG_FILE}}
  HUB_K8S_VERSION:
    sh: yq '.hub.kubernetesVersion // "1.37"' {{.CONFIG_FILE}}
  HUB_VPC_CIDR:
    sh: yq '.hub.vpcCidr // "10.0.0.0/16"' {{.CONFIG_FILE}}
  HUB_VPC_PREFIX:
    sh: yq '.hub.vpcCidr // "10.0.0.0/16"' {{.CONFIG_FILE}} | cut -d. -f1-2
  # Option D: when hub.network.vpcId is set (CDK pre-created VPC), the hub uses
  # EksCluster (without VPC creation). When unset, falls back to EksclusterWithVpc.
  HUB_VPC_ID:
    sh: yq '.hub.network.vpcId // ""' {{.CONFIG_FILE}}
  HUB_SUBNET_1:
    sh: yq '.hub.network.subnetIds[0] // ""' {{.CONFIG_FILE}}
  HUB_SUBNET_2:
    sh: yq '.hub.network.subnetIds[1] // ""' {{.CONFIG_FILE}}
  AWS_ACCOUNT_ID:
    sh: yq '.aws.accountId' {{.CONFIG_FILE}}
  AWS_REGION:
    sh: yq '.aws.region' {{.CONFIG_FILE}}
  REPO_URL:
    sh: yq '.repo.url' {{.CONFIG_FILE}}
  REPO_REVISION:
    sh: yq '.repo.revision' {{.CONFIG_FILE}}
  REPO_BASEPATH:
    sh: yq '.repo.basepath' {{.CONFIG_FILE}}
  # Fleet content (fleet/members, fleet/spoke-values, overlays) may live in a
  # DIFFERENT repo than the platform charts — a consumer repo owns its own fleet
  # while still consuming platform addons from here. Falls back to repo.* so a
  # config without a fleetRepo block behaves exactly as before.
  # Keep in sync with cluster-providers/kind-crossplane/Taskfile.yaml.
  FLEET_REPO_URL:
    sh: yq '.fleetRepo.url // .repo.url' {{.CONFIG_FILE}}
  FLEET_REPO_REVISION:
    sh: yq '.fleetRepo.revision // .repo.revision' {{.CONFIG_FILE}}
  FLEET_REPO_BASEPATH:
    sh: yq '.fleetRepo.basepath // .repo.basepath' {{.CONFIG_FILE}}
  # OAP (Open Agentic Platform) addon coordinates. Emitted into the hub cluster
  # secret as snake_case annotations addons_repo_url / addons_repo_revision, which
  # the OAP addon registry (gitops/addons/registry/_defaults.yaml) reads to resolve
  # repoURLGit / repoURLGitRevision for the agent-platform fan-out appsets. This is
  # what makes a FRESH deploy annotation-driven (no hardcoded revision in any appset).
  # Empty (no agenticRepo block) -> the annotation renders empty -> _defaults' own
  # `default` fallback applies, so a non-OAP config behaves exactly as before.
  AGENTIC_REPO_URL:
    sh: yq '.agenticRepo.url // ""' {{.CONFIG_FILE}}
  AGENTIC_REPO_REVISION:
    sh: yq '.agenticRepo.revision // ""' {{.CONFIG_FILE}}
  DOMAIN:
    sh: yq '.domain // ""' {{.CONFIG_FILE}}
  RESOURCE_PREFIX:
    sh: yq '.resourcePrefix // ""' {{.CONFIG_FILE}}
  INGRESS_NAME:
    sh: yq '.ingressName // ""' {{.CONFIG_FILE}}
  INGRESS_SECURITY_GROUPS:
    sh: yq '.ingressSecurityGroups // ""' {{.CONFIG_FILE}}
  # Exposure: platform does not provision a domain/CloudFront. insecure -> HTTP-only
  # ALB (consumer terminates TLS upstream); false -> HTTPS with ACM. Written verbatim
  # to the cluster-secret annotation chain the addon charts consume.
  INSECURE:
    sh: yq '.insecure // false' {{.CONFIG_FILE}}
  INGRESS_CERT_ARN:
    sh: yq '.certificateArn // ""' {{.CONFIG_FILE}}
  ADMIN_ROLE_NAME:
    sh: yq '.hub.adminRoleName // .adminRoleName // "Admin"' {{.CONFIG_FILE}}
  CAPABILITY_NAME:
    sh: yq '.argocdCapability.name // "argocd"' {{.CONFIG_FILE}}
  IDC_INSTANCE_ARN:
    sh: yq '.identityCenter.instanceArn' {{.CONFIG_FILE}}
  IDC_REGION:
    sh: yq '.identityCenter.region' {{.CONFIG_FILE}}
  IDC_IDENTITY_STORE_ID:
    sh: yq '.identityCenter.identityStoreId // ""' {{.CONFIG_FILE}}
  IDC_ADMIN_GROUP_ID:
    sh: yq '.identityCenter.adminGroupId // ""' {{.CONFIG_FILE}}
  KIND_CLUSTER_NAME: "{{.HUB_CLUSTER_NAME}}-bootstrap"
  CALLER_ROLE_ARN:
    sh: |
      # Try STS first — works when AWS credentials are already configured.
      #
      # Do NOT use `2>/dev/null || true` here. This value is REQUIRED: an empty
      # result aborts the install with "cannot create hub:claim ... Ensure AWS
      # credentials are configured", which sends the operator to check credentials
      # that were never broken. A transient STS failure (throttle, DNS, reset) used
      # to be swallowed into an empty ARN and misreported as a config error; the
      # same command succeeded on the next three runs with no changes.
      # Keep stderr so the real cause is visible, and only fall through to the
      # fallbacks below when STS genuinely returned nothing.
      STS_ERR=$(mktemp)
      ARN=$(aws sts get-caller-identity --query "Arn" --output text 2>"$STS_ERR" || true)
      if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
        if [ -s "$STS_ERR" ]; then
          echo "  sts get-caller-identity failed: $(tr '\n' ' ' < "$STS_ERR")" >&2
        fi
      fi
      rm -f "$STS_ERR"
      if [ -n "$ARN" ] && [ "$ARN" != "None" ]; then
        if echo "$ARN" | grep -q ":assumed-role/"; then
          echo "$ARN" | sed 's|arn:aws:sts::|arn:aws:iam::|;s|:assumed-role/|:role/|;s|/[^/]*$||'
        else
          echo "$ARN"
        fi
        exit 0
      fi
      # Fallback 1: WS_PARTICIPANT_ROLE_ARN env var (set by CDK bootstrap in workshop.sh)
      if [ -n "${WS_PARTICIPANT_ROLE_ARN:-}" ]; then
        WS="$WS_PARTICIPANT_ROLE_ARN"
        if echo "$WS" | grep -q ":assumed-role/"; then
          echo "$WS" | sed 's|arn:aws:sts::|arn:aws:iam::|;s|:assumed-role/|:role/|;s|/[^/]*$||'
        else
          echo "$WS"
        fi
        exit 0
      fi
      # Fallback 2: adminRoleName from config + account ID (best-effort ARN construction)
      ROLE=$(yq '.adminRoleName // ""' {{.CONFIG_FILE}} 2>/dev/null || true)
      ACCT=$(yq '.aws.accountId // ""' {{.CONFIG_FILE}} 2>/dev/null || true)
      if [ -n "$ROLE" ] && [ -n "$ACCT" ] && [ "$ROLE" != "null" ] && [ "$ACCT" != "null" ]; then
        echo "arn:aws:iam::${ACCT}:role/${ROLE}"
        exit 0
      fi
      echo ""
  ACK_NAMESPACE: "ack-system"
  KRO_NAMESPACE: "kro-system"
  ACK_IAM_VERSION: "1.6.4"
  ACK_EKS_VERSION: "1.13.0"
  ACK_EC2_VERSION: "1.12.0"
  ACK_SECRETSMANAGER_VERSION: "1.3.1"
  KRO_VERSION: "0.9.4"
  ARGOCD_VERSION:
    sh: yq '.argocd.defaultVersion' {{.ROOT_DIR}}/gitops/addons/registry/core.yaml
  C_INFO:
    sh: printf '\033[1;36m'
  C_OK:
    sh: printf '\033[1;32m'
  C_STEP:
    sh: printf '\033[1;33m'
  C_ERR:
    sh: printf '\033[1;31m'
  C_WARN:
    sh: printf '\033[0;33m'
  C_RESET:
    sh: printf '\033[0m'

tasks:
  validate:
    desc: Pre-flight checks
    cmds:
      - cmd: command -v {{.ITEM}} >/dev/null 2>&1 || { echo "Missing {{.ITEM}}"; exit 1; }
        for:
          var: REQUIRED_CLIS
      - test -f {{.CONFIG_FILE}} || { echo "config.local.yaml not found"; exit 1; }
      - aws sts get-caller-identity >/dev/null || { echo "AWS credentials not configured"; exit 1; }
      - printf '{{.C_OK}}✓ Pre-flight checks passed.{{.C_RESET}}\n'

  install:
    desc: Bootstrap the platform (idempotent)
    vars:
      INSTALL_START:
        sh: date +%s
    cmds:
      - task: kind:create
      - task: kind:kubeconfig
      - task: credentials:setup
      - task: ack:install
      - task: kro:install
      - task: kro:install-eso-bootstrap
      - task: kro:install-cluster-secret-store-bootstrap
      - task: kro:apply-rgds
      # Create the cluster-mgmt IAM roles BEFORE hub:claim.
      # The eksclusterwithvpc RGD immediately tries to create ACK-managed IAM resources
      # (cniMetricsHelperPolicy, adotCollectorPolicy, etc.) when KRO reconciles the claim.
      # ACK EKS Capability assumes the peeks-cluster-mgmt-iam role (created here) to create
      # those AWS IAM resources. Without these roles, ACK cannot reconcile the Policy CRs and
      # KRO stays stuck reporting:
      #   "cniMetricsHelperPolicy.status.ackResourceMetadata.arn: no such key: arn (data pending)"
      # Running this before hub:claim ensures the roles exist when ACK first processes the CRs.
      - task: hub:create-mgmt-roles
      - task: hub:claim
      - task: hub:wait-for-eks
      - task: hub:authorize-ide-access
      # Re-check credentials before hub:seed — if this is a resumed install
      # the kind cluster credentials may have expired (STS tokens last ~1h).
      - task: credentials:check-and-refresh
      - task: hub:wait-for-gitlab-init
      - task: hub:seed
      - task: hub:force-eso-refresh
      - task: hub:wait-for-sync
        vars: { MAX_OUTOFSYNC: "20" }
      # Bootstrap the hub Crossplane providers' credentials (create provider-aws-iam/eks pod
      # identities + restart) so crossplane-base's provider roles/PIAs (amp/rds/grafana/devlake)
      # can reconcile. Done imperatively here (like the crossplane/terraform flows) rather than in
      # the RGD: the hub is provisioned once by the transient kind cluster, so an RGD-based hub
      # bootstrap can't self-heal an already-running hub. crossplane-base only declares the
      # downstream provider PIAs (createIdentity:false for iam/eks) — nothing else seeds the first
      # credential, so without this the whole crossplane chain stays credential-less.
      - task: hub:bootstrap-crossplane-identity
      # Enable spokes EARLY (kro-ack-specific optimization): KRO-provisioned spokes are
      # created by the hub's ACK EKS capability, NOT the Crossplane providers, so spoke
      # NOTE: spoke enablement and fleet-overlay wiring are CONSUMER concerns (the
      # consumer owns the gitops/fleet repo). This generic provider provisions the
      # hub only and exposes the PlatformCluster abstraction; consumers (e.g. the
      # workshop, or OAP) declare spokes against their own repo / via PlatformCluster
      # claims. See workshop/ for the reference consumer.
      # Crossplane provider bring-up for the hub's OWN observability (AMP/RDS/Grafana).
      - task: install:post-sync
      # ── Perf lever #1 (kro-ack): NEITHER the global full-sync wait NOR the
      #    Crossplane-providers wait is a precondition for the consumer declaring
      #    spokes. KRO-provisioned spokes are created by the hub's ACK EKS
      #    capability — ready UPSTREAM here (ack:install / kro:install /
      #    kro:apply-rgds / hub:create-mgmt-roles / hub:claim) — NOT by Crossplane.
      #    The Crossplane providers at this point serve only the hub's OWN
      #    observability (AMP/RDS/Grafana) + agentcore, which converge on their own.
      #    Forensics (v0.4.0-rc2, a kro-ack deploy): the old blocking full-sync gate
      #    sat ~17 min solely on crossplane-base (the providers app), then
      #    hub:wait-for-providers confirmed Healthy in ~2 s. So move BOTH waits into
      #    a non-blocking background settle (which KEEPS the crossplane-base
      #    force-sync remediation) and return "hub bootstrap complete" immediately →
      #    the consumer declares spokes ~25 min sooner so spoke provisioning (~21 min)
      #    overlaps the hub settle instead of queuing after it.
      - task: install:hub-settle-bg
      - task: install:finalize
      - printf '{{.C_OK}}✓ Platform hub bootstrap complete in %ds. Run task status.{{.C_RESET}}\n' "$(($(date +%s) - {{.INSTALL_START}}))"

  install:post-sync:
    internal: true
    deps:
      - hub:restart-identity-pods
      - install:phase1-observability-bg

  install:phase1-observability-bg:
    internal: true
    desc: Seed observability in background — non-blocking so slow AMP provisioning doesn't delay install
    cmds:
      - |
        # Repo root from {{.ROOT_DIR}} (expanded by go-task at TEMPLATE time, before any
        # shell runs — the backgrounded subshell below cannot affect it; verified). In an
        # included Taskfile ROOT_DIR is the ROOT Taskfile's directory, i.e. the repo root
        # (this file's own directory is TASKFILE_DIR).
        #
        # Do NOT reintroduce WORKSPACE_PATH / WORKING_REPO here. Those are Workshop Studio
        # env vars; on any other machine both defaults are wrong, so this backgrounded job
        # cd'd into a nonexistent directory and failed SILENTLY.
        REPO_ROOT="{{.ROOT_DIR}}"
        # Fail loudly rather than silently seeding nothing: `task kind-kro-ack:...` below
        # requires the root Taskfile to be present at REPO_ROOT.
        if [ ! -f "$REPO_ROOT/Taskfile.yaml" ]; then
          printf '{{.C_ERR}}✗ observability seed not started: no Taskfile.yaml at %s (repo root misresolved).{{.C_RESET}}\n' "$REPO_ROOT"
          exit 1
        fi
        # DETACH via double-fork (`sh -c '... &'`), NOT a bare `( ... ) &`.
        # go-task runs cmds through the mvdan/sh interpreter, which KILLS its background
        # jobs when the task body exits — verified that a bare `( ... ) &` never even
        # creates its redirect target, so the long AMP poll could never survive. The outer
        # `sh` exits at once, orphaning the subshell so it outlives go-task. REPO_ROOT is
        # passed via the environment so paths with spaces/quotes are safe.
        REPO_ROOT="$REPO_ROOT" \
          sh -c '( cd "$REPO_ROOT" && exec task kind-kro-ack:secrets-manager:seed-observability ) >> /tmp/observability-seed.log 2>&1 < /dev/null &'
        printf '{{.C_INFO}}  Observability seeding running in background (log: /tmp/observability-seed.log){{.C_RESET}}\n'

  install:finalize:
    internal: true
    # Keycloak-dependent steps must run AFTER Keycloak is configured (review #1053 §3/§4):
    # the restarts flush stale OIDC sockets / pick up the client secret the
    # keycloak-config PostSync hook writes, and the consumer's idc:configure needs the
    # platform realm live. Sequential cmds (not parallel deps) so the narrow gate runs
    # FIRST — and because finalize is foreground, this also gives idc:configure its
    # Keycloak head start before the hub returns.
    cmds:
      - task: hub:wait-for-keycloak
      - task: hub:restart-langfuse
      - task: hub:restart-backstage
      - task: urls

  # ── Perf lever #1 (background settle launcher) ──────────────────────────────
  # Launch hub:settle in the background so `task install` returns immediately after
  # install:post-sync. For kro-ack the KRO/ACK spoke machinery is already ready
  # upstream, so neither the full-sync wait nor the Crossplane-providers wait needs
  # to block the install return — both move here. Non-blocking by design.
  install:hub-settle-bg:
    internal: true
    desc: Launch the hub settle (full-sync + crossplane-base remediation) in the background (non-blocking)
    cmds:
      - |
        REPO_ROOT="{{.ROOT_DIR}}"
        # `task kind-kro-ack:hub:settle` below needs the ROOT Taskfile. In an included
        # Taskfile {{.ROOT_DIR}} is the repo root (expanded at template time, before any
        # shell runs — the backgrounded subshell cannot change it).
        if [ ! -f "$REPO_ROOT/Taskfile.yaml" ]; then
          printf '{{.C_ERR}}✗ hub settle not started: no Taskfile.yaml at %s (repo root misresolved).{{.C_RESET}}\n' "$REPO_ROOT"
          exit 1
        fi
        # DETACH so the ~40-min settle BOTH outlives go-task AND releases the install's
        # stdout/stderr: `exec task` replaces the subshell (no wrapper shell lingers),
        # the redirect is applied to the SUBSHELL — `) >> log 2>&1` — so go-task's own
        # fds are closed (not just task's), and `< /dev/null` detaches stdin. Otherwise
        # the orphaned subshell keeps the SSM `tslog | tee` pipe open and cfn-signal
        # blocks until the settle ends, up to 40 min (review #1053 §2). REPO_ROOT via
        # env so paths with spaces are safe. (Same idiom as install:phase1-observability-bg.)
        # setsid (review #1053 hardening): run the settle in its OWN session so a
        # group-wide SIGINT/SIGTERM — e.g. SSM killing the caller's process group on
        # executionTimeout — doesn't reach the detached settle. flock -n gives the
        # single-instance guard (a second `task install` skips a duplicate settle).
        # CRITICAL (review #1053 §3): the `&` is INSIDE sh -c and the redirect lands on
        # the backgrounded subshell, so sh -c returns at ONCE and releases go-task's
        # stdout (the SSM `tslog | tee` pipe). If the `&` sits OUTSIDE sh -c (prior
        # form), the outer sh keeps that stdout for the whole settle and cfn-signal
        # blocks up to 40 min. exec leaves no wrapper shell holding fds. Degrades
        # gracefully where setsid/flock are absent (the IDE has both; util-linux).
        if command -v setsid >/dev/null 2>&1 && command -v flock >/dev/null 2>&1; then
          REPO_ROOT="$REPO_ROOT" \
            sh -c '( cd "$REPO_ROOT" && exec setsid flock -n /tmp/hub-settle.lock task kind-kro-ack:hub:settle ) >> /tmp/hub-full-sync-settle.log 2>&1 < /dev/null &'
        else
          REPO_ROOT="$REPO_ROOT" \
            sh -c '( cd "$REPO_ROOT" && exec task kind-kro-ack:hub:settle ) >> /tmp/hub-full-sync-settle.log 2>&1 < /dev/null &'
        fi
        printf '{{.C_INFO}}  Lever #1: hub addons + Crossplane providers settling in background (log: /tmp/hub-full-sync-settle.log); install continues — KRO/ACK spoke machinery is already ready.{{.C_RESET}}\n'

  kind:create:
    desc: Create Kind cluster (skips if exists)
    # `kind get clusters` exercises kind's own provider connection, so this reports an
    # unreachable container runtime instead of letting `kind create` fail with a raw
    # socket error that names neither the cause nor the remedy. Deliberately runtime
    # AGNOSTIC: runtime selection is kind's contract via KIND_EXPERIMENTAL_PROVIDER and
    # belongs in the operator's environment, not in these Taskfiles.
    preconditions:
      - sh: kind get clusters >/dev/null 2>&1
        msg: |
          No container runtime reachable for kind.
          Start Docker, or export KIND_EXPERIMENTAL_PROVIDER for another runtime
          (e.g. KIND_EXPERIMENTAL_PROVIDER=podman), then re-run.
    status:
      - kind get clusters 2>/dev/null | grep -q "^{{.KIND_CLUSTER_NAME}}$"
    cmds:
      - kind create cluster --name {{.KIND_CLUSTER_NAME}} --config kind.yaml --kubeconfig {{.KUBECONFIG}}

  kind:kubeconfig:
    desc: Ensure kind cluster kubeconfig is present (idempotent)
    cmds:
      - mkdir -p {{.ROOT_DIR}}/private
      - kind export kubeconfig --name {{.KIND_CLUSTER_NAME}} --kubeconfig {{.KUBECONFIG}} 2>/dev/null || true
      - kubectl config use-context kind-{{.KIND_CLUSTER_NAME}} --kubeconfig {{.KUBECONFIG}} 2>/dev/null || true

  credentials:setup:
    desc: Create AWS credentials secret (skips if exists)
    status:
      - kubectl -n {{.ACK_NAMESPACE}} get secret aws-credentials 2>/dev/null
    cmds:
      - task: credentials:refresh

  credentials:check-and-refresh:
    desc: "Refresh AWS credentials if expired or missing (safe to call on every install)"
    cmds:
      - |
        # Test if current ACK credentials are still valid.
        # Safe when kind cluster/secret doesn't exist yet — will refresh in that case too.
        NEEDS_REFRESH=false
        if ! kubectl -n {{.ACK_NAMESPACE}} get secret aws-credentials >/dev/null 2>&1; then
          printf '{{.C_INFO}}  ACK credentials secret missing — will create.{{.C_RESET}}\n'
          NEEDS_REFRESH=true
        else
          AKI=$(kubectl -n {{.ACK_NAMESPACE}} get secret aws-credentials \
            -o jsonpath='{.data.credentials}' 2>/dev/null | base64 -d | \
            grep aws_access_key_id | awk '{print $3}' || true)
          SAK=$(kubectl -n {{.ACK_NAMESPACE}} get secret aws-credentials \
            -o jsonpath='{.data.credentials}' 2>/dev/null | base64 -d | \
            grep aws_secret_access_key | awk '{print $3}' || true)
          ST=$(kubectl -n {{.ACK_NAMESPACE}} get secret aws-credentials \
            -o jsonpath='{.data.credentials}' 2>/dev/null | base64 -d | \
            grep aws_session_token | awk '{print $3}' || true)
          RESULT=$(AWS_ACCESS_KEY_ID="$AKI" AWS_SECRET_ACCESS_KEY="$SAK" \
            AWS_SESSION_TOKEN="$ST" aws sts get-caller-identity \
            --region {{.AWS_REGION}} --output text 2>&1 || echo "FAILED")
          if echo "$RESULT" | grep -qiE "ExpiredToken|InvalidClientTokenId|AuthFailure|FAILED"; then
            printf '{{.C_INFO}}  ACK credentials expired — refreshing...{{.C_RESET}}\n'
            NEEDS_REFRESH=true
          else
            printf '{{.C_OK}}✓ ACK credentials valid.{{.C_RESET}}\n'
          fi
        fi
        [ "$NEEDS_REFRESH" = "true" ] && task credentials:refresh || true

  credentials:refresh:
    desc: Force-refresh AWS credentials secret
    cmds:
      - kubectl create namespace {{.ACK_NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - |
        set -e
        # Prefer explicit aws.profile from config — IMDS only used as fallback when no profile
        # is set (or set to "default"). Without this, EC2-hosted runners (Cloud9, Workshop Studio,
        # any EC2-based bootstrap host) silently override the user's intended account by reading
        # the instance role from IMDS, causing ACK controllers to provision in the wrong account.
        AWS_PROFILE_NAME=$(yq '.aws.profile // ""' {{.CONFIG_FILE}})
        AKI=""; SAK=""; ST=""
        if [ -n "$AWS_PROFILE_NAME" ] && [ "$AWS_PROFILE_NAME" != "default" ]; then
          printf '  Using AWS profile from config: %s\n' "$AWS_PROFILE_NAME"
          EXPORTED=$(aws configure export-credentials --profile "$AWS_PROFILE_NAME" --format env-no-export)
          AKI=$(echo "$EXPORTED" | sed -n 's/^AWS_ACCESS_KEY_ID=//p')
          SAK=$(echo "$EXPORTED" | sed -n 's/^AWS_SECRET_ACCESS_KEY=//p')
          ST=$(echo  "$EXPORTED" | sed -n 's/^AWS_SESSION_TOKEN=//p')
        else
          TOKEN=$(curl -s -m 2 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" 2>/dev/null || true)
          if [ -n "$TOKEN" ]; then
            printf '  Using EC2 instance role credentials (IMDS)\n'
            ROLE=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/)
            CREDS=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/iam/security-credentials/$ROLE)
            AKI=$(echo "$CREDS" | jq -r .AccessKeyId)
            SAK=$(echo "$CREDS" | jq -r .SecretAccessKey)
            ST=$(echo  "$CREDS" | jq -r .Token)
          else
            printf '  Using AWS default profile\n'
            EXPORTED=$(aws configure export-credentials --profile default --format env-no-export)
            AKI=$(echo "$EXPORTED" | sed -n 's/^AWS_ACCESS_KEY_ID=//p')
            SAK=$(echo "$EXPORTED" | sed -n 's/^AWS_SECRET_ACCESS_KEY=//p')
            ST=$(echo  "$EXPORTED" | sed -n 's/^AWS_SESSION_TOKEN=//p')
          fi
        fi
        if [ -z "$AKI" ] || [ -z "$SAK" ]; then echo "ERROR: empty credentials"; exit 1; fi
        rm -f {{.ROOT_DIR}}/private/aws-creds.ini
        install -m 600 /dev/null {{.ROOT_DIR}}/private/aws-creds.ini
        {
          echo "[default]"
          echo "aws_access_key_id = $AKI"
          echo "aws_secret_access_key = $SAK"
          # MUST be an `if`, not `[ -n "$ST" ] && echo ...`. As the last command of the
          # brace group, a bare test sets the group's exit status, so with plain IAM user
          # credentials (no session token) the group returns 1 and errexit aborts the task
          # — the file is written correctly, only the status is wrong. Role, SSO and
          # instance-profile credentials all carry a session token, which is why this only
          # ever fails for long-lived access keys. kind-crossplane fixed this in 932df63e;
          # keep both providers on the `if` form.
          if [ -n "$ST" ]; then echo "aws_session_token = $ST"; fi
        } > {{.ROOT_DIR}}/private/aws-creds.ini
      - kubectl -n {{.ACK_NAMESPACE}} create secret generic aws-credentials
          --from-file=credentials={{.ROOT_DIR}}/private/aws-creds.ini
          --dry-run=client -o yaml | kubectl apply -f -
      - |
        # Also refresh eso-aws-credentials (ESO needs individual keys, not INI format)
        # awk, not `grep X | awk`: for a plain IAM user there is no aws_session_token
        # line, so grep exits 1, and under go-task's mvdan/sh (which implements pipefail
        # strictly, unlike /bin/sh) the whole pipeline inherits that 1 and errexit aborts
        # the task. awk matches internally, emits nothing when absent, and exits 0.
        # Preferred over `|| true`, which would also swallow a real failure of the
        # kubectl/base64 step feeding $CREDS.
        CREDS=$(kubectl -n {{.ACK_NAMESPACE}} get secret aws-credentials -o jsonpath='{.data.credentials}' | base64 -d)
        kubectl -n {{.ACK_NAMESPACE}} create secret generic eso-aws-credentials \
          --from-literal=access-key-id="$(echo "$CREDS" | awk '/aws_access_key_id/{print $3}')" \
          --from-literal=secret-access-key="$(echo "$CREDS" | awk '/aws_secret_access_key/{print $3}')" \
          --from-literal=session-token="$(echo "$CREDS" | awk '/aws_session_token/{print $3}')" \
          --dry-run=client -o yaml | kubectl apply -f -
      - rm -f {{.ROOT_DIR}}/private/aws-creds.ini
      - |
        # Restart ACK controllers so they immediately pick up the fresh credentials
        # (without restart they poll every ~30s which can leave PIAs in Unknown state)
        printf '{{.C_STEP}}▸ Restarting ACK controllers to pick up fresh credentials...{{.C_RESET}}\n'
        kubectl rollout restart deployment -n {{.ACK_NAMESPACE}} 2>/dev/null || true
        printf '{{.C_OK}}✓ ACK controllers restarting — PIAs will re-sync in ~30s{{.C_RESET}}\n'

  argocd:install:
    desc: Install ArgoCD (skips if deployed)
    status:
      - helm status argocd -n argocd 2>/dev/null | grep -q deployed
    cmds:
      - helm repo add argo https://argoproj.github.io/argo-helm --force-update
      - helm upgrade --install argocd argo/argo-cd
          --namespace argocd --create-namespace
          --version {{.ARGOCD_VERSION}}
          --wait --timeout 5m

  ack:install:
    desc: Install ACK controllers (IAM, EKS, EC2, SecretsManager)
    cmds:
      - task: ack:install-controller
        vars: { CONTROLLER: iam, VERSION: "{{.ACK_IAM_VERSION}}" }
      - task: ack:install-controller
        vars: { CONTROLLER: eks, VERSION: "{{.ACK_EKS_VERSION}}" }
      - task: ack:install-controller
        vars: { CONTROLLER: ec2, VERSION: "{{.ACK_EC2_VERSION}}" }
      - task: ack:install-controller
        vars: { CONTROLLER: secretsmanager, VERSION: "{{.ACK_SECRETSMANAGER_VERSION}}" }
      - printf '{{.C_OK}}✓ ACK controllers installed.{{.C_RESET}}\n'

  ack:install-controller:
    internal: true
    status:
      - helm status ack-{{.CONTROLLER}}-controller -n {{.ACK_NAMESPACE}} 2>/dev/null | grep -q deployed
    cmds:
      - helm install ack-{{.CONTROLLER}}-controller
          oci://public.ecr.aws/aws-controllers-k8s/{{.CONTROLLER}}-chart
          --namespace {{.ACK_NAMESPACE}} --create-namespace
          --version {{.VERSION}}
          --set aws.region={{.AWS_REGION}}
          --set aws.credentials.secretName=aws-credentials
          --set aws.credentials.secretKey=credentials
          --set serviceAccount.name=ack-{{.CONTROLLER}}-controller
          --wait --timeout 5m

  kro:install:
    desc: Install KRO controller
    status:
      - helm status kro -n {{.KRO_NAMESPACE}} 2>/dev/null | grep -q deployed
    cmds:
      - helm install kro oci://registry.k8s.io/kro/charts/kro
          --namespace {{.KRO_NAMESPACE}} --create-namespace
          --version {{.KRO_VERSION}}
          --wait --timeout 5m
      - printf '{{.C_OK}}✓ KRO installed.{{.C_RESET}}\n'

  kro:install-eso-bootstrap:
    desc: Install External Secrets Operator on the bootstrap kind cluster (required for RGD schema validation)
    vars:
      ESO_VERSION:
        sh: yq '.external-secrets.defaultVersion' {{.GITOPS_ROOT}}/addons/registry/core.yaml
    status:
      - helm status external-secrets -n external-secrets 2>/dev/null | grep -q deployed
    cmds:
      - helm repo add external-secrets https://charts.external-secrets.io --force-update
      - helm upgrade --install external-secrets external-secrets/external-secrets
          --namespace external-secrets --create-namespace
          --version {{.ESO_VERSION}}
          --set serviceAccount.name=external-secrets-sa
          --wait --timeout 5m
      - printf '{{.C_OK}}✓ ESO installed on bootstrap cluster.{{.C_RESET}}\n'

  kro:install-cluster-secret-store-bootstrap:
    desc: Apply aws-secrets-manager ClusterSecretStore on the bootstrap kind cluster (required for RGD ESO resources)
    status:
      - kubectl get clustersecretstore aws-secrets-manager 2>/dev/null | grep -q aws-secrets-manager
    cmds:
      - |
        # Extract individual credential keys from the ACK credentials file and
        # create a separate secret for ESO (ESO needs individual keys, not INI format)
        # awk, not `grep X | awk` — see the note in credentials:refresh. A plain IAM user
        # has no aws_session_token line; grep exits 1, pipefail propagates it and errexit
        # aborted this task with all output suppressed. This is what made the ESO
        # ClusterSecretStore step fail for IAM-user credentials.
        CREDS=$(kubectl get secret aws-credentials -n ack-system -o jsonpath='{.data.credentials}' | base64 -d)
        ACCESS_KEY=$(echo "$CREDS" | awk '/aws_access_key_id/{print $3}')
        SECRET_KEY=$(echo "$CREDS" | awk '/aws_secret_access_key/{print $3}')
        SESSION_TOKEN=$(echo "$CREDS" | awk '/aws_session_token/{print $3}')
        kubectl create secret generic eso-aws-credentials -n ack-system \
          --from-literal=access-key-id="$ACCESS_KEY" \
          --from-literal=secret-access-key="$SECRET_KEY" \
          --from-literal=session-token="$SESSION_TOKEN" \
          --dry-run=client -o yaml | kubectl apply -f -
      # Gate on the CRD before applying. external-secrets was helm-installed
      # immediately before this, and the API server does not serve
      # clustersecretstores until the CRD is Established — so the apply below raced
      # it and failed with no usable error (the task exited 1 straight after
      # "✓ ESO installed", because the apply's stderr was not surfaced). An
      # ordering problem needs an explicit readiness gate, not a re-run.
      - kubectl wait --for=condition=established --timeout=120s
          crd/clustersecretstores.external-secrets.io
      - |
        cat <<'EOF' | sed "s|AWS_REGION|{{.AWS_REGION}}|g" | kubectl apply -f -
        apiVersion: external-secrets.io/v1
        kind: ClusterSecretStore
        metadata:
          name: aws-secrets-manager
        spec:
          provider:
            aws:
              service: SecretsManager
              region: AWS_REGION
              auth:
                secretRef:
                  accessKeyIDSecretRef:
                    name: eso-aws-credentials
                    namespace: ack-system
                    key: access-key-id
                  secretAccessKeySecretRef:
                    name: eso-aws-credentials
                    namespace: ack-system
                    key: secret-access-key
                  sessionTokenSecretRef:
                    name: eso-aws-credentials
                    namespace: ack-system
                    key: session-token
        EOF
      - printf '{{.C_OK}}✓ ClusterSecretStore applied on bootstrap cluster.{{.C_RESET}}\n'

  kro:apply-rgds:
    desc: Apply KRO ResourceGraphDefinitions for VPC and EKS
    cmds:
      - kubectl apply -f {{.GITOPS_ROOT}}/addons/charts/kro/resource-groups/manifests/eks/rg-vpc.yaml
      - kubectl apply -f {{.GITOPS_ROOT}}/addons/charts/kro/resource-groups/manifests/eks/rg-eks.yaml
      - kubectl apply -f {{.GITOPS_ROOT}}/addons/charts/kro/resource-groups/manifests/eks/rg-eks-vpc.yaml
      - printf '{{.C_STEP}}▸ Waiting for RGDs to be ready...{{.C_RESET}}\n'
      - kubectl wait --for=condition=Ready resourcegraphdefinition/vpc.kro.run --timeout=600s
      - kubectl wait --for=condition=Ready resourcegraphdefinition/ekscluster.kro.run --timeout=600s
      - kubectl wait --for=condition=Ready resourcegraphdefinition/eksclusterwithvpc.kro.run --timeout=600s
      - printf '{{.C_OK}}✓ ResourceGraphDefinitions applied.{{.C_RESET}}\n'

  kro:reset-crds:
    desc: Delete KRO-managed CRDs on the bootstrap kind cluster to allow breaking schema changes (run before kro:apply-rgds)
    preconditions:
      - sh: "! kubectl get ekscluster,eksclusterwithvpc -A --no-headers 2>/dev/null | grep -qv '^$'"
        msg: "Live EksCluster/EksclusterWithVpc instances exist — delete them first (task kind-kro-ack:destroy) before resetting CRDs."
    cmds:
      - kubectl delete crd eksclusters.kro.run eksclusterwithvpcs.kro.run --ignore-not-found
      - printf '{{.C_OK}}✓ KRO CRDs deleted — re-run task install.{{.C_RESET}}\n'

  idc:setup:
    desc: Create IDC groups if they don't exist (idempotent)
    vars:
      STORE_ID:
        sh: |
          ID=$(yq '.identityCenter.identityStoreId // ""' {{.CONFIG_FILE}})
          if [ -z "$ID" ]; then
            aws sso-admin list-instances --region {{.IDC_REGION}} --query 'Instances[0].IdentityStoreId' --output text 2>/dev/null || echo ""
          else
            echo "$ID"
          fi
      ADMIN_GROUP:
        sh: |
          EXISTING=$(yq '.identityCenter.adminGroupId // ""' {{.CONFIG_FILE}})
          if [ -n "$EXISTING" ]; then echo "$EXISTING"; exit 0; fi
          STORE_ID=$(yq '.identityCenter.identityStoreId // ""' {{.CONFIG_FILE}})
          [ -z "$STORE_ID" ] && STORE_ID=$(aws sso-admin list-instances --region {{.IDC_REGION}} --query 'Instances[0].IdentityStoreId' --output text 2>/dev/null)
          aws identitystore list-groups --identity-store-id "$STORE_ID" --region {{.IDC_REGION}} --filters '[{"AttributePath":"DisplayName","AttributeValue":"admin"}]' --query 'Groups[0].GroupId' --output text 2>/dev/null | grep -v None || echo ""
    cmds:
      - |
        STORE_ID="{{.STORE_ID}}"
        if [ -z "$STORE_ID" ]; then
          echo "ERROR: No IDC Identity Store found. Set identityCenter.identityStoreId in config.local.yaml"
          exit 1
        fi
        printf '{{.C_STEP}}▸ IDC Identity Store: %s{{.C_RESET}}\n' "$STORE_ID"
        # BYO IdC: if adminGroupId AND adminUserId are pre-populated in config,
        # skip group/user/membership creation entirely (useful when IdC lives in
        # a different AWS account and the bootstrap role lacks identitystore:Create* perms).
        BYO_GROUP=$(yq '.identityCenter.adminGroupId // ""' {{.CONFIG_FILE}})
        BYO_USER=$(yq '.identityCenter.adminUserId // ""' {{.CONFIG_FILE}})
        if [ -n "$BYO_GROUP" ] && [ -n "$BYO_USER" ]; then
          printf '{{.C_INFO}}  BYO IdC detected (adminGroupId + adminUserId set) — skipping group/user/membership creation{{.C_RESET}}\n'
          printf '{{.C_OK}}✓ IDC admin group: %s{{.C_RESET}}\n' "$BYO_GROUP"
          printf '{{.C_OK}}✓ IDC admin user:  %s{{.C_RESET}}\n' "$BYO_USER"
          yq -i ".identityCenter.identityStoreId = \"$STORE_ID\"" {{.CONFIG_FILE}}
          exit 0
        fi
        # Create groups idempotently
        for GROUP_NAME in admin editor viewer; do
          EXISTING=$(aws identitystore list-groups --identity-store-id "$STORE_ID" --region {{.IDC_REGION}} \
            --filters "[{\"AttributePath\":\"DisplayName\",\"AttributeValue\":\"$GROUP_NAME\"}]" \
            --query 'Groups[0].GroupId' --output text 2>/dev/null | grep -v None || echo "")
          if [ -n "$EXISTING" ]; then
            printf '{{.C_INFO}}  Group "%s" exists: %s{{.C_RESET}}\n' "$GROUP_NAME" "$EXISTING"
          else
            NEW_ID=$(aws identitystore create-group --identity-store-id "$STORE_ID" --region {{.IDC_REGION}} \
              --display-name "$GROUP_NAME" --description "Platform group for EKS ArgoCD Capability" \
              --query 'GroupId' --output text)
            printf '{{.C_OK}}  Created group "%s": %s{{.C_RESET}}\n' "$GROUP_NAME" "$NEW_ID"
          fi
        done
        # Output admin group ID (prefer config value, fallback to lookup)
        ADMIN_ID=$(yq '.identityCenter.adminGroupId // ""' {{.CONFIG_FILE}})
        if [ -z "$ADMIN_ID" ]; then
          ADMIN_ID=$(aws identitystore list-groups --identity-store-id "$STORE_ID" --region {{.IDC_REGION}} \
            --filters '[{"AttributePath":"DisplayName","AttributeValue":"admin"}]' \
            --query 'Groups[0].GroupId' --output text)
        fi
        printf '{{.C_OK}}✓ IDC admin group: %s{{.C_RESET}}\n' "$ADMIN_ID"
        # Create admin user if not exists
        ADMIN_USER=$(aws identitystore list-users --identity-store-id "$STORE_ID" --region {{.IDC_REGION}} \
          --filters '[{"AttributePath":"UserName","AttributeValue":"eks-argocd-admin-user"}]' \
          --query 'Users[0].UserId' --output text 2>/dev/null | grep -v None || echo "")
        if [ -z "$ADMIN_USER" ]; then
          ADMIN_USER=$(aws identitystore create-user --identity-store-id "$STORE_ID" --region {{.IDC_REGION}} \
            --user-name "eks-argocd-admin-user" --display-name "EKS ArgoCD Admin" \
            --name '{"GivenName":"EKS Admin","FamilyName":"User"}' \
            --emails '[{"Value":"eks-argocd-admin@example.com","Primary":true}]' \
            --query 'UserId' --output text)
          printf '{{.C_OK}}  Created admin user: %s{{.C_RESET}}\n' "$ADMIN_USER"
        else
          printf '{{.C_INFO}}  Admin user exists: %s{{.C_RESET}}\n' "$ADMIN_USER"
        fi
        # Add user to admin group if not already member
        IS_MEMBER=$(aws identitystore is-member-in-groups --identity-store-id "$STORE_ID" --region {{.IDC_REGION}} \
          --member-id '{"UserId":"'"$ADMIN_USER"'"}' --group-ids "$ADMIN_ID" \
          --query 'Results[0].MembershipExists' --output text 2>/dev/null || echo "false")
        if [ "$IS_MEMBER" != "True" ]; then
          aws identitystore create-group-membership --identity-store-id "$STORE_ID" --region {{.IDC_REGION}} \
            --group-id "$ADMIN_ID" --member-id '{"UserId":"'"$ADMIN_USER"'"}' >/dev/null 2>&1 || true
          printf '{{.C_OK}}  Added user to admin group{{.C_RESET}}\n'
        fi
        # Update config.local.yaml with discovered values
        yq -i ".identityCenter.adminGroupId = \"$ADMIN_ID\"" {{.CONFIG_FILE}}
        yq -i ".identityCenter.identityStoreId = \"$STORE_ID\"" {{.CONFIG_FILE}}

  hub:wait-for-gitlab-init:
    desc: Wait for gitlab:init-ec2 background job to complete before seeding Secrets Manager
    cmds:
      - |
        PID_FILE="/tmp/gitlab-init.pid"
        LOG_FILE="/tmp/gitlab-init.log"
        if [ ! -f "$PID_FILE" ]; then
          echo "[$(date +%H:%M:%S)] ✓ No gitlab:init background job found — assuming already done"
          exit 0
        fi
        GITLAB_PID=$(cat "$PID_FILE" 2>/dev/null)
        if [ -z "$GITLAB_PID" ]; then
          echo "[$(date +%H:%M:%S)] ✓ gitlab:init PID empty — assuming already done"
          exit 0
        fi
        echo "[$(date +%H:%M:%S)] ▸ Waiting for gitlab:init-ec2 background job (PID=$GITLAB_PID)..."
        _LOG_LINES=0
        while kill -0 "$GITLAB_PID" 2>/dev/null; do
          if [ -f "$LOG_FILE" ]; then
            _TOTAL=$(wc -l < "$LOG_FILE" 2>/dev/null || echo 0)
            if [ "$_TOTAL" -gt "$_LOG_LINES" ]; then
              tail -n +$((_LOG_LINES + 1)) "$LOG_FILE" 2>/dev/null
              _LOG_LINES=$_TOTAL
            fi
          fi
          sleep 3
        done
        if [ -f "$LOG_FILE" ]; then
          tail -n +$((_LOG_LINES + 1)) "$LOG_FILE" 2>/dev/null || true
        fi
        echo "[$(date +%H:%M:%S)] ✓ gitlab:init-ec2 background job complete"
        rm -f "$PID_FILE"

  hub:claim:
    desc: Apply hub cluster claim (EksCluster or EksclusterWithVpc depending on hub.network)
    cmds:
      - |
        # Guard: argoCdHubRoleArn cannot be empty — IAM would reject the trust policy.
        if [ -z "{{.CALLER_ROLE_ARN}}" ]; then
          printf '{{.C_ERR}}✗ CALLER_ROLE_ARN is empty — cannot create hub:claim (IAM trust policy would be invalid).{{.C_RESET}}\n'
          printf '{{.C_INFO}}  Ensure AWS credentials are configured (IMDS, WS_PARTICIPANT_ROLE_ARN, or aws.profile in config).{{.C_RESET}}\n'
          exit 1
        fi
        printf '{{.C_INFO}}  argoCdHubRoleArn = {{.CALLER_ROLE_ARN}}{{.C_RESET}}\n'
      - kubectl create namespace {{.HUB_CLUSTER_NAME}} --dry-run=client -o yaml | kubectl apply -f -
      - |
        # When hub.network.vpcId is set (CDK pre-created VPC), use EksCluster (no VPC creation).
        # Otherwise fall back to EksclusterWithVpc (creates its own VPC via ACK).
        if [ -n "{{.HUB_VPC_ID}}" ]; then
          KIND="EksCluster"
          NETWORK_BLOCK=$(cat <<NETEOF
          network:
            vpcID: "{{.HUB_VPC_ID}}"
            subnets:
              controlplane:
                subnet1ID: "{{.HUB_SUBNET_1}}"
                subnet2ID: "{{.HUB_SUBNET_2}}"
              workers:
                subnet1ID: "{{.HUB_SUBNET_1}}"
                subnet2ID: "{{.HUB_SUBNET_2}}"
        NETEOF
          )
        else
          KIND="EksclusterWithVpc"
          NETWORK_BLOCK=$(cat <<NETEOF
          cidr:
            vpcCidr: {{.HUB_VPC_CIDR}}
            publicSubnet1Cidr: "{{.HUB_VPC_PREFIX}}.1.0/24"
            publicSubnet2Cidr: "{{.HUB_VPC_PREFIX}}.2.0/24"
            privateSubnet1Cidr: "{{.HUB_VPC_PREFIX}}.11.0/24"
            privateSubnet2Cidr: "{{.HUB_VPC_PREFIX}}.12.0/24"
        NETEOF
          )
        fi
        # Platform-wide AWS tags (SpringClean auto-delete=no, peeks.io=<stack>, cost,
        # compliance) from config.local.yaml. The hub cluster is claimed DIRECTLY here by
        # the bootstrap kind cluster — it does NOT flow through the clusters-kro
        # ApplicationSet that threads platformTags into spoke EksclusterWithVpc claims
        # (clusters-kro.yaml -> rg-eks-vpc.yaml awsTags), so without this the hub EKS
        # cluster (EksCluster path) and, on the EksclusterWithVpc path, its VPC/NAT/EIP
        # would be the ONLY platform resources left untagged. Injected as spec.awsTags via
        # yq (indentation-safe, unlike splicing a block into the heredoc): rg-eks.yaml
        # merges it into the cluster tag map (Maps.merge) and rg-eks-vpc.yaml propagates it
        # to the VPC children. yq prints "null" for a missing key -> normalise to {} so
        # awsTags becomes {} (RGD no-op) when no platformTags are configured.
        PLATFORM_TAGS_JSON=$(yq -o=json -I=0 '.platformTags // {}' {{.CONFIG_FILE}} 2>/dev/null || echo '{}')
        if [ "$PLATFORM_TAGS_JSON" = "null" ] || [ -z "$PLATFORM_TAGS_JSON" ]; then PLATFORM_TAGS_JSON='{}'; fi
        echo "[hub:claim] injecting spec.awsTags=$PLATFORM_TAGS_JSON"
        # Built-in Auto Mode NodePools toggle (consumer-agnostic: read from config).
        # Default "true" = generic behaviour (built-in general-purpose + system).
        # The PEEKS workshop sets hub.enableGeneralPurposeNodePool=false in config.local.yaml
        # so the hub drops the built-in general-purpose pool (keeps system + its *-peeks
        # pools); unpinned platform workloads (Argo EventBus, CI WorkflowTemplates) then
        # avoid the small, consolidation-prone built-in node that caused jetstream quorum loss.
        HUB_ENABLE_GP_NODEPOOL=$(yq '.hub.enableGeneralPurposeNodePool | tostring' {{.CONFIG_FILE}} 2>/dev/null || echo "true")
        if [ "$HUB_ENABLE_GP_NODEPOOL" = "null" ] || [ -z "$HUB_ENABLE_GP_NODEPOOL" ]; then HUB_ENABLE_GP_NODEPOOL="true"; fi
        echo "[hub:claim] enableGeneralPurposeNodePool=$HUB_ENABLE_GP_NODEPOOL"
        cat <<EOF | PLATFORM_TAGS_JSON="$PLATFORM_TAGS_JSON" yq '.spec.awsTags = (strenv(PLATFORM_TAGS_JSON) | from_json)' - | kubectl apply -f -
        apiVersion: kro.run/v1alpha1
        kind: $KIND
        metadata:
          name: {{.HUB_CLUSTER_NAME}}
          namespace: {{.HUB_CLUSTER_NAME}}
        spec:
          name: {{.HUB_CLUSTER_NAME}}
          tenant: platform
          environment: control-plane
          # Fleet role: the hub MUST be control-plane — the clusters-kro ApplicationSet
          # matrix selects the hub via matchLabels{fleet_member: control-plane}. Set
          # explicitly so the hub:pivot self-adoption (#775) serializes it into the hub
          # instance spec and the EksCluster RGD stamps the ArgoCD cluster secret
          # control-plane (not the default "spoke") — otherwise the hub is ejected from
          # the matrix and the spokes are pruned (#1033).
          fleetMember: control-plane
          # [#1033] Hub is BORN with deletionPolicy=retain. The EksCluster RGD stamps
          # services.k8s.aws/deletion-policy=retain onto EVERY AWS-backed child (the EKS
          # Cluster, IAM roles, OIDC provider, security groups, access entries, the ack/
          # argocd/kro Capabilities and all pod-identity associations), and kro then
          # ENFORCES retain — it never reverts it. This is what makes the hub:pivot
          # kind-side retain guard pass deterministically (a transient `kubectl annotate`
          # on kro-owned children is reverted by kro within ~1s, which was aborting the
          # pivot before it ever stopped kind or adopted on the hub), and it guarantees
          # kind can never issue an AWS Delete on the real hub when it is stopped/deleted.
          # The `destroy` task flips this to "delete" so teardown still removes the AWS
          # resources (ACK cascade) instead of orphaning them to the sweep.
          deletionPolicy: retain
          region: {{.AWS_REGION}}
          # managementRegion drives the ACK region annotation on the cluster-config
          # Secrets Manager secret (clusterConfigSecret). For this single-region/account
          # workshop it must equal the deploy region; otherwise it defaults to us-west-2
          # (RGD schema) and the secret is created in us-west-2 while everything else is
          # in AWS_REGION → clusterConfigSecret never syncs → hub EKS never ACTIVE.
          managementRegion: {{.AWS_REGION}}
          k8sVersion: "{{.HUB_K8S_VERSION}}"
          accountId: "{{.AWS_ACCOUNT_ID}}"
          managementAccountId: "{{.AWS_ACCOUNT_ID}}"
          argoCdHubRoleArn: "{{.CALLER_ROLE_ARN}}"
          adminRoleName: {{.ADMIN_ROLE_NAME}}
          fleetSecretManagerSecretNameSuffix: argocd-secret
          # Hub keeps the direct ArgoCD cluster-secret path (the hub registers
          # itself; its <hub>/config is seeded separately by secrets-manager:seed).
          # Spokes default to "false" (fleet-secrets ApplicationSet mechanism).
          createArgocdClusterSecret: "true"
          # domainName is required by EksCluster RGD (no default unlike EksclusterWithVpc).
          # Use placeholder when empty (CloudFront mode) — hub:seed overwrites via cluster secret.
          domainName: '{{if .DOMAIN}}{{.DOMAIN}}{{else}}cluster.local{{end}}'
          resourcePrefix: {{.RESOURCE_PREFIX}}
          enableGeneralPurposeNodePool: "$HUB_ENABLE_GP_NODEPOOL"
          argocdCapability:
            enabled: "true"
            idcInstanceArn: {{.IDC_INSTANCE_ARN}}
            idcRegion: {{.IDC_REGION}}
            adminGroupId: {{.IDC_ADMIN_GROUP_ID}}
        $NETWORK_BLOCK
          workloads: "false"
          gitops:
            addonsRepoUrl: {{.REPO_URL}}
            addonsRepoRevision: {{.REPO_REVISION}}
            addonsRepoBasePath: "{{.REPO_BASEPATH}}/addons/"
            addonsRepoPath: bootstrap
            fleetRepoUrl: {{.FLEET_REPO_URL}}
            fleetRepoRevision: {{.FLEET_REPO_REVISION}}
            fleetRepoBasePath: "{{.FLEET_REPO_BASEPATH}}/fleet/"
            fleetRepoPath: bootstrap
            platformRepoUrl: {{.REPO_URL}}
            platformRepoRevision: {{.REPO_REVISION}}
            platformRepoBasePath: "{{.REPO_BASEPATH}}/platform/"
            platformRepoPath: bootstrap
            workloadRepoUrl: {{.REPO_URL}}
            workloadRepoRevision: {{.REPO_REVISION}}
            workloadRepoBasePath: "{{.REPO_BASEPATH}}/apps/"
            workloadRepoPath: ""
          addons:
            enable_ingress_class_alb: "true"
            enable_argo_rollouts: "false"
            enable_metrics_server: "false"
            enable_external_secrets: "true"
            enable_external_dns: "true"
            enable_adot_collector: "false"
            enable_cw_prometheus: "false"
            enable_kyverno: "false"
            enable_kyverno_policies: "false"
            enable_kyverno_policy_reporter: "false"
            enable_cni_metrics_helper: "false"
            enable_prometheus_node_exporter: "false"
            enable_kube_state_metrics: "false"
            enable_opentelemetry_operator: "false"
            enable_cert_manager: "true"
            enable_aws_efs_csi_driver: "false"
            enable_crossplane: "true"
            enable_crossplane_aws: "true"
            enable_flux: "false"
            enable_ingress_nginx: "false"
            enable_platform_manifests: "true"
            enable_kubevela: "false"
            adot_collector_namespace: adot-collector-kubeprometheus
            adot_collector_service_account: adot-collector-kubeprometheus
            external_dns_namespace: external-dns
            external_dns_service_account: external-dns-sa
            external_dns_policy: sync
            external_secrets_namespace: external-secrets
            external_secrets_service_account: external-secrets-sa
            amp_endpoint_url: ""
        EOF
      # Pre-create the argocd namespace on the kind cluster so KRO can immediately
      # reconcile the argocdSecret resource (which targets this namespace).
      # Without this, KRO fails with "namespace argocd not found" until ArgoCD
      # is installed by hub:argocd:install later in the sequence.
      - kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -

  hub:wait-for-eks:
    desc: Wait for the hub cluster instance to reach ACTIVE state and the EKS cluster to exist in AWS
    vars:
      WAIT_TIMEOUT_SEC: '{{.WAIT_TIMEOUT_SEC | default "3000"}}'
      WAIT_RETRY_SEC: '{{.WAIT_RETRY_SEC | default "600"}}'
      WAIT_INTERVAL_SEC: '{{.WAIT_INTERVAL_SEC | default "30"}}'
      HUB_KIND: '{{if .HUB_VPC_ID}}ekscluster{{else}}eksclusterwithvpc{{end}}'
    cmds:
      - |
        printf '{{.C_STEP}}▸ Waiting for {{.HUB_KIND}}/{{.HUB_CLUSTER_NAME}} to reach ACTIVE (max {{.WAIT_TIMEOUT_SEC}}s)...{{.C_RESET}}\n'
        END=$(( $(date +%s) + {{.WAIT_TIMEOUT_SEC}} ))
        LAST_STATE=""
        ITER=0
        while [ "$(date +%s)" -lt "$END" ]; do
          STATE=$(kubectl get {{.HUB_KIND}} {{.HUB_CLUSTER_NAME}} -n {{.HUB_CLUSTER_NAME}} -o jsonpath='{.status.state}' 2>/dev/null || echo "")
          if [ "$STATE" != "$LAST_STATE" ]; then
            printf '{{.C_INFO}}  state: %s{{.C_RESET}}\n' "${STATE:-<empty>}"
            LAST_STATE="$STATE"
          fi
          if [ "$STATE" = "ACTIVE" ]; then
            break
          fi
          # Every 5 iterations (~2.5min): scan for ACK.Terminal resources and delete for auto-recovery.
          # Common cause: argoCdHubRoleArn="" -> IAM rejects trust policy -> role stuck ACK.Terminal.
          ITER=$((ITER + 1))
          if [ $((ITER % 5)) -eq 0 ]; then
            TERMINAL=$(kubectl get roles.iam.aws.upbound.io \
              -n {{.HUB_CLUSTER_NAME}} \
              -o jsonpath='{range .items[*]}{.metadata.name} {range .status.conditions[*]}{.type}={.status} {end}{"\n"}{end}' \
              2>/dev/null | grep "ACK.Terminal=True" | awk '{print $1}' || true)
            if [ -n "$TERMINAL" ]; then
              printf '{{.C_INFO}}  ♻ ACK.Terminal IAM roles detected — deleting for auto-recovery: %s{{.C_RESET}}\n' "$TERMINAL"
              for R in $TERMINAL; do
                kubectl delete roles.iam.aws.upbound.io "$R" -n {{.HUB_CLUSTER_NAME}} --ignore-not-found 2>/dev/null || true
              done
            fi
          fi
          sleep {{.WAIT_INTERVAL_SEC}}
        done
        if [ "$STATE" != "ACTIVE" ]; then
          # Do NOT abort on the first timeout. A transient ACK dependency (e.g. a child
          # node briefly reporting "no such key: arn (data pending)" before ACK populates
          # a status ARN) can keep the instance out of ACTIVE past the window even though
          # it is still converging. Nudge KRO to re-reconcile, then grant one extra grace
          # window before failing. The whole install is idempotent and resumable, so a
          # transient must not permanently skip the post-wait hub:seed (app-of-apps) step.
          printf '{{.C_INFO}}  {{.HUB_KIND}} not ACTIVE after {{.WAIT_TIMEOUT_SEC}}s (state: %s) — nudging reconcile, retrying for {{.WAIT_RETRY_SEC}}s...{{.C_RESET}}\n' "${STATE:-<empty>}"
          kubectl get {{.HUB_KIND}} {{.HUB_CLUSTER_NAME}} -n {{.HUB_CLUSTER_NAME}} -o jsonpath='{.status.conditions}' 2>/dev/null || true
          kubectl annotate {{.HUB_KIND}} {{.HUB_CLUSTER_NAME}} -n {{.HUB_CLUSTER_NAME}} kro.run/reconcile-nudge="$(date +%s)" --overwrite 2>/dev/null || true
          GRACE_END=$(( $(date +%s) + {{.WAIT_RETRY_SEC}} ))
          while [ "$(date +%s)" -lt "$GRACE_END" ]; do
            STATE=$(kubectl get {{.HUB_KIND}} {{.HUB_CLUSTER_NAME}} -n {{.HUB_CLUSTER_NAME}} -o jsonpath='{.status.state}' 2>/dev/null || echo "")
            if [ "$STATE" = "ACTIVE" ]; then break; fi
            sleep {{.WAIT_INTERVAL_SEC}}
          done
        fi
        if [ "$STATE" != "ACTIVE" ]; then
          printf '{{.C_ERR}}✗ {{.HUB_KIND}} not ACTIVE after {{.WAIT_TIMEOUT_SEC}}s + {{.WAIT_RETRY_SEC}}s grace (last state: %s){{.C_RESET}}\n' "$STATE"
          kubectl get {{.HUB_KIND}} {{.HUB_CLUSTER_NAME}} -n {{.HUB_CLUSTER_NAME}} -o jsonpath='{.status.conditions}' 2>/dev/null || true
          exit 1
        fi
        printf '{{.C_OK}}✓ {{.HUB_KIND}} ACTIVE{{.C_RESET}}\n'      - |
        printf '{{.C_STEP}}▸ Verifying EKS cluster {{.HUB_CLUSTER_NAME}} exists in AWS...{{.C_RESET}}\n'
        END=$(( $(date +%s) + 300 ))
        while [ "$(date +%s)" -lt "$END" ]; do
          EKS_STATUS=$(aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --query 'cluster.status' --output text 2>/dev/null || echo "")
          if [ "$EKS_STATUS" = "ACTIVE" ]; then
            printf '{{.C_OK}}✓ EKS cluster ACTIVE{{.C_RESET}}\n'
            exit 0
          fi
          printf '{{.C_INFO}}  EKS status: %s{{.C_RESET}}\n' "${EKS_STATUS:-<not-found>}"
          sleep 15
        done
        printf '{{.C_ERR}}✗ EKS cluster not ACTIVE in AWS after RGD reported ACTIVE{{.C_RESET}}\n'
        exit 1

  hub:authorize-ide-access:
    desc: Allow the IDE EC2 (kind cluster) to reach the hub EKS API server via private endpoint
    status:
      # Skip if HUB_VPC_ID is unset (separate VPC mode — no private endpoint routing issue)
      - '[ -z "{{.HUB_VPC_ID}}" ]'
    cmds:
      - |
        # When the hub EKS cluster shares the IDE VPC (Option D), DNS resolves the
        # API server to the private ENI. The cluster security group only allows worker
        # nodes by default — we must add an inbound rule for the IDE EC2 (which runs
        # the kind cluster that needs kubectl access to hub EKS).
        CLUSTER_SG=$(aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
          --query 'cluster.resourcesVpcConfig.clusterSecurityGroupId' --output text)
        printf '{{.C_STEP}}▸ Authorizing IDE access to hub EKS API (SG %s, VPC CIDR)...{{.C_RESET}}\n' "$CLUSTER_SG"
        # Allow TCP 443 from the entire VPC CIDR (covers IDE EC2 + kind bridge network).
        # Idempotent: --cidr rule is a no-op if already present.
        VPC_CIDR=$(aws ec2 describe-vpcs --vpc-ids {{.HUB_VPC_ID}} --region {{.AWS_REGION}} \
          --query 'Vpcs[0].CidrBlock' --output text)
        aws ec2 authorize-security-group-ingress \
          --group-id "$CLUSTER_SG" --protocol tcp --port 443 \
          --cidr "$VPC_CIDR" --region {{.AWS_REGION}} 2>/dev/null \
          && printf '{{.C_OK}}✓ Authorized VPC CIDR %s → cluster SG %s :443{{.C_RESET}}\n' "$VPC_CIDR" "$CLUSTER_SG" \
          || printf '{{.C_INFO}}  Rule already exists (idempotent).{{.C_RESET}}\n'

  hub:seed:
    desc: Seed hub cluster after EKS is ACTIVE
    cmds:
      - task: credentials:check-and-refresh
      - printf '{{.C_STEP}}▸ Waiting for hub EksCluster to be ready...{{.C_RESET}}\n'
      - |
        STATUS="Pending"
        for i in $(seq 1 120); do
          STATUS=$(kubectl get ekscluster {{.HUB_CLUSTER_NAME}} -n {{.HUB_CLUSTER_NAME}} -o jsonpath='{.status.clusterState}' 2>/dev/null || echo "Pending")
          printf '{{.C_INFO}}  [%s/120] Cluster status: %s{{.C_RESET}}\n' "$i" "$STATUS"
          if [ "$STATUS" = "ACTIVE" ]; then break; fi
          sleep 15
        done
        if [ "$STATUS" != "ACTIVE" ]; then echo "ERROR: cluster not ACTIVE"; exit 1; fi
      - printf '{{.C_STEP}}▸ Creating cluster admin access entry...{{.C_RESET}}\n'
      - cmd: |
          CALLER_ARN=$(aws sts get-caller-identity --query "Arn" --output text)
          if echo "$CALLER_ARN" | grep -q ":assumed-role/"; then
            PRINCIPAL_ARN=$(echo "$CALLER_ARN" | sed 's|arn:aws:sts::|arn:aws:iam::|;s|:assumed-role/|:role/|;s|/[^/]*$||')
          else
            PRINCIPAL_ARN="$CALLER_ARN"
          fi
          aws eks create-access-entry --cluster-name {{.HUB_CLUSTER_NAME}} --principal-arn "$PRINCIPAL_ARN" --type STANDARD --region {{.AWS_REGION}} 2>/dev/null || true
          aws eks associate-access-policy --cluster-name {{.HUB_CLUSTER_NAME}} --principal-arn "$PRINCIPAL_ARN" --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy --access-scope type=cluster --region {{.AWS_REGION}} 2>/dev/null || true
      - cmd: |
          # Grant the ACK capability role (secretsmanager controller) permission to
          # read k8s Secrets — required to push <cluster>/config to Secrets Manager.
          # Without this the ACK secretsmanager controller reports
          # "kubernetes secret not found" even when the Secret exists, because the
          # AmazonEKSACKPolicy alone does not include Secret read access.
          # Ref: https://docs.aws.amazon.com/eks/latest/userguide/capabilities-security.html
          ACK_ROLE="arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/{{.HUB_CLUSTER_NAME}}-ack-capability-role"
          aws eks associate-access-policy \
            --cluster-name {{.HUB_CLUSTER_NAME}} \
            --principal-arn "$ACK_ROLE" \
            --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSSecretReaderPolicy \
            --access-scope type=cluster \
            --region {{.AWS_REGION}} 2>/dev/null || true
          echo "  ✓ AmazonEKSSecretReaderPolicy associated to $ACK_ROLE"
      - task: secrets-manager:seed
      - task: secrets-manager:seed-keycloak
      - task: secrets-manager:seed-secrets
      - task: hub:install-eso
      - task: hub:cluster-secret-store
      - task: hub:seed-secret
      - task: hub:apply-root-appset
      # The Argo CD capability exists now (hub:apply-root-appset waited for its CRDs).
      - task: secrets-manager:seed-argocd-url
      - task: hub:create-mgmt-roles

  hub:kubeconfig:
    cmds:
      - aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --kubeconfig {{.ROOT_DIR}}/private/hub-kubeconfig 2>&1 >/dev/null

  secrets-manager:seed:
    desc: Seed hub config into AWS Secrets Manager
    vars:
      CLUSTER_ARN:
        sh: aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --query 'cluster.arn' --output text 2>/dev/null
      # ArgoCD EKS Capability server URL (host, no scheme) so Backstage links to the
      # capability endpoint, not the CloudFront domain. The capability may not be ACTIVE
      # yet when hub:seed first runs, so retry briefly rather than capturing an empty value
      # (an empty aws_argocd_url makes platform.yaml fall back to the CloudFront domain,
      # which does NOT serve ArgoCD -> broken deep-links in Backstage).
      ARGOCD_URL:
        sh: |
          for _ in $(seq 1 30); do
            U=$(aws eks describe-capability --cluster-name {{.HUB_CLUSTER_NAME}} --capability-name argocd \
                  --query 'capability.configuration.argoCd.serverUrl' --output text --region {{.AWS_REGION}} 2>/dev/null \
                | sed 's|https://||')
            if [ -n "$U" ] && [ "$U" != "None" ]; then echo "$U"; exit 0; fi
            sleep 10
          done
          echo ""
      VPC_ID:
        sh: aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --query 'cluster.resourcesVpcConfig.vpcId' --output text
      # Private subnets + cluster SG for the devlake RDS `vpc` object (see cmds). Mirrors the
      # kind-crossplane seed so the aws-resources ExternalSecret / init-env-config Job can
      # populate a non-empty vpc-config EnvironmentConfig.
      PRIVATE_SUBNET_IDS:
        sh: |
          SUBNETS=$(aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --query 'cluster.resourcesVpcConfig.subnetIds' --output text | tr '\t' '\n')
          aws ec2 describe-subnets --subnet-ids $SUBNETS --region {{.AWS_REGION}} --query 'Subnets[?MapPublicIpOnLaunch==`false`].SubnetId' --output text | tr '\t' ','
      CLUSTER_SG:
        sh: aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --query 'cluster.resourcesVpcConfig.clusterSecurityGroupId' --output text
    cmds:
      - |
        SECRET_KEY="{{.HUB_CLUSTER_NAME}}/config"
        GIT_DOMAIN=$(cat {{.ROOT_DIR}}/private/git-domain 2>/dev/null || yq '.gitDomain // ""' {{.CONFIG_FILE}} || true)
        # Read at runtime rather than via the global DOMAIN var: go-task evaluates global
        # `vars:` once at parse time, so a value written into config during this run would
        # not be visible here.
        # `yq` yields the STRING "null" for a missing key, which is non-empty and would
        # defeat the guard below, so normalise it.
        RUNTIME_DOMAIN=$(yq '.domain // ""' {{.CONFIG_FILE}} 2>/dev/null | tr -d '[:space:]')
        if [ "$RUNTIME_DOMAIN" = "null" ]; then RUNTIME_DOMAIN=""; fi
        # Mirror the hub's enableGeneralPurposeNodePool into the cluster secret so the
        # platform-manifests-bootstrap gate appends the fallback -peeks pools when the
        # built-in general-purpose pool was dropped. Read with `| tostring` (NOT `//`,
        # which treats a YAML `false` as unset and would disagree with hub:claim).
        # Default "true" (safe: no fallback pools).
        HUB_ENABLE_GP=$(yq '.hub.enableGeneralPurposeNodePool | tostring' {{.CONFIG_FILE}} 2>/dev/null || echo "true")
        if [ -z "$HUB_ENABLE_GP" ] || [ "$HUB_ENABLE_GP" = "null" ]; then HUB_ENABLE_GP="true"; fi
        if [ -z "$RUNTIME_DOMAIN" ]; then
          echo "ERROR: domain is empty — set 'domain' in config.local.yaml before running hub:seed."
          echo "       For CloudFront exposure, reserve one first: scripts/cloudfront-reserve-domain.sh"
          echo "       Without a domain, ingress_domain_name in the cluster secret will be empty and all ArgoCD addon apps will misconfigure."
          exit 1
        fi
        echo "[hub:seed] ingress_domain_name=$RUNTIME_DOMAIN"
        # Platform-wide AWS tags (SpringClean auto-delete=no, cost, compliance) from
        # config.local.yaml as a compact single-line JSON object. Stored as the string
        # metadata key `platform_tags` below (ESO expands metadata keys 1:1 into cluster
        # secret annotations), which clusters-kro.yaml threads into every kro spoke's
        # EksclusterWithVpc awsTags. yq prints "null"/"{}" for a missing key -> normalise
        # both to "{}" so the injection below is skipped when no tags are configured.
        PLATFORM_TAGS_JSON=$(yq -o=json -I=0 '.platformTags // {}' {{.CONFIG_FILE}} 2>/dev/null || echo '{}')
        if [ "$PLATFORM_TAGS_JSON" = "null" ] || [ -z "$PLATFORM_TAGS_JSON" ]; then PLATFORM_TAGS_JSON='{}'; fi
        echo "[hub:seed] platform_tags=$PLATFORM_TAGS_JSON"
        # Preserve overlay + argocd wiring across re-seeds. This task rebuilds the entire
        # <hub>/config metadata from scratch and has no status: guard, so it runs on every
        # install. Without re-merging these, a second run WIPES:
        #   - overlay_repo_url/revision/basepath -> disables the whole fleet-config overlay
        #     fleet-wide and orphans spokes that exist only in the overlay
        #     (see docs multi-repo-architecture.md "re-seed must preserve overlay_repo_url");
        #   - aws_argocd_url -> falls back to the CloudFront domain (which does not serve
        #     ArgoCD) -> broken Backstage deep-links.
        EXISTING=$(aws secretsmanager get-secret-value --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} \
          --query SecretString --output text 2>/dev/null || echo "")
        PRESERVED_OVERLAY_URL=""; PRESERVED_OVERLAY_REV=""; PRESERVED_OVERLAY_BASE=""; PRESERVED_ARGOCD=""
        if [ -n "$EXISTING" ]; then
          EMETA=$(echo "$EXISTING" | jq -r '.metadata // "{}"' | jq -c '. as $m | (if ($m|type)=="string" then ($m|fromjson) else $m end)' 2>/dev/null || echo "{}")
          PRESERVED_OVERLAY_URL=$(echo "$EMETA"  | jq -r '.overlay_repo_url // ""')
          PRESERVED_OVERLAY_REV=$(echo "$EMETA"  | jq -r '.overlay_repo_revision // ""')
          PRESERVED_OVERLAY_BASE=$(echo "$EMETA" | jq -r '.overlay_repo_basepath // ""')
          PRESERVED_ARGOCD=$(echo "$EMETA"       | jq -r '.aws_argocd_url // ""')
        fi
        # Prefer a freshly-resolved capability URL; fall back to the previously stored one so a
        # transient describe-capability miss never blanks a good value.
        ARGOCD_FINAL="{{.ARGOCD_URL}}"
        [ -z "$ARGOCD_FINAL" ] && ARGOCD_FINAL="$PRESERVED_ARGOCD"
        # The aws-resources ExternalSecret reads <hub>/config property `vpc` into
        # peeks-hub-vpc-secret.vpc_data; the init-env-config Job then parses .id / .subnet_ids /
        # .cluster_security_group_id from it to build the vpc-config EnvironmentConfig that the
        # devlake RDS composition consumes. `vpc` MUST be a JSON object (a bare VPC-id string makes
        # every jq lookup empty -> empty vpc-config -> RDS never provisions). Stored as a JSON
        # STRING (--arg), matching kind-crossplane, so ESO's property extraction round-trips.
        # awk 'NF', not `grep -v '^$'`: with an empty PRIVATE_SUBNET_IDS the grep matches
        # nothing and exits 1, which pipefail propagates and errexit turns into a task
        # abort (verified under go-task's mvdan/sh). awk drops blank lines and exits 0,
        # yielding [] so the jq below still produces a well-formed vpc object.
        PRIVATE_SUBNETS_JSON=$(echo "{{.PRIVATE_SUBNET_IDS}}" | tr ',' '\n' | awk 'NF' | jq -R . | jq -s .)
        VPC_JSON=$(jq -n --arg id "{{.VPC_ID}}" --argjson subnet_ids "$PRIVATE_SUBNETS_JSON" \
          --arg cluster_security_group_id "{{.CLUSTER_SG}}" \
          '{id:$id, subnet_ids:$subnet_ids, cluster_security_group_id:$cluster_security_group_id}' | jq -c .)
        SECRET_VALUE=$(jq -n \
          --arg metadata '{"addonsRepoURL":"{{.REPO_URL}}","addonsRepoRevision":"{{.REPO_REVISION}}","addonsRepoBasepath":"{{.REPO_BASEPATH}}","addons_repo_url":"{{.AGENTIC_REPO_URL}}","addons_repo_revision":"{{.AGENTIC_REPO_REVISION}}","fleetRepoURL":"{{.FLEET_REPO_URL}}","fleetRepoRevision":"{{.FLEET_REPO_REVISION}}","fleetRepoBasepath":"{{.FLEET_REPO_BASEPATH}}","aws_region":"{{.AWS_REGION}}","aws_account_id":"{{.AWS_ACCOUNT_ID}}","aws_cluster_name":"{{.HUB_CLUSTER_NAME}}","aws_cluster_arn":"{{.CLUSTER_ARN}}","aws_vpc_id":"{{.VPC_ID}}","aws_private_subnet_ids":"{{.PRIVATE_SUBNET_IDS}}","aws_cluster_security_group_id":"{{.CLUSTER_SG}}","alb_controller_mode":"oss","ingress_domain_name":"'"$RUNTIME_DOMAIN"'","ingress_name":"{{.HUB_CLUSTER_NAME}}-platform","ingress_security_groups":"{{.INGRESS_SECURITY_GROUPS}}","resource_prefix":"{{.RESOURCE_PREFIX}}","enable_general_purpose_nodepool":"'"$HUB_ENABLE_GP"'","insecure":"{{.INSECURE}}","certificate_arn":"{{.INGRESS_CERT_ARN}}","admin_role_name":"{{.ADMIN_ROLE_NAME}}","gitlab_domain_name":"'"$GIT_DOMAIN"'","git_token":"{{.USER_PASSWORD}}","aws_argocd_url":"'"$ARGOCD_FINAL"'"}' \
          --arg config '{"tlsClientConfig":{"insecure":false}}' \
          --arg server '{{.CLUSTER_ARN}}' \
          --arg addons '{"provider":"kro-ack"}' \
          --arg vpc "$VPC_JSON" \
          '{metadata: $metadata, config: $config, server: $server, addons: $addons, vpc: $vpc}')
        # Re-merge preserved overlay wiring into the metadata (only keys that are non-empty),
        # so a re-seed never drops the fleet-config overlay.
        SECRET_VALUE=$(echo "$SECRET_VALUE" | jq \
          --arg ou "$PRESERVED_OVERLAY_URL" --arg orv "$PRESERVED_OVERLAY_REV" --arg ob "$PRESERVED_OVERLAY_BASE" \
          --arg pt "$PLATFORM_TAGS_JSON" \
          '.metadata |= ( (fromjson) as $m
             | $m
             | (if $ou  != "" then .overlay_repo_url      = $ou  else . end)
             | (if $orv != "" then .overlay_repo_revision = $orv else . end)
             | (if $ob  != "" then .overlay_repo_basepath = $ob  else . end)
             | (if $pt  != "" and $pt != "{}" then .platform_tags = $pt else . end)
             | tojson )')
        aws secretsmanager restore-secret --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} 2>/dev/null || true
        aws secretsmanager create-secret \
          --name "$SECRET_KEY" --secret-string "$SECRET_VALUE" --region {{.AWS_REGION}} 2>/dev/null \
        || aws secretsmanager put-secret-value \
          --secret-id "$SECRET_KEY" --secret-string "$SECRET_VALUE" --region {{.AWS_REGION}}

  secrets-manager:seed-argocd-url:
    desc: Fill aws_argocd_url in <hub>/config from the Argo CD capability when it is still empty
    cmds:
      - |
        # secrets-manager:seed resolves the capability URL too, but on a fresh install it runs
        # minutes before the Argo CD capability is created, so it stores "" and nothing writes
        # the key later: Backstage's argocd_hostname then falls back to the ingress domain,
        # which does not serve Argo CD. hub:seed calls this once the capability's CRDs are
        # served. Only an EMPTY value is filled, and only this key is merged (re-running the
        # whole seed would drop the keys other tasks merged in since). Idempotent, non-fatal.
        SECRET_KEY="{{.HUB_CLUSTER_NAME}}/config"
        CONFIG_EXISTING=$(aws secretsmanager get-secret-value --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} \
          --query SecretString --output text 2>/dev/null) || CONFIG_EXISTING=""
        if [ -z "$CONFIG_EXISTING" ]; then
          printf '{{.C_ERR}}⚠ %s not readable — aws_argocd_url not checked.{{.C_RESET}}\n' "$SECRET_KEY"
          exit 0
        fi
        STORED=$(echo "$CONFIG_EXISTING" | jq -r '.metadata // "{}" | (if type == "string" then fromjson else . end) | .aws_argocd_url // ""') || {
          printf '{{.C_ERR}}⚠ %s metadata is not JSON — aws_argocd_url not checked.{{.C_RESET}}\n' "$SECRET_KEY"
          exit 0
        }
        if [ -n "$STORED" ]; then
          printf '{{.C_OK}}✓ aws_argocd_url already set in %s.{{.C_RESET}}\n' "$SECRET_KEY"
          exit 0
        fi
        printf '{{.C_STEP}}▸ Resolving the Argo CD capability URL for aws_argocd_url...{{.C_RESET}}\n'
        URL=""
        for _ in $(seq 1 30); do
          URL=$(aws eks describe-capability --cluster-name {{.HUB_CLUSTER_NAME}} --capability-name argocd \
                --query 'capability.configuration.argoCd.serverUrl' --output text --region {{.AWS_REGION}} 2>/dev/null \
              | sed 's|https://||') || URL=""
          if [ -n "$URL" ] && [ "$URL" != "None" ]; then break; fi
          URL=""
          sleep 10
        done
        if [ -z "$URL" ]; then
          printf '{{.C_ERR}}⚠ Argo CD capability URL not available — aws_argocd_url stays empty; re-run task kind-kro-ack:secrets-manager:seed-argocd-url.{{.C_RESET}}\n'
          exit 0
        fi
        CONFIG_UPDATED=$(echo "$CONFIG_EXISTING" | jq --arg u "$URL" \
          '.metadata = (.metadata // "{}" | (if type == "string" then fromjson else . end) | .aws_argocd_url = $u | tojson)')
        if aws secretsmanager put-secret-value \
            --secret-id "$SECRET_KEY" \
            --secret-string "$CONFIG_UPDATED" \
            --region {{.AWS_REGION}} >/dev/null; then
          printf '{{.C_OK}}✓ aws_argocd_url set in %s (Argo CD capability endpoint).{{.C_RESET}}\n' "$SECRET_KEY"
        else
          printf '{{.C_ERR}}⚠ could not update %s — aws_argocd_url stays empty; re-run task kind-kro-ack:secrets-manager:seed-argocd-url.{{.C_RESET}}\n' "$SECRET_KEY"
        fi

  secrets-manager:seed-keycloak:
    desc: Seed keycloak passwords
    status:
      - aws secretsmanager describe-secret --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} 2>/dev/null
    cmds:
      - |
        ADMIN_PASS=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
        DB_PASS=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
        USER_PASS=${IDE_PASSWORD:-$(openssl rand -base64 12 | tr -d '/+=' | head -c 16)}
        SECRET_VALUE=$(jq -n \
          --arg admin "$ADMIN_PASS" --arg db "$DB_PASS" --arg user "$USER_PASS" \
          '{keycloak_admin_password: $admin, keycloak_postgres_password: $db, user_password: $user}')
        aws secretsmanager restore-secret --secret-id "{{.HUB_CLUSTER_NAME}}/keycloak" --region {{.AWS_REGION}} 2>/dev/null || true
        aws secretsmanager create-secret \
          --name "{{.HUB_CLUSTER_NAME}}/keycloak" --secret-string "$SECRET_VALUE" --region {{.AWS_REGION}} 2>/dev/null \
        || aws secretsmanager put-secret-value \
          --secret-id "{{.HUB_CLUSTER_NAME}}/keycloak" --secret-string "$SECRET_VALUE" --region {{.AWS_REGION}}

  hub:install-argocd:
    desc: Install ArgoCD on the hub cluster (OSS mode, skipped when EKS Capability is used)
    status:
      # Skip if argocdCapability is enabled in config OR if ArgoCD CRDs already exist on the hub
      - test "$(yq '.argocdCapability.enabled // "false"' {{.CONFIG_FILE}} 2>/dev/null || echo false)" = "true" || KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl get crd applications.argoproj.io 2>/dev/null | grep -q applications
    cmds:
      - task: hub:kubeconfig
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig helm repo add argo https://argoproj.github.io/argo-helm --force-update
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig helm upgrade --install argocd argo/argo-cd
          --namespace argocd --create-namespace
          --version {{.ARGOCD_VERSION}}
          --wait --timeout 5m
      - printf '{{.C_OK}}✓ ArgoCD installed on hub (OSS mode).{{.C_RESET}}\n'

  hub:install-eso:
    desc: Install External Secrets Operator on hub
    vars:
      ESO_VERSION:
        sh: yq '.external-secrets.defaultVersion' {{.GITOPS_ROOT}}/addons/registry/core.yaml
    status:
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig helm status external-secrets -n external-secrets 2>/dev/null | grep -q deployed
    cmds:
      - task: hub:kubeconfig
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig helm repo add external-secrets https://charts.external-secrets.io --force-update
      # Seed-safe: the hub drops the built-in untainted general-purpose NodePool
      # (enableGeneralPurposeNodePool=false), and the custom *-peeks pools only
      # arrive via GitOps AFTER apply-root-appset. ESO is helm-installed with
      # --wait BEFORE that, so without a toleration its pods cannot schedule
      # (only the CriticalAddonsOnly-tainted `system` pool exists) and the
      # install deadlocks until timeout. Tolerate CriticalAddonsOnly so ESO
      # lands on the system pool during seed; Karpenter provisions a system node.
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig helm upgrade --install external-secrets external-secrets/external-secrets
          --namespace external-secrets --create-namespace
          --version {{.ESO_VERSION}}
          --set serviceAccount.name=external-secrets-sa
          --set 'tolerations[0].key=CriticalAddonsOnly'
          --set 'tolerations[0].operator=Exists'
          --set 'tolerations[0].effect=NoSchedule'
          --set 'webhook.tolerations[0].key=CriticalAddonsOnly'
          --set 'webhook.tolerations[0].operator=Exists'
          --set 'webhook.tolerations[0].effect=NoSchedule'
          --set 'certController.tolerations[0].key=CriticalAddonsOnly'
          --set 'certController.tolerations[0].operator=Exists'
          --set 'certController.tolerations[0].effect=NoSchedule'
          --wait --timeout 5m

  hub:cluster-secret-store:
    desc: Apply ClusterSecretStore on hub
    cmds:
      - task: hub:kubeconfig
      - |
        cat <<'EOF' | sed "s|AWS_REGION|{{.AWS_REGION}}|g" | KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl apply -f -
        apiVersion: external-secrets.io/v1
        kind: ClusterSecretStore
        metadata:
          name: aws-secrets-manager
        spec:
          provider:
            aws:
              service: SecretsManager
              region: AWS_REGION
        EOF

  hub:seed-secret:
    desc: Create minimal seed cluster secret on the hub (repo coords + fleet labels only)
    vars:
      CLUSTER_ARN:
        sh: aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --query 'cluster.arn' --output text 2>/dev/null || echo "arn:aws:eks:{{.AWS_REGION}}:{{.AWS_ACCOUNT_ID}}:cluster/{{.HUB_CLUSTER_NAME}}"
    cmds:
      - printf '{{.C_STEP}}▸ Getting hub kubeconfig...{{.C_RESET}}\n'
      - task: hub:kubeconfig
      - printf '{{.C_STEP}}▸ Creating seed cluster secret on hub...{{.C_RESET}}\n'
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl create namespace argocd --dry-run=client -o yaml | KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl apply -f -
      - |
        cat <<'EOF' | sed "s|CLUSTER_NAME|{{.HUB_CLUSTER_NAME}}|g; s|CLUSTER_ARN|{{.CLUSTER_ARN}}|g; s|FLEET_REPO_URL|{{.FLEET_REPO_URL}}|g; s|FLEET_REPO_REVISION|{{.FLEET_REPO_REVISION}}|g; s|FLEET_REPO_BASEPATH|{{.FLEET_REPO_BASEPATH}}|g; s|REPO_URL|{{.REPO_URL}}|g; s|REPO_REVISION|{{.REPO_REVISION}}|g; s|REPO_BASEPATH|{{.REPO_BASEPATH}}|g" | KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl apply -f -
        apiVersion: v1
        kind: Secret
        type: Opaque
        metadata:
          name: CLUSTER_NAME
          namespace: argocd
          annotations:
            addonsRepoURL: "REPO_URL"
            addonsRepoRevision: "REPO_REVISION"
            addonsRepoBasepath: "REPO_BASEPATH"
            fleetRepoURL: "FLEET_REPO_URL"
            fleetRepoRevision: "FLEET_REPO_REVISION"
            fleetRepoBasepath: "FLEET_REPO_BASEPATH"
            aws_cluster_name: {{.HUB_CLUSTER_NAME}}
          labels:
            argocd.argoproj.io/secret-type: cluster
            environment: control-plane
            fleet_member: control-plane
        stringData:
          name: CLUSTER_NAME
          server: "CLUSTER_ARN"
          config: '{"tlsClientConfig":{"insecure":false}}'
          project: default
        EOF
      - printf '{{.C_OK}}✓ Seed secret created on hub{{.C_RESET}}\n'
      - rm -f {{.ROOT_DIR}}/private/hub-kubeconfig

  hub:apply-root-appset:
    desc: Apply root-appset to hub
    cmds:
      - task: hub:kubeconfig
      # Gate: the ArgoCD EKS Capability reconciles asynchronously after the EksCluster is ACTIVE.
      # root-appset.yaml contains an ApplicationSet, so we must wait until applicationsets.argoproj.io
      # is registered and Established before applying, otherwise kubectl fails with
      # "no matches for kind ApplicationSet in version argoproj.io/v1alpha1".
      - printf '{{.C_STEP}}▸ Waiting for ArgoCD capability CRDs (ApplicationSet/Application) to be served...{{.C_RESET}}\n'
      - |
        KC={{.ROOT_DIR}}/private/hub-kubeconfig
        for i in $(seq 1 60); do
          if KUBECONFIG=$KC kubectl get crd applicationsets.argoproj.io applications.argoproj.io >/dev/null 2>&1; then
            break
          fi
          printf '{{.C_INFO}}  [%s/60] ArgoCD CRDs not ready yet...{{.C_RESET}}\n' "$i"
          sleep 10
        done
        if ! KUBECONFIG=$KC kubectl get crd applicationsets.argoproj.io >/dev/null 2>&1; then
          printf '{{.C_ERR}}ERROR: ArgoCD ApplicationSet CRD never became available — the argocd EKS Capability has not reconciled.{{.C_RESET}}\n'
          exit 1
        fi
        KUBECONFIG=$KC kubectl wait --for=condition=Established \
          crd/applicationsets.argoproj.io crd/applications.argoproj.io --timeout=120s
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl apply -f {{.GITOPS_ROOT}}/bootstrap/root-appset.yaml
      - rm -f {{.ROOT_DIR}}/private/hub-kubeconfig
      - printf '{{.C_OK}}✓ Root appset applied. Hub is now self-managing.{{.C_RESET}}\n'

  hub:force-eso-refresh:
    desc: Force ESO to immediately refresh cluster secret so annotations are populated before ArgoCD wave 5 apps render
    internal: true
    cmds:
      - task: hub:kubeconfig
      - |
        KC={{.ROOT_DIR}}/private/hub-kubeconfig
        printf '{{.C_STEP}}▸ Forcing ESO refresh of cluster secret annotations...{{.C_RESET}}\n'
        ES=$(KUBECONFIG=$KC kubectl -n argocd get externalsecret -o name 2>/dev/null | grep -i fleet-secret | grep {{.HUB_CLUSTER_NAME}} | head -1 || true)
        if [ -n "$ES" ]; then
          KUBECONFIG=$KC kubectl -n argocd annotate "$ES" \
            force-sync="$(date +%s)" --overwrite >/dev/null 2>&1 || true
          for i in $(seq 1 12); do
            VAL=$(KUBECONFIG=$KC kubectl get secret {{.HUB_CLUSTER_NAME}} -n argocd \
              -o jsonpath='{.metadata.annotations.insecure}' 2>/dev/null)
            [ -n "$VAL" ] && printf '{{.C_OK}}✓ Cluster secret annotations populated (insecure=%s){{.C_RESET}}\n' "$VAL" && break
            sleep 5
          done
        else
          printf '{{.C_INFO}}  fleet-secret ESO not found yet — waiting 30s{{.C_RESET}}\n'
          sleep 30
        fi
      - rm -f {{.ROOT_DIR}}/private/hub-kubeconfig

  hub:bootstrap-crossplane-identity:
    desc: Seed hub Crossplane provider creds (provider-aws-iam/eks pod identities) so crossplane-base can provision
    internal: true
    status:
      # Skip only when the pod identity associations this task actually creates both
      # exist. The previous guard checked for {{.HUB_CLUSTER_NAME}}-CrossplaneAMPProviderRole,
      # a role Crossplane creates downstream — but that role SURVIVES `task destroy`
      # (the teardown sweep does not remove Crossplane-provisioned provider roles),
      # while the pod identity associations do NOT. On a destroy->reinstall against a
      # reused account the stale role made this task self-skip, so the provider-aws-iam
      # /eks PIAs were never recreated and every Crossplane AWS provider came up
      # credential-less ("cannot retrieve the AWS credentials"), degrading ~15 apps.
      # Gate on the real artifact instead: both PIAs present => done.
      - |
        for SA in provider-aws-iam provider-aws-eks; do
          ID=$(aws eks list-pod-identity-associations --cluster-name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
            --query "associations[?serviceAccount=='$SA' && namespace=='crossplane-system'] | [0].associationId" --output text 2>/dev/null)
          [ -n "$ID" ] && [ "$ID" != "None" ] || exit 1
        done
    cmds:
      - printf '{{.C_STEP}}▸ Bootstrapping Crossplane provider pod identities (iam/eks)...{{.C_RESET}}\n'
      - |
        ROLE_NAME="{{.HUB_CLUSTER_NAME}}-crossplane-provider"
        TRUST='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"pods.eks.amazonaws.com"},"Action":["sts:AssumeRole","sts:TagSession"]}]}'
        aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1 || \
          aws iam create-role --role-name "$ROLE_NAME" --assume-role-policy-document "$TRUST" \
            --description "Bootstrap creds for crossplane provider-aws-iam/eks" >/dev/null
        aws iam attach-role-policy --role-name "$ROLE_NAME" \
          --policy-arn arn:aws:iam::aws:policy/AdministratorAccess >/dev/null 2>&1 || true
        ROLE_ARN="arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/$ROLE_NAME"
        for SA in provider-aws-iam provider-aws-eks; do
          EXISTS=$(aws eks list-pod-identity-associations --cluster-name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
            --query "associations[?serviceAccount=='$SA'] | [0].associationId" --output text 2>/dev/null)
          if [ -z "$EXISTS" ] || [ "$EXISTS" = "None" ]; then
            aws eks create-pod-identity-association --cluster-name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
              --namespace crossplane-system --service-account "$SA" --role-arn "$ROLE_ARN" >/dev/null
            echo "  created PIA crossplane-system/$SA"
          else
            echo "  PIA crossplane-system/$SA already exists"
          fi
        done
      # NOTE: We deliberately do NOT restart the Crossplane providers here.
      # This task runs before crossplane-base is deployed, so the provider pods
      # don't exist yet — they will start AFTER these PIAs exist and therefore
      # pick up credentials at startup. The downstream providers (amp/rds/etc.)
      # and any that started early are restarted (non-fatally) by the phase1
      # task hub:restart-identity-pods, which waits for all PIAs Ready first.
      - printf '{{.C_OK}}✓ Crossplane provider pod identities created (providers credentialed on startup/phase1 restart).{{.C_RESET}}\n'

  # ── Perf lever #1 (background settle) + straggler diagnostics ───────────────
  # Self-contained settle: waits for the hub addons AND Crossplane providers to
  # converge, logging the NAMES of every out-of-sync app on each poll (not only on
  # timeout). Run in the background by install:hub-settle-bg so it never blocks
  # `task install`. Uses its OWN per-run kubeconfig (mktemp, see below) so it cannot
  # race the foreground tasks that share {{.ROOT_DIR}}/private/hub-kubeconfig
  # (urls, restart-langfuse, restart-backstage). Carries a remediation ADAPTED from
  # hub:wait-for-providers, but note the TRIGGER differs: the original fired on
  # "providers not Healthy after 5 min"; here it fires on "crossplane-base not Synced
  # after 5 min" (Synced is weaker than Healthy). A final providers-Healthy line is
  # logged at the end to preserve that signal (review #1053). Force-syncs crossplane-base
  # once if still OutOfSync (unsticks the provider-credential chicken-and-egg for hub
  # observability/agentcore — NOT a spoke precondition).
  hub:settle:
    # NOT internal: the background launcher invokes it from the CLI as
    # `task kind-kro-ack:hub:settle`; go-task rejects CLI calls to internal tasks
    # (exit 202), which silently skipped the entire settle (review #1053 §1).
    desc: "Settle hub addons + Crossplane providers (logs out-of-sync names each poll). Safe to background."
    vars:
      MAX_OUTOFSYNC: '{{.MAX_OUTOFSYNC | default "5"}}'
    cmds:
      - |
        STATUS=/tmp/hub-full-sync-settle.status
        # Single-instance is enforced by the launcher's `flock -n /tmp/hub-settle.lock`
        # (install:hub-settle-bg), NOT here: go-task's shell cannot redirect fd 9, so an
        # in-body `exec 9>LOCK` returns 1 and errexit kills the settle before it starts
        # (review #1053 §2). A direct manual `task kind-kro-ack:hub:settle` is not guarded,
        # which is fine — the mktemp kubeconfig below keeps concurrent runs from colliding.
        # Per-run private kubeconfig (review #1053 "re-runs collide"): a FIXED shared path
        # let the first settle to finish `rm` a concurrent run's kubeconfig. mktemp + an
        # EXIT trap give each run its own file, cleaned up however the run ends.
        KC=$(mktemp)
        trap 'rm -f "$KC"' EXIT
        # Run header (review #1053): keep appended runs separated in the shared log.
        printf '=== settle start %s (pid %s) ===\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$$"
        # Mark running up front (review #1053 §6) so a re-run's `urls` doesn't show the
        # PREVIOUS run's terminal status while this one is still in flight.
        printf 'running\n' > "$STATUS"
        if ! aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --alias {{.HUB_CLUSTER_NAME}} --kubeconfig "$KC" >/dev/null; then
          printf '✗ hub:settle: could not update kubeconfig for {{.HUB_CLUSTER_NAME}} — aborting settle (addons still converge via ArgoCD auto-sync; review #1053 §6).\n'
          printf 'kubeconfig-error\n' > "$STATUS"
          exit 1
        fi
        TIMEOUT=2400
        INTERVAL=30
        ELAPSED=0
        FORCED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          APP_OUTPUT=$(KUBECONFIG="$KC" kubectl get applications.argoproj.io -n argocd --no-headers 2>/dev/null || echo "")
          TOTAL=$(echo "$APP_OUTPUT" | awk 'NF>0' | wc -l | tr -d ' ')
          SYNCED=$(echo "$APP_OUTPUT" | awk '$2 == "Synced"' | wc -l | tr -d ' ')
          UNKNOWN=$(echo "$APP_OUTPUT" | awk '$2 == "Unknown"' | wc -l | tr -d ' ')
          OUTOFSYNC=$((TOTAL - SYNCED - UNKNOWN))
          printf '  [%ss] %s/%s synced, %s unknown/spoke, %s out-of-sync\n' "$ELAPSED" "$SYNCED" "$TOTAL" "$UNKNOWN" "$OUTOFSYNC"
          # Straggler diagnostics: name the apps still OutOfSync so a slow run shows
          # WHICH app is lagging (e.g. crossplane-base) without extra live tooling.
          if [ "$OUTOFSYNC" -gt 0 ]; then
            echo "$APP_OUTPUT" | awk '$2 != "Synced" && $2 != "Unknown" && NF>0 {printf "      - %s (%s/%s)\n", $1, $3, $2}'
          fi
          # Remediation (ported from hub:wait-for-providers): if crossplane-base is
          # still OutOfSync after ~5 min, force a sync once to unstick the provider
          # credential bootstrap. Hub observability/agentcore only — not spokes.
          if [ "$FORCED" -eq 0 ] && [ "$ELAPSED" -ge 300 ]; then
            CB=$(echo "$APP_OUTPUT" | awk -v n="crossplane-base-{{.HUB_CLUSTER_NAME}}" '$1==n && $2!="Synced"')
            if [ -n "$CB" ]; then
              printf '  Force-syncing crossplane-base (still OutOfSync after 5min)...\n'
              KUBECONFIG="$KC" kubectl patch application "crossplane-base-{{.HUB_CLUSTER_NAME}}" -n argocd --type merge -p '{"operation":{"initiatedBy":{"username":"admin"},"sync":{"revision":"HEAD"}}}' 2>/dev/null || true
              FORCED=1
            fi
          fi
          if [ "$TOTAL" -gt 0 ] && [ "$OUTOFSYNC" -le {{.MAX_OUTOFSYNC}} ]; then
            printf '✓ Hub settled: %s/%s synced (%s unknown/spoke, %s within tolerance).\n' "$SYNCED" "$TOTAL" "$UNKNOWN" "$OUTOFSYNC"
            printf 'ok\n' > "$STATUS"
            break
          fi
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          printf '⚠ Hub settle timed out after %ss. %s app(s) still out-of-sync (review #1053 §6):\n' "$TIMEOUT" "$OUTOFSYNC"
          echo "$APP_OUTPUT" | awk '$2 != "Synced" && $2 != "Unknown" && NF>0 {printf "      - %s (%s/%s)\n", $1, $3, $2}'
          printf 'timeout\n' > "$STATUS"
        fi
        # Final providers-Healthy signal (review #1053): the remediation TRIGGER here is
        # "crossplane-base not Synced after 5min", which is weaker than the old
        # hub:wait-for-providers "providers not Healthy". Log the real provider Healthy
        # state at the end so that signal is preserved.
        UNHEALTHY_PROVIDERS=$(KUBECONFIG="$KC" kubectl get providers.pkg.crossplane.io -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Healthy")].status!="True")].metadata.name}' 2>/dev/null || true)
        if [ -n "$UNHEALTHY_PROVIDERS" ]; then
          printf '  providers still not Healthy: %s\n' "$UNHEALTHY_PROVIDERS"
        else
          printf '  all Crossplane providers Healthy.\n'
        fi
        # $KC is removed by the EXIT trap set above.

  hub:wait-for-sync:
    desc: Wait for hub ArgoCD apps to sync
    vars:
      MAX_OUTOFSYNC: '{{.MAX_OUTOFSYNC | default "5"}}'
    cmds:
      - task: hub:kubeconfig
      - printf '{{.C_STEP}}▸ Waiting for apps to appear...{{.C_RESET}}\n'
      - |
        TIMEOUT=300; ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          TOTAL=$(KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl get applications.argoproj.io -n argocd --no-headers 2>/dev/null | wc -l | tr -d ' ')
          [ "$TOTAL" -gt 3 ] && printf '{{.C_INFO}}  %s apps detected{{.C_RESET}}\n' "$TOTAL" && break
          printf '{{.C_INFO}}  %s apps so far, waiting...{{.C_RESET}}\n' "$TOTAL"
          sleep 10; ELAPSED=$((ELAPSED + 10))
        done
      - printf '{{.C_STEP}}▸ Waiting for apps to sync...{{.C_RESET}}\n'
      - |
        TIMEOUT=1800; INTERVAL=15; ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          APP_OUTPUT=$(KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl get applications.argoproj.io -n argocd --no-headers 2>/dev/null || echo "")
          TOTAL=$(echo "$APP_OUTPUT" | awk '$2 != "Unknown" && NF>0' | wc -l | tr -d ' ')
          SYNCED=$(echo "$APP_OUTPUT" | awk '$2 == "Synced"' | wc -l | tr -d ' ')
          UNKNOWN=$(echo "$APP_OUTPUT" | awk '$2 == "Unknown"' | wc -l | tr -d ' ')
          OUTOFSYNC=$((TOTAL - SYNCED))
          printf '{{.C_INFO}}  Apps: %s/%s synced, %s unknown, %s out-of-sync (%ss elapsed){{.C_RESET}}\n' "$SYNCED" "$TOTAL" "$UNKNOWN" "$OUTOFSYNC" "$ELAPSED"
          # Straggler diagnostics: name the OutOfSync apps ~every 2 min so a slow run
          # shows WHICH app is lagging (not just a count) without extra tooling.
          if [ "$OUTOFSYNC" -gt 0 ] && [ $((ELAPSED % 120)) -lt $INTERVAL ]; then
            echo "$APP_OUTPUT" | awk '$2 != "Synced" && $2 != "Unknown" && NF>0 {printf "      - %s (%s/%s)\n", $1, $3, $2}'
          fi
          if [ "$TOTAL" -gt 0 ] && [ "$OUTOFSYNC" -le {{.MAX_OUTOFSYNC}} ]; then
            printf '{{.C_OK}}✓ All %s apps synced (within %s tolerance, %s unknown).{{.C_RESET}}\n' "$SYNCED" "{{.MAX_OUTOFSYNC}}" "$UNKNOWN"
            break
          fi
          sleep $INTERVAL; ELAPSED=$((ELAPSED + INTERVAL))
        done
        [ $ELAPSED -ge $TIMEOUT ] && printf '{{.C_WARN}}⚠ Sync wait timed out after %ss — continuing.{{.C_RESET}}\n' "$TIMEOUT" || true
      - rm -f {{.ROOT_DIR}}/private/hub-kubeconfig

  status:
    desc: Check bootstrap status
    cmds:
      - printf '{{.C_INFO}}=== Kind ==={{.C_RESET}}\n' && kind get clusters 2>/dev/null | grep "{{.KIND_CLUSTER_NAME}}" || echo "Not running"
      - printf '{{.C_INFO}}=== Helm ==={{.C_RESET}}\n' && helm list -A 2>/dev/null || echo "None"
      - printf '{{.C_INFO}}=== KRO RGDs ==={{.C_RESET}}\n' && kubectl get resourcegraphdefinitions 2>/dev/null || echo "None"
      - printf '{{.C_INFO}}=== KRO Instances ==={{.C_RESET}}\n' && kubectl get eksclusterwithvpc -A 2>/dev/null || echo "None"

  destroy-kind:
    desc: Delete Kind cluster only (hub persists)
    status:
      - "! kind get clusters 2>/dev/null | grep -q '^{{.KIND_CLUSTER_NAME}}$'"
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}

  hub:destroy-addons:
    desc: >-
      Gracefully remove all addons from the HUB EKS cluster (no git changes) so the
      on-hub ACK/KRO/Crossplane controllers delete their managed AWS resources
      (team IAM roles/policies, ALBs, DynamoDB, spoke clusters) while still alive.
      Deletes the infra-provisioning stack (crossplane/kro/ack) LAST. All steps are
      best-effort — safe to run even if the hub is already gone. Adapted from
      kind-crossplane. Must run BEFORE the hub cluster is deleted.
    vars:
      # Infra-provisioning stack: controllers that must stay alive to delete other
      # AWS resources and the spoke clusters. Skipped in the per-addon pass (step 7)
      # and deleted LAST, after the spoke clusters (step 8).
      # NOTE: keep in sync with the SKIP list in step 7 and the explicit reverse-order
      # list in step 8 — adding/removing an ACK controller means updating all three.
      INFRA_STACK: "argocd crossplane crossplane-base kro kro-manifests kro-manifests-hub ack-iam ack-eks ack-ec2 ack-ecr ack-s3 ack-dynamodb ack-efs"
      KC: "KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl"
    cmds:
      # Best-effort hub kubeconfig — if the hub EKS is already gone, every kubectl
      # below no-ops (2>/dev/null || true) and the task still completes cleanly.
      - cmd: aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --kubeconfig {{.ROOT_DIR}}/private/hub-kubeconfig >/dev/null 2>&1
        ignore_error: true
      - printf '{{.C_ERR}}▸ Stopping all regeneration...{{.C_RESET}}\n'
      # 1. bootstrap ApplicationSet (preserveResources) — stop recreating bootstrap App
      - '{{.KC}} patch applicationset bootstrap -n argocd --type merge -p ''{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":true}}}'' 2>/dev/null || true'
      - sleep 3
      - '{{.KC}} delete applicationset bootstrap -n argocd --timeout=30s 2>/dev/null || true'
      # 2. bootstrap Application (no cascade)
      - '{{.KC}} patch application bootstrap -n argocd --type merge -p ''{"metadata":{"finalizers":[]}}'' 2>/dev/null || true'
      - '{{.KC}} delete application bootstrap -n argocd --wait=false 2>/dev/null || true'
      # 3. cluster-addons ApplicationSet (preserveResources) — stop generating addon appsets
      - '{{.KC}} patch applicationset cluster-addons -n argocd --type merge -p ''{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":true}}}'' 2>/dev/null || true'
      - sleep 3
      - '{{.KC}} delete applicationset cluster-addons -n argocd --timeout=30s 2>/dev/null || true'
      # 4. cluster-addons Application (no cascade)
      - '{{.KC}} patch application cluster-addons -n argocd --type merge -p ''{"metadata":{"finalizers":[]}}'' 2>/dev/null || true'
      - '{{.KC}} delete application cluster-addons -n argocd --wait=false 2>/dev/null || true'
      # 4.5. Delete the agent-platform chain (optional agentic overlay). Stop the
      #      AppSet FIRST (preserveResources) so it does not regenerate its child apps,
      #      then orphan the child apps. No-op when agent-platform is not deployed
      #      (absent on rc3). Mirrors the kind-crossplane path so the two providers stay
      #      symmetric — without this, agent-platform is only in the step-7 SKIP, so its
      #      AppSet would survive and regenerate the workloads deleted in step 5.
      - cmd: |
          if {{.KC}} get applicationset agent-platform -n argocd >/dev/null 2>&1; then
            echo "Stopping agent-platform AppSet..."
            {{.KC}} patch applicationset agent-platform -n argocd --type merge -p '{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":true}}}' 2>&1 || true
            sleep 3
            {{.KC}} delete applicationset agent-platform -n argocd --timeout=30s 2>&1 || true
          fi
          for app in $({{.KC}} get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -E '^agent-platform-' || true); do
            echo "Stopping $app..."
            {{.KC}} patch application "$app" -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' 2>&1 || true
            {{.KC}} delete application "$app" -n argocd --wait=false 2>&1 || true
          done
        ignore_error: true
      # 4.6. Delete bootstrap-level AppSets that are in the SKIP list for step 7 but
      #      are never explicitly stopped — they regenerate per-cluster apps during
      #      step 10's force-delete loop, causing an infinite loop.
      #      - abstractions: generates crossplane-base-<cluster> apps for each cluster
      #      - hub-fleet-secret: generates fleet-secret-<cluster> apps
      #      - pod-identities: generates pod-identity-<cluster> apps
      #      Stop each with preserveResources=true first so child apps are orphaned
      #      (not cascade-deleted), then delete the AppSet itself.
      - cmd: |
          for AS in abstractions hub-fleet-secret pod-identities; do
            if {{.KC}} get applicationset "$AS" -n argocd >/dev/null 2>&1; then
              echo "Stopping $AS AppSet..."
              {{.KC}} patch applicationset "$AS" -n argocd --type merge -p '{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":true}}}' 2>&1 || true
              sleep 3
              {{.KC}} delete applicationset "$AS" -n argocd --timeout=30s 2>&1 || true
            fi
          done
        ignore_error: true
      # 4.7. Stop managing platform-manifests-bootstrap WITHOUT pruning it. It owns the
      #      Karpenter NodePools (consumer pools such as the workshop's system-peeks and
      #      general-purpose-peeks, plus gpu/trainium) that the platform controllers are
      #      pinned to: cert-manager, external-secrets, crossplane, LBC, argo-*, ... If
      #      step 7 prunes it like any other addon, Auto Mode drains those nodes and the
      #      controllers stay Pending for the rest of the teardown, so the addons removed
      #      after it wait out their finalizer timeouts and leave their AWS resources
      #      behind. Its AppSet goes with --cascade=orphan, then its Applications without
      #      their resources-finalizer; the NodePools go with the hub cluster, which
      #      destroy deletes through the AWS API right after this task.
      - cmd: |
          if {{.KC}} get applicationset platform-manifests-bootstrap -n argocd >/dev/null 2>&1; then
            echo "Stopping platform-manifests-bootstrap (NodePools kept until the cluster delete)..."
            {{.KC}} patch applicationset platform-manifests-bootstrap -n argocd --type merge -p '{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":true}}}' 2>&1 || true
            sleep 3
            {{.KC}} delete applicationset platform-manifests-bootstrap -n argocd --cascade=orphan --timeout=30s 2>&1 || true
          fi
          for app in $({{.KC}} get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -E '^platform-manifests-bootstrap-' || true); do
            {{.KC}} patch application "$app" -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' 2>&1 || true
            {{.KC}} delete application "$app" -n argocd --wait=false 2>&1 || true
          done
        ignore_error: true
      # 5. Delete APPLICATION WORKLOADS first — all ArgoCD Applications whose project is
      #    NOT 'default' (addons) or 'platform' (infra). On kro-c1 these are rust-project,
      #    java-project, cpu-ray-project, spoke-workloads (rust/java/golang/dotnet/next-js
      #    apps, CI/CD pipelines, ray, progressive-delivery). Deleting them removes the kro
      #    AppmodService/CICDPipeline/RayService CRs so kro/ACK (still alive on the hub)
      #    delete the app-owned AWS resources (IAM roles/policies, ECR repos, DynamoDB) and
      #    the Rollouts/Services on the spokes. MUST happen before spoke-cluster deletion.
      - printf '{{.C_ERR}}▸ Deleting application workloads (non-default/platform projects)...{{.C_RESET}}\n'
      - cmd: |
          for app in $({{.KC}} get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.project}{"\n"}{end}' 2>/dev/null | awk '$2!="default" && $2!="platform" && $2!=""{print $1}'); do
            echo "Deleting workload $app..."
            {{.KC}} delete application $app -n argocd --timeout=300s 2>/dev/null || \
            ({{.KC}} patch application $app -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null && \
             {{.KC}} delete application $app -n argocd --wait=false 2>/dev/null) || true
          done
        ignore_error: true
      # 6. Delete SPOKE CLUSTERS (after their workloads, before hub addons): the hub
      #    KRO/Crossplane provisioners tear down the spoke EKS. kro-ack spokes are
      #    generated by the 'clusters-kro' ApplicationSet (apps clusters-kro-<spoke>);
      #    'clusters' covers any crossplane/fleet-registered ones.
      - printf '{{.C_ERR}}▸ Deleting spoke clusters...{{.C_RESET}}\n'
      - cmd: |
          for AS in clusters-kro clusters; do
            if {{.KC}} get applicationset $AS -n argocd >/dev/null 2>&1; then
              {{.KC}} patch applicationset $AS -n argocd --type merge -p '{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":false}}}' 2>/dev/null || true
              sleep 3
              {{.KC}} delete applicationset $AS -n argocd --timeout=60s 2>/dev/null || true
            fi
          done
        ignore_error: true
      # Wait for spoke-provisioning apps to disappear (no common label — match by name),
      # then force-strip finalizers on any that are stuck.
      - cmd: |
          for i in $(seq 1 40); do
            REMAIN=$({{.KC}} get applications -n argocd -o name 2>/dev/null | grep -Ec 'clusters-kro-|clusters-.*spoke') || REMAIN=0
            [ "$REMAIN" -eq 0 ] && break
            echo "  waiting for $REMAIN spoke-provisioning app(s) to delete..."; sleep 15
          done
          for app in $({{.KC}} get applications -n argocd -o name 2>/dev/null | grep -E 'clusters-kro-|clusters-.*spoke' | sed 's|.*/||'); do
            {{.KC}} patch application $app -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
            {{.KC}} delete application $app -n argocd --wait=false 2>/dev/null || true
          done
        ignore_error: true
      # 7. Delete HUB ADDONS in reverse sync-wave order, SKIPPING the infra stack.
      #    Addons are discovered LIVE from the cluster (kubectl), not from the static
      #    registry files, so addons enabled outside the registry are still cleaned up.
      #    Child apps are matched by ownerReference (ArgoCD does not label generated apps
      #    uniformly), and the finalizer/deletion waits are skipped when an addon has no
      #    child apps — avoiding the per-addon 30s/120s timeouts on disabled addons.
      #    The wave is read from the addon's Applications: the registry's annotationsAppSet
      #    is rendered onto the AppSet's template, so the AppSets themselves carry no wave
      #    and the order would fall back to reverse-alphabetical. multi-acct is skipped
      #    here and removed last, without pruning (step 9b).
      - cmd: |
          SKIP="{{.INFRA_STACK}} multi-acct bootstrap cluster-addons agent-platform fleet-secrets hub-fleet-secret clusters clusters-kro abstractions pod-identities"
          APP_WAVES=$({{.KC}} get applications -n argocd \
            -o jsonpath='{range .items[*]}{.metadata.ownerReferences[0].name}{" "}{.metadata.annotations.argocd\.argoproj\.io/sync-wave}{"\n"}{end}' 2>/dev/null || true)
          ADDONS=$({{.KC}} get applicationsets -n argocd \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.metadata.annotations.argocd\.argoproj\.io/sync-wave}{"\n"}{end}' 2>/dev/null \
          | while read name wave; do
            [ -z "$name" ] && continue
            app_wave=$(echo "$APP_WAVES" | awk -v n="$name" '$1 == n && $2 != "" {print $2; exit}')
            wave="${app_wave:-${wave:-0}}"
            skip=false
            for s in $SKIP; do if [ "$name" = "$s" ]; then skip=true; break; fi; done
            [ "$skip" = "true" ] && continue
            echo "$wave $name"
          done | sort -rn | awk '{print $2}' || true)
          for ADDON in $ADDONS; do
            {{.KC}} get applicationset "$ADDON" -n argocd >/dev/null 2>&1 || continue
            echo "Deleting $ADDON..."
            {{.KC}} patch applicationset "$ADDON" -n argocd --type merge -p '{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":false}}}' 2>&1 || true
            CHILDREN=$({{.KC}} get applications -n argocd -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name==\"$ADDON\")]}{.metadata.name}{\"\\n\"}{end}" 2>/dev/null)
            if [ -n "$CHILDREN" ]; then
              E=0; while [ $E -lt 30 ]; do
                F=$({{.KC}} get applications -n argocd -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name==\"$ADDON\")]}{.metadata.finalizers}{end}" 2>/dev/null)
                echo "$F" | grep -q resources-finalizer && break
                sleep 2; E=$((E + 2))
              done
            fi
            {{.KC}} delete applicationset "$ADDON" -n argocd --timeout=180s 2>&1 || true
            if [ -n "$CHILDREN" ]; then
              E=0; while [ $E -lt 120 ]; do
                R=$({{.KC}} get applications -n argocd -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name==\"$ADDON\")]}{.metadata.name}{end}" 2>/dev/null)
                [ -z "$R" ] && break
                sleep 5; E=$((E + 5))
              done
            fi
          done
        ignore_error: true
      # 8. Delete the INFRA-PROVISIONING STACK LAST, reverse order (consumers -> controllers).
      - cmd: |
          for ADDON in kro-manifests-hub kro-manifests kro ack-efs ack-dynamodb ack-s3 ack-ecr ack-ec2 ack-eks ack-iam crossplane-base crossplane; do
            if {{.KC}} get applicationset $ADDON -n argocd >/dev/null 2>&1; then
              echo "Deleting $ADDON..."
              {{.KC}} patch applicationset $ADDON -n argocd --type merge -p '{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":false}}}' 2>&1 || true
              sleep 3
              {{.KC}} delete applicationset $ADDON -n argocd --timeout=180s 2>&1 || true
              E=0; while [ $E -lt 120 ]; do
                R=$({{.KC}} get applications -n argocd -o jsonpath="{range .items[?(@.metadata.ownerReferences[0].name==\"$ADDON\")]}{.metadata.name}{end}" 2>/dev/null)
                [ -z "$R" ] && break
                sleep 5; E=$((E + 5))
              done
            fi
          done
        ignore_error: true
      # 9. fleet-secrets
      - printf '{{.C_ERR}}▸ Deleting fleet-secrets...{{.C_RESET}}\n'
      - '{{.KC}} patch applicationset fleet-secrets -n argocd --type merge -p ''{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":false}}}'' 2>/dev/null || true'
      - sleep 3
      - '{{.KC}} delete applicationset fleet-secrets -n argocd --timeout=180s 2>/dev/null || true'
      # 9b. multi-acct LAST and WITHOUT pruning, like bootstrap/cluster-addons in steps 1-4.
      #     It owns the per-cluster Namespaces and the CARM IAMRoleSelectors that ACK needs
      #     to delete every other addon's AWS resources. After the #1033 pivot, Namespace
      #     <hub> also holds the hub's own EksCluster, which destroy has just flipped to
      #     deletionPolicy=delete: pruning that Namespace makes ACK delete the hub's Argo CD
      #     and ACK capability roles mid-teardown. So orphan it (AppSet deleted with
      #     --cascade=orphan, then its Applications without their resources-finalizer). The
      #     hub cluster delete below removes these objects; the sweep owns the residue.
      - cmd: |
          if {{.KC}} get applicationset multi-acct -n argocd >/dev/null 2>&1; then
            echo "Removing multi-acct (no prune)..."
            {{.KC}} patch applicationset multi-acct -n argocd --type merge -p '{"spec":{"syncPolicy":{"preserveResourcesOnDeletion":true}}}' 2>&1 || true
            sleep 3
            {{.KC}} delete applicationset multi-acct -n argocd --cascade=orphan --timeout=30s 2>&1 || true
          fi
          for app in $({{.KC}} get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -E '^multi-acct-' || true); do
            {{.KC}} patch application "$app" -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' 2>&1 || true
            {{.KC}} delete application "$app" -n argocd --wait=false 2>&1 || true
          done
        ignore_error: true
      # 10. Force-delete ALL leftover ArgoCD objects, generators-first + finalizers-first,
      #     bounded and NON-blocking. Some leftover apps (e.g. crossplane-base-<spoke>,
      #     generated by the 'abstractions' AppSet) point at spoke clusters that are already
      #     deleted, so their argocd resources-finalizer can never complete — a per-app
      #     `delete --timeout=300s` blocks 300s each, and any surviving generator AppSet keeps
      #     recreating them, so the naive loop could hang indefinitely (observed >1h). Here we
      #     (a) delete every remaining ApplicationSet first (finalizers stripped) so nothing
      #     regenerates, then (b) strip finalizers off all remaining Applications BEFORE a
      #     non-blocking delete, in a small bounded number of passes.
      - cmd: |
          # 10a. Kill any surviving generator AppSets so they stop recreating child apps.
          for as in $({{.KC}} get applicationsets -n argocd -o name 2>/dev/null); do
            {{.KC}} patch "$as" -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
            {{.KC}} delete "$as" -n argocd --wait=false 2>/dev/null || true
          done
          # 10b. Strip finalizers on ALL remaining Applications, THEN delete non-blocking.
          #      Bounded 3-pass loop catches last stragglers without ever blocking.
          for pass in 1 2 3; do
            APPS=$({{.KC}} get applications -n argocd -o name 2>/dev/null)
            [ -z "$APPS" ] && break
            for app in $APPS; do
              echo "Force-deleting leftover $app..."
              {{.KC}} patch "$app" -n argocd --type merge -p '{"metadata":{"finalizers":[]}}' 2>/dev/null || true
            done
            {{.KC}} delete applications -n argocd --all --wait=false 2>/dev/null || true
            sleep 5
          done
        ignore_error: true
      - printf '{{.C_OK}}✓ Hub addons removed.{{.C_RESET}}\n'

  destroy:
    desc: Full teardown — delete KRO instances, wait for ACK to clean up AWS resources, delete Kind
    vars:
      CLEANUP_KIND: '{{.CLEANUP_KIND | default "false"}}'
    cmds:
      # Preflight: the extended sweep (step 6) runs python helpers that import boto3.
      # boto3 was an UNDECLARED prerequisite: when absent, the sweep died on
      # ModuleNotFoundError and CloudFront, IAM, Secrets, AMP, OIDC and VPC cleanup
      # were all skipped — while destroy still printed "✓ Destroy complete". Fail here
      # instead, before anything is torn down, so the operator is not left with a
      # half-destroyed account and a success message. Note boto3 does not install on
      # the default Python 3.14 on current macOS; a 3.12 interpreter works.
      - cmd: |
          if ! python3 -c 'import boto3' 2>/dev/null; then
            printf '{{.C_ERR}}✗ boto3 is required by the teardown sweep but is not importable by %s.{{.C_RESET}}\n' "$(command -v python3)"
            printf '{{.C_INFO}}  Install it:   python3 -m pip install boto3{{.C_RESET}}\n'
            printf '{{.C_INFO}}  If that fails on Python 3.14, use a 3.12 interpreter (e.g. pyenv/uv) and re-run.{{.C_RESET}}\n'
            printf '{{.C_INFO}}  Refusing to start: without it the sweep silently skips CloudFront, IAM,{{.C_RESET}}\n'
            printf '{{.C_INFO}}  Secrets, AMP, OIDC and VPC cleanup.{{.C_RESET}}\n'
            exit 1
          fi
      - |
        # [#1033] Pivot-aware kubeconfig. After a hub self-adoption pivot kind is stopped
        # (detach=stop) or gone (detach=delete), so `kind get kubeconfig` fails and the kind
        # steps must be skipped (review #2). Detect that and point the Taskfile-wide KUBECONFIG
        # at the HUB instead — the hub's own kro/ACK now manage it, and the hub EKS cluster is
        # deleted below via the AWS API (aws eks delete-cluster), not through kind. On a
        # non-pivoted stack the kind branch runs and behaves exactly as before.
        if docker ps -q --filter "label=io.x-k8s.kind.cluster={{.KIND_CLUSTER_NAME}}" | grep -q . \
           && kind get kubeconfig --name {{.KIND_CLUSTER_NAME}} > {{.KUBECONFIG}} 2>/dev/null; then
          printf '{{.C_INFO}}  kind running — using kind kubeconfig for teardown.{{.C_RESET}}\n'
          printf 'kind' > /tmp/peeks-destroy-mode
        else
          printf '{{.C_INFO}}  kind not running (pivoted/stopped/gone) — using hub kubeconfig for teardown.{{.C_RESET}}\n'
          printf 'hub' > /tmp/peeks-destroy-mode
          aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
            --kubeconfig {{.KUBECONFIG}} --alias {{.KIND_CLUSTER_NAME}} 2>/dev/null \
            || printf '{{.C_INFO}}  (hub kubeconfig unavailable — hub may already be gone; teardown continues best-effort.){{.C_RESET}}\n'
        fi
      # [#1033 N4] credentials:refresh writes IDE/participant AWS creds into ack-system and
      # rollout-restarts it. On a PIVOTED stack KUBECONFIG points at the HUB, whose ACK runs on
      # capability roles and needs none of this; it also hard-fails when the hub is already gone
      # (the task has no ignore_error). Only refresh on the kind kubeconfig.
      - cmd: |
          if [ "$(cat /tmp/peeks-destroy-mode 2>/dev/null)" = "kind" ]; then
            ( cd "{{.ROOT_DIR}}" && task kind-kro-ack:credentials:refresh )
          else
            printf '{{.C_INFO}}  skipping credentials:refresh (hub/pivoted kubeconfig — hub ACK uses capability roles; review #1033 N4).{{.C_RESET}}\n'
          fi
        ignore_error: true
      # [#1033 N5] The hub EksCluster is BORN with deletionPolicy=retain (hub:claim) so kind can
      # never AWS-delete it. We flip it back to "delete" here as a DEFENSIVE measure: it only
      # has an effect if the instance CR is ever GRACEFULLY deleted via k8s (deletionTimestamp
      # set → ACK finalizer honours the policy). destroy does NOT gracefully delete the CR — it
      # removes the hub via the AWS API (aws eks delete-capability / delete-cluster below) and
      # `kind delete cluster` is not a graceful CR delete either — so the flip does NOT by itself
      # drive the ACK cascade, and IAM/OIDC/SG residue is owned by the extended sweep regardless.
      # The flip simply guarantees that IF something later gracefully deletes the retained CR, it
      # won't orphan. Patch whichever instance kind exists, against the pivot-aware KUBECONFIG set
      # above (kind pre-pivot, hub post-pivot). Best-effort: a no-op if no instance is reachable.
      - cmd: |
          # [#1033] On a PIVOTED stack the hub EksCluster is asserted by the `hub-self-adoption`
          # ArgoCD Application (selfHeal:true) whose git manifest carries deletionPolicy:retain.
          # If we flip the live instance to deletionPolicy=delete while that App is still
          # running, selfHeal reverts the patch back to retain → ACK orphans (never deletes) the
          # AWS children → IAM/OIDC/SG/access-entries leak to the sweep. So REMOVE the asserter
          # FIRST: strip its argocd cascade finalizer and delete it non-cascading
          # (--cascade=orphan) so deleting the App does not itself prune the EksCluster — the
          # flip below then sticks. No-op on a non-pivoted stack (App absent).
          kubectl -n argocd patch application hub-self-adoption --type merge -p '{"metadata":{"finalizers":[]}}' >/dev/null 2>&1 || true
          kubectl -n argocd delete application hub-self-adoption --cascade=orphan --wait=false --ignore-not-found >/dev/null 2>&1 || true
          flipped=0
          for KK in ekscluster eksclusterwithvpc; do
            if kubectl -n {{.HUB_CLUSTER_NAME}} get "$KK.kro.run" {{.HUB_CLUSTER_NAME}} >/dev/null 2>&1; then
              if kubectl -n {{.HUB_CLUSTER_NAME}} patch "$KK.kro.run" {{.HUB_CLUSTER_NAME}} \
                   --type merge -p '{"spec":{"deletionPolicy":"delete"}}' >/dev/null 2>&1; then
                printf '{{.C_INFO}}  flipped %s/%s deletionPolicy=delete for teardown.{{.C_RESET}}\n' "$KK" "{{.HUB_CLUSTER_NAME}}"
                flipped=1
              fi
            fi
          done
          if [ "$flipped" = 1 ]; then
            # Wait on the REAL condition (not a fixed sleep): kro propagating deletion-policy=delete
            # onto the ACK EKS Cluster child's annotation. Bounded to ~60s; proceed anyway if slow
            # (the sweep still backstops IAM/OIDC/SG).
            printf '{{.C_INFO}}  waiting for kro to propagate deletion-policy=delete to the ACK EKS Cluster child…{{.C_RESET}}\n'
            for i in $(seq 1 30); do
              if kubectl -n {{.HUB_CLUSTER_NAME}} get cluster.eks.services.k8s.aws \
                   -o jsonpath='{range .items[*]}{.metadata.annotations.services\.k8s\.aws/deletion-policy}{"\n"}{end}' 2>/dev/null \
                   | grep -qx delete; then
                printf '{{.C_OK}}  ✓ deletion-policy=delete propagated to ACK EKS Cluster (after %ds).{{.C_RESET}}\n' "$((i*2))"
                break
              fi
              [ "$i" = 30 ] && printf '{{.C_INFO}}  propagation not confirmed within 60s — continuing (sweep backstops residue).{{.C_RESET}}\n' || sleep 2
            done
          else
            printf '{{.C_INFO}}  no hub kro instance reachable to flip (already gone) — sweep will backstop IAM/OIDC/SG.{{.C_RESET}}\n'
          fi
        ignore_error: true
      # Kill the Kind cluster FIRST — before hub:destroy-addons.
      # This stops KRO from reconciling the hub eksclusterwithvpc resource.
      # Without this, KRO may recreate the hub EKS cluster after we delete it
      # (standard KRO reconcile: desired state ≠ actual → create).
      # hub:destroy-addons only needs the hub EKS cluster API (via hub-kubeconfig),
      # not the Kind cluster, so killing Kind here is safe.
      - cmd: |
          kind delete cluster --name {{.KIND_CLUSTER_NAME}} 2>/dev/null || true
          printf '{{.C_OK}}✓ Kind cluster removed — KRO cannot recreate hub EKS.\n'
        ignore_error: true
      # Gracefully tear down the addon layer on the HUB EKS.
      # All-best-effort: a no-op if the hub is already gone.
      - task: hub:destroy-addons
      # Delete EKS Capabilities (ack, argocd, kro) directly via AWS API.
      # aws eks delete-cluster fails with ResourceInUseException if capabilities exist.
      - printf '{{.C_ERR}}▸ Deleting EKS Capabilities (ack, argocd, kro)...{{.C_RESET}}\n'
      - cmd: |
          for CAP in ack argocd kro; do
            STATUS=$(aws eks list-capabilities --cluster-name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
              --query "capabilities[?capabilityName=='${CAP}'].status | [0]" --output text 2>/dev/null || echo "")
            if [ -n "$STATUS" ] && [ "$STATUS" != "None" ] && [ "$STATUS" != "" ]; then
              echo "  Deleting capability $CAP (status: $STATUS)..."
              aws eks delete-capability --cluster-name {{.HUB_CLUSTER_NAME}} --capability-name "$CAP" \
                --region {{.AWS_REGION}} 2>/dev/null || true
            fi
          done
          # Wait up to 5 min for all capabilities to be gone
          for i in $(seq 1 20); do
            COUNT=$(aws eks list-capabilities --cluster-name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
              --query 'length(capabilities)' --output text 2>/dev/null || echo 0)
            [ "$COUNT" = "0" ] && break
            printf '  [%s/20] %s capabilities remaining...\n' "$i" "$COUNT"
            sleep 15
          done
        ignore_error: true
      # Delete the hub EKS cluster directly via AWS API (bypasses KRO entirely).
      # Kind is already dead so KRO cannot recreate it.
      - printf '{{.C_ERR}}▸ Deleting hub EKS cluster via AWS API...{{.C_RESET}}\n'
      - cmd: |
          STATUS=$(aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
            --query 'cluster.status' --output text 2>/dev/null || echo "NOT_FOUND")
          if [ "$STATUS" != "NOT_FOUND" ] && [ "$STATUS" != "DELETING" ]; then
            # Keep stderr: this is where ResourceInUseException ("Cluster has
            # capabilities attached") appears when the capability wait above timed
            # out. Discarding it is why the cluster could survive a destroy that
            # reported success. Still `|| true` so later cleanup steps run; the
            # check at the end of destroy is what fails the task.
            aws eks delete-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} || true
            echo "  Submitted hub EKS cluster deletion"
          fi
        ignore_error: true
      - printf '{{.C_STEP}}▸ Waiting for EKS cluster deletion...{{.C_RESET}}\n'
      - cmd: |
          for i in $(seq 1 120); do
            STATUS=$(aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} \
              --query 'cluster.status' --output text 2>/dev/null || echo "NOT_FOUND")
            [ "$STATUS" = "NOT_FOUND" ] && break
            printf '{{.C_INFO}}  [%s/120] Hub EKS status: %s...{{.C_RESET}}\n' "$i" "$STATUS"
            sleep 15
          done
        ignore_error: true
      # Clean up Secrets Manager
      - aws secretsmanager delete-secret --secret-id {{.HUB_CLUSTER_NAME}}/config --force-delete-without-recovery --region {{.AWS_REGION}} 2>/dev/null || true
      - aws secretsmanager delete-secret --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --force-delete-without-recovery --region {{.AWS_REGION}} 2>/dev/null || true
      # Best-effort sweep of AWS resources the addon controllers may have orphaned —
      # prevents redeploy conflicts on a reused account: IAM EntityAlreadyExists,
      # ALB DuplicateLoadBalancerName, delivery-source ConflictException.
      # Prefix-scoped; never fails destroy.
      - printf '{{.C_ERR}}▸ Sweeping leftover AWS resources ({{.RESOURCE_PREFIX}}-*)...{{.C_RESET}}\n'
      - cmd: |
          REGION="{{.AWS_REGION}}"; PREFIX="{{.RESOURCE_PREFIX}}"
          # 1. ALBs from the load-balancer-controller — scoped by the elbv2.k8s.aws/cluster
          #    tag to our "${PREFIX}-*" clusters (hub + spokes). Tag-based (not name-based)
          #    so we never touch unrelated clusters' ALBs, and we also catch non-"k8s-*"
          #    names (e.g. the hub ingress ALB).
          for ARN in $(aws elbv2 describe-load-balancers --region "$REGION" --query 'LoadBalancers[].LoadBalancerArn' --output text 2>/dev/null); do
            CL=$(aws elbv2 describe-tags --region "$REGION" --resource-arns "$ARN" --query "TagDescriptions[0].Tags[?Key=='elbv2.k8s.aws/cluster']|[0].Value" --output text 2>/dev/null)
            case "$CL" in
              "${PREFIX}-"*) echo "  deleting ALB $ARN (cluster $CL)"; aws elbv2 delete-load-balancer --load-balancer-arn "$ARN" --region "$REGION" 2>/dev/null || true ;;
            esac
          done
          # 2. Orphaned CloudWatch delivery sources for this hub
          for ID in $(aws logs describe-deliveries --region "$REGION" --query "deliveries[?contains(deliverySourceName, '{{.HUB_CLUSTER_NAME}}')].id" --output text 2>/dev/null); do
            aws logs delete-delivery --id "$ID" --region "$REGION" 2>/dev/null || true
          done
          # 3. Orphaned ACK-managed IAM roles. Scope by BOTH the resource prefix AND
          #    an ACK ownership tag (services.k8s.aws/*), and skip infra/bootstrap/CFN
          #    roles by name. Deleting the IDE execution role (*-team-stack-*/*SharedRole*),
          #    the cluster/provider roles, or the argo-rollouts roles would break the
          #    teardown or the CloudFormation stack delete — so they are never swept.
          DENY_RE='(-team-stack-|SharedRole|-cluster-mgmt-|-cluster-role$|-cluster-node-role$|-crossplane-provider|Crossplane.*ProviderRole|-argo-rollouts)'
          [ -n "$PREFIX" ] && aws iam list-roles --query "Roles[?starts_with(RoleName, '${PREFIX}-')].RoleName" --output text 2>/dev/null | tr '\t' '\n' | while read ROLE; do
            [ -z "$ROLE" ] && continue
            echo "$ROLE" | grep -qE "$DENY_RE" && { echo "  skip role $ROLE (infra/bootstrap/CFN — not swept)"; continue; }
            case "$ROLE" in "${PREFIX}-workshop-"*) echo "  skip role $ROLE (CloudFormation stack role — not swept)"; continue ;; esac
            ACK=$(aws iam list-role-tags --role-name "$ROLE" --query "length(Tags[?starts_with(Key, 'services.k8s.aws/')])" --output text 2>/dev/null || echo 0)
            [ "$ACK" = "0" ] && { echo "  skip role $ROLE (not ACK-managed)"; continue; }
            for P in $(aws iam list-attached-role-policies --role-name "$ROLE" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null); do
              aws iam detach-role-policy --role-name "$ROLE" --policy-arn "$P" 2>/dev/null || true
            done
            for IP in $(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames[]' --output text 2>/dev/null); do
              aws iam delete-role-policy --role-name "$ROLE" --policy-name "$IP" 2>/dev/null || true
            done
            echo "  deleting ACK IAM role $ROLE"; aws iam delete-role --role-name "$ROLE" 2>/dev/null || true
          done
          # 4. Orphaned ACK-managed customer IAM policies (same scoping as roles:
          #    prefix + services.k8s.aws/* tag + name denylist; DENY_RE from step 3).
          [ -n "$PREFIX" ] && aws iam list-policies --scope Local --query "Policies[?starts_with(PolicyName, '${PREFIX}-')].Arn" --output text 2>/dev/null | tr '\t' '\n' | while read POL; do
            [ -z "$POL" ] && continue
            echo "$POL" | grep -qE "$DENY_RE" && { echo "  skip policy $POL (infra/bootstrap — not swept)"; continue; }
            ACK=$(aws iam list-policy-tags --policy-arn "$POL" --query "length(Tags[?starts_with(Key, 'services.k8s.aws/')])" --output text 2>/dev/null || echo 0)
            [ "$ACK" = "0" ] && { echo "  skip policy $POL (not ACK-managed)"; continue; }
            for V in $(aws iam list-policy-versions --policy-arn "$POL" --query 'Versions[?IsDefaultVersion==`false`].VersionId' --output text 2>/dev/null); do
              aws iam delete-policy-version --policy-arn "$POL" --version-id "$V" 2>/dev/null || true
            done
            echo "  deleting ACK IAM policy $POL"; aws iam delete-policy --policy-arn "$POL" 2>/dev/null || true
          done
          # 5. Orphaned ACK-managed ECR repositories. The CICD RGD names repos
          #    "${PREFIX}/<app>" and "${PREFIX}/<app>/cache", so scope by the "${PREFIX}/"
          #    (or "${PREFIX}-") name prefix AND require an ACK ownership tag.
          #    NOTE: DynamoDB tables use arbitrary user-provided names (tableName) with no
          #    deployment-scoping prefix/tag, so they are intentionally NOT swept — a broad
          #    tag-only delete would risk other deployments' tables. They rely on graceful
          #    CR deletion (the workload step waits before stripping finalizers). Same for
          #    EFS (optional addon, not created by the app RGDs).
          [ -n "$PREFIX" ] && for REPO in $(aws ecr describe-repositories --region "$REGION" --query "repositories[?starts_with(repositoryName, '${PREFIX}/') || starts_with(repositoryName, '${PREFIX}-')].repositoryName" --output text 2>/dev/null | tr '\t' '\n'); do
            [ -z "$REPO" ] && continue
            ARN=$(aws ecr describe-repositories --region "$REGION" --repository-names "$REPO" --query 'repositories[0].repositoryArn' --output text 2>/dev/null)
            ACK=$(aws ecr list-tags-for-resource --region "$REGION" --resource-arn "$ARN" --query "length(tags[?starts_with(Key, 'services.k8s.aws/')])" --output text 2>/dev/null || echo 0)
            [ "$ACK" = "0" ] && { echo "  skip ECR $REPO (not ACK-managed)"; continue; }
            echo "  deleting ACK ECR repo $REPO"; aws ecr delete-repository --region "$REGION" --repository-name "$REPO" --force 2>/dev/null || true
          done
        ignore_error: true
      # 6. Extended sweep — resources not cleaned by ACK CR deletion or CFN:
      #    CloudFront VPC origins + distributions, remaining IAM roles/policies
      #    (Crossplane/pod-identity/LBC/etc — not ACK-tagged), Secrets Manager,
      #    AMP workspaces, OIDC providers, CW log groups, spoke VPCs.
      #    All best-effort; safe to run on a fresh account (most loops are no-ops).
      - printf '{{.C_ERR}}▸ Extended AWS sweep (CloudFront, IAM, Secrets, AMP, OIDC, VPCs)...{{.C_RESET}}\n'
      - cmd: |
          REGION="{{.AWS_REGION}}"; PREFIX="{{.RESOURCE_PREFIX}}"
          HUB="{{.HUB_CLUSTER_NAME}}"
          # 6a. CloudFront VPC Origins and Distributions associated with this hub.
          #     The hub platform CloudFront distribution uses a VPC Origin pointing to
          #     the internal ALB ingress. After the ALB is deleted, CloudFront VPC origin
          #     ENIs remain in the private subnets, blocking VPC deletion via CFN.
          #     Strategy: delete all ${HUB}-* VPC origins and their distributions.
          python3 "{{.ROOT_DIR}}/scripts/sweep-cloudfront.py" "{{.HUB_CLUSTER_NAME}}" 2>&1 || true
          # 6b. ALL remaining peeks-* IAM roles (not just ACK-tagged). Crossplane provider
          #     roles, ExternalDNS, LBC, Kargo, KeycloakConfig, argo-rollouts IRSA roles etc.
          #     are NOT ACK-tagged but are workshop-owned and cause EntityAlreadyExists on
          #     re-deploy. Same denylist as step 3 to protect CFN/cluster roles.
          DENY_RE='(-team-stack-|SharedRole)'
          [ -n "$PREFIX" ] && aws iam list-roles --query "Roles[?starts_with(RoleName, '${PREFIX}-')].RoleName" \
              --output text 2>/dev/null | tr '\t' '\n' | while read ROLE; do
            [ -z "$ROLE" ] && continue
            echo "$ROLE" | grep -qE "$DENY_RE" && { echo "  skip role $ROLE (CFN — not swept)"; continue; }
            # The stack's own roles are named <stack-name>-<LogicalId>-<random>. The self-paced
            # stack is "<prefix>-workshop" (no "-team-stack-"), so match the stack-name prefix too:
            # deleting them breaks the stack's custom-resource Lambdas during delete-stack.
            case "$ROLE" in "${PREFIX}-workshop-"*) echo "  skip role $ROLE (CloudFormation stack role — not swept)"; continue ;; esac
            for P in $(aws iam list-attached-role-policies --role-name "$ROLE" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null); do
              aws iam detach-role-policy --role-name "$ROLE" --policy-arn "$P" 2>/dev/null || true
            done
            for IP in $(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames[]' --output text 2>/dev/null); do
              aws iam delete-role-policy --role-name "$ROLE" --policy-name "$IP" 2>/dev/null || true
            done
            echo "  deleting IAM role $ROLE"; aws iam delete-role --role-name "$ROLE" 2>/dev/null || true
          done
          # 6c. ALL remaining peeks-* IAM policies (not just ACK-tagged).
          [ -n "$PREFIX" ] && aws iam list-policies --scope Local \
              --query "Policies[?starts_with(PolicyName, '${PREFIX}-')].Arn" \
              --output text 2>/dev/null | tr '\t' '\n' | while read POL; do
            [ -z "$POL" ] && continue
            echo "$POL" | grep -qE "$DENY_RE" && continue
            for V in $(aws iam list-policy-versions --policy-arn "$POL" --query 'Versions[?IsDefaultVersion==`false`].VersionId' --output text 2>/dev/null); do
              aws iam delete-policy-version --policy-arn "$POL" --version-id "$V" 2>/dev/null || true
            done
            echo "  deleting IAM policy $POL"; aws iam delete-policy --policy-arn "$POL" 2>/dev/null || true
          done
          # 6d. Secrets Manager: bootstrap secrets not cleaned by SM delete commands above.
          for SECRET in "${HUB}/secrets" "${HUB}/keycloak-clients" "${HUB}/config" "${HUB}/keycloak" \
                        "${PREFIX}/team-rust/amp-workspace" "${PREFIX}/team-java/amp-workspace" \
                        "${PREFIX}/platform/amp" "${PREFIX}-devlake/mysql-connection"; do
            aws secretsmanager delete-secret --secret-id "$SECRET" \
              --force-delete-without-recovery --region "$REGION" 2>/dev/null || true
          done
          echo "  deleted bootstrap secrets (if existed)"
          # 6di. Delete all other peeks-* Secrets Manager secrets by prefix.
          for SECRET_ARN in $(aws secretsmanager list-secrets --region "$REGION" \
                --filters Key=name,Values="${PREFIX}" \
                --query 'SecretList[].ARN' --output text 2>/dev/null | tr '\t' '\n'); do
            [ -z "$SECRET_ARN" ] && continue
            aws secretsmanager delete-secret --secret-id "$SECRET_ARN" \
              --force-delete-without-recovery --region "$REGION" 2>/dev/null || true
            echo "  ✓ deleted secret $SECRET_ARN"
          done
          # 6e. AMP workspaces tagged with the resource prefix (Crossplane-managed,
          #     orphaned when crossplane-base AppSet is deleted before workspace CR).
          for WS_ID in $(aws amp list-workspaces --region "$REGION" \
                --query "workspaces[?starts_with(alias, '${PREFIX}')].workspaceId" \
                --output text 2>/dev/null | tr '\t' '\n'); do
            [ -z "$WS_ID" ] && continue
            aws amp delete-workspace --workspace-id "$WS_ID" --region "$REGION" 2>/dev/null || true
            echo "  ✓ deleted AMP workspace $WS_ID"
          done
          # 6ei. AMP scrapers (created by observability bootstrap, not deleted with workspace).
          #      Scrapers are regional, so only delete ours: the scraper's source EKS cluster
          #      must be the hub, a ${PREFIX}-spoke-dev/-prod spoke, or a cluster tagged
          #      platform.gitops.io/prefix=${PREFIX}. Other stacks' scrapers are left alone.
          OWNED_CLUSTERS=" $HUB ${PREFIX}-spoke-dev ${PREFIX}-spoke-prod "
          for C in $(aws eks list-clusters --region "$REGION" --query 'clusters[]' --output text 2>/dev/null | tr '\t' '\n'); do
            T=$(aws eks describe-cluster --name "$C" --region "$REGION" \
              --query 'cluster.tags."platform.gitops.io/prefix"' --output text 2>/dev/null || true)
            if [ "$T" = "$PREFIX" ]; then OWNED_CLUSTERS="$OWNED_CLUSTERS$C "; fi
          done
          aws amp list-scrapers --region "$REGION" \
                --query 'scrapers[].[scraperId, source.eksConfiguration.clusterArn]' \
                --output text 2>/dev/null | while read -r SCRAPER_ID CLUSTER_ARN; do
            [ -z "$SCRAPER_ID" ] && continue
            CLUSTER="${CLUSTER_ARN##*/}"
            case "$OWNED_CLUSTERS" in *" $CLUSTER "*) ;; *) continue ;; esac
            aws amp delete-scraper --scraper-id "$SCRAPER_ID" --region "$REGION" 2>/dev/null || true
            echo "  ✓ deleted AMP scraper $SCRAPER_ID ($CLUSTER)"
          done
          # 6eii. DevLake RDS instance (created by KubeVela in kind-kro-ack path).
          #       Named devlake-mysql-db-* and scoped to the peeks VPC. Not ACK-tagged.
          for DB in $(aws rds describe-db-instances --region "$REGION" \
                --query "DBInstances[?starts_with(DBInstanceIdentifier, 'devlake-')].DBInstanceIdentifier" \
                --output text 2>/dev/null | tr '\t' '\n'); do
            [ -z "$DB" ] && continue
            aws rds delete-db-instance --db-instance-identifier "$DB" \
              --skip-final-snapshot --delete-automated-backups \
              --region "$REGION" 2>/dev/null || true
            echo "  ✓ initiated RDS deletion: $DB"
          done
          # 6f. EKS OIDC providers for peeks clusters. IRSA uses cluster-specific OIDC
          #     providers that accumulate across re-deploys (one per EKS cluster per run).
          #     Only delete providers whose URL matches ${REGION} — never delete providers
          #     for other regions (agent-sandbox, us-east-1 deployments, etc.).
          ACCT=$(aws sts get-caller-identity --query 'Account' --output text 2>/dev/null)
          # Build the list of known active clusters to preserve their OIDC providers
          ACTIVE_OIDCS=""
          for C in $(aws eks list-clusters --region "$REGION" --query 'clusters[]' --output text 2>/dev/null | tr '\t' '\n'); do
            OI=$(aws eks describe-cluster --name "$C" --region "$REGION" \
              --query 'cluster.identity.oidc.issuer' --output text 2>/dev/null || true)
            if [ -n "$OI" ]; then ACTIVE_OIDCS="$ACTIVE_OIDCS ${OI##*/}"; fi
          done
          for ARN in $(aws iam list-open-id-connect-providers \
                --query 'OpenIDConnectProviderList[].Arn' --output text 2>/dev/null | tr '\t' '\n'); do
            URL=$(aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$ARN" \
              --query 'Url' --output text 2>/dev/null || true)
            # Only sweep EKS OIDC providers in this region
            echo "$URL" | grep -q "oidc.eks.${REGION}.amazonaws.com" || continue
            OIDC_ID="${URL##*/}"
            # Skip if this is an active cluster's OIDC
            KEEP=false
            for AO in $ACTIVE_OIDCS; do
              if [ "$AO" = "$OIDC_ID" ]; then KEEP=true; break; fi
            done
            $KEEP && { echo "  skip active cluster OIDC $OIDC_ID"; continue; }
            aws iam delete-open-id-connect-provider --open-id-connect-provider-arn "$ARN" 2>/dev/null || true
            echo "  ✓ deleted OIDC provider $OIDC_ID"
          done
          # 6g. CloudWatch Log Groups for deleted EKS clusters.
          for LG_PREFIX in "/aws/eks/${PREFIX}-hub" "/aws/eks/${PREFIX}-spoke-dev" "/aws/eks/${PREFIX}-spoke-prod"; do
            for LG in $(aws logs describe-log-groups --region "$REGION" \
                  --log-group-name-prefix "$LG_PREFIX" \
                  --query 'logGroups[].logGroupName' --output text 2>/dev/null | tr '\t' '\n'); do
              [ -z "$LG" ] && continue
              aws logs delete-log-group --log-group-name "$LG" --region "$REGION" 2>/dev/null || true
              echo "  ✓ deleted CW log group $LG"
            done
          done
          # 6h. Orphaned spoke VPCs (ACK ec2 VPC resources that survived cluster delete).
          #     Scoped by the EKS ACK tag (eks:kubernetes-resource-name=<PREFIX>-spoke-*).
          python3 "{{.ROOT_DIR}}/scripts/sweep-spoke-vpcs.py" "{{.RESOURCE_PREFIX}}" "{{.AWS_REGION}}" "{{.HUB_CLUSTER_NAME}}" 2>&1 || true
          # 6i. IDE VPC non-default security groups (created by workshop, not by CFN).
          #     These include ALB SGs, EKS cluster SGs, RDS SGs, AMG SGs, k8s-traffic SGs.
          #     If left, they block CFN's VPC deletion → DELETE_FAILED on VPC subnet.
          #     We only delete SGs in THIS stack's CFN-managed workshop VPC: its
          #     platform.gitops.io/prefix tag is ${PREFIX} (the template stamps it), or,
          #     on stacks that predate that tag, it has none and the stack is named
          #     ${PREFIX}-workshop or ${PREFIX}-workshop-<suffix> (self-paced, Workshop
          #     Studio ${PREFIX}-workshop-team-stack). Never a stack-name substring:
          #     "peeks-workshop" matches every workshop stack in the account.
          for VPC_ID in $(aws ec2 describe-vpcs --region "$REGION" \
                --filters "Name=tag:aws:cloudformation:stack-id,Values=*" \
                --query 'Vpcs[].VpcId' --output text 2>/dev/null | tr '\t' '\n'); do
            [ -z "$VPC_ID" ] && continue
            # Check if this VPC belongs to our workshop stack (prefix tag, else stack name)
            STACK_TAG=$(aws ec2 describe-vpcs --region "$REGION" --vpc-ids "$VPC_ID" \
              --query "Vpcs[0].Tags[?Key=='aws:cloudformation:stack-name'].Value | [0]" \
              --output text 2>/dev/null || true)
            OWNER_TAG=$(aws ec2 describe-vpcs --region "$REGION" --vpc-ids "$VPC_ID" \
              --query "Vpcs[0].Tags[?Key=='platform.gitops.io/prefix'].Value | [0]" \
              --output text 2>/dev/null || true)
            case "$OWNER_TAG" in
              ""|None) case "$STACK_TAG" in "${PREFIX}-workshop"|"${PREFIX}-workshop-"*) ;; *) continue ;; esac ;;
              "$PREFIX") ;;
              *) continue ;;
            esac
            echo "  Cleaning SGs in workshop VPC $VPC_ID..."
            # Revoke cross-SG rules first, then delete. Skip the stack's own SGs
            # (tagged aws:cloudformation:stack-name, e.g. the IDE and its EFS SG):
            # they are still in use and CFN deletes them with the stack. Revoking
            # the EFS "NFS from IDE instances" rule here cuts the IDE's home
            # directory while this teardown is still running on it.
            SG_IDS=$(aws ec2 describe-security-groups --region "$REGION" \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'SecurityGroups[?GroupName!=`default` && !(Tags[?Key==`aws:cloudformation:stack-name`])].GroupId' \
              --output text 2>/dev/null | tr '\t' '\n')
            for SG in $SG_IDS; do
              [ -z "$SG" ] && continue
              # Revoke any cross-SG references
              SG_IN=$(aws ec2 describe-security-groups --region "$REGION" --group-ids "$SG" \
                --query 'SecurityGroups[0].IpPermissions[?UserIdGroupPairs]' \
                --output json 2>/dev/null)
              [ -n "$SG_IN" ] && [ "$SG_IN" != "[]" ] && \
                aws ec2 revoke-security-group-ingress --region "$REGION" \
                  --group-id "$SG" --ip-permissions "$SG_IN" 2>/dev/null || true
              aws ec2 delete-security-group --group-id "$SG" --region "$REGION" 2>/dev/null || true
            done
          done
        ignore_error: true
      - cmd: |
          if [ "{{.CLEANUP_KIND}}" = "true" ]; then
            kind delete cluster --name {{.KIND_CLUSTER_NAME}}
          else
            echo "Kind preserved. Run 'task destroy-kind' to remove."
          fi
      # Don't claim success without checking. Every step above is `|| true` +
      # ignore_error, so destroy used to print "✓ Destroy complete." even when the
      # hub cluster survived (capability deletion timed out and the DeleteCluster
      # error was swallowed). One check on the one outcome that matters.
      - cmd: |
          if aws eks describe-cluster --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} >/dev/null 2>&1; then
            printf '{{.C_ERR}}✗ Destroy incomplete: EKS cluster {{.HUB_CLUSTER_NAME}} still exists. Re-run task destroy.{{.C_RESET}}\n'
            exit 1
          fi
          printf '{{.C_OK}}✓ Destroy complete.{{.C_RESET}}\n'

  # ---- from kind-crossplane ----
  urls:
    desc: Print platform URLs (alias for print-urls)
    aliases: [print-urls]
    vars:
      INGRESS_DOMAIN: '{{.DOMAIN}}'
      GITLAB_DOMAIN:
        sh: |
          if [ -f {{.ROOT_DIR}}/private/git-domain ]; then
            cat {{.ROOT_DIR}}/private/git-domain
          else
            echo "{{.DOMAIN}}"
          fi
      KC_ADMIN_PASSWORD:
        sh: aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.keycloak_admin_password // empty'
      USER_PASSWORD:
        sh: aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text 2>/dev/null | jq -r '.user_password // "workshop-user-2026"'
      ARGOCD_URL:
        sh: aws eks describe-capability --cluster-name {{.HUB_CLUSTER_NAME}} --capability-name argocd --query 'capability.configuration.argoCd.serverUrl' --output text --region {{.AWS_REGION}} 2>/dev/null || echo ""
    cmds:
      - |
        printf '{{.C_OK}}Platform URLs{{.C_RESET}}\n'
        printf '  Backstage:  https://{{.INGRESS_DOMAIN}}/backstage\n'
        printf '  Keycloak:   https://{{.INGRESS_DOMAIN}}/keycloak\n'
        printf '  Argo WF:    https://{{.INGRESS_DOMAIN}}/argo-workflows\n'
        printf '  Kargo:      https://{{.INGRESS_DOMAIN}}/\n'
        printf '  Grafana:    https://{{.INGRESS_DOMAIN}}/grafana\n'
        printf '  ArgoCD:     {{.ARGOCD_URL}}\n'
        printf '\n'
        printf '{{.C_INFO}}Credentials{{.C_RESET}}\n'
        printf '  User:       user1 / {{.USER_PASSWORD}}\n'
        printf '  Keycloak:   admin / {{.KC_ADMIN_PASSWORD}}\n'
        # Log discoverability (review #1053): point to the background settle log + its
        # status marker so the hub-settle outcome is findable from the final summary.
        if [ -f /tmp/hub-full-sync-settle.log ]; then
          printf '\n{{.C_INFO}}Hub settle (background){{.C_RESET}}\n'
          printf '  log:    /tmp/hub-full-sync-settle.log\n'
          printf '  status: %s\n' "$(cat /tmp/hub-full-sync-settle.status 2>/dev/null || echo 'running')"
        fi
  # ---- from kind-crossplane ----
  hub:wait-for-keycloak:
    desc: "Narrow gate — wait for keycloak-<hub> Synced/Healthy with its config op Succeeded (bounded 15min, non-fatal). Much shorter than the global full-sync; what Keycloak-dependent steps actually need (review #1053 §3/§4)."
    cmds:
      - task: hub:kubeconfig
      - |
        KC={{.ROOT_DIR}}/private/hub-kubeconfig
        APP="keycloak-{{.HUB_CLUSTER_NAME}}"
        TIMEOUT=900; INTERVAL=15; ELAPSED=0
        # set +e (review #1053 §1): under go-task's errexit a single transient kubectl
        # read (SYNC/HEALTH/OP) would abort the whole gate — and the step is non-fatal.
        set +e
        printf '{{.C_STEP}}▸ Waiting for %s to be configured (Synced/Healthy, op Succeeded)...{{.C_RESET}}\n' "$APP"
        while [ $ELAPSED -lt $TIMEOUT ]; do
          SYNC=$(KUBECONFIG=$KC kubectl get application.argoproj.io "$APP" -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null)
          HEALTH=$(KUBECONFIG=$KC kubectl get application.argoproj.io "$APP" -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null)
          OP=$(KUBECONFIG=$KC kubectl get application.argoproj.io "$APP" -n argocd -o jsonpath='{.status.operationState.phase}' 2>/dev/null)
          if [ "$SYNC" = "Synced" ] && [ "$HEALTH" = "Healthy" ] && [ "$OP" = "Succeeded" ]; then
            printf '{{.C_OK}}✓ %s configured (Synced/Healthy, op Succeeded).{{.C_RESET}}\n' "$APP"
            break
          fi
          [ $((ELAPSED % 60)) -eq 0 ] && printf '{{.C_INFO}}  [%ss] %s sync=%s health=%s op=%s{{.C_RESET}}\n' "$ELAPSED" "$APP" "${SYNC:-?}" "${HEALTH:-?}" "${OP:-?}"
          sleep $INTERVAL; ELAPSED=$((ELAPSED + INTERVAL))
        done
        # if … fi, not `[ ] && printf` (review #1053 §1): the && list returns 1 on the
        # SUCCESS path (ELAPSED < TIMEOUT), which go-task reads as a task failure and
        # aborts `task install` before the Keycloak-dependent restarts + idc:configure.
        if [ $ELAPSED -ge $TIMEOUT ]; then
          printf '{{.C_WARN}}⚠ %s not fully configured after %ss (sync=%s health=%s op=%s) — continuing; Keycloak-dependent steps (Backstage/Langfuse restart, idc:configure) may need a retry (review #1053 §3/§4).{{.C_RESET}}\n' "$APP" "$TIMEOUT" "${SYNC:-?}" "${HEALTH:-?}" "${OP:-?}"
        fi
      - rm -f {{.ROOT_DIR}}/private/hub-kubeconfig

  hub:restart-langfuse:
    desc: Restart Langfuse to pick up Keycloak client secret (created by config job after initial deploy)
    cmds:
      - task: hub:kubeconfig
      - printf '{{.C_STEP}}▸ Restarting Langfuse to pick up Keycloak client secret...{{.C_RESET}}\n'
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout restart deploy -n langfuse langfuse 2>/dev/null || true
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout status deploy -n langfuse langfuse --timeout=120s 2>/dev/null || true
      - rm -f {{.ROOT_DIR}}/private/hub-kubeconfig
      - printf '{{.C_OK}}✓ Langfuse restarted with Keycloak SSO credentials.{{.C_RESET}}\n'

  hub:restart-backstage:
    desc: Restart Backstage to flush stale openid-client keep-alive sockets after Keycloak is fully configured
    cmds:
      - task: hub:kubeconfig
      - printf '{{.C_STEP}}▸ Restarting Backstage to flush stale Keycloak OIDC sockets...{{.C_RESET}}\n'
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout restart deploy -n backstage backstage 2>/dev/null || true
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout status deploy -n backstage backstage --timeout=180s 2>/dev/null || true
      - rm -f {{.ROOT_DIR}}/private/hub-kubeconfig
      - printf '{{.C_OK}}✓ Backstage restarted — OIDC sockets refreshed.{{.C_RESET}}\n'


  # ---- from kind-crossplane ----
  hub:wait-for-full-sync:
    desc: Wait for ALL apps (including spokes) to sync after provider restart
    vars:
      MAX_OUTOFSYNC: '{{.MAX_OUTOFSYNC | default "5"}}'
    cmds:
      - task: hub:kubeconfig
      - printf '{{.C_STEP}}▸ Waiting for all apps to sync (spoke clusters provisioning)...{{.C_RESET}}\n'
      - |
        TIMEOUT=2400
        INTERVAL=30
        ELAPSED=0
        while [ $ELAPSED -lt $TIMEOUT ]; do
          APP_OUTPUT=$(KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl get applications.argoproj.io -n argocd --no-headers 2>/dev/null || echo "")
          TOTAL=$(echo "$APP_OUTPUT" | awk 'NF>0' | wc -l | tr -d ' ')
          SYNCED=$(echo "$APP_OUTPUT" | awk '$2 == "Synced"' | wc -l | tr -d ' ')
          UNKNOWN=$(echo "$APP_OUTPUT" | awk '$2 == "Unknown"' | wc -l | tr -d ' ')
          OUTOFSYNC=$((TOTAL - SYNCED - UNKNOWN))
          printf '{{.C_INFO}}  Apps: %s/%s synced, %s unknown, %s out-of-sync (%ss elapsed){{.C_RESET}}\n' "$SYNCED" "$TOTAL" "$UNKNOWN" "$OUTOFSYNC" "$ELAPSED"
          if [ "$TOTAL" -gt 0 ] && [ "$OUTOFSYNC" -le {{.MAX_OUTOFSYNC}} ]; then
            printf '{{.C_OK}}✓ All %s apps synced (within %s tolerance, %s unknown).{{.C_RESET}}\n' "$SYNCED" "{{.MAX_OUTOFSYNC}}" "$UNKNOWN"
            break
          fi
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done
        if [ $ELAPSED -ge $TIMEOUT ]; then
          printf '{{.C_ERR}}⚠ Timed out after %ss. %s app(s) still not synced:{{.C_RESET}}\n' "$TIMEOUT" "$OUTOFSYNC"
          echo "$APP_OUTPUT" | awk '$2 != "Synced" && NF>0 {printf "  - %s (%s/%s)\n", $1, $3, $2}'
          printf '{{.C_STEP}}▸ Continuing — spoke clusters may still be provisioning.{{.C_RESET}}\n'
        fi
      - rm -f {{.ROOT_DIR}}/private/hub-kubeconfig


  # ---- from kind-crossplane ----
  hub:wait-for-providers:
    desc: Wait for all Crossplane providers to be Healthy (ensures ec2/rds/etc. CRDs available before spoke provisioning)
    cmds:
      - task: hub:kubeconfig
      - |
        KC={{.ROOT_DIR}}/private/hub-kubeconfig
        [ ! -f "$KC" ] && KC={{.ROOT_DIR}}/private/kubeconfig
        printf '{{.C_STEP}}▸ Waiting for all Crossplane providers to be Healthy...{{.C_RESET}}\n'
        for i in $(seq 1 60); do
          # Read provider state into vars FIRST so a failed kubectl read is caught by its own
          # exit code and we keep polling, instead of letting empty output count as UNHEALTHY=0
          # → a false "all Healthy" pass on a transient read error (review #1053 r4, same as the
          # kind-crossplane gate).
          NAMES=$(KUBECONFIG=$KC kubectl get providers.pkg.crossplane.io -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Healthy")].status!="True")].metadata.name}' 2>/dev/null) || { [ $((i % 4)) -eq 0 ] && printf '{{.C_WARN}}  [%ds] provider read failed, retrying...{{.C_RESET}}\n' "$((i*15))"; sleep 15; continue; }
          LIST=$(KUBECONFIG=$KC kubectl get providers.pkg.crossplane.io --no-headers 2>/dev/null) || { [ $((i % 4)) -eq 0 ] && printf '{{.C_WARN}}  [%ds] provider read failed, retrying...{{.C_RESET}}\n' "$((i*15))"; sleep 15; continue; }
          UNHEALTHY=$(echo "$NAMES" | wc -w | tr -d ' ')
          TOTAL=$(echo "$LIST" | awk 'NF>0' | wc -l | tr -d ' ')
          if [ "$UNHEALTHY" = "0" ] && [ "$TOTAL" -gt 0 ]; then
            printf '{{.C_OK}}✓ All %s Crossplane providers Healthy.{{.C_RESET}}\n' "$TOTAL"
            break
          fi
          [ $((i % 4)) -eq 0 ] && printf '{{.C_INFO}}  [%ds] %s/%s providers Healthy...{{.C_RESET}}\n' "$((i*15))" "$((TOTAL-UNHEALTHY))" "$TOTAL" || true
          # After 5min, force-sync crossplane-base to unblock stuck ArgoCD retry loops.
          # -ge 20 + FORCED sentinel (not -eq 20): a failed read on poll 20 continues past this,
          # so an exact match would never fire again (review #1053 r5 §1). Fires once, at/after 20.
          if [ "$i" -ge 20 ] && [ -z "${FORCED:-}" ]; then
            FORCED=1
            printf '{{.C_WARN}}  Providers not all Healthy after 5min — force-syncing crossplane-base...{{.C_RESET}}\n'
            KUBECONFIG=$KC kubectl patch application "crossplane-base-{{.HUB_CLUSTER_NAME}}" -n argocd --type merge -p '{"operation":{"initiatedBy":{"username":"admin"},"sync":{"revision":"HEAD"}}}' 2>/dev/null || true
          fi
          sleep 15
        done
        printf '{{.C_WARN}}  Providers wait complete.{{.C_RESET}}\n'


  # ---- from kind-crossplane ----
  secrets-manager:seed-secrets:
    desc: Seed platform user credentials into Secrets Manager for ExternalSecrets
    # TODO(#757): gitlab_root_password and git_token should move to peeks-hub/gitlab
    # (separate secret, gated on enable_gitlab) so the platform can run without GitLab.
    # https://github.com/aws-samples/appmod-blueprints/issues/757
    cmds:
      - |
        SECRET_KEY="{{.HUB_CLUSTER_NAME}}/secrets"
        USER_PASS=$(aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query SecretString --output text | jq -r .user_password)
        # Merge into the existing secret so a re-run backfills any keys a previous
        # (partial) install left out — and never rotates values live consumers
        # depend on. First run: no secret yet, start from {} and create-then-put.
        EXISTING=$(aws secretsmanager get-secret-value --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} --query SecretString --output text 2>/dev/null || echo "{}")
        # Reuse existing hash/key on re-runs (don't rotate them out from under Kargo etc.)
        USER_PASS_HASH=$(echo "$EXISTING" | jq -r '.user_password_hash // ""')
        if [ -z "$USER_PASS_HASH" ]; then
          # One shared implementation for all four hash sites across both providers —
          # see scripts/bcrypt-hash.sh for the fallback order and why an empty hash is
          # never written. It exits non-zero rather than emitting an empty value, so
          # errexit aborts here instead of silently breaking Kargo admin login.
          USER_PASS_HASH=$(bash "{{.ROOT_DIR}}/scripts/bcrypt-hash.sh" "$USER_PASS")
        fi
        USER_PASS_KEY=$(echo "$EXISTING" | jq -r '.user_password_key // ""')
        if [ -z "$USER_PASS_KEY" ]; then
          USER_PASS_KEY=$(echo -n "$USER_PASS" | base64)
        fi
        UPDATED=$(echo "$EXISTING" | jq \
          --arg user_password "$USER_PASS" \
          --arg user_password_hash "$USER_PASS_HASH" \
          --arg user_password_key "$USER_PASS_KEY" \
          '. + {user_password: $user_password, user_password_hash: $user_password_hash, user_password_key: $user_password_key}')
        # DevLake credentials. These belong here (NOT in seed-observability) so the
        # devlake-encryption-secret ExternalSecret resolves during the normal install,
        # independent of the AMP/AMG observability flow — which waits up to 30 min for
        # the AMP workspace and is frequently re-run separately (task observability-seed).
        # Gating these behind observability left DevLake's ExternalSecret in
        # SecretSyncedError whenever observability seeding didn't complete.
        # Generate only if absent so re-runs don't break existing encrypted connections.
        #   - encryption secret: 128 uppercase chars (DevLake requirement)
        if ! echo "$UPDATED" | jq -e 'has("devlake_encryption_secret")' >/dev/null; then
          DEVLAKE_ENC=$(openssl rand -base64 2000 | tr -dc 'A-Z' | fold -w 128 | head -n 1)
          UPDATED=$(echo "$UPDATED" | jq --arg p "$DEVLAKE_ENC" '. + {devlake_encryption_secret: $p}')
        fi
        if ! echo "$UPDATED" | jq -e 'has("devlake_mysql_password")' >/dev/null; then
          DEVLAKE_MYSQL=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
          UPDATED=$(echo "$UPDATED" | jq --arg p "$DEVLAKE_MYSQL" '. + {devlake_mysql_password: $p}')
        fi
        # grafana_mysql_password: the devlake `mysql-passwords` ExternalSecret reads
        # BOTH devlake_mysql_password AND grafana_mysql_password — ESO fails the whole
        # ExternalSecret if either property is missing, so this must be seeded here too
        # (it was previously only generated in the AMP-gated seed-observability flow,
        # leaving mysql-passwords in SecretSyncedError and devlake-peeks-hub Degraded).
        if ! echo "$UPDATED" | jq -e 'has("grafana_mysql_password")' >/dev/null; then
          GRAFANA_MYSQL=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
          UPDATED=$(echo "$UPDATED" | jq --arg p "$GRAFANA_MYSQL" '. + {grafana_mysql_password: $p}')
        fi
        # backstage_postgres_password + git_token: the backstage-postgres and
        # git-credentials ExternalSecrets read these from <hub>/secrets. They were
        # previously only generated in the AMP-gated seed-observability flow, so on a
        # fresh install where observability seeding hadn't completed Backstage stayed
        # OutOfSync/Degraded ('key backstage_postgres_password does not exist') and
        # $BACKSTAGE_URL returned 503 — blocking every Backstage-dependent module.
        # Seed them here (in the always-runs early phase) instead. git_token mirrors
        # the workshop user password (GitLab PAT == user password in this workshop).
        if ! echo "$UPDATED" | jq -e 'has("backstage_postgres_password")' >/dev/null; then
          BS_PG_PASS=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
          UPDATED=$(echo "$UPDATED" | jq --arg p "$BS_PG_PASS" '. + {backstage_postgres_password: $p}')
        fi
        # git_token is seeded by CDK at deploy time (root-<ide_password>) — no runtime seeding needed.
        # aiops_agent_git_token is written authoritatively by workshop `gitlab:init-ec2` after it
        # creates the aiops-agent bot + sets its PAT (single source of truth — no seed here, so the
        # SM value and the real PAT can never diverge).
        aws secretsmanager restore-secret --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} 2>/dev/null || true
        aws secretsmanager create-secret \
          --name "$SECRET_KEY" \
          --secret-string "$UPDATED" \
          --region {{.AWS_REGION}} 2>/dev/null \
        || aws secretsmanager put-secret-value \
          --secret-id "$SECRET_KEY" \
          --secret-string "$UPDATED" \
          --region {{.AWS_REGION}}
        echo "Seeded Secrets Manager: $SECRET_KEY"


  # ---- from kind-crossplane ----
  secrets-manager:seed-observability:
    desc: Seed observability credentials (AMP endpoint, AMG API key) into Secrets Manager
    vars:
      KC_DOMAIN: '{{.DOMAIN}}'
    cmds:
      - |
        set -e
        SECRET_KEY="{{.HUB_CLUSTER_NAME}}/secrets"

        # Poll for AMP workspace (up to 60 min — Crossplane provisioning of AMP/AMG
        # can take well over 30 min on busy accounts; the previous 30 min ceiling
        # was too short and left Grafana unseeded on slow installs).
        # Use crossplane-name tag to identify the correct workspace (avoids ambiguity with duplicates)
        AMP_WORKSPACE_ID=""
        printf '{{.C_STEP}}▸ Waiting for AMP workspace...{{.C_RESET}}\n'
        for i in $(seq 1 120); do
          for WS_ID in $(aws amp list-workspaces --region {{.AWS_REGION}} --query "workspaces[?alias=='{{.RESOURCE_PREFIX}}-observability-amp'].workspaceId" --output text 2>/dev/null); do
            TAG_VAL=$(aws amp list-tags-for-resource --resource-arn "arn:aws:aps:{{.AWS_REGION}}:{{.AWS_ACCOUNT_ID}}:workspace/$WS_ID" --region {{.AWS_REGION}} --query "tags.\"crossplane-name\"" --output text 2>/dev/null || echo "")
            if [ "$TAG_VAL" = "{{.RESOURCE_PREFIX}}-amp" ]; then
              AMP_WORKSPACE_ID="$WS_ID"
              break
            fi
          done
          if [ -n "$AMP_WORKSPACE_ID" ]; then
            break
          fi
          printf '  [%d/120] AMP workspace not ready yet...\n' "$i"
          sleep 30
        done
        if [ -z "$AMP_WORKSPACE_ID" ] || [ "$AMP_WORKSPACE_ID" = "None" ]; then
          echo ""
          echo "============================================================"
          echo "WARN: AMP workspace not created after 60 min."
          echo "  The peeks-observability-seed.timer will keep retrying this"
          echo "  automatically; or run 'task observability-seed' manually once"
          echo "  the observability-aws ArgoCD app is Synced and AMP/AMG are ACTIVE."
          echo "============================================================"
          exit 0
        fi
        AMP_ENDPOINT=$(aws amp describe-workspace --workspace-id "$AMP_WORKSPACE_ID" --region {{.AWS_REGION}} --query "workspace.prometheusEndpoint" --output text)
        echo "Found AMP endpoint: $AMP_ENDPOINT"

        # Poll for AMG workspace (up to 15 min)
        # Use crossplane-name tag to identify the correct workspace
        AMG_WORKSPACE_ID=""
        printf '{{.C_STEP}}▸ Waiting for AMG workspace...{{.C_RESET}}\n'
        for i in $(seq 1 30); do
          for WS in $(aws grafana list-workspaces --region {{.AWS_REGION}} --query "workspaces[?name=='{{.RESOURCE_PREFIX}}-observability' && status=='ACTIVE'].id" --output text 2>/dev/null); do
            TAG_VAL=$(aws grafana describe-workspace --workspace-id "$WS" --region {{.AWS_REGION}} --query "workspace.tags.\"crossplane-name\"" --output text 2>/dev/null || echo "")
            if [ "$TAG_VAL" = "{{.RESOURCE_PREFIX}}-amg" ]; then
              AMG_WORKSPACE_ID="$WS"
              break
            fi
          done
          if [ -n "$AMG_WORKSPACE_ID" ]; then
            break
          fi
          printf '  [%d/30] AMG workspace not ready yet...\n' "$i"
          sleep 30
        done
        if [ -z "$AMG_WORKSPACE_ID" ] || [ "$AMG_WORKSPACE_ID" = "None" ]; then
          echo "WARN: AMG workspace not found. Run 'task observability-seed' later."
          exit 0
        fi
        AMG_ENDPOINT=$(aws grafana describe-workspace --workspace-id "$AMG_WORKSPACE_ID" --region {{.AWS_REGION}} --query "workspace.endpoint" --output text)
        echo "Found AMG endpoint: $AMG_ENDPOINT"

        # Create AMG service account + token (admin, 30 days) — API keys removed in Grafana 12
        SA_NAME="crossplane-$(date +%s)"
        SA_ID=$(aws grafana create-workspace-service-account --workspace-id "$AMG_WORKSPACE_ID" --grafana-role ADMIN --name "$SA_NAME" --region {{.AWS_REGION}} --query "id" --output text 2>/dev/null || echo "")
        if [ -z "$SA_ID" ] || [ "$SA_ID" = "None" ]; then
          echo "WARN: Could not create AMG service account. Skipping."
          exit 0
        fi
        AMG_API_KEY=$(aws grafana create-workspace-service-account-token --workspace-id "$AMG_WORKSPACE_ID" --service-account-id "$SA_ID" --name "token-$SA_NAME" --seconds-to-live 2592000 --region {{.AWS_REGION}} --query "serviceAccountToken.key" --output text 2>/dev/null || echo "")
        if [ -z "$AMG_API_KEY" ]; then
          echo "WARN: Could not create AMG service account token. Skipping."
          exit 0
        fi

        # Install required Grafana plugins (X-Ray for trace visualization)
        printf '{{.C_STEP}}▸ Installing AMG plugins (X-Ray)...{{.C_RESET}}\n'
        XRAY_RESP=$(curl -s -X POST -H "Authorization: Bearer $AMG_API_KEY" \
          -H "Content-Type: application/json" \
          "https://$AMG_ENDPOINT/api/plugins/grafana-x-ray-datasource/install" 2>&1 | head -1)
        case "$XRAY_RESP" in
          *"Access denied"*|*accessErrorId*)
            printf '{{.C_INFO}}  X-Ray plugin NOT installed: the AMG workspace identity lacks plugins:install.{{.C_RESET}}\n'
            printf '{{.C_INFO}}    X-Ray panels in Grafana will be empty. Grant grafana:UpdatePluginConfiguration to fix.{{.C_RESET}}\n' ;;
          *) printf '{{.C_OK}}  X-Ray plugin install requested (optional).{{.C_RESET}}\n' ;;
        esac

        # Merge into existing secret (preserves other keys). On first run
        # the secret doesn't exist yet — `get-secret-value` returns empty,
        # we start from `{}`, and `put-secret-value` would fail with
        # ResourceNotFoundException, so create-then-put.
        EXISTING=$(aws secretsmanager get-secret-value --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} --query "SecretString" --output text 2>/dev/null || echo "{}")
        # Pull user_password from keycloak secret for backstage ExternalSecrets
        KC_SECRET=$(aws secretsmanager get-secret-value --secret-id "{{.HUB_CLUSTER_NAME}}/keycloak" --region {{.AWS_REGION}} --query "SecretString" --output text 2>/dev/null || echo "{}")
        USER_PASS=$(echo "$KC_SECRET" | jq -r '.user_password // "workshop-user-2026"')
        # Generate backstage_postgres_password if not already present
        if ! echo "$EXISTING" | jq -e 'has("backstage_postgres_password")' >/dev/null 2>&1; then
          BS_PG_PASS=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
        else
          BS_PG_PASS=$(echo "$EXISTING" | jq -r '.backstage_postgres_password')
        fi
        # Kargo admin credentials: bcrypt hash of user password + random signing key.
        # Reuse existing values on re-runs so we don't rotate them out from under Kargo.
        KARGO_HASH=$(echo "$EXISTING" | jq -r '.user_password_hash // ""')
        if [ -z "$KARGO_HASH" ]; then
          # One shared implementation for all four hash sites across both providers —
          # see scripts/bcrypt-hash.sh for the fallback order (htpasswd, then an
          # importable bcrypt, then `python3 -m pip install bcrypt`) and for why an
          # empty hash is never written: Kargo authenticates admin logins against this
          # value, ESO syncs an empty string faithfully, and the platform then looks
          # healthy while admin login is broken. The script exits non-zero instead, so
          # errexit aborts this task; re-run after installing a prerequisite.
          KARGO_HASH=$(bash "{{.ROOT_DIR}}/scripts/bcrypt-hash.sh" "$USER_PASS")
        fi
        KARGO_KEY=$(echo "$EXISTING" | jq -r '.user_password_key // ""')
        if [ -z "$KARGO_KEY" ]; then
          KARGO_KEY=$(openssl rand -base64 30 | tr -d '/+=' | head -c 40)
        fi
        UPDATED=$(echo "$EXISTING" | jq \
          --arg amp_url "${AMP_ENDPOINT}api/v1/remote_write" \
          --arg amp_query_url "$AMP_ENDPOINT" \
          --arg amp_region "{{.AWS_REGION}}" \
          --arg grafana_api_key "$AMG_API_KEY" \
          --arg grafana_url "$AMG_ENDPOINT" \
          --arg user_password "$USER_PASS" \
          --arg backstage_postgres_password "$BS_PG_PASS" \
          --arg user_password_hash "$KARGO_HASH" \
          --arg user_password_key "$KARGO_KEY" \
          '. + {amp_endpoint_url: $amp_query_url, amp_region: $amp_region, grafana_api_key: $grafana_api_key, grafana_url: $grafana_url, user_password: $user_password, backstage_postgres_password: $backstage_postgres_password, user_password_hash: $user_password_hash, user_password_key: $user_password_key}')
        # Generate the grafana_mysql_password the grafana-dashboards
        # ExternalSecret expects, but only if it isn't already there
        # (so re-runs don't rotate it out from under live consumers).
        if ! echo "$UPDATED" | jq -e 'has("grafana_mysql_password")' >/dev/null; then
          GRAFANA_MYSQL_PASSWORD=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
          UPDATED=$(echo "$UPDATED" | jq --arg p "$GRAFANA_MYSQL_PASSWORD" '. + {grafana_mysql_password: $p}')
        fi
        # DevLake encryption secret (128 uppercase chars, per DevLake requirement).
        # Reuse on re-runs so we don't break existing encrypted connections.
        if ! echo "$UPDATED" | jq -e 'has("devlake_encryption_secret")' >/dev/null; then
          DEVLAKE_ENC=$(openssl rand -base64 2000 | tr -dc 'A-Z' | fold -w 128 | head -n 1)
          UPDATED=$(echo "$UPDATED" | jq --arg p "$DEVLAKE_ENC" '. + {devlake_encryption_secret: $p}')
        fi
        if ! echo "$UPDATED" | jq -e 'has("devlake_mysql_password")' >/dev/null; then
          DEVLAKE_MYSQL=$(openssl rand -base64 18 | tr -d '/+=' | head -c 24)
          UPDATED=$(echo "$UPDATED" | jq --arg p "$DEVLAKE_MYSQL" '. + {devlake_mysql_password: $p}')
        fi
        aws secretsmanager restore-secret --secret-id "$SECRET_KEY" --region {{.AWS_REGION}} 2>/dev/null || true
        aws secretsmanager create-secret \
          --name "$SECRET_KEY" \
          --secret-string "$UPDATED" \
          --region {{.AWS_REGION}} 2>/dev/null \
        || aws secretsmanager put-secret-value \
          --secret-id "$SECRET_KEY" \
          --secret-string "$UPDATED" \
          --region {{.AWS_REGION}}
        echo "Seeded observability credentials into $SECRET_KEY"

        # Spoke amp-workspace-secrets ExternalSecrets (Argo Rollouts metric queries on the
        # spokes) read a SEPARATE secret <prefix>/platform/amp with properties
        # 'amp-workspace' (the AMP query endpoint) and 'amp-region'. In the terraform flow
        # this was created by common/secrets.tf; the kind-crossplane flow never created it,
        # so every spoke amp-workspace-secrets-* ExternalSecret stayed in SecretSyncedError.
        # Create/refresh it here now that AMP_ENDPOINT is known.
        AMP_SECRET_KEY="{{.RESOURCE_PREFIX}}/platform/amp"
        AMP_SECRET_VALUE=$(jq -n --arg r "{{.AWS_REGION}}" --arg w "$AMP_ENDPOINT" '{"amp-region": $r, "amp-workspace": $w}')
        aws secretsmanager create-secret \
          --name "$AMP_SECRET_KEY" \
          --secret-string "$AMP_SECRET_VALUE" \
          --region {{.AWS_REGION}} 2>/dev/null \
        || aws secretsmanager put-secret-value \
          --secret-id "$AMP_SECRET_KEY" \
          --secret-string "$AMP_SECRET_VALUE" \
          --region {{.AWS_REGION}}
        echo "Seeded AMP workspace secret: $AMP_SECRET_KEY"

        # Update hub cluster config secret with AMG URL for Keycloak SAML and grafana-dashboards
        CONFIG_KEY="{{.HUB_CLUSTER_NAME}}/config"
        CONFIG_EXISTING=$(aws secretsmanager get-secret-value --secret-id "$CONFIG_KEY" --region {{.AWS_REGION}} --query "SecretString" --output text)
        CONFIG_UPDATED=$(echo "$CONFIG_EXISTING" | jq \
          --arg grafana_url "$AMG_ENDPOINT" \
          '.metadata = (.metadata | fromjson | . + {aws_grafana_url: $grafana_url} | tojson)')
        aws secretsmanager put-secret-value \
          --secret-id "$CONFIG_KEY" \
          --secret-string "$CONFIG_UPDATED" \
          --region {{.AWS_REGION}}
        echo "Updated hub config with AMG URL: $AMG_ENDPOINT"

        # Populate spoke scraper values into hub Secrets Manager secret (dynamic, no file commits needed)
        CONFIG_KEY="{{.HUB_CLUSTER_NAME}}/config"
        CONFIG_EXISTING=$(aws secretsmanager get-secret-value --secret-id "$CONFIG_KEY" --region {{.AWS_REGION}} --query "SecretString" --output text)
        SPOKE_DEV_ARN=""
        SPOKE_DEV_SUBNETS=""
        SPOKE_DEV_SG=""
        SPOKE_PROD_ARN=""
        SPOKE_PROD_SUBNETS=""
        SPOKE_PROD_SG=""
        for CLUSTER in {{.RESOURCE_PREFIX}}-spoke-dev {{.RESOURCE_PREFIX}}-spoke-prod; do
          SPOKE_ARN=$(aws eks describe-cluster --name "$CLUSTER" --region {{.AWS_REGION}} --query 'cluster.arn' --output text 2>/dev/null || echo "")
          if [ -n "$SPOKE_ARN" ] && [ "$SPOKE_ARN" != "None" ]; then
            SPOKE_ALL_SUBNETS=$(aws eks describe-cluster --name "$CLUSTER" --region {{.AWS_REGION}} --query 'cluster.resourcesVpcConfig.subnetIds[]' --output text)
            SPOKE_PRIVATE_SUBNETS=$(aws ec2 describe-subnets --subnet-ids $SPOKE_ALL_SUBNETS --region {{.AWS_REGION}} --query 'Subnets[?MapPublicIpOnLaunch==`false`].SubnetId' --output text | tr '\t' '\n' | awk '!seen[$0]++' | head -2 | paste -sd ',' -)
            if [ -z "$SPOKE_PRIVATE_SUBNETS" ]; then
              SPOKE_PRIVATE_SUBNETS=$(echo "$SPOKE_ALL_SUBNETS" | tr '\t' '\n' | head -2 | paste -sd ',' -)
            fi
            SPOKE_SG=$(aws eks describe-cluster --name "$CLUSTER" --region {{.AWS_REGION}} --query 'cluster.resourcesVpcConfig.clusterSecurityGroupId' --output text)
            echo "Spoke $CLUSTER: arn=$SPOKE_ARN subnets=$SPOKE_PRIVATE_SUBNETS sg=$SPOKE_SG"
            if [ "$CLUSTER" = "{{.RESOURCE_PREFIX}}-spoke-dev" ]; then
              SPOKE_DEV_ARN="$SPOKE_ARN"
              SPOKE_DEV_SUBNETS="$SPOKE_PRIVATE_SUBNETS"
              SPOKE_DEV_SG="$SPOKE_SG"
            else
              SPOKE_PROD_ARN="$SPOKE_ARN"
              SPOKE_PROD_SUBNETS="$SPOKE_PRIVATE_SUBNETS"
              SPOKE_PROD_SG="$SPOKE_SG"
            fi
          else
            echo "WARN: Cluster $CLUSTER not found in {{.AWS_REGION}}. Scraper skipped."
          fi
        done
        if [ -n "$SPOKE_DEV_ARN" ] || [ -n "$SPOKE_PROD_ARN" ]; then
          CONFIG_UPDATED=$(echo "$CONFIG_EXISTING" | jq \
            --arg sda "$SPOKE_DEV_ARN" \
            --arg sds "$SPOKE_DEV_SUBNETS" \
            --arg sdsg "$SPOKE_DEV_SG" \
            --arg spa "$SPOKE_PROD_ARN" \
            --arg sps "$SPOKE_PROD_SUBNETS" \
            --arg spsg "$SPOKE_PROD_SG" \
            '.metadata = (.metadata | fromjson | . + {spoke_dev_cluster_arn: $sda, spoke_dev_private_subnet_ids: $sds, spoke_dev_security_group_id: $sdsg, spoke_prod_cluster_arn: $spa, spoke_prod_private_subnet_ids: $sps, spoke_prod_security_group_id: $spsg} | tojson)')
          aws secretsmanager put-secret-value \
            --secret-id "$CONFIG_KEY" \
            --secret-string "$CONFIG_UPDATED" \
            --region {{.AWS_REGION}}
          echo "Updated hub config with spoke scraper data"
        fi

        # Update Keycloak SAML client with AMG URL
        printf '{{.C_STEP}}▸ Waiting for Keycloak to be reachable...{{.C_RESET}}\n'
        for i in $(seq 1 30); do
          if curl -sf -o /dev/null "https://{{.KC_DOMAIN}}/keycloak/realms/master/.well-known/openid-configuration" 2>/dev/null; then
            echo "Keycloak is reachable"
            break
          fi
          echo "  [$i/30] Keycloak not reachable yet (DNS/ALB propagating)..."
          sleep 20
        done
        printf '{{.C_STEP}}▸ Updating Keycloak SAML client with AMG URL...{{.C_RESET}}\n'
        # Best-effort, trailing block: relax errexit so a Keycloak/AMG hiccup
        # (missing perms, duplicate SAML clients yielding a multi-line client id ->
        # malformed curl URL, transient API error) only WARNs instead of aborting
        # the entire install. This is the last block in the task, so set +e is safe.
        set +e
        KC_PASS=$(aws secretsmanager get-secret-value --secret-id {{.HUB_CLUSTER_NAME}}/keycloak --region {{.AWS_REGION}} --query 'SecretString' --output text | jq -r '.keycloak_admin_password')
        KC_TOKEN=$(curl -s -X POST "https://{{.KC_DOMAIN}}/keycloak/realms/master/protocol/openid-connect/token" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=password&client_id=admin-cli&username=admin&password=$KC_PASS" | jq -r '.access_token')
        if [ -n "$KC_TOKEN" ] && [ "$KC_TOKEN" != "null" ]; then
          KC_CLIENT_ID=$(curl -s "https://{{.KC_DOMAIN}}/keycloak/admin/realms/platform/clients" \
            -H "Authorization: Bearer $KC_TOKEN" | jq -r '.[] | select(.name=="amazon-managed-grafana" and .protocol=="saml") | .id')
          if [ -n "$KC_CLIENT_ID" ]; then
            KC_CLIENT=$(curl -s "https://{{.KC_DOMAIN}}/keycloak/admin/realms/platform/clients/$KC_CLIENT_ID" \
              -H "Authorization: Bearer $KC_TOKEN")
            KC_UPDATED=$(echo "$KC_CLIENT" | jq \
              --arg url "$AMG_ENDPOINT" \
              '.clientId = "https://\($url)/saml/metadata" | .adminUrl = "https://\($url)/login/saml" | .redirectUris = ["https://\($url)/saml/acs"]')
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PUT "https://{{.KC_DOMAIN}}/keycloak/admin/realms/platform/clients/$KC_CLIENT_ID" \
              -H "Authorization: Bearer $KC_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$KC_UPDATED")
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Keycloak SAML client updated for AMG: $AMG_ENDPOINT"
            else
              echo "WARN: Keycloak SAML client update returned HTTP $HTTP_CODE"
            fi
          else
            echo "WARN: Keycloak SAML client 'amazon-managed-grafana' not found"
          fi
        else
          echo "WARN: Could not get Keycloak admin token. SAML client not updated."
        fi
      - |
        # Nudge Grafana to converge now that grafana_api_key/AMG creds are seeded.
        # The grafana-admin-credentials ExternalSecret -> Secret -> external-grafana
        # instance chain only reconciles once these creds exist; and the
        # grafana-operator caches its "available instances" registry, so
        # GrafanaDashboards created before the instance was Ready keep reporting
        # NoMatchingInstances until the operator re-evaluates. Force the
        # ExternalSecrets to resync and restart the operator so dashboards attach
        # and the grafana-dashboards Argo app reaches Healthy without manual steps.
        # Best-effort: never fail the seed on this.
        for es in grafana-admin-credentials grafana-amp-creds grafana-mysql-creds; do
          kubectl annotate externalsecret "$es" -n grafana-operator force-sync="$(date +%s)" --overwrite 2>/dev/null || true
        done
        kubectl rollout restart deploy/grafana-operator -n grafana-operator 2>/dev/null || true
        echo "Grafana ExternalSecrets resynced and grafana-operator restarted to pick up seeded credentials."



  hub:create-mgmt-roles:
    desc: Create cluster-mgmt IAM roles assumed by ACK controllers (single-account prereq)
    vars:
      ACK_CAPABILITY_ROLE:
        sh: aws eks describe-capability --cluster-name {{.HUB_CLUSTER_NAME}} --capability-name ack --region {{.AWS_REGION}} --query 'capability.roleArn' --output text 2>/dev/null | sed 's|.*/||' | grep -v '^$' || echo "{{.HUB_CLUSTER_NAME}}-ack-capability-role"
    cmds:
      - printf '{{.C_STEP}}▸ Creating cluster-mgmt IAM roles for ACK...{{.C_RESET}}\n'
      - |
        # Trust: the third pattern admits ANY spoke's ACK capability role, not just
        # <prefix>-spoke-*. The spoke resource graph names that role
        # ${schema.spec.name}-ack-capability-role (rg-eks.yaml), so with a name-scoped
        # pattern a spoke called e.g. `oap-dev` provisioned fine and then could not assume
        # <prefix>-cluster-mgmt-* from its own ACK — failing at the trust boundary AFTER the
        # cluster existed. Cluster names are customer-supplied, so they cannot carry
        # authorization meaning. The principal is still constrained to this account (the
        # Principal is this account's root) and to the platform-specific role suffix.
        TRUST_POLICY=$(cat <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"AWS": "arn:aws:iam::{{.AWS_ACCOUNT_ID}}:root"},
            "Action": ["sts:AssumeRole", "sts:TagSession"],
            "Condition": {"ArnLike": {"aws:PrincipalArn": [
              "arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/{{.ACK_CAPABILITY_ROLE}}",
              "arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/{{.RESOURCE_PREFIX}}-ack-*",
              "arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/*-ack-capability-role"
            ]}}
          }]
        }
        EOF
        )
        get_policies() {
          case $1 in
            ec2) echo "arn:aws:iam::aws:policy/AmazonEC2FullAccess arn:aws:iam::aws:policy/AmazonVPCFullAccess";;
            eks) echo "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy arn:aws:iam::aws:policy/AmazonEKSServicePolicy arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly";;
            iam) echo "arn:aws:iam::aws:policy/IAMFullAccess";;
            ecr) echo "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryFullAccess";;
            s3) echo "arn:aws:iam::aws:policy/AmazonS3FullAccess";;
            dynamodb) echo "arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess";;
            secretsmanager) echo "arn:aws:iam::aws:policy/SecretsManagerReadWrite";;
            rds) echo "arn:aws:iam::aws:policy/AmazonRDSFullAccess arn:aws:iam::aws:policy/SecretsManagerReadWrite";;
          esac
        }
        # Create all 7 roles in parallel — each is independent
        _PIDS=""
        for service in ec2 eks iam ecr s3 dynamodb secretsmanager rds; do
          (
            ROLE_NAME="{{.RESOURCE_PREFIX}}-cluster-mgmt-${service}"
            if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
              aws iam update-assume-role-policy --role-name "$ROLE_NAME" --policy-document "$TRUST_POLICY"
            else
              aws iam create-role --role-name "$ROLE_NAME" --assume-role-policy-document "$TRUST_POLICY" --no-cli-pager >/dev/null
            fi
            for arn in $(get_policies $service); do
              aws iam attach-role-policy --role-name "$ROLE_NAME" --policy-arn "$arn" 2>/dev/null || true
            done
            echo "  ✓ $ROLE_NAME"
          ) &
          _PIDS="$_PIDS $!"
        done
        # Wait for all role creations to complete
        for _pid in $_PIDS; do wait "$_pid" || true; done
        # Inline policies for EKS role: AccessEntry, PodIdentity, PassRole
        EKS_ROLE="{{.RESOURCE_PREFIX}}-cluster-mgmt-eks"
        # PassRole: scoped by the service the role is passed TO, not by role name.
        # The spoke RGD names every role after the CLUSTER (${schema.spec.name}-cluster-role,
        # -cluster-node-role, -ack-capability-role, ...), so a cluster whose name does not
        # start with RESOURCE_PREFIX produced roles the name-based grant below could not pass,
        # and CreateCluster failed with AccessDenied on iam:PassRole AFTER the VPC, subnets
        # and NAT gateway had already been created. Cluster names are customer-supplied and
        # arbitrary, so they cannot be relied on for authorization.
        # The four services are exactly the trust targets of the roles this platform passes:
        #   eks.amazonaws.com              cluster role
        #   ec2.amazonaws.com              node role (EKS Auto Mode computeConfig.nodeRoleArn)
        #   capabilities.eks.amazonaws.com argocd/ack/kro capability roles
        #   pods.eks.amazonaws.com         pod identity roles (was the only entry here)
        aws iam put-role-policy --role-name "$EKS_ROLE" --policy-name eks-access-management --policy-document '{
          "Version": "2012-10-17",
          "Statement": [
            {"Effect": "Allow", "Action": ["eks:*"], "Resource": "*"},
            {"Effect": "Allow", "Action": ["iam:PassRole","iam:GetRole"], "Resource": ["arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/{{.RESOURCE_PREFIX}}-*","arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/*-microservice-*"]},
            {"Effect": "Allow", "Action": ["iam:GetRole","iam:ListRoleTags"], "Resource": "arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/*"},
            {"Effect": "Allow", "Action": "iam:PassRole", "Resource": "arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/*", "Condition": {"StringEquals": {"iam:PassedToService": ["pods.eks.amazonaws.com","eks.amazonaws.com","ec2.amazonaws.com","capabilities.eks.amazonaws.com"]}}}
          ]
        }'
        RDS_ROLE="{{.RESOURCE_PREFIX}}-cluster-mgmt-rds"
        aws iam put-role-policy --role-name "$RDS_ROLE" --policy-name rds-kms --policy-document '{
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["kms:CreateGrant","kms:DescribeKey","kms:GenerateDataKey","kms:GenerateDataKeyWithoutPlaintext","kms:Decrypt","kms:Encrypt","kms:ReEncryptFrom","kms:ReEncryptTo","kms:RetireGrant","kms:ListGrants","kms:ListAliases"],
            "Resource": "*"
          }]
        }'
        # Allow ACK capability role to assume cluster-mgmt roles
        # Best-effort: the ACK capability role only exists after the hub EKS cluster
        # is created. When this task runs before hub:claim (new ordering for PR #861),
        # the role doesn't exist yet — skip gracefully. hub:seed re-runs this task
        # once the hub is up, which will apply the policy correctly.
        aws iam put-role-policy --role-name "{{.ACK_CAPABILITY_ROLE}}" --policy-name ack-assume-role --policy-document '{
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": ["sts:AssumeRole", "sts:TagSession"],
            "Resource": "arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/{{.RESOURCE_PREFIX}}-cluster-mgmt-*"
          }]
        }' 2>/dev/null || echo "  (ACK capability role not yet available — will be applied in hub:seed)"
        # [#1033 Deliverable #9] The hub self-manage grant (eks:Describe/manage on the
        # hub's OWN cluster + pod-identity ARNs) is NO LONGER applied imperatively here.
        # This capability role is a kro/ACK-managed IAM Role, so ACK reconciles it back to
        # its RGD-defined inlinePolicies on every pass and an out-of-band put-role-policy
        # was silently stripped (observed live: role carried only AssumeWorkloadRoles +
        # ManageIRSARoles after reconcile → adopted cluster/PIA children stayed
        # AccessDenied). The grant now lives durably in rg-eks.yaml as the `SelfManageHub`
        # inlinePolicy on ${schema.spec.name}-ack-capability-role, gated to the
        # control-plane hub (fleetMember=="control-plane"). See the RGD for details.
      - printf '{{.C_OK}}✓ cluster-mgmt roles ready.{{.C_RESET}}\n'


  hub:restart-identity-pods:
    desc: Restart pods that depend on Pod Identity (external-dns, LBC, Crossplane providers) after identities are ready
    status:
      - |
        KC={{.ROOT_DIR}}/private/hub-kubeconfig
        # Ensure kubeconfig exists for the status check (generate on the fly if absent)
        if [ ! -f "$KC" ]; then
          aws eks update-kubeconfig --name {{.HUB_CLUSTER_NAME}} --region {{.AWS_REGION}} --kubeconfig "$KC" >/dev/null 2>&1 || exit 1
        fi
        # Fast path: if all Crossplane providers are Healthy AND at least one
        # Crossplane-managed resource is Ready, the providers already have valid
        # AWS credentials — no restart needed (saves ~5min on re-runs).
        UNHEALTHY=$(KUBECONFIG=$KC kubectl get providers.pkg.crossplane.io \
          -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Healthy")].status!="True")].metadata.name}' \
          2>/dev/null | wc -w | tr -d ' ')
        [ "$UNHEALTHY" != "0" ] && exit 1
        # Check that providers can actually reconcile AWS resources (proves creds work).
        # Look for any Ready IAM role — crossplane-base creates several early on.
        HAS_READY=$(KUBECONFIG=$KC kubectl get roles.iam.aws.upbound.io -A \
          -o jsonpath='{.items[?(@.status.conditions[?(@.type=="Ready")].status=="True")].metadata.name}' \
          2>/dev/null | head -c 1)
        if [ -n "$HAS_READY" ]; then
          exit 0
        fi
        # Fallback: skip if oldest provider pod has been running >5min (credentials
        # were injected at startup and providers haven't created managed resources yet)
        OLDEST_TS=$(KUBECONFIG=$KC kubectl get pods -n crossplane-system \
          -l pkg.crossplane.io/revision \
          --sort-by=.metadata.creationTimestamp \
          -o jsonpath='{.items[0].metadata.creationTimestamp}' 2>/dev/null)
        [ -z "$OLDEST_TS" ] && exit 1
        NOW=$(date +%s)
        # python3 is always available on the IDE — use it for portable ISO-8601 parsing
        OLDEST_S=$(python3 -c "import datetime,sys; \
          ts=sys.argv[1]; \
          dt=datetime.datetime.strptime(ts,'%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=datetime.timezone.utc); \
          print(int(dt.timestamp()))" "$OLDEST_TS" 2>/dev/null || echo "0")
        AGE=$(( NOW - OLDEST_S ))
        [ "$AGE" -gt 300 ]
    cmds:
      - task: hub:kubeconfig
      - printf '{{.C_STEP}}▸ Terminating any stuck ArgoCD sync operations on pod-identities apps...{{.C_RESET}}\n'
      - |
        # A stuck PreSync hook on pod-identities-* (e.g. crd-wait Job whose
        # resources were already deleted) leaves operationState.phase=Running
        # indefinitely. This prevents PodIdentityAssociations from ever being
        # created, which in turn means LBC/external-dns never get AWS creds.
        # Terminate any such stuck operations before waiting.
        KC="KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig"
        eval "$KC" kubectl get applications -n argocd -o json 2>/dev/null | \
          jq -r '.items[] | select(
            (.metadata.name | startswith("pod-identities")) and
            (.status.operationState.phase == "Running")
          ) | .metadata.name' | \
        while read -r app; do
          printf '  ⚠ Terminating stuck sync on %s\n' "$app"
          eval "$KC" kubectl patch application "$app" -n argocd \
            --type='json' -p='[{"op":"remove","path":"/operation"}]' 2>/dev/null || true
          sleep 3
          eval "$KC" kubectl patch application "$app" -n argocd --type merge \
            -p '{"operation":{"initiatedBy":{"username":"admin"},"sync":{"revision":"HEAD"}}}' \
            2>/dev/null || true
        done
      - printf '{{.C_STEP}}▸ Waiting for pod identity associations to be Ready...{{.C_RESET}}\n'
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl -n crossplane-system wait --for=condition=Ready podidentityassociations.eks.aws.upbound.io --all --timeout=300s 2>/dev/null || true
      - printf '{{.C_STEP}}▸ Restarting Crossplane providers to pick up pod identity credentials...{{.C_RESET}}\n'
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl delete pod -n crossplane-system -l pkg.crossplane.io/revision --force --grace-period=0 2>/dev/null || true
      - sleep 15
      - printf '{{.C_STEP}}▸ Restarting external-dns and LBC to pick up pod identity credentials...{{.C_RESET}}\n'
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout restart deploy -n kube-system -l app.kubernetes.io/name=external-dns 2>/dev/null || true
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout restart deploy -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller 2>/dev/null || true
      - printf '{{.C_STEP}}▸ Restarting LiteLLM to pick up pod identity credentials...{{.C_RESET}}\n'
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout restart deploy -n kagent litellm 2>/dev/null || true
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout restart deploy -n otel otel-collector 2>/dev/null || true
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout status deploy -n kube-system -l app.kubernetes.io/name=external-dns --timeout=60s 2>/dev/null || true
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout status deploy -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller --timeout=60s 2>/dev/null || true
      - KUBECONFIG={{.ROOT_DIR}}/private/hub-kubeconfig kubectl rollout status deploy -n kagent litellm --timeout=120s 2>/dev/null || true
      - printf '{{.C_OK}}✓ Identity-dependent pods restarted.{{.C_RESET}}\n'
      # Lever #4 (replaces a flat `sleep 90`): bounded, event-driven wait for Pod
      # Identity credentials. The sleep existed (the Pod Identity race, tracked
      # internally as issue #8) to let the EKS Pod Identity agent inject credentials
      # into the freshly-restarted provider pods BEFORE ArgoCD syncs crossplane-base
      # and creates IAM roles (else ReconcileError "no EC2 IMDS role found"). The
      # webhook injects the creds env (AWS_CONTAINER_CREDENTIALS_FULL_URI) only when a
      # PodIdentityAssociation exists for the pod's SA AT ADMISSION; a pod admitted
      # before its PIA comes up Ready with NO creds -- that IS the race. So Ready alone
      # is insufficient: we wait until every provider-aws-* pod is Ready AND carries the
      # injected creds env, re-admitting (deleting once) any pod that missed its PIA,
      # bounded to a 90s ceiling (never longer than the old sleep). kubeconfig is
      # removed AFTER this probe (not before).
      - printf '{{.C_INFO}}  Waiting for Pod Identity credentials (provider-aws pods Ready + creds env, cap 90s)...{{.C_RESET}}\n'
      - |
        KC={{.ROOT_DIR}}/private/hub-kubeconfig
        ERRF=$(mktemp)
        # EXIT condition set: provider-aws-* pods that are NOT (Ready AND admitted with the
        # Pod Identity creds env). We only declare success when this set is empty.
        JQ_FLAGGED='[ .items[]
          | select(.metadata.deletionTimestamp == null)
          | select((.spec.serviceAccountName // "") | startswith("provider-aws-"))
          | select(([.status.conditions[]? | select(.type=="Ready" and .status=="True")] | length == 0)
                or ([.spec.containers[].env[]? | select(.name=="AWS_CONTAINER_CREDENTIALS_FULL_URI")] | length == 0))
          | .metadata.name ] | .[]'
        # RE-ADMIT set: provider-aws-* pods MISSING the creds env. The env is injected at
        # ADMISSION and never changes, so ONLY these benefit from a delete/re-admit -- a pod
        # that already has the env but is merely slow to become Ready just needs time, and
        # deleting it would reset its startup for nothing (review N1). So the re-admit acts
        # on NOENV, while the exit check still uses FLAGGED.
        JQ_NOENV='[ .items[]
          | select(.metadata.deletionTimestamp == null)
          | select((.spec.serviceAccountName // "") | startswith("provider-aws-"))
          | select([.spec.containers[].env[]? | select(.name=="AWS_CONTAINER_CREDENTIALS_FULL_URI")] | length == 0)
          | .metadata.name ] | .[]'
        JQ_TOTAL='[ .items[] | select(.metadata.deletionTimestamp == null) | select((.spec.serviceAccountName // "") | startswith("provider-aws-")) ] | length'
        START=$(date +%s); DEADLINE=$(( START + 90 )); REDELETED=0; STATE=cap; FLAGGED=
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          if ! PODS=$(KUBECONFIG=$KC kubectl get pods -n crossplane-system --request-timeout=10s -o json 2>"$ERRF"); then
            STATE=apierr; break   # real API/kubeconfig/auth error -- NOT a timeout (review finding 2)
          fi
          TOTAL=$(printf '%s' "$PODS" | jq -r "$JQ_TOTAL") || { STATE=apierr; break; }
          FLAGGED=$(printf '%s' "$PODS" | jq -r "$JQ_FLAGGED") || { STATE=apierr; break; }
          NOENV=$(printf '%s' "$PODS" | jq -r "$JQ_NOENV") || { STATE=apierr; break; }
          if [ "$TOTAL" -gt 0 ] && [ -z "$FLAGGED" ]; then STATE=ok; break; fi
          # A pod MISSING the creds env was admitted before its PIA existed. Re-check PIAs,
          # then re-admit ONLY those pods ONCE so they re-admit WITH the creds env (N1).
          if [ -n "$NOENV" ] && [ "$REDELETED" -eq 0 ]; then
            PIA_WAIT=$(( DEADLINE - $(date +%s) )); [ "$PIA_WAIT" -gt 30 ] && PIA_WAIT=30 || true; [ "$PIA_WAIT" -gt 0 ] || PIA_WAIT=1
            KUBECONFIG=$KC kubectl -n crossplane-system wait --for=condition=Ready \
              podidentityassociations.eks.aws.upbound.io --all --timeout="${PIA_WAIT}s" >/dev/null 2>&1 || true
            printf '  ↻ re-admitting %s provider pod(s) missing creds env: %s\n' \
              "$(printf '%s' "$NOENV" | wc -w | tr -d ' ')" "$(printf '%s' "$NOENV" | tr '\n' ' ')"
            printf '%s\n' "$NOENV" | while IFS= read -r p; do
              [ -n "$p" ] && KUBECONFIG=$KC kubectl delete pod -n crossplane-system "$p" --force --grace-period=0 >/dev/null 2>&1 || true
            done
            REDELETED=1
          fi
          sleep 5
        done
        case "$STATE" in
          ok)     printf '  ✓ %s provider-aws pods Ready with Pod Identity creds after %ss.\n' "$TOTAL" "$(( $(date +%s) - START ))" ;;
          apierr) R=$(( DEADLINE - $(date +%s) )); [ "$R" -gt 0 ] || R=0
                  printf '  ⚠ cannot query provider pods (%s); sleeping the remaining %ss of the 90s budget.\n' "$(tail -n 1 "$ERRF" 2>/dev/null)" "$R"; [ "$R" -gt 0 ] && sleep "$R" || true ;;
          cap)    printf '  ⚠ provider-aws pods not Ready+credentialed within 90s cap -- proceeding (same ceiling as the old sleep 90). Still flagged: %s\n' "$(printf '%s' "${FLAGGED:-none (no provider-aws pods found)}" | tr '\n' ' ')" ;;
        esac
        rm -f "$KC" "$ERRF"


  hub:update:
    desc: Update hub infra via Kind+Crossplane
    vars:
      MNG_SETS:
        sh: |
          if [ "$(yq '.hub.managedNodeGroup.enabled // false' {{.CONFIG_FILE}})" = "true" ]; then
            SETS="--set clusters.hub.managedNodeGroup.enabled=true"
            IDX=0
            for TYPE in $(yq '.hub.managedNodeGroup.instanceTypes // ["m5.large"] | .[]' {{.CONFIG_FILE}}); do
              SETS="$SETS --set clusters.hub.managedNodeGroup.instanceTypes[$IDX]=$TYPE"
              IDX=$((IDX+1))
            done
            SETS="$SETS --set clusters.hub.managedNodeGroup.desiredSize=$(yq '.hub.managedNodeGroup.desiredSize // 2' {{.CONFIG_FILE}})"
            SETS="$SETS --set clusters.hub.managedNodeGroup.minSize=$(yq '.hub.managedNodeGroup.minSize // 1' {{.CONFIG_FILE}})"
            SETS="$SETS --set clusters.hub.managedNodeGroup.maxSize=$(yq '.hub.managedNodeGroup.maxSize // 5' {{.CONFIG_FILE}})"
            SETS="$SETS --set clusters.hub.managedNodeGroup.diskSize=$(yq '.hub.managedNodeGroup.diskSize // 50' {{.CONFIG_FILE}})"
            SETS="$SETS --set clusters.hub.managedNodeGroup.capacityType=$(yq '.hub.managedNodeGroup.capacityType // "ON_DEMAND"' {{.CONFIG_FILE}})"
            echo "$SETS"
          fi
    cmds:
      - task: init
      - task: kind:create
      - task: credentials:setup
      - task: crossplane:helm
      - task: crossplane:providers
      - task: crossplane:provider-config
      - kubectl apply -f {{.GITOPS_ROOT}}/abstractions/crossplane/platform-cluster/templates/ 2>/dev/null || true
      - helm template hub-cluster {{.GITOPS_ROOT}}/abstractions/crossplane/platform-cluster
          --set clusters.hub.region={{.AWS_REGION}}
          --set clusters.hub.clusterName={{.HUB_CLUSTER_NAME}}
          --set clusters.hub.kubernetesVersion={{.HUB_K8S_VERSION}}
          --set clusters.hub.vpcCidr={{.HUB_VPC_CIDR}}
          --set clusters.hub.resourcePrefix={{.RESOURCE_PREFIX}}
          {{.MNG_SETS}}
          | kubectl apply -f -
      - kubectl apply -f claims/
      - kubectl -n crossplane-system wait --for=condition=Ready --timeout=3500s platformclusters.platform.gitops.io/{{.HUB_CLUSTER_NAME}}
      - task: destroy-kind


  spokes:seed-provider-identity:
    desc: >-
      Seed the bootstrap Crossplane provider IAM roles + EKS Pod Identity
      associations for spoke clusters (same account). The iam/eks providers are
      createIdentity:false in the registry, so crossplane-base does NOT create
      their roles; without this seed a spoke's iam/eks providers cannot
      authenticate (chicken-and-egg). Mirrors the hub bootstrap. Idempotent.
      Run after spokes are provisioned (ACTIVE). Cross-account spokes are NOT
      handled here - their roles must be bootstrapped in the target account.
    cmds:
      - cmd: |
          # provider service-account suffix -> IAM role name suffix
          PROVIDERS="iam:CrossplaneIAMProviderRole eks:CrossplaneEKSProviderRole"
          # Discover spokes from fleet members, excluding the hub.
          SPOKES=$(ls "{{.GITOPS_ROOT}}/fleet/members" 2>/dev/null | grep -vx "{{.HUB_CLUSTER_NAME}}" || true)
          if [ -z "$SPOKES" ]; then
            printf '{{.C_INFO}}  No spoke members under fleet/members; nothing to seed.{{.C_RESET}}\n'
            exit 0
          fi
          for SPOKE in $SPOKES; do
            STATUS=$(aws eks describe-cluster --name "$SPOKE" --region {{.AWS_REGION}} --query 'cluster.status' --output text 2>/dev/null || echo "NONE")
            if [ "$STATUS" != "ACTIVE" ]; then
              printf '{{.C_INFO}}  Skipping %s (cluster status: %s){{.C_RESET}}\n' "$SPOKE" "$STATUS"
              continue
            fi
            for ENTRY in $PROVIDERS; do
              SVC="${ENTRY%%:*}"            # iam | eks
              ROLE_NAME="${SPOKE}-${ENTRY##*:}"
              SA="provider-aws-${SVC}"
              ROLE_ARN="arn:aws:iam::{{.AWS_ACCOUNT_ID}}:role/${ROLE_NAME}"
              # 1. IAM role trusting EKS Pod Identity (idempotent)
              if ! aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
                aws iam create-role --role-name "$ROLE_NAME" \
                  --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"pods.eks.amazonaws.com"},"Action":["sts:AssumeRole","sts:TagSession"]}]}' \
                  --tags Key=managed-by,Value=platform-bootstrap Key=purpose,Value="${SVC}-provider" >/dev/null
                printf '{{.C_OK}}  ✓ %s: created role %s{{.C_RESET}}\n' "$SPOKE" "$ROLE_NAME"
              else
                printf '{{.C_INFO}}  %s: role %s exists{{.C_RESET}}\n' "$SPOKE" "$ROLE_NAME"
              fi
              # 2. AdministratorAccess (attach is idempotent)
              aws iam attach-role-policy --role-name "$ROLE_NAME" \
                --policy-arn arn:aws:iam::aws:policy/AdministratorAccess >/dev/null
              # 3. Pod Identity association on the spoke (idempotent)
              EXISTING=$(aws eks list-pod-identity-associations --cluster-name "$SPOKE" --region {{.AWS_REGION}} \
                --namespace crossplane-system --service-account "$SA" \
                --query 'associations[0].associationId' --output text 2>/dev/null || echo "None")
              if [ "$EXISTING" = "None" ] || [ -z "$EXISTING" ]; then
                aws eks create-pod-identity-association --cluster-name "$SPOKE" --region {{.AWS_REGION}} \
                  --namespace crossplane-system --service-account "$SA" --role-arn "$ROLE_ARN" >/dev/null
                printf '{{.C_OK}}  ✓ %s: pod identity %s -> %s{{.C_RESET}}\n' "$SPOKE" "$SA" "$ROLE_NAME"
              else
                printf '{{.C_INFO}}  %s: pod identity for %s exists{{.C_RESET}}\n' "$SPOKE" "$SA"
              fi
            done
          done
          printf '{{.C_OK}}✓ Spoke provider identity seeding complete.{{.C_RESET}}\n'

  hub:pivot:
    desc: >-
      [#775] Self-adopt the hub EksCluster from the ephemeral kind cluster onto the hub
      EKS cluster itself, then stop/delete kind. DRY-RUN by default (PIVOT_DRY_RUN=true):
      prints the hub-side manifest + plan and mutates nothing. The live pivot
      (PIVOT_DRY_RUN=false PIVOT_CONFIRM=yes) stops kind first (single reconciler — no
      dual-controller conflict), adopts on the hub, gates on adoption-complete (instance
      ACTIVE + every kro-owned child synced), then detaches per PIVOT_DETACH_MODE
      (stop=default, recoverable; delete=`kind delete cluster`). No graceful CR delete,
      so no finalizer runs and no AWS Delete is ever issued.

      By default (HUB_PIVOT_GITOPS=true) the hub EksCluster is asserted via GitOps. The
      provider is CONSUMER-AGNOSTIC: it reads the overlay repo the consumer wired into
      <hub>/config (overlay_repo_url/revision/basepath) and REUSES the ArgoCD repo
      credential the consumer registered (argocd/fleet-config-repo) — it never assumes a
      specific consumer's GitLab/IDE/CloudFront or writes a repo password of its own. It
      commits self-adoption/hub/<hub>.yaml to that overlay and a dedicated
      `hub-self-adoption` ArgoCD Application reconciles it (destination = the hub cluster
      NAME, since the EKS ArgoCD capability disables the loopback; selfHeal:true,
      prune:false) — desired-state-from-git, so the instance can never be pruned. The live
      pivot is REFUSED up front (nothing mutated) if no overlay repo is wired or the repo
      credential is absent. HUB_PIVOT_GITOPS=false is a deliberate operator override that
      adopts imperatively with no re-asserter (no automatic fallback).
    vars:
      PIVOT_DRY_RUN: '{{.PIVOT_DRY_RUN | default "true"}}'
      PIVOT_CONFIRM: '{{.PIVOT_CONFIRM | default "no"}}'
      KINDKC: '{{.ROOT_DIR}}/private/kubeconfig'
      HUBKC: '{{.ROOT_DIR}}/private/hub-kubeconfig'
      HUB_KIND: '{{if .HUB_VPC_ID}}EksCluster{{else}}EksclusterWithVpc{{end}}'
      PIVOT_ADOPT_TIMEOUT_SEC: '{{.PIVOT_ADOPT_TIMEOUT_SEC | default "1800"}}'
      PIVOT_ADOPT_INTERVAL_SEC: '{{.PIVOT_ADOPT_INTERVAL_SEC | default "20"}}'
      PIVOT_DETACH_MODE: '{{.PIVOT_DETACH_MODE | default "stop"}}'
      # GitOps-assert the adopted hub EksCluster (commit to fleet-config + selfHeal/prune=false
      # Application) instead of a one-shot kubectl apply; imperative fallback when false/unreachable.
      HUB_PIVOT_GITOPS: '{{.HUB_PIVOT_GITOPS | default "true"}}'
    cmds:
      - task: hub:kubeconfig
      - |
        set -euo pipefail
        HUB='{{.HUB_CLUSTER_NAME}}'; NS="$HUB"
        KINDKC='{{.KINDKC}}'; HUBKC='{{.HUBKC}}'; REGION='{{.AWS_REGION}}'
        kind_k() { KUBECONFIG="$KINDKC" kubectl "$@"; }
        hub_k()  { KUBECONFIG="$HUBKC"  kubectl "$@"; }

        printf '{{.C_STEP}}▸ hub:pivot ({{if eq .PIVOT_DRY_RUN "true"}}DRY-RUN{{else}}LIVE{{end}}) for %s{{.C_RESET}}\n' "$HUB"

        # --- Preconditions (fail-closed) --------------------------------------
        if ! kind_k -n "$NS" get {{.HUB_KIND}}.kro.run "$HUB" >/dev/null 2>&1; then
          printf '{{.C_ERR}}✗ kind has no {{.HUB_KIND}}/%s in ns %s — nothing to pivot (already pivoted?).{{.C_RESET}}\n' "$HUB" "$NS"
          exit 1
        fi
        for rgd in ekscluster.kro.run vpc.kro.run; do
          hub_k get resourcegraphdefinition "$rgd" >/dev/null 2>&1 \
            || { printf '{{.C_ERR}}✗ hub missing RGD %s — hub ACK/KRO addons not synced yet.{{.C_RESET}}\n' "$rgd"; exit 1; }
        done
        for cap in ack kro; do
          st=$(aws eks describe-capability --cluster-name "$HUB" --capability-name "$cap" --region "$REGION" \
                 --query 'capability.status' --output text 2>/dev/null || echo UNKNOWN)
          printf '{{.C_INFO}}  hub capability %-4s = %s{{.C_RESET}}\n' "$cap" "$st"
        done

        # --- 1. Serialize kind EksCluster spec -> hub-side manifest ------------
        WORK=$(mktemp -d)
        # [#1033 N3] EXIT trap. Under `set -e`, a failure AFTER kind is stopped (the ec2 /
        # namespace apply, the clone mkdir/yq, or the imperative apply) would otherwise leave
        # kind stopped with the hub half-adopted — while the workshop prints "fail-closed and
        # restarted kind", which would be false. On any non-zero exit once kind has been
        # stopped, restart kind and orphan the hub-side instance (retain → no AWS delete) so we
        # return to single-manager (kind) state. DETACHED=1 (set at a successful detach) makes it
        # a no-op; explicit abort branches set ABORT_HANDLED=1 so they aren't double-handled.
        DETACHED=0; KIND_STOPPED=0; ABORT_HANDLED=0
        pivot_cleanup() {
          rc=$?
          rm -rf "$WORK" 2>/dev/null || true
          if [ "$DETACHED" != 1 ] && [ "$ABORT_HANDLED" != 1 ] && [ "$KIND_STOPPED" = 1 ] && [ "$rc" != 0 ]; then
            printf '{{.C_ERR}}✗ pivot aborted unexpectedly (rc=%s) after kind was stopped — restarting kind + orphaning hub-side instance (retain → no AWS delete)…{{.C_RESET}}\n' "$rc"
            [ -n "$KIND_NODES" ] && docker start $KIND_NODES >/dev/null 2>&1 || true
            ABORT_HANDLED=1  # [#1033 N3] this branch restarts kind itself; EXIT trap must not re-handle
          orphan_hub_instance hub_k 2>/dev/null || true
          fi
        }
        trap pivot_cleanup EXIT
        # Project to a CLEAN manifest (apiVersion/kind/name/namespace/spec only): the kind
        # instance's finalizers, kro.run/* labels and applyset annotations MUST be dropped —
        # the hub kro assigns its own; applying them verbatim would hand it a foreign applyset.
        # Inject two anti-prune ArgoCD annotations so no App treats the adopted CR as extraneous
        # or prunes it: compare-options=IgnoreExtraneous, sync-options=Prune=false.
        # Force three spec fields regardless of what the kind instance carried:
        #   fleetMember=control-plane  — else it defaults to "spoke" on the hub, ejecting the
        #       hub from the clusters-kro matrix (the relabel this PR fixes).
        #   deletionPolicy=retain      — any graceful delete of the hub-side instance would
        #       otherwise DeleteCluster the hub itself; destroy deletes the hub via the AWS API,
        #       so retain loses nothing on teardown and closes every graceful-delete path.
        #   createArgocdClusterSecret=false  — [verified live, kro 0.9.4-eks-1] the hub's ArgoCD
        #       registration Secret (argocd/<hub>, the object the clusters-kro matrix selects on
        #       fleet_member) is owned by hub:seed + the fleet-secret ExternalSecret, NOT kro.
        #       hub:claim sets "true" only for the kind bootstrap (ESO can't yet register the hub
        #       to itself). Keeping "true" on the adopted instance would pull that Secret into the
        #       hub kro graph and churn the fleet_member label — the exact cause of spoke deletion.
        #       "false" keeps it on the ESO path, so the pivot never re-materialises it. This is
        #       the RGD's documented default, not a workaround.
        kind_k -n "$NS" get {{.HUB_KIND}}.kro.run "$HUB" -o json \
          | jq '{apiVersion, kind, metadata: {name: .metadata.name, namespace: .metadata.namespace, annotations: {"argocd.argoproj.io/compare-options": "IgnoreExtraneous", "argocd.argoproj.io/sync-options": "Prune=false"}}, spec} | .spec.fleetMember = "control-plane" | .spec.deletionPolicy = "retain" | .spec.createArgocdClusterSecret = "false"' \
          > "$WORK/hub-instance.json"
        printf '{{.C_OK}}✓ serialized kind %s/%s spec -> hub-side manifest{{.C_RESET}}\n' '{{.HUB_KIND}}' "$HUB"

        # --- 2. (fallback path) ec2 adoption-fields manifests ------------------
        if [ "{{.HUB_KIND}}" = "EksclusterWithVpc" ]; then
          printf '{{.C_INFO}}  EksclusterWithVpc path — generating Class-2 ec2 adoption manifests{{.C_RESET}}\n'
          SRC_KUBECONFIG="$KINDKC" VPC_CR_NAME="$HUB" VPC_CR_NS="$NS" REGION="$REGION" \
            bash '{{.ROOT_DIR}}/cluster-providers/kind-kro-ack/scripts/pivot-adopt-ec2.sh' \
            > "$WORK/ec2-adopt.yaml" || true
        else
          printf '{{.C_INFO}}  EksCluster (pre-created VPC) path — no Class-2 ec2 adoption needed{{.C_RESET}}\n'
          : > "$WORK/ec2-adopt.yaml"
        fi

        # --- 3. Inventory kind-side AWS-backed children (informational) --------
        # The pivot ADOPTS these on the hub, then discards kind WITHOUT a graceful CR delete,
        # so no deletionTimestamp is set, no ACK finalizer runs and no AWS Delete is called.
        printf '{{.C_STEP}}▸ kind-side AWS-backed children (will be adopted on the hub)…{{.C_RESET}}\n'
        # CHILD_GKS = the ACK (AWS-backed) children of the EksCluster kro graph — they honour
        # services.k8s.aws/deletion-policy, so these are the set the retain guard pins before
        # kind stops. (Cluster-scoped Crossplane IAM roles are platform GitOps, not children here.)
        CHILD_GKS="cluster.eks.services.k8s.aws accessentry.eks.services.k8s.aws securitygroup.ec2.services.k8s.aws podidentityassociation.eks.services.k8s.aws role.iam.services.k8s.aws policies.iam.services.k8s.aws openidconnectprovider.iam.services.k8s.aws capabilities.eks.services.k8s.aws secrets.secretsmanager.services.k8s.aws vpc.ec2.services.k8s.aws subnet.ec2.services.k8s.aws natgateway.ec2.services.k8s.aws elasticipaddress.ec2.services.k8s.aws internetgateway.ec2.services.k8s.aws routetable.ec2.services.k8s.aws"
        # CHILD_GKS_INFO = non-ACK kro children — inventoried for completeness; not an AWS-delete
        # risk (ESO only syncs; the underlying AWS secret is the secrets.secretsmanager ACK above).
        CHILD_GKS_INFO="externalsecret.external-secrets.io"
        for gk in $CHILD_GKS $CHILD_GKS_INFO; do
          for cr in $(kind_k -n "$NS" get "$gk" -l kro.run/owned=true -o name 2>/dev/null); do
            printf '{{.C_INFO}}  • %s{{.C_RESET}}\n' "$cr"
          done
        done

        # adoption_gate <kubeconfig-accessor-fn>: prints per-child readiness on the hub;
        # returns 0 only if the hub instance is ACTIVE AND every AWS-backed child reports
        # synced/ready. Call ONLY in a condition context (returns non-zero by design).
        adoption_gate() {
          local K="$1"; local notready=0 st cr ok
          st=$($K -n "$NS" get {{.HUB_KIND}}.kro.run "$HUB" -o jsonpath='{.status.state}' 2>/dev/null || true)
          printf '{{.C_INFO}}  hub instance {{.HUB_KIND}}/%s state=%s{{.C_RESET}}\n' "$HUB" "${st:-<none>}"
          [ "$st" = "ACTIVE" ] || notready=1
          for gk in $CHILD_GKS; do
            for cr in $($K -n "$NS" get "$gk" -l kro.run/owned=true -o name 2>/dev/null); do
              ok=$($K -n "$NS" get "$cr" -o jsonpath='{range .status.conditions[*]}{.type}={.status} {end}' 2>/dev/null \
                    | grep -oE '(ACK\.ResourceSynced|Synced|Ready)=True' | head -1 || true)
              if [ -n "$ok" ]; then
                printf '{{.C_OK}}    ✓ %-55s synced{{.C_RESET}}\n' "$cr"
              else
                printf '{{.C_ERR}}    ✗ %-55s NOT synced{{.C_RESET}}\n' "$cr"
                notready=1
              fi
            done
          done
          return $notready
        }

        # --- Spoke-integrity guard --------------------------------------------
        # The pivot must be inert to the spoke instances the hub already manages
        # (clusters-kro -> EksclusterWithVpc/EksCluster). Capture the baseline now; the gate
        # below fails-closed if any spoke acquires a deletionTimestamp during the pivot — kind
        # is never discarded while a spoke is being pruned, and is restarted to drive them back.
        SPOKE_GKS="eksclusterwithvpc.kro.run ekscluster.kro.run"
        spoke_instances() {
          local K="$1" gk
          for gk in $SPOKE_GKS; do
            $K get "$gk" -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}' 2>/dev/null || true
          done | grep -v "^$NS/$HUB\$" | sort -u
        }
        SPOKE_BASELINE=$(spoke_instances hub_k || true)
        if [ -n "$SPOKE_BASELINE" ]; then
          printf '{{.C_INFO}}  spoke instances the pivot must NOT perturb:{{.C_RESET}}\n'
          printf '%s\n' "$SPOKE_BASELINE" | sed 's/^/    • /'
        else
          printf '{{.C_INFO}}  no pre-existing spoke instances on the hub (nothing to protect).{{.C_RESET}}\n'
        fi
        # Returns non-zero (and prints) if any baseline spoke instance is deletion-marked.
        spokes_intact() {
          local K="$1" si ns name ts gk bad=0
          [ -z "$SPOKE_BASELINE" ] && return 0
          while IFS= read -r si; do
            [ -z "$si" ] && continue
            ns=${si%%/*}; name=${si#*/}
            for gk in $SPOKE_GKS; do
              ts=$($K -n "$ns" get "$gk" "$name" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)
              if [ -n "$ts" ]; then
                printf '{{.C_ERR}}    ✗ spoke %s/%s deletion-marked (%s) — pivot perturbed a spoke!{{.C_RESET}}\n' "$ns" "$name" "$ts"
                bad=1
              fi
            done
          done < <(printf '%s\n' "$SPOKE_BASELINE")
          return $bad
        }

        # --- Hub-instance integrity guard + deleter forensics -----------------
        # Detect a deletionTimestamp on the hub's OWN instance immediately and snapshot who
        # issued the delete, so a regression names the deleter instead of us guessing. The
        # anti-prune annotations on hub-instance.json are the primary defence; this is the
        # fail-closed net + evidence collector.
        capture_hub_deleter_forensics() {
          local K="$1" ts="$2"
          printf '{{.C_ERR}}  ✗ HUB instance {{.HUB_KIND}}/%s is DELETION-MARKED (%s) — capturing deleter forensics:{{.C_RESET}}\n' "$HUB" "$ts"
          printf '{{.C_INFO}}  [forensic] hub instance (managed-fields show the last writer per field):{{.C_RESET}}\n'
          $K -n "$NS" get {{.HUB_KIND}}.kro.run "$HUB" -o yaml --show-managed-fields 2>&1 | sed 's/^/      /'
          printf '{{.C_INFO}}  [forensic] events mentioning %s (ArgoCD prune emits a Delete/Prune event here):{{.C_RESET}}\n' "$HUB"
          $K get events -A --sort-by=.metadata.creationTimestamp 2>/dev/null | grep -i "$HUB" | tail -40 | sed 's/^/      /' || true
          printf '{{.C_INFO}}  [forensic] ArgoCD Applications tracking an EksCluster (prune flag + per-resource status = the smoking gun):{{.C_RESET}}\n'
          $K get applications.argoproj.io -A -o json 2>/dev/null \
            | jq -r '.items[] | . as $a | (($a.status.resources // [])[] | select(.kind=="EksCluster")) as $r | "\($a.metadata.namespace)/\($a.metadata.name) autoPrune=\($a.spec.syncPolicy.automated.prune // false) selfHeal=\($a.spec.syncPolicy.automated.selfHeal // false) -> \($r.namespace)/\($r.name) status=\($r.status // "n/a") requiresPruning=\($r.requiresPruning // "n/a")"' 2>/dev/null | sed 's/^/      /' || true
          printf '{{.C_INFO}}  [forensic] all ApplicationSets (a generator pruning the hub out of its matrix would show here):{{.C_RESET}}\n'
          $K get applicationsets.argoproj.io -A 2>/dev/null | sed 's/^/      /' || true
          printf '{{.C_INFO}}  [forensic] hub instance labels / annotations / ownerRefs (applyset membership + any cascade owner):{{.C_RESET}}\n'
          $K -n "$NS" get {{.HUB_KIND}}.kro.run "$HUB" \
            -o jsonpath='{"      labels:  "}{.metadata.labels}{"\n      annots:  "}{.metadata.annotations}{"\n      owners:  "}{.metadata.ownerReferences}{"\n"}' 2>/dev/null || true
          printf '{{.C_INFO}}  [forensic] hub cluster secret fleet_member (must still be control-plane):{{.C_RESET}}\n'
          $K -n argocd get secret -l argocd.argoproj.io/secret-type=cluster \
            -o jsonpath='{range .items[*]}      {.metadata.name}  fleet_member={.metadata.labels.fleet_member}{"\n"}{end}' 2>/dev/null || true
        }
        # Returns non-zero (and dumps forensics) if the hub instance is deletion-marked.
        hub_intact() {
          local K="$1" ts
          ts=$($K -n "$NS" get {{.HUB_KIND}}.kro.run "$HUB" -o jsonpath='{.metadata.deletionTimestamp}' 2>/dev/null || true)
          if [ -n "$ts" ]; then capture_hub_deleter_forensics "$K" "$ts"; return 1; fi
          return 0
        }

        # orphan_hub_instance <kubeconfig-accessor-fn>: remove the adopted hub-side instance
        # from the hub WITHOUT deleting any AWS resource, so an aborted pivot can restart kind
        # and return to single-manager (kind-only) state instead of leaving BOTH kind and the
        # hub reconciling the same AWS resources (review #4 dual-manager). Safe because the
        # adopted instance carries deletionPolicy: retain (forced in the projection), so the
        # kro delete cascades to the ACK children as RETAIN (orphan) — never an AWS Delete.
        orphan_hub_instance() {
          local K="$1"
          # [#1033 GitOps] If the hub-self-adoption Application is asserting the instance,
          # remove it FIRST so selfHeal cannot recreate the CR we are about to orphan. Strip
          # the argocd cascade finalizer and delete non-cascading (--cascade=orphan) so
          # deleting the App does NOT itself prune/delete the EksCluster — the orphan below
          # handles the CR explicitly (retain → no AWS delete).
          $K -n argocd patch application hub-self-adoption --type merge -p '{"metadata":{"finalizers":[]}}' >/dev/null 2>&1 || true
          $K -n argocd delete application hub-self-adoption --cascade=orphan --wait=false --ignore-not-found >/dev/null 2>&1 || true
          # Belt-and-suspenders: re-assert retain on the hub-side ACK children before removal.
          for gk in $CHILD_GKS; do
            $K -n "$NS" annotate "$gk" -l kro.run/owned=true services.k8s.aws/deletion-policy=retain --overwrite >/dev/null 2>&1 || true
          done
          # Remove the kro instance (non-blocking); children orphan via retain.
          $K -n "$NS" delete {{.HUB_KIND}}.kro.run "$HUB" --wait=false --ignore-not-found >/dev/null 2>&1 || true
          # Force-clear the kro finalizer if the delete wedges, so the CR actually leaves the
          # hub and the hub stops reconciling it (restores single-manager state after restart).
          $K -n "$NS" patch {{.HUB_KIND}}.kro.run "$HUB" --type merge -p '{"metadata":{"finalizers":[]}}' >/dev/null 2>&1 || true
          printf '{{.C_INFO}}  orphaned hub-side %s/%s (retain → no AWS delete); hub will stop reconciling it.{{.C_RESET}}\n' '{{.HUB_KIND}}' "$HUB"
        }

        # --- Dry-run output ----------------------------------------------------
        printf '{{.C_STEP}}▸ Hub-side instance manifest (would be applied on %s):{{.C_RESET}}\n' "$HUB"
        jq -r '.' "$WORK/hub-instance.json" | sed 's/^/    /'
        if [ -s "$WORK/ec2-adopt.yaml" ]; then
          printf '{{.C_STEP}}▸ ec2 adoption manifests:{{.C_RESET}}\n'; sed 's/^/    /' "$WORK/ec2-adopt.yaml"
        fi
        printf '{{.C_STEP}}▸ Pivot plan: retain-pin kind-side ACK children (deletion-policy=retain → kind can never AWS-delete) -> stop kind nodes (docker stop) -> apply manifest on hub (adopt-or-create, single reconciler; fleetMember=control-plane, deletionPolicy=retain) -> WAIT adoption-complete (instance ACTIVE + every kro-owned child synced) -> detach=%s (stop: leave kind stopped & recoverable | delete: kind delete cluster). No kubectl delete of the CR, and retain on both sides means no path issues an AWS Delete.{{.C_RESET}}\n' '{{.PIVOT_DETACH_MODE}}'

        if [ "{{.PIVOT_DRY_RUN}}" = "true" ]; then
          printf '{{.C_OK}}✓ DRY-RUN complete — nothing mutated. Re-run with PIVOT_DRY_RUN=false PIVOT_CONFIRM=yes to execute.{{.C_RESET}}\n'
          exit 0
        fi

        # --- LIVE path (experimental, gated) -----------------------------------
        if [ "{{.PIVOT_CONFIRM}}" != "yes" ]; then
          printf '{{.C_ERR}}✗ Refusing live pivot without PIVOT_CONFIRM=yes.{{.C_RESET}}\n'; exit 1
        fi

        # --- Consumer-agnostic precondition (fail-closed, BEFORE any mutation) -------------
        # A cluster provider reads inputs ONLY from config.yaml + <hub>/config; it never
        # assumes or writes a specific consumer's systems (workshop GitLab, IDE, CloudFront).
        # So the GitOps adoption uses the overlay repo the CONSUMER wired into <hub>/config
        # (overlay_repo_url/revision/basepath) and REUSES the ArgoCD repo credential the
        # consumer already registered (argocd/fleet-config-repo) — the provider resolves no
        # GitLab URL and writes no repo password of its own. Refuse the live pivot UP FRONT
        # (before stopping kind, so a refusal mutates nothing) if either is missing. The
        # explicit operator override HUB_PIVOT_GITOPS=false adopts imperatively with no
        # re-asserter and skips this requirement.
        OVERLAY_URL=""; OVERLAY_REV="main"; OVERLAY_BP=""; REPO_USER=""; REPO_PASS=""
        if [ "{{.HUB_PIVOT_GITOPS}}" = "true" ]; then
          # Refresh the hub kubeconfig so the credential read is reliable standalone or in-install.
          aws eks update-kubeconfig --name "$HUB" --region "$REGION" --alias "$HUB" --kubeconfig "$HUBKC" >/dev/null 2>&1 || true
          set +e
          HUB_CFG=$(aws secretsmanager get-secret-value --secret-id "$HUB/config" --region "$REGION" --query 'SecretString' --output text 2>/dev/null)
          OVERLAY_URL=$(printf '%s' "$HUB_CFG" | jq -r '(.metadata | fromjson).overlay_repo_url      // ""'     2>/dev/null)
          OVERLAY_REV=$(printf '%s' "$HUB_CFG" | jq -r '(.metadata | fromjson).overlay_repo_revision // "main"' 2>/dev/null)
          OVERLAY_BP=$( printf '%s' "$HUB_CFG" | jq -r '(.metadata | fromjson).overlay_repo_basepath  // ""'     2>/dev/null)
          REPO_USER=$(hub_k -n argocd get secret fleet-config-repo -o jsonpath='{.data.username}' 2>/dev/null | base64 -d 2>/dev/null)
          REPO_PASS=$(hub_k -n argocd get secret fleet-config-repo -o jsonpath='{.data.password}' 2>/dev/null | base64 -d 2>/dev/null)
          set -e
          [ -n "$OVERLAY_REV" ] && [ "$OVERLAY_REV" != "null" ] || OVERLAY_REV=main
          [ "$OVERLAY_BP" = "null" ] && OVERLAY_BP="" || true
          if [ -z "$OVERLAY_URL" ] || [ "$OVERLAY_URL" = "null" ]; then
            printf '{{.C_ERR}}✗ Refusing live pivot: no overlay repo wired in %s/config (overlay_repo_url empty).{{.C_RESET}}\n' "$HUB"
            printf '{{.C_INFO}}  A cluster provider is consumer-agnostic — it adopts the hub via the overlay repo the CONSUMER wires into <hub>/config (e.g. the workshop set-overlay-repo step) and reuses the ArgoCD repo credential the consumer registered. Wire the overlay first, then re-run. (Operator override: HUB_PIVOT_GITOPS=false adopts imperatively with no re-asserter.){{.C_RESET}}\n'
            exit 1
          fi
          if [ -z "$REPO_PASS" ]; then
            printf '{{.C_ERR}}✗ Refusing live pivot: overlay repo wired (%s) but no ArgoCD repo credential argocd/fleet-config-repo to reuse.{{.C_RESET}}\n' "$OVERLAY_URL"
            printf '{{.C_INFO}}  The consumer must register the overlay repo credential before the pivot (its set-overlay-repo step). Re-run once it exists.{{.C_RESET}}\n'
            exit 1
          fi
          # [#1033 S2] Reachability check INSIDE the precondition (before kind is stopped) so an
          # unreachable / mis-authenticated overlay refuses up front with no stop/start cycle.
          # Credential handling: GIT_ASKPASS feeds the password out-of-band so it is NEVER on
          # git's argv (ps-visible) and needs no URL-encoding — the probed URL carries no secret.
          OVERLAY_HOSTPATH="${OVERLAY_URL#https://}"
          ASKPASS=$(mktemp); printf '#!/bin/sh\nexec echo "$REPO_PASS"\n' > "$ASKPASS"; chmod +x "$ASKPASS"
          if ! GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 REPO_PASS="$REPO_PASS" \
                 git -c credential.username="${REPO_USER:-x-access-token}" ls-remote "https://$OVERLAY_HOSTPATH" >/dev/null 2>&1; then
            rm -f "$ASKPASS"
            printf '{{.C_ERR}}✗ Refusing live pivot: overlay repo %s is not reachable with the registered ArgoCD credential (checked up front, before stopping kind).{{.C_RESET}}\n' "$OVERLAY_URL"
            exit 1
          fi
          rm -f "$ASKPASS"
          printf '{{.C_OK}}  ✓ consumer-supplied overlay repo + reusable ArgoCD credential present and reachable — %s @ %s.{{.C_RESET}}\n' "$OVERLAY_URL" "$OVERLAY_REV"
        fi

        # Identify this cluster's kind node containers (label set by kind).
        KIND_NODES=$(docker ps -q --filter "label=io.x-k8s.kind.cluster={{.KIND_CLUSTER_NAME}}" 2>/dev/null || true)

        # BEFORE stopping kind, pin every kind-side AWS-backed ACK child to
        # services.k8s.aws/deletion-policy=retain — a declarative guarantee that kind's ACK can
        # never issue an AWS Delete on the real hub resources, whatever sets a deletionTimestamp
        # (stray delete, owner-ref cascade, prune, or a docker-stop race). retain = ACK drops its
        # finalizer and orphans (preserves) the live AWS resource.
        # [#1033 N6] Pin retain at the SOURCE first. On a pre-PR kind instance the children's
        # services.k8s.aws/deletion-policy is OWNED by kro.run/applyset, so a bare `kubectl
        # annotate` on the children is reverted by kro and the "retain-pinned N" log is a no-op.
        # Patch the kind INSTANCE spec and let kro propagate deletion-policy=retain down to the
        # ACK children (same propagation-wait shape as destroy), THEN keep the direct child
        # annotate below as belt-and-suspenders.
        printf '{{.C_STEP}}▸ [LIVE] pinning kind instance %s deletionPolicy=retain (kro propagates to children)…{{.C_RESET}}\n' "$HUB"
        kind_k -n "$NS" patch {{.HUB_KIND}}.kro.run "$HUB" --type merge -p '{"spec":{"deletionPolicy":"retain"}}' >/dev/null 2>&1 || true
        for i in $(seq 1 30); do
          if kind_k -n "$NS" get cluster.eks.services.k8s.aws \
               -o jsonpath='{range .items[*]}{.metadata.annotations.services\.k8s\.aws/deletion-policy}{"\n"}{end}' 2>/dev/null \
               | grep -qx retain; then
            printf '{{.C_OK}}  ✓ kro propagated deletion-policy=retain to the kind-side ACK EKS Cluster (after %ds).{{.C_RESET}}\n' "$((i*2))"
            break
          fi
          [ "$i" = 30 ] && printf '{{.C_INFO}}  retain propagation not confirmed within 60s — the direct child annotate below still pins it.{{.C_RESET}}\n' || sleep 2
        done
        printf '{{.C_STEP}}▸ [LIVE] pinning kind-side ACK children to deletion-policy=retain (never delete AWS on kind stop)…{{.C_RESET}}\n'
        RETAIN_N=0
        for gk in $CHILD_GKS; do
          for cr in $(kind_k -n "$NS" get "$gk" -l kro.run/owned=true -o name 2>/dev/null); do
            if kind_k -n "$NS" annotate "$cr" services.k8s.aws/deletion-policy=retain --overwrite >/dev/null 2>&1; then
              RETAIN_N=$((RETAIN_N+1))
            fi
          done
        done
        printf '{{.C_OK}}  ✓ retain-pinned %d kind-side ACK child resource(s).{{.C_RESET}}\n' "$RETAIN_N"

        # STOP kind FIRST — halt its kube-apiserver + kro/ACK controllers so ONLY the
        # hub reconciles the adopted resources (no dual-manager conflict). docker stop
        # preserves etcd in the container fs -> recoverable with `docker start`.
        printf '{{.C_STEP}}▸ [LIVE] stopping kind nodes so only the hub reconciles…{{.C_RESET}}\n'
        if [ -n "$KIND_NODES" ]; then docker stop $KIND_NODES; \
          else printf '{{.C_INFO}}  no running kind nodes for {{.KIND_CLUSTER_NAME}} (already stopped?).{{.C_RESET}}\n'; fi
        KIND_STOPPED=1  # [#1033 N3] from here, an unexpected exit must restart kind (EXIT trap)

        # ADOPT on the hub (kind is down -> single reconciler, no conflict).
        printf '{{.C_STEP}}▸ [LIVE] adopting on hub (adopt-or-create)…{{.C_RESET}}\n'
        [ -s "$WORK/ec2-adopt.yaml" ] && hub_k apply -f "$WORK/ec2-adopt.yaml"
        hub_k create namespace "$NS" --dry-run=client -o yaml | hub_k apply -f -

        # Commit the EksCluster to the CONSUMER's overlay repo and let the hub's OWN ArgoCD
        # assert it (selfHeal + prune:false) — desired-state-from-git, so the CR can never be
        # pruned (a one-shot kubectl apply has no re-asserter if something deletes it).
        # Coordinates + credential were resolved and validated in the consumer-agnostic
        # precondition above: the provider reads overlay_repo_url/revision/basepath from
        # <hub>/config and reuses the ArgoCD repo credential argocd/fleet-config-repo the
        # consumer registered — it never builds a GitLab URL or writes a repo password itself.
        HUB_GITOPS_ACTIVE=0
        if [ "{{.HUB_PIVOT_GITOPS}}" = "true" ]; then
          # Authenticated push URL = overlay URL + the reused credential (never logged).
          OVERLAY_HOSTPATH=${OVERLAY_URL#https://}
          if [ -n "$REPO_USER" ]; then PUSH_URL="https://$REPO_USER:$REPO_PASS@$OVERLAY_HOSTPATH"; else PUSH_URL="https://$REPO_PASS@$OVERLAY_HOSTPATH"; fi
          # Manifest path inside the overlay repo (honour basepath if the overlay nests).
          REL_DIR="self-adoption/hub"; [ -n "$OVERLAY_BP" ] && REL_DIR="${OVERLAY_BP%/}/self-adoption/hub"
          printf '{{.C_STEP}}▸ [LIVE] GitOps adoption: committing hub EksCluster to the overlay repo (%s @ %s, path %s)…{{.C_RESET}}\n' "$OVERLAY_URL" "$OVERLAY_REV" "$REL_DIR"
          PUSHED=0
          if git ls-remote "$PUSH_URL" >/dev/null 2>&1; then
            REPO_DIR=$(mktemp -d)
            if git clone --branch "$OVERLAY_REV" --single-branch "$PUSH_URL" "$REPO_DIR" >/dev/null 2>&1 && [ -d "$REPO_DIR/.git" ]; then
              # self-adoption/hub/<hub>.yaml is OUTSIDE every appset's scan path
              # (clusters-kro reads gitops/fleet/spoke-values/...), so no appset ever
              # treats it as its own child → only the dedicated App below manages it.
              mkdir -p "$REPO_DIR/$REL_DIR"
              yq -p=json -o=yaml '.' "$WORK/hub-instance.json" > "$REPO_DIR/$REL_DIR/$HUB.yaml"
              if ( cd "$REPO_DIR"; git add -A; \
                   git -c user.email=pivot@peeks.local -c user.name=peeks-pivot \
                     commit -m "[#1033] GitOps-assert hub $HUB EksCluster (self-adoption)" >/dev/null 2>&1 || true; \
                   git push "$PUSH_URL" "HEAD:$OVERLAY_REV" >/dev/null 2>&1 ); then PUSHED=1; fi
            fi
            rm -rf "$REPO_DIR"
          fi
          if [ "$PUSHED" = 1 ]; then
            # Dedicated hub self-adoption Application. source.repoURL = the overlay URL;
            # ArgoCD authenticates with the CONSUMER-registered argocd/fleet-config-repo
            # credential (the provider neither writes nor owns that Secret). destination.name =
            # the registered hub cluster NAME — the EKS ArgoCD capability DISABLES the in-cluster
            # loopback (https://kubernetes.default.svc), so a name-based destination is REQUIRED.
            # selfHeal re-asserts the EksCluster if anything deletes it; prune:false guarantees
            # ArgoCD itself NEVER deletes it. The committed manifest carries deletionPolicy:retain,
            # so even a selfHeal-driven delete/recreate on the ACK children orphans (never
            # AWS-deletes) the live cluster.
            if cat <<APPEOF | hub_k apply -f -
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: hub-self-adoption
          namespace: argocd
        spec:
          project: default
          destination:
            name: "$HUB"
            namespace: "$NS"
          source:
            repoURL: "$OVERLAY_URL"
            targetRevision: "$OVERLAY_REV"
            path: "$REL_DIR"
          syncPolicy:
            automated:
              selfHeal: true
              prune: false
            syncOptions:
              - CreateNamespace=true
              - ServerSideApply=true
        APPEOF
            then
              HUB_GITOPS_ACTIVE=1
              printf '{{.C_OK}}✓ hub EksCluster committed to the overlay repo + hub-self-adoption Application applied (selfHeal, prune=false — desired-state-from-git, un-prunable).{{.C_RESET}}\n'
            fi
          fi
          if [ "$HUB_GITOPS_ACTIVE" != 1 ]; then
            printf '{{.C_ERR}}✗ [LIVE] GitOps adoption could not commit to the overlay repo (%s) — ABORTING; kind NOT discarded. There is NO imperative fallback here (that was the two-behaviour coupling this change removes); restart kind and retry once the overlay is reachable.{{.C_RESET}}\n' "$OVERLAY_URL"
            ABORT_HANDLED=1  # [#1033 N3] this branch restarts kind itself; EXIT trap must not re-handle
            [ -n "$KIND_NODES" ] && docker start $KIND_NODES || true
            exit 1
          fi
        else
          # Deliberate operator override (HUB_PIVOT_GITOPS=false): adopt imperatively with no
          # git re-asserter. Documented escape hatch for a bare provider with no overlay repo —
          # NOT an automatic fallback (the implicit fallback that made the provider behave two
          # ways has been removed).
          printf '{{.C_INFO}}  [LIVE] HUB_PIVOT_GITOPS=false — imperative adopt on the hub (operator override; no re-asserter).{{.C_RESET}}\n'
          hub_k apply -f "$WORK/hub-instance.json"
        fi

        # THE gate: do not detach until the hub demonstrably owns every resource.
        printf '{{.C_STEP}}▸ [LIVE] waiting for adoption-complete (max {{.PIVOT_ADOPT_TIMEOUT_SEC}}s)…{{.C_RESET}}\n'
        GATE_OK=0; SPOKE_PERTURBED=0; HUB_DELETED=0; HUB_FORENSICS_DONE=0; GATE_LOG="$WORK/gate.out"
        DEADLINE=$(( $(date +%s) + {{.PIVOT_ADOPT_TIMEOUT_SEC}} ))
        while [ "$(date +%s)" -lt "$DEADLINE" ]; do
          # Fail-closed the moment the pivot perturbs a pre-existing spoke (#1033).
          if ! spokes_intact hub_k; then SPOKE_PERTURBED=1; break; fi
          # Hub-instance deletion handling (the 14:07 regression):
          #  - imperative mode: fail-closed immediately (no re-asserter) + dump forensics.
          #  - GitOps mode (HUB_GITOPS_ACTIVE): the hub-self-adoption Application re-asserts
          #    the instance via selfHeal, so a deletion is self-recovered — do NOT fail-closed.
          #    Capture forensics ONCE (so we still name any deleter) then keep polling; the
          #    adoption_gate below simply shows notready during the brief recreate window.
          if [ "$HUB_GITOPS_ACTIVE" = 1 ]; then
            if [ "$HUB_FORENSICS_DONE" != 1 ] && ! hub_intact hub_k; then
              HUB_FORENSICS_DONE=1
              printf '{{.C_INFO}}  (GitOps mode) hub instance was deletion-marked — ArgoCD selfHeal will re-assert it from git; continuing (not fail-closed).{{.C_RESET}}\n'
            fi
          else
            if ! hub_intact hub_k; then HUB_DELETED=1; break; fi
          fi
          if adoption_gate hub_k >"$GATE_LOG" 2>&1; then GATE_OK=1; break; fi
          sleep {{.PIVOT_ADOPT_INTERVAL_SEC}}
        done
        cat "$GATE_LOG" 2>/dev/null || true
        if [ "$HUB_DELETED" = 1 ]; then
          printf '{{.C_ERR}}✗ HUB INSTANCE DELETION-MARKED during adoption — ABORTING; kind NOT discarded.{{.C_RESET}}\n'
          printf '{{.C_INFO}}  The deleter forensics are dumped above. Orphaning the hub-side instance (retain → no AWS delete), then restarting kind to resume prior management…{{.C_RESET}}\n'
          ABORT_HANDLED=1  # [#1033 N3] this branch restarts kind itself; EXIT trap must not re-handle
          orphan_hub_instance hub_k
          [ -n "$KIND_NODES" ] && docker start $KIND_NODES || true
          printf '{{.C_ERR}}  Something deleted {{.HUB_KIND}}/%s on the hub. The anti-prune annotations should stop an ArgoCD prune; if it recurs, the forensics above name the actual deleter.{{.C_RESET}}\n' "$HUB"
          exit 1
        fi
        if [ "$SPOKE_PERTURBED" = 1 ]; then
          printf '{{.C_ERR}}✗ PIVOT PERTURBED A SPOKE INSTANCE — ABORTING; kind NOT discarded.{{.C_RESET}}\n'
          printf '{{.C_INFO}}  Orphaning the hub-side instance (retain → no AWS delete), then restarting kind. NOTE: a deletion-marked spoke CR cannot be un-marked — it completes deletion; with deletionPolicy=retain the AWS EKS cluster survives and kind re-creates the CR (delete-then-recreate, not in-place recovery).{{.C_RESET}}\n'
          ABORT_HANDLED=1  # [#1033 N3] this branch restarts kind itself; EXIT trap must not re-handle
          orphan_hub_instance hub_k
          [ -n "$KIND_NODES" ] && docker start $KIND_NODES || true
          printf '{{.C_ERR}}  A spoke was deletion-marked during adoption — this must not happen; investigate the fleetMember label on the hub cluster secret before retrying.{{.C_RESET}}\n'
          exit 1
        fi
        if [ "$GATE_OK" != 1 ]; then
          printf '{{.C_ERR}}✗ ADOPTION NOT COMPLETE within timeout — ABORTING; kind NOT discarded.{{.C_RESET}}\n'
          printf '{{.C_INFO}}  Orphaning the hub-side instance (retain → no AWS delete), then restarting kind to resume its management (recovering prior state)…{{.C_RESET}}\n'
          ABORT_HANDLED=1  # [#1033 N3] this branch restarts kind itself; EXIT trap must not re-handle
          orphan_hub_instance hub_k
          [ -n "$KIND_NODES" ] && docker start $KIND_NODES || true
          printf '{{.C_ERR}}  Re-run when the hub is healthy; adopt-or-create is idempotent.{{.C_RESET}}\n'
          exit 1
        fi
        printf '{{.C_OK}}✓ adoption-complete gate PASSED — the hub owns every resource.{{.C_RESET}}\n'

        # Final pre-detach assertion: spokes must still be intact right before we make
        # kind unrecoverable/stopped (#1033). Covers the gate-pass -> detach window.
        if ! spokes_intact hub_k; then
          printf '{{.C_ERR}}✗ A spoke was deletion-marked after the gate passed — ABORTING before detach; orphaning hub-side instance then restarting kind.{{.C_RESET}}\n'
          ABORT_HANDLED=1  # [#1033 N3] this branch restarts kind itself; EXIT trap must not re-handle
          orphan_hub_instance hub_k
          [ -n "$KIND_NODES" ] && docker start $KIND_NODES || true
          exit 1
        fi

        # DETACH outcome (PIVOT_DETACH_MODE: stop=default recoverable | delete=permanent).
        # Neither path sets a deletionTimestamp on the CR, so no finalizer runs and ACK
        # never issues an AWS Delete; the live resources stay, now solely hub-owned.
        if [ "{{.PIVOT_DETACH_MODE}}" = "delete" ]; then
          printf '{{.C_STEP}}▸ [LIVE] PIVOT_DETACH_MODE=delete — discarding kind %s (permanent)…{{.C_RESET}}\n' '{{.KIND_CLUSTER_NAME}}'
          kind delete cluster --name '{{.KIND_CLUSTER_NAME}}'
        else
          printf '{{.C_OK}}▸ [LIVE] PIVOT_DETACH_MODE=stop — leaving kind STOPPED (recoverable via docker start).{{.C_RESET}}\n'
          printf '{{.C_INFO}}  Once validated, re-run with PIVOT_DETACH_MODE=delete to remove kind permanently.{{.C_RESET}}\n'
        fi
        DETACHED=1  # [#1033 N3] detach committed (kind intentionally stopped/deleted) — EXIT trap must NOT restart kind

        # Verify the real EKS cluster survived.
        sleep 5
        FINAL=$(aws eks describe-cluster --name "$HUB" --region "$REGION" --query 'cluster.status' --output text 2>/dev/null || echo MISSING)
        if [ "$FINAL" = "ACTIVE" ]; then
          printf '{{.C_OK}}✓ [LIVE] pivot done. %s ACTIVE and now self-managed by the hub (kind {{if eq .PIVOT_DETACH_MODE "delete"}}deleted{{else}}stopped{{end}}).{{.C_RESET}}\n' "$HUB"
        else
          printf '{{.C_ERR}}✗ [LIVE] post-pivot EKS status=%s (expected ACTIVE) — investigate.{{.C_RESET}}\n' "$FINAL"; exit 1
        fi
